<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Browsers render this at 16-20px in the tab strip, so it carries the SMALL
       variant of the mark, not the four-rung one: two rungs of unequal reach
       either side of a full-width spread line. The full mark lives in the
       sidebar, the OG image and icon-192/512. -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07211C"/><stop offset="1" stop-color="#03100E"/></linearGradient></defs>
  <rect width="100" height="100" rx="26" fill="url(#g)"/>
  <g fill="#7DFCDD">
    <rect x="16" y="14" width="54" height="20" rx="10" opacity=".62"/>
    <rect x="8"  y="44" width="84" height="10" rx="5"/>
    <rect x="16" y="64" width="68" height="20" rx="10"/>
  </g>
</svg>
