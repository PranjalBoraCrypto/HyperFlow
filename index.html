  document.addEventListener('visibilitychange',measure);

  /* ── data ── */
  let M=null, A=null, chart=null, rangeK='1h';
  /* `let` does not hoist. These lived next to their own functions, below the
     try block that calls loadFlow(), and the page threw "Cannot access flowK

     said why. Page state is declared with the rest of the page state. */
  const FLOWW=[{k:'1h', label:'1H',  src:'m', bars:60,  unit:'minute', word:'the last 60 completed minutes'},
               {k:'24h',label:'24H', src:'h', bars:24,  unit:'hour',   word:'the last 24 completed hours'},
               {k:'7d', label:'7D',  src:'h', bars:168, unit:'hour',   word:'the last 7 days'},
               {k:'30d',label:'30D', src:'h', bars:720, unit:'hour',   word:'the last 30 days'}];
  let flowK='24h', flowRaw=null, flowStat=null, flowSplit=null, flowSeg=null;

  try{
    const U=await loadUniverse();
    RADAR={t:Date.now(),U,short:RADAR.short,det:RADAR.det||{}};
    M=U.find(m=>m.name===name);
    /* Not found does not mean not listed. Spot ENA trades on Hyperliquid as
       UENA, so "#/coin/ENA" with Spot selected used to say "No market called
       ENA" — true of the string and false of the market. Resolve the same
       asset under this venue's name and go there, telling the reader why. */
    if(!M){
      await ensureTwins();
      const want = isSpot() ? twinOf(name,true) : twinOf(name,false);
      const same = (want && U.find(m=>m.name===want)) ||
        (isSpot() ? U.find(m=>m.alt===name) : null);
      if(same && same.name!==name){

      p2.style.cssText='color:var(--ink-2);margin-top:9px';
      const b2=el('a','btn pri mag','Back to the radar'); b2.href='#/radar'; b2.style.marginTop='15px';
      c2.append(p2,b2); PAGE.appendChild(c2); magnetise(c2);
      return;
    }
    paintHeader();
    if(ALIASED && ALIASED.to===name){
      const from=ALIASED.from; ALIASED=null;
      /* "Unit names it U + the ticker" was true of UENA and wrong about FXRP,
         XMR1, LINK0 and HPENGU — several bridges list here and each names its
         tokens its own way. The sentence describes what was checked instead. */
      const n=el('p','cn-alias');
      n.append(el('b',null,'You asked for '+from+'.'),
        document.createTextNode(' On Hyperliquid '+(isSpot()?'spot':'perps')+' that market is '+
          name+' — the same asset under the name the bridge that carries it gave it. '+
          'Paired by price, not by the ticker: the two track each other to within a fraction '+
          'of a percent.'));
      head.appendChild(n);
    }
    /* The buttons need whichever venue is the OTHER one, and nothing else
       waits on it. In spot that is the perp list, which only the radar table
       used to load — so a spot page never offered "Trade the perp" at all. */
    Promise.all([ spotIndex().catch(()=>null),
                  isSpot()? otherSide().catch(()=>null) : null ])
      .then(()=>paintActions()).catch(()=>paintActions());
    paintPositioning();
    paintSimilar(U);
    startTape();
    loadFlow();
    loadNews();
    await loadRange('1h');

  function paintHeader(){
    const v=$('.v',pxw); v.textContent=px(M.mark);

  function paintActions(){
    acts.innerHTML='';
    const ARROW='<svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>';

  async function loadRange(k){
    rangeK=k;
    const r=RANGES.find(x=>x.k===k)||RANGES[0];
    if(!chart){ chartHost.innerHTML=''; chart=candleChart(chartHost); }
    chartHost.dataset.busy='1';
    try{
      const now=Date.now();
      /* The 50 and 100-bar averages need 50 and 100 bars BEFORE the first one
         drawn, or they simply start partway across the chart — which is what
         made the lines appear out of nowhere. Fetch a 100-bar run-up, compute
         the averages over everything, then draw only the window. */
      const WARM=100;
      const raw=await apiR({type:'candleSnapshot',req:{coin:M.key||name,interval:r.k,
        startTime:now-(r.bars+WARM)*r.ms, endTime:now}},{ttl:45000});
      if(!Array.isArray(raw)||raw.length<5){
        chartHost.innerHTML='';
        chartHost.appendChild(el('p','rd-count','Not enough history at this interval to draw a chart.'));
        chart=null; return;
      }
      const full=withMAs(raw);
      const win=full.length>r.bars ? full.slice(-r.bars) : full;
      chart.set(win);
      paintChartStat(win,r);
      /* the hourly bars are what every measure on this page is computed from,
         so the read and the measures are only recomputed on the 1h range */
      if(k==='1h'){
        A=analyse(M, raw);
        RADAR.det[name]=A;
        paintRead(); paintMeasures();
      }
    }catch(e){
      chartHost.innerHTML='';
      chartHost.appendChild(el('p','rd-count','The chart did not load. '+
        (e.code==='RATE'?'The exchange rate-limited this browser.':'Try again in a moment.')));
      chart=null;
    } finally { delete chartHost.dataset.busy; }
  }

  /* "Similar" has to mean something or it is a random list. Three axes, each
     on a log scale because a market ten times bigger is one step away, not ten
     — traded volume, open interest, and the size of today's move. Nearest on
     the sum wins. Delisted markets and the coin itself are never candidates. */
  function paintSimilar(U){
    if(!M) return;
    const lg=v=>Math.log10(Math.max(v||0,1));
    const pool=U.filter(x=>x.name!==M.name && !x.delisted
      && x.vol>(isSpot()?SPOT_FLOOR:VOL_FLOOR)/4);
    if(!pool.length){ simSec.remove(); return; }
    const near=pool.map(x=>{
      const dv=Math.abs(lg(x.vol)-lg(M.vol));
      const doi=(x.oiNtl!=null&&M.oiNtl!=null)? Math.abs(lg(x.oiNtl)-lg(M.oiNtl)) : 0;
      const dc=Math.abs((x.chg||0)-(M.chg||0))/8;
      return {m:x, d:dv*1.0 + doi*0.8 + dc*0.7};
    }).sort((a,b)=>a.d-b.d).slice(0,5);
    simHost.innerHTML='';
    /* The distance is a real number but a meaningless one to read, so it is
       spent on three rungs and a word instead. The cutoffs are the same scale
       the distance is built on: a rung is roughly "within a factor of two on
       every axis". */
    const rung=d=> d<0.45?3 : d<0.95?2 : 1;
    /* "close" on its own, sitting above a column headed PRICE, reads as a
       closing price — or as a button. The word has to say what is being
       measured, and "similar" is the word the section heading already uses. */
    const howAlike=n=> n===3?'very similar' : n===2?'similar' : 'loosely similar';
    near.forEach(({m:x,d},i)=>{
      const a2=el('a','cn-simc tilt edge'); a2.href='#/coin/'+encodeURIComponent(x.name);
      a2.style.setProperty('--i',i);          /* the section's stagger */

      const top=el('div','cn-simt');
      top.append(coinMark(x.name,30), el('b',null,x.name),
        Object.assign(el('span','chip '+(x.chg>=0?'up':'down')),{textContent:pct(x.chg)}));
      a2.appendChild(top);

      const n2=rung(d);
      const wr=el('div','cn-simw');
      const rr=el('div','cn-simr');
      for(let k=0;k<3;k++){ const sp=el('span'); if(k<n2) sp.dataset.on='1'; rr.appendChild(sp); }
      wr.append(rr, el('span',null,howAlike(n2)));
      a2.appendChild(wr);

      /* Four numbers, and every one of them is on the row already — no extra
         call is made to fill this card in. */
      const g=el('div','cn-simg');
      const G=(label,val,cls)=>{ const d2=el('div');
        d2.append(el('s',null,label), Object.assign(el('b',null,val),{className:cls||''}));
        g.appendChild(d2); };
      G('price', px(x.mark));
      G('24h volume', '$'+fmtC(x.vol));
      if(isSpot()){
        G('market cap', x.mcap? '$'+fmtC(x.mcap) : '—');
        G('spread', x.spreadPct!=null? x.spreadPct.toFixed(3)+'%' : '—');
      }else{
        G('open interest', x.oiNtl? '$'+fmtC(x.oiNtl) : '—');
        G('funding apr', x.fundingApr!=null? pct(x.fundingApr,1) : '—',
          x.fundingApr>0?'up':x.fundingApr<0?'down':'');
      }
      a2.appendChild(g);

      const f=el('div','cn-simf');
      f.innerHTML='<span>Read '+x.name+'</span><svg viewBox="0 0 24 24" fill="none" '+
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
        '<path d="M5 12h12M12 6l6 6-6 6"/></svg>';
      a2.appendChild(f);
      simHost.appendChild(a2);
    });
    field(simHost);
  }

  /* What the window on screen actually contains — the four numbers a reader
     would otherwise work out by squinting at the axis. */
  function paintChartStat(win,r){
    chartStat.innerHTML='';
    if(!win.length) return;
    let hi=-Infinity, lo=Infinity, vol=0, upN=0;
    for(const b of win){ if(b.h>hi)hi=b.h; if(b.l<lo)lo=b.l; vol+=b.v; if(b.c>=b.o) upN++; }
    const first=win[0].o, last=win[win.length-1].c;
    const chg=first? (last/first-1)*100 : 0;
    const span=(win[win.length-1].t-win[0].t)/864e5;
    const S=(k,v,cls)=>{ const n=el('div','cn-cs');
      n.append(el('s',null,k), Object.assign(el('b',null,v),{className:cls||''}));
      chartStat.appendChild(n); };
    S('over this window', pct(chg), chg>=0?'up':'down');
    S('high', px(hi));
    S('low', px(lo));
    S('range', (lo? (hi/lo-1)*100 : 0).toFixed(2)+'%');
    S('green bars', Math.round(upN/win.length*100)+'%');
    S('shown', (span<2? Math.round(span*24)+' hours' : Math.round(span)+' days'));
  }

  /* ── the read ──
     A direction, stated once, with the count behind it and the flags that
     qualify it. Deliberately not a call to action: it says what the measures
     read, names how many agree, and points at the list underneath. */
  function paintRead(){
    if(!A) return;
    const r=momentum(M,A);
    readHost.innerHTML='';
    const card=el('div','cn-readc tilt edge'); card.dataset.dir=r.dir;
    const l=el('div','l');
    const badge=el('div','cn-badge');
    /* "Reads up" in green at 29px is a description that behaves like a call.
       A count cannot be mistaken for one: it says what the indicators did,
       names how many, and leaves the conclusion where it belongs. */
    const total=r.votes.length;
    const lean = r.dir==='long' ? r.for+' of '+total+' measures lean up'
               : r.dir==='short'? r.against+' of '+total+' measures lean down'
               : 'The measures are split '+r.for+'–'+r.against;
    badge.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+
      (r.dir==='long'?'<path d="M12 19V5M6 11l6-6 6 6"/>':
       r.dir==='short'?'<path d="M12 5v14M6 13l6 6 6-6"/>':'<path d="M5 12h14"/>')+'</svg>'+
      '<span>'+lean+'</span>';
    l.appendChild(badge);
    l.appendChild(el('p','cn-readp', r.dir==='none'
      ? 'The seven measures are split — '+r.for+' point up, '+r.against+' point down. That is a market without a trend to read, not a quiet one.'
      : r.for+' of the seven measures point '+(r.dir==='long'?'up':'down')+', '+r.against+' point the other way. '+
        'Agreement is what the score below counts; it says nothing about what happens next.'));
    const flags=el('div','cn-flags');
    (r.flags||[]).forEach(f=>{ const c2=el('span','chip warn',f.t); c2.setAttribute('data-tip',f.w); flags.appendChild(c2); });
    if(r.flags&&r.flags.length) l.appendChild(flags);
    card.appendChild(l);
    const sc=el('div','cn-score');
    const b=el('b'); countUp(b,r.score,v=>String(Math.round(v)),700);
    sc.append(b, el('s',null,'agreement score'));
    const bars=el('div','cn-votes');
    r.votes.forEach(v=>{ const i=el('i'); if(v.vote!=='flat') i.dataset.v=v.vote; bars.appendChild(i); });
    sc.appendChild(bars);
    card.appendChild(sc);
    readHost.appendChild(card);
    readHost.appendChild(Object.assign(el('p','cn-disc'),
      {textContent:'This is arithmetic on public data, not a call. It has no view on the next hour, no knowledge of your size, and the score is a sort order rather than a probability.'}));
    field(readHost);
  }

  /* ── the measures, in plain words ── */
  function paintMeasures(){
    if(!A) return;
    const r=momentum(M,A);
    measHost.innerHTML='';
    /* These open, like the ones on the home page. The earlier edit patched the

      const body=el('div','cn-mb');

      hd.appendChild(cv);

        ex.append(el('p','hm-what',mn.what), el('p','hm-now',mn.now));
        row.appendChild(ex);
        hd.addEventListener('click',()=>{

          $$('.cn-m[data-open="1"]',measHost).forEach(o=>{ if(o!==row) o.dataset.open='0'; });
          row.dataset.open=open?'0':'1';
        });
      } else { hd.disabled=true; cv.hidden=true; }
      measHost.appendChild(row);

    field(measHost);
  }

  
  
  function paintPositioning(){
    posHost.innerHTML='';
    const tile=(k,v,s,cls,tip)=>{ const n=el('div','cn-tile');
      const kk=el('s',null,k); if(tip){ kk.appendChild(document.createTextNode(' ')); kk.appendChild(qm(tip)); }
      n.append(kk, Object.assign(el('b',null,v),{className:cls||''}), el('p',null,s));
      posHost.appendChild(n); };
    if(isSpot()){
      /* Spot has no funding, no open interest and no oracle. It has supply,
         which perps do not — so the section answers a different question
         rather than showing four dashes. */
      tile('Market cap', M.mcap?'$'+fmtC(M.mcap):'—',
        M.mcap?'circulating supply at the current price':'the exchange does not publish supply for this token');
      tile('24-hour volume','$'+fmtC(M.vol),'traded against USDC on this venue');
      tile('Turnover', M.mcap&&M.vol? (M.vol/M.mcap*100).toFixed(2)+'%':'—',
        'a day of volume as a share of market cap');
      tile('Listing', M.bridged?'Bridged':(M.canonical?'Canonical':'Deployed'),
        M.bridged? 'a wrapped version of an asset from another chain — not the native token'
                 : M.canonical? 'a canonical Hyperliquid listing'
                              : 'deployed by a third party on Hyperliquid');
      field(posHost); return;
    }
    tile('Funding APR', pct(M.fundingApr,1),
      M.fundingApr>0?'longs are paying shorts to hold':M.fundingApr<0?'shorts are paying longs to hold':'flat',
      M.fundingApr>0?'down':M.fundingApr<0?'up':'', 'fundapr');
    tile('Open interest','$'+fmtC(M.oiNtl),'dollar value of every position open on this market','', 'oi');
    tile('Volume / open interest', M.volOverOi!=null?M.volOverOi.toFixed(2)+'×':'—',
      M.volOverOi!=null? (M.volOverOi>1?'turned over more than once in a day':'less than one turnover in a day'):'—','','vsoi');
    tile('Mark vs oracle', pct(M.oracleGap,3),
      M.oracleGap>0?'the perp is trading above spot':'the perp is trading below spot','','basis');
    field(posHost);
  }

  /* ── flow ──
     "How much actually traded here" is the question a tape cannot answer,
     because a tape only ever holds the last few seconds. Four windows do.

     What this deliberately does NOT show is buy volume against sell volume,
     because that number does not exist to be shown. Hyperliquid puts a side on
     every trade it broadcasts live, but its history is candles, and a candle
     carries open, high, low, close, volume and a trade count — no side. The
     recentTrades endpoint returns ten prints, roughly thirteen seconds' worth.
     So there is no honest way to write "$120M bought, $95M sold" over a day,
     and deriving one from bar direction and calling it buying pressure is
     exactly the kind of number this site exists not to print.

     What IS real is the same volume split by how each bar closed, and that is
     what the bar is labelled: traded on hours that closed up, against hours
     that closed down. Every figure here is a sum over completed bars, so it
     reconciles against the exchange's own 24h volume to within the part of the
     current hour that has not finished yet.

     Two calls cover all four windows: one minute bars for the last hour, one
     hour bars for the last thirty days, sliced four ways. */

  function flowBars(raw){
    /* the last bar the exchange returns is the one still being built, and a
       partial bar makes every window look thinner than it is */
    const b=(raw||[]).map(k=>({o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,n:+k.n||0,t:k.t}));
    return b.slice(0,-1);
  }
  function flowStats(bars,n){
    const w=bars.length>n? bars.slice(-n) : bars;
    let vol=0, up=0, down=0, tr=0;
    for(const b of w){
      const ntl=b.v*((b.o+b.h+b.l+b.c)/4);   /* typical price, not close */
      vol+=ntl; tr+=b.n;
      if(b.c>=b.o) up+=ntl; else down+=ntl;
    }
    const chg = w.length&&w[0].o ? (w[w.length-1].c/w[0].o-1)*100 : null;
    return {vol,up,down,tr,chg,n:w.length,avg:tr?vol/tr:0};
  }

  function buildFlow(){
    flowHost.innerHTML='';
    const hd=el('div','cn-fh');
    const L=el('div','cn-fhl');
    L.append(el('h3',null,'How much traded'), qm('flowsplit'));
    flowSeg=el('div','seg'); const fp=el('div','pill'); flowSeg.appendChild(fp);
    FLOWW.forEach(w=>{
      const b=el('button',w.k===flowK?'on':null,w.label); b.type='button'; b.dataset.f=w.k;
      b.addEventListener('click',()=>{
        if(flowK===w.k) return;
        flowK=w.k;
        $$('button',flowSeg).forEach(x=>x.classList.toggle('on',x.dataset.f===w.k));
        moveFP();
        paintFlow();
      });
      flowSeg.appendChild(b);
    });
    const moveFP=()=>{ const on=$('button.on',flowSeg);
      if(on){ fp.style.left=on.offsetLeft+'px'; fp.style.width=on.offsetWidth+'px'; } };
    requestAnimationFrame(()=>requestAnimationFrame(moveFP));
    addEventListener('resize',moveFP); ACTIVE.push(()=>removeEventListener('resize',moveFP));
    hd.append(L,flowSeg);
    flowStat=el('div','cn-fs');
    flowSplit=el('div','cn-sp');
    flowHost.append(hd,flowStat,flowSplit);
    flowHost.dataset.busy='1';
    for(let i=0;i<4;i++){ const sk=el('div','sk'); sk.style.height='46px'; flowStat.appendChild(sk); }
  }

  function paintFlow(){
    if(!flowRaw) return;
    const w=FLOWW.find(x=>x.k===flowK)||FLOWW[1];
    const st=flowStats(w.src==='m'?flowRaw.m:flowRaw.h, w.bars);
    delete flowHost.dataset.busy;
    if(!st.n){ flowStat.innerHTML='';
      flowStat.appendChild(el('p','rd-count','No completed bars in this window yet.'));
      flowSplit.innerHTML=''; return; }

    flowStat.innerHTML='';
    const F=(label,sub,cls)=>{
      const d=el('div','cn-f1'); d.append(el('s',null,label));
      const b=el('b'); if(cls) b.className=cls; d.appendChild(b);
      if(sub) d.appendChild(el('i',null,sub));
      flowStat.appendChild(d); return b;
    };
    countUp(F('traded', w.word), st.vol, v=>'$'+fmtC(v), 700);
    countUp(F('trades', 'prints that crossed'), st.tr, v=>Math.round(v).toLocaleString(), 700);
    countUp(F('average trade', 'value of a typical print'), st.avg, v=>'$'+fmtC(v), 700);
    const cb=F('price move','first bar open to last bar close',
      st.chg==null?'':st.chg>=0?'up':'down');
    cb.textContent = st.chg==null? '—' : pct(st.chg);

    /* the split */
    flowSplit.innerHTML='';
    const tot=st.up+st.down;
    const upPct = tot? st.up/tot*100 : 50;
    /* the long half of each label is dropped on a narrow screen, where it
       wrapped to two lines and said nothing the note does not */
    const lab=el('div','cn-spl');
    const side=(cls,val,mid,tail)=>{ const n=el('span',cls);
      n.append(el('b',null,'$'+fmtC(val)), document.createTextNode(' '),
        el('s',null,mid), document.createTextNode(' '+tail));
      return n; };
    lab.append(side('cn-spu', st.up,  'on '+w.unit+'s that closed','up'),
               side('cn-spd', st.down,'on '+w.unit+'s that closed','down'));
    const bar=el('div','cn-spb');
    const iu=el('i','cn-spu'), idn=el('i','cn-spd');
    bar.append(iu,idn);
    const note=el('div','cn-spn');
    note.append(el('p',null, Math.round(upPct)+'% of this window traded on '+w.unit+
      's that closed higher than they opened. Completed bars only.'));
    note.append(el('p','cn-spc','Bar direction, not buying against selling — the exchange puts a '+
      'side on live trades only, never on history.'));
    flowSplit.append(lab,bar,note);
    requestAnimationFrame(()=>{ iu.style.width=upPct+'%'; idn.style.width=(100-upPct)+'%'; });
  }

  async function loadFlow(){
    buildFlow();
    try{
      const now=Date.now();
      const coin=M&&M.key||name;
      const [mm,hh]=await Promise.all([
        apiR({type:'candleSnapshot',req:{coin,interval:'1m',startTime:now-75*60e3,endTime:now}},{ttl:45000}),
        apiR({type:'candleSnapshot',req:{coin,interval:'1h',startTime:now-31*864e5,endTime:now}},{ttl:120000})
      ]);
      flowRaw={m:flowBars(mm), h:flowBars(hh)};
      paintFlow();
    }catch(e){
      delete flowHost.dataset.busy;
      flowStat.innerHTML='';
      flowStat.appendChild(el('p','rd-count', e.code==='RATE'
        ? 'The exchange rate-limited this browser, so the windows did not load.'
        : 'The windows did not load. Try again in a moment.'));
    }
  }

    /* ── the tape ──
     A live feed, not a leaderboard. It used to hold the eight biggest prints
     since the page opened, which meant it stopped changing after a minute and
     looked broken. Now it is the last twelve trades, newest at the top, each
     one sliding in as it arrives — and it repaints ONLY the rows that changed,
     so nothing on screen flashes. A list that rebuilds itself every second is
     a strobe, and people close the tab. */
  function startTape(){
    let ws=null, retry=null, live=false;
    const CAP=12;
    const seen=new Set();
    let feed=[], count=0, notional=0, biggest=0, dirty=false;
    tapeHost.innerHTML='';
    const list=el('div','cn-tapel');
    const status=el('p','cn-fine','connecting to the trade feed…');
    tapeHost.append(list,status);
    const empty=el('p','rd-count','Waiting for the first print…');
    list.appendChild(empty);

    const rowFor=t=>{
      const r=el('div','cn-tr'); r.dataset.side=t.side==='B'?'buy':'sell';
      r.dataset.tid=t.tid;
      if(t.ntl>=biggest*0.6&&t.ntl>0) r.dataset.big='1';
      r.append(Object.assign(el('span','cn-tsd'),{textContent:t.side==='B'?'buy':'sell'}),
        Object.assign(el('span','cn-tn'),{textContent:'$'+fmtC(t.ntl)}),
        Object.assign(el('span','cn-tp'),{textContent:px(t.px)}),
        Object.assign(el('span','cn-tt'),{textContent:new Date(t.time)
          .toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}));
      return r;
    };

    /* Coalesced on a TIMER, not requestAnimationFrame. rAF does not fire in a
       view the browser is not painting — a background tab, an occluded pane —
       so a tape gated behind it receives every trade and renders none of them,
       which is exactly what happened: the socket took 47 trades and the list
       stayed on "waiting for the first print". Fourth time in this project
       that hanging work off a frame callback has produced silent emptiness.
       A timer also bounds the DOM work better than the frame rate does: at
       most one insert pass every 220ms however busy the market gets. */
    let timer=null;
    const schedule=()=>{ if(timer) return;
      timer=setTimeout(()=>{ timer=null; flush(); },220); };
    function flush(){
      if(!dirty) return; dirty=false;
      if(empty.isConnected) empty.remove();
      const have=new Set([...list.children].map(n=>n.dataset.tid));
      /* newest first: insert at the top in reverse so order is preserved */
      for(let i=feed.length-1;i>=0;i--){
        const t=feed[i];
        if(have.has(String(t.tid))) continue;
        const r=rowFor(t);
        list.insertBefore(r,list.firstChild);
      }
      while(list.children.length>CAP) list.removeChild(list.lastChild);
      status.textContent=count.toLocaleString()+' trades since you opened this page · $'+
        fmtC(notional)+' crossed · largest $'+fmtC(biggest);
    }

    const connect=()=>{
      try{ ws=new WebSocket('wss://api.hyperliquid.xyz/ws'); }
      catch(e){ status.textContent='The live feed is not reachable from this browser.'; return; }
      ws.onopen=()=>{ live=true;
        ws.send(JSON.stringify({method:'subscribe',subscription:{type:'trades',coin:M.key||name}})); };
      ws.onmessage=e=>{
        let m2; try{ m2=JSON.parse(e.data); }catch(_){ return; }
        if(m2.channel!=='trades'||!Array.isArray(m2.data)) return;
        for(const t of m2.data){
          if(seen.has(t.tid)) continue; seen.add(t.tid);
          const ntl=+t.px*+t.sz;
          count++; notional+=ntl; if(ntl>biggest) biggest=ntl;
          feed.push({side:t.side,px:+t.px,ntl,time:t.time,tid:t.tid});
          dirty=true;
        }
        if(feed.length>CAP) feed=feed.slice(-CAP);
        /* the seen-set would grow without bound on a busy market */
        if(seen.size>4000) seen.clear();
        if(!dirty) return;
        if(!list.querySelector('.cn-tr')) flush();   /* first print: no delay */
        else schedule();
      };
      ws.onclose=()=>{ live=false;
        if(!retry) retry=setTimeout(()=>{ retry=null; if(tapeHost.isConnected) connect(); },4000); };
      ws.onerror=()=>{ try{ws.close()}catch(_){}; };
    };
    connect();
    ACTIVE.push(()=>{ if(retry) clearTimeout(retry); retry=1;
      if(timer) clearTimeout(timer);
      try{ ws&&ws.close(); }catch(e){} });
  }

  /* ── news ── */
  async function loadNews(){
    try{
      const ctl=new AbortController();
      const t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch('/api/news?coin='+encodeURIComponent(name),{signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) throw new Error('status '+r.status);
      const d=await r.json();
      newsHost.innerHTML='';
      if(!d.items||!d.items.length){
        newsHost.appendChild(el('p','rd-count', d.note||
          'No recent story from these outlets mentions this market.'));
        return;
      }
      const wrap=el('div','cn-newsl lead');
      d.items.forEach(it=>{
        const a=el('a','cn-n tilt edge'); a.href=it.link; a.target='_blank'; a.rel='noopener noreferrer';
        const meta=el('div','cn-nm');
        meta.append(el('span','cn-nsrc',it.source));
        if(it.time) meta.append(el('span','cn-nt',since(it.time)));
        a.append(meta, el('b',null,it.title));
        if(it.summary) a.append(el('p',null,it.summary));
        wrap.appendChild(a);
      });
      newsHost.appendChild(wrap);
      if(d.sources&&d.sources.length)
        newsHost.appendChild(Object.assign(el('p','cn-fine'),
          {textContent:'Headlines from '+d.sources.join(', ')+'. Cached for an hour, so the same request does not hit them once per reader.'}));
      field(newsHost); reveal(newsHost);
    }catch(e){
      newsHost.innerHTML='';
      newsHost.appendChild(el('p','rd-count','The news feed did not answer.'));
    }
  }
};

/* "3h ago" reads faster than a timestamp when the question is only how fresh
   the story is. */
function since(ms){
  const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<90) return 'just now';
  const m=s/60; if(m<60) return Math.round(m)+'m ago';
  const h=m/60; if(h<24) return Math.round(h)+'h ago';
  const d=h/24; return Math.round(d)+'d ago';
}

    c.appendChild(b);
    PAGE.appendChild(c); reveal(PAGE);
  };
}
