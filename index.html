  .mk-name{min-height:44px;margin:-6px -8px;padding:6px 8px;color:var(--mint)}
  .mk-name svg{opacity:.85;transform:none}
}
.mk-id .px{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mk-spark{height:38px;min-width:0}
.mk-read{min-width:0;display:flex;flex-direction:column;gap:7px}
.mk-lean{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600}
.mk-lean .ar{width:16px;height:16px;flex:none}
.mk[data-dir="long"] .mk-lean{color:var(--up)} .mk[data-dir="short"] .mk-lean{color:var(--down)}
.mk[data-dir="none"] .mk-lean{color:var(--ink-3)}
.mk-votes{display:flex;gap:3px}
.mk-votes i{width:15px;height:4px;border-radius:99px;background:var(--line-2);transition:background var(--sp)}
.mk-votes i[data-v="for"]{background:var(--up)} .mk-votes i[data-v="against"]{background:var(--down)}
.mk-sc{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.mk-sc b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.mk-sc s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.mk-cv{width:19px;height:19px;color:var(--ink-3);transition:transform var(--sp) var(--spring),color var(--sp);flex:none}
.mk[data-open="1"] .mk-cv{transform:rotate(180deg);color:var(--mint)}
.mk[data-open="1"] .mk-h{border-radius:var(--r3) var(--r3) 0 0}
@media (max-width:1180px){
  .mk-h{grid-template-columns:32px minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr) auto auto auto;gap:14px}
}
@media (max-width:940px){
  .mk-h{grid-template-columns:28px minmax(0,1.15fr) minmax(0,1fr) auto auto auto;
    grid-template-areas:"rank id read sc clx cv";gap:13px;padding:15px 13px 15px 16px}
  .mk-spark{display:none}
}
@media (max-width:720px){
  /* two lines: what it is, then what it reads and what you can do about it */
  .mk-h{grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"id sc" "read read" "clx clx";
    gap:12px 12px;padding:15px 15px 16px}
  .mk-rank{display:none} .mk-cv{display:none}
  .mk-h .clx{margin-left:0;justify-content:flex-start}
  .mk-read{padding-top:2px}
}
@media (max-width:400px){
  .mk-h{padding:14px 13px 15px}
  .mk-h .clx{width:100%}
  .mk-h .clx-b{flex:1;justify-content:center}
}

/* the working */
.mk-body{display:none;padding:2px 18px 19px 19px;flex-direction:column;gap:17px}
.mk[data-open="1"] .mk-body{display:flex;animation:pgIn .34s var(--ease-out)}
/* the working: one line per measure. The reasoning moved into the tooltip —
   seven paragraphs of justification on screen is not transparency, it is noise. */
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(238px,100%),1fr));gap:1px 22px;
  background:var(--g2);border:1px solid var(--line);border-radius:var(--r2);padding:5px 4px}
.wk-i{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:8px 10px;
  border-radius:9px;transition:background var(--sp);cursor:help}
.wk-i:hover{background:var(--g3)}
.wk-i .v{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
.wk-i[data-v="for"] .v{background:var(--up-wash);color:var(--up)}
.wk-i[data-v="against"] .v{background:var(--down-wash);color:var(--down)}
.wk-i[data-v="flat"] .v{background:var(--g3);color:var(--ink-4)}
.wk-i b{font-size:12.5px;font-weight:500;color:var(--ink-2);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-i .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}

/* practical panel: what it costs, what it moves */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(158px,100%),1fr));gap:9px}
.pr{padding:12px 14px;border-radius:var(--r2);background:var(--g2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;min-width:0}
.pr .k{display:flex;align-items:center;gap:6px}
.pr .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.pr .v::-webkit-scrollbar{display:none}
.pr .s{font-size:11px;color:var(--ink-3);line-height:1.35}
.pr .v.up{color:var(--up)} .pr .v.down{color:var(--down)} .pr .v.warn{color:var(--warn)}

/* size box — the trader actually types a number here */
.szbox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;border-radius:var(--r2);
  background:var(--g2);border:1px solid var(--line)}
.szbox label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3)}
.szbox input{width:118px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--g0);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:14px;padding:0 11px;outline:none;
  transition:border-color var(--sp),box-shadow var(--sp)}
.szbox input:focus{border-color:var(--mint-2);box-shadow:0 0 0 3px var(--mint-wash)}
.szbox .pre{display:flex;gap:5px}
.szbox .pre button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  transition:border-color var(--sp),color var(--sp),transform var(--sp) var(--spring)}
.szbox .pre button:hover{border-color:var(--mint-2);color:var(--mint);transform:translateY(-1px)}

/* ═══════════════ TABLE + PAGER ═══════════════ */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r3);background:var(--g1)}
.tw table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tw th,.tw td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tw thead th{position:sticky;top:0;z-index:2;background:var(--g2);font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  cursor:pointer;user-select:none;transition:color var(--sp)}
.tw thead th:hover{color:var(--mint)}
.tw thead th .ar{opacity:0;font-size:9px;margin-left:4px}
.tw thead th.nos{cursor:default;width:1%}
.tw thead th[data-sort] .ar{opacity:1;color:var(--mint)}
.tw tbody tr{transition:background var(--sp-fast);cursor:pointer}
.tw tbody tr:hover{background:var(--g2)}
.tw tbody tr:last-child td{border-bottom:none}
.tw td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tw td.r,.tw th.r{text-align:right}
.tw td b{font-weight:600}
/* the market name is the way out to the exchange; the rest of the row still
   opens the reading on this site */
.tw-name .cmk{margin-right:3px}
.tw-name{display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none;
  border-radius:8px;margin:-6px -7px;padding:6px 7px;min-height:32px;
  transition:color var(--sp),background var(--sp)}
.tw-name svg{width:12px;height:12px;opacity:0;transform:translate(-2px,2px);
  transition:opacity var(--sp),transform var(--sp) var(--ease)}
.tw-name:hover{color:var(--mint);background:var(--mint-wash)}
.tw-name:hover svg{opacity:1;transform:none}
.tw-name:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (hover:none){
  .tw-name{min-height:44px;margin:-8px;padding:8px;color:var(--mint)}
  .tw-name svg{opacity:.8;transform:none}
}
.tw tbody tr[data-dead] td{color:var(--ink-4)}
.tw tbody tr[data-dead] .tw-name{color:var(--ink-3)}
.chip.dead{margin-left:7px;background:transparent;border:1px solid var(--line-3);color:var(--ink-4)}
.tw .up{color:var(--up)} .tw .down{color:var(--down)} .tw .dim{color:var(--ink-3)}
.pgr{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding-top:13px;margin-top:13px;
  border-top:1px solid var(--line)}
.pgb{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  border:1px solid var(--line-2);background:var(--g1);color:var(--ink-2);
  transition:color var(--sp),border-color var(--sp),transform var(--sp) var(--spring)}
.pgb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pgb:hover:not(:disabled){color:var(--mint);border-color:var(--mint-2);transform:translateY(-2px)}
.pgb:active:not(:disabled){transform:scale(.92)}
.pgb:disabled{opacity:.3;cursor:default}
.pgd{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pgd button{width:8px;height:8px;border-radius:99px;background:var(--line-3);flex:none;
  transition:background var(--sp),width var(--sp) var(--spring)}
.pgd button:hover{background:var(--ink-3)}
.pgd button.on{background:var(--mint);width:22px;border-radius:99px}
.pgn{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
@media (max-width:640px){ .pgb{width:44px;height:44px} .pgn{margin-left:0;width:100%} }
@keyframes pgFlick{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* funding board */
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){ .fb{grid-template-columns:1fr} }
.fb-col{display:flex;flex-direction:column;gap:7px}
.fb-hd{display:flex;align-items:center;gap:8px;padding:0 2px 4px}
.fb-hd b{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:700;letter-spacing:-.02em}
.fb-r{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;
  border-radius:var(--r2);background:var(--g1);border:1px solid var(--line);
  color:inherit;text-decoration:none;min-height:44px;
  transition:border-color var(--sp),transform var(--sp) var(--ease)}
.fb-r:hover{border-color:var(--line-2);transform:translateX(4px)}
.fb-r .m{min-width:0;display:flex;flex-direction:column;gap:2px}
.fb-r .m b{font-size:13.5px;font-weight:600}
.fb-r .m s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.fb-r .a{display:inline-flex;align-items:center;gap:5px;
  font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.fb-r .a svg{width:12px;height:12px;opacity:0;transform:translate(-2px,2px);color:var(--ink-4);
  transition:opacity var(--sp),transform var(--sp) var(--ease)}
.fb-r:hover .a svg{opacity:1;transform:none;color:var(--mint)}
@media (hover:none){ .fb-r .a svg{opacity:.7;transform:none} }
.fb-r .bar{width:56px;height:5px;border-radius:99px;background:var(--g3);overflow:hidden;flex:none}
.fb-r .bar i{display:block;height:100%;border-radius:99px;transform-origin:left;transform:scaleX(0);
  transition:transform .8s var(--ease)}

/* method / provenance */
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:6px 26px}
.mt-c{display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;
  column-gap:13px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.mt-i{grid-row:1/3;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;
  background:var(--mint-wash);color:var(--mint)}
.mt-i svg{width:16px;height:16px}
.mt-c b{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:700;letter-spacing:-.02em}
.mt-c p{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:2px}
.mt-c code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mint-2);
  background:var(--g2);border-radius:5px;padding:1px 5px}

/* ═══ the tension rope — verlet chain, real constraint solving ═══ */

/* NFA */
.nfa{margin-top:clamp(16px,2.2vw,26px);border-radius:var(--r2);border:1px solid var(--line);
  background:var(--g1);transition:border-color var(--sp)}
.nfa:hover{border-color:var(--line-2)}
.nfa summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;
  font-size:12.5px;color:var(--ink-3);line-height:1.5}
.nfa summary::-webkit-details-marker{display:none}
.nfa summary svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--ink-4);stroke-width:1.7;stroke-linecap:round}
.nfa summary span{min-width:0}
.nfa summary i{margin-left:auto;font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap;
  transition:color var(--sp)}
.nfa summary:hover i,.nfa summary:hover svg{color:var(--mint);stroke:var(--mint)}
.nfa[open] summary i{color:var(--mint)}
.nfa p{padding:0 14px 13px 39px;font-size:12.5px;color:var(--ink-3);line-height:1.6;max-width:88ch}
@media (max-width:640px){ .nfa summary i{display:none} .nfa p{padding-left:14px} }

/* referral, disclosed in place */
.rf{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:19px;border-radius:var(--r3);
  background:var(--g1);border:1px solid var(--line);position:relative;overflow:hidden}
.rf::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(520px circle at 88% 0%,var(--mint-glow),transparent 62%)}
.rf canvas{width:56px;height:56px;border-radius:16px;flex:none;position:relative}
.rf .t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.rf .t h3{font-size:16px}
.rf .t p{font-size:13.5px;color:var(--ink-2)}
.rf .t .disc{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.rf .btn{position:relative;flex:none}
@media (max-width:560px){ .rf .btn{width:100%} }

/* command palette */
.pal{position:fixed;inset:0;z-index:210;display:none}
.pal[data-on="1"]{display:block}
.pal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  opacity:0;transition:opacity var(--sp)}
.pal[data-on="1"] .scrim{opacity:1}
.pal .box{position:absolute;left:50%;top:14vh;transform:translateX(-50%) translateY(-12px) scale(.98);
  width:min(620px,92vw);background:var(--g1);border:1px solid var(--line-3);border-radius:var(--r3);
  box-shadow:var(--e4);overflow:hidden;opacity:0;transition:opacity var(--sp),transform var(--sp) var(--ease-out)}
.pal[data-on="1"] .box{opacity:1;transform:translateX(-50%) scale(1)}
.pal input{width:100%;height:56px;border:none;outline:none;background:transparent;color:var(--ink);
  font-size:16px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal input::placeholder{color:var(--ink-3)}
.pal .list{max-height:min(56vh,420px);overflow-y:auto;padding:7px}
.pal .row{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;padding:10px 11px;
  border-radius:10px;cursor:pointer;transition:background var(--sp-fast)}
.pal .row[data-sel="1"]{background:var(--mint-wash)}
.pal .row .i{color:var(--ink-3);display:grid;place-items:center}
.pal .row[data-sel="1"] .i{color:var(--mint)}
.pal .row svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.pal .row b{font-size:13.5px;font-weight:600}
.pal .row s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.pal .empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* every tappable control clears 44px on touch. Measured, not guessed —
   .cmd and .iconb were 36px and .btn 42px before this block existed. */
@media (max-width:860px){
  .cmd,.iconb{height:44px;min-width:44px}
  .btn{height:46px}
  .seg button{min-height:44px}
  .szbox input{height:44px}
  .szbox .pre button{height:40px;min-width:44px}
  .qm{width:22px;height:22px;font-size:11px}
  .top{height:auto;min-height:var(--top);padding-top:6px;padding-bottom:6px}
  /* the measure labels ellipsed away on a phone — "Price vs 100-bar averag…"
     tells a trader nothing. They wrap to two lines instead. */
  .wk-i{align-items:flex-start}
  .wk-i b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
  .wk-i .v,.wk-i .n{margin-top:1px}
  .sec-h input[type="search"]{height:44px!important}
}
/* at 320 the top bar had crumb + LIVE + search + clock + theme fighting over
   300px and the page title was ellipsing to nothing. The dock already says
   which page you are on, so the crumb gives up its space first. */
@media (max-width:560px){ .crumb .live{display:none} }
@media (max-width:420px){ .crumb{display:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  body::before{opacity:.3}
}

<body>
<div class="rprog" id="rprog"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="rl-tip" id="rltip" aria-hidden="true"></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="main">
    <header class="top" id="top">
      <div class="crumb">
        <span class="t" id="crumbT">Radar</span>
        <span class="live"><i></i>Live</span>
      </div>
      <!-- One control for the whole site. Perps first because that is what
           almost everyone is here for; the choice is remembered. -->
      <div class="mseg" id="mseg" role="group" aria-label="Market type">
        <div class="pill" id="modePill"></div>
        <button type="button" data-mode="perp" class="on">Perps</button>
        <button type="button" data-mode="spot">Spot</button>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* Colour + alpha. Accepts #rgb, #rrggbb, rgb()/rgba(); returns rgba(). Canvas

function hexA(col,a){

    let h=col.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(h.length>=6){ const n=parseInt(h.slice(0,6),16);
      if(isFinite(n)) return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

}
const fmtN=(v,d=2)=>{const n=+v; return isFinite(n)? n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';};
const fmtC=v=>{const n=+v,a=Math.abs(n); if(!isFinite(n))return '—';
  if(a>=1e9)return (n/1e9).toFixed(2)+'B'; if(a>=1e6)return (n/1e6).toFixed(2)+'M';
  if(a>=1e3)return (n/1e3).toFixed(1)+'K'; return n.toFixed(2);};
const usd=(v,d)=>{const n=+v; if(!isFinite(n))return '—'; const a=Math.abs(n);
  const dd=d!=null?d:a>=1e6?2:a>=1000?0:a>=1?2:a>=0.01?4:6;
  return (n<0?'-$':'$')+a.toLocaleString('en-US',{minimumFractionDigits:dd,maximumFractionDigits:dd});};
const pct=(v,d=2)=>{const n=+v; return isFinite(n)? (n>=0?'+':'−')+Math.abs(n).toFixed(d)+'%':'—';};

  const d=n>=1000?1:n>=1?3:n>=0.01?5:7; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};

/* one shared pointer-light loop. Every .glow / .mk card reads --mx/--my.
   One rAF for the whole page instead of a listener per card. */
(function pointerField(){
  if(!FINE()||RM()) return;
  let tx=0,ty=0,raf=null,live=new Set();
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;
    if(!raf) raf=requestAnimationFrame(tick);},{passive:true});
  function tick(){
    raf=null;
    for(const n of live){
      if(!n.isConnected){live.delete(n);continue;}
      const r=n.getBoundingClientRect();
      if(r.bottom<-200||r.top>innerHeight+200) continue;
      const fx=(tx-r.left)/r.width, fy=(ty-r.top)/r.height;
      n.style.setProperty('--mx',(fx*100).toFixed(1)+'%');
      n.style.setProperty('--my',(fy*100).toFixed(1)+'%');
      /* unitless, so CSS can turn it into degrees without any JS per element */
      n.style.setProperty('--px',(fx-0.5).toFixed(3));
      n.style.setProperty('--py',(fy-0.5).toFixed(3));
    }
  }
  window.__field=(n)=>{ live.add(n); };
})();
function field(scope){ if(window.__field) $$('.glow,.mk,.rd-hr,.edge,.tilt',scope||document).forEach(window.__field); }
/* primary actions pull very slightly toward the cursor and spring back.
   One listener per button, transform only — never layout. */
/* .mag is only ever on buttons, and a button the reader is aiming at must not
   move away from the aim: 9px of travel on a 42px control means the thing
   shifts while you point at it, and because the pull is recomputed from the
   moved position, chasing it makes it worse. A third of the pull, capped at
   3px, keeps the response and removes the miss. The values are written to CSS
   variables rather than to `transform`, so the hover lift composes with them
   instead of being overwritten — see the .btn rule. */
function magnetise(scope){
  if(!FINE()||RM()) return;
  $$('.mag',scope||document).forEach(n=>{
    if(n.__mag) return; n.__mag=1;
    const gx=.08, gy=.10, cxMax=3, cyMax=2;
    let raf=null,tx=0,ty=0,cx=0,cy=0;
    const tick=()=>{ cx+=(tx-cx)*.18; cy+=(ty-cy)*.18;
      n.style.setProperty('--mgx',cx.toFixed(2)+'px');
      n.style.setProperty('--mgy',cy.toFixed(2)+'px');
      raf=(Math.abs(tx-cx)>.1||Math.abs(ty-cy)>.1)?requestAnimationFrame(tick):null; };
    const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
    n.addEventListener('pointermove',e=>{ const r=n.getBoundingClientRect();
      tx=clamp((e.clientX-r.left-r.width/2)*gx,-cxMax,cxMax);
      ty=clamp((e.clientY-r.top-r.height/2)*gy,-cyMax,cyMax); kick(); },{passive:true});
    n.addEventListener('pointerleave',()=>{ tx=0;ty=0;kick(); });
  });
}

/* a critically-damped spring, used for anything that should settle rather than ease */
function spring(get,set,{k=0.14,d=0.78}={}){
  let v=0,cur=get(),raf=null;
  return function to(target){
    const step=()=>{
      const f=(target-cur)*k; v=(v+f)*d; cur+=v;
      set(cur);
      if(Math.abs(target-cur)>0.02||Math.abs(v)>0.02) raf=requestAnimationFrame(step);
      else { cur=target; set(cur); raf=null; }
    };
    if(!raf) raf=requestAnimationFrame(step);
  };
}

/* count-up. The true value is written FIRST — a frame that never arrives can
   only cost the animation, never the number. */
function countUp(node,to,fmt,ms){
  node.textContent=fmt(to);
  if(RM()||!isFinite(to)) return;
  const t0=performance.now(),dur=ms||760;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    node.textContent=fmt(to*e); if(p<1) requestAnimationFrame(step); else node.textContent=fmt(to);};
  requestAnimationFrame(step);
}

/* ═══════════════════════════════════════════════════════════════
   1 · data layer — cache + TTL + in-flight dedupe + abort + RATE
   ═══════════════════════════════════════════════════════════════ */
const API='https://api.hyperliquid.xyz/info';
const _c=new Map(), _f=new Map();
async function api(body,{ttl=30000,timeout=15000}={}){
  const k=JSON.stringify(body), now=Date.now(), hit=_c.get(k);
  if(hit && now-hit.t<ttl) return hit.v;
  if(_f.has(k)) return _f.get(k);
  const p=(async()=>{
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),timeout);
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),signal:ac.signal});
      if(r.status===429){const e=new Error('rate');e.code='RATE';throw e;}
      if(!r.ok){const e=new Error('http '+r.status);e.code='HTTP';throw e;}
      const v=await r.json(); _c.set(k,{t:Date.now(),v}); return v;
    } finally { clearTimeout(to); _f.delete(k); }
  })();
  _f.set(k,p); return p;
}
const BACKOFF=[1500,3500,7000,12000];
async function apiR(body,opt){
  let last;
  for(let i=0;i<=BACKOFF.length;i++){
    try{ return await api(body,opt); }
    catch(e){ last=e; if(i===BACKOFF.length) break;
      if(e.code!=='RATE'&&e.code!=='HTTP'&&e.name!=='AbortError') throw e;
      await new Promise(r=>setTimeout(r,BACKOFF[i])); }
  }
  throw last;
}

/* ═══════════════════════════════════════════════════════════════
   3 · the mark, drawn not imported
   ═══════════════════════════════════════════════════════════════ */
function fit(cv,w,h,cap){const d=Math.min(devicePixelRatio||1,cap||2);
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
/* C · Stack — an order book seen edge-on. Four rungs of unequal reach around
   the spread line. Drawn, never imported, and drawn from one set of numbers so
   the favicon, the rail and the share image cannot drift apart. */
function stackMark(c,S,col,opts){
  const k=S/100, o=opts||{};
  const rung=(x,y,w,h,a)=>{ c.globalAlpha=a; c.fillStyle=col;
    rr(c,x*k,y*k,w*k,h*k,(h/2)*k); c.fill(); };
  /* Below about 64px the four-rung mark turns to mush: four 11-unit rungs with
     7-unit gaps land on 3.5px bars separated by 2.2px, and a browser tab strip
     renders that as a smudge. The small variant keeps the idea — unequal reach
     either side of a full-width spread line — with two rungs at nearly twice
     the weight. Unequal lengths matter: three equal bars would read as a
     hamburger menu, not an order book. */
  const small = S<64;
  if(small){
    rung(16,14,54,20,.62); rung(16,64,68,20,1); c.globalAlpha=1;
    c.fillStyle=col; rr(c,8*k,44*k,84*k,10*k,5*k); c.fill();
  } else {
    rung(18,16,52,11,.45); rung(18,33,34,11,.7);
    rung(18,56,64,11,1);   rung(18,73,40,11,.7);
    c.globalAlpha=1; c.fillStyle=col;
    rr(c,10*k,47*k,80*k,4*k,2*k); c.fill();
  }
  c.globalAlpha=1;
}
function paintMark(cv,size){
  const c=fit(cv,size,size,2);
  c.clearRect(0,0,size,size);
  const g=c.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#0A2C25'); g.addColorStop(1,'#051A16');
  c.fillStyle=g; rr(c,0,0,size,size,size*.31); c.fill();
  c.save(); c.scale(.94,.94); c.translate(size*.032,size*.032); stackMark(c,size,'#7DFCDD'); c.restore();
  c.strokeStyle='rgba(150,252,228,.18)'; c.lineWidth=1;
  rr(c,.5,.5,size-1,size-1,size*.31-.5); c.stroke();
}

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
const TIPS={
  funding:['Funding clock','Hyperliquid settles funding every hour, on the hour, across the whole venue. This counts down to the next settlement, so you can see whether a funding number is about to be paid or has just been paid.'],
  score:['Lens score','A 0–100 ranking inside the selected lens only. It is a sort order, not a rating of the market and not a probability. Switch lens and the same market moves.'],
  lean:['Direction lean','The arithmetic result of the measures listed underneath — how many currently read up versus down. It is a description of indicator state, never an instruction, and it says nothing about what price does next.'],
  rsi:['RSI (14)','Relative Strength Index over 14 bars. Above 70 is conventionally called overbought, below 30 oversold. On its own it is a poor timing tool, which is why it is one vote of several here.'],
  matrend:['Moving average stack','Price against the 20, 50 and 100-bar simple moving averages. Above all three is a clean uptrend; below all three a clean downtrend; mixed means no trend, which is information too.'],
  atr:['ATR expansion','Average True Range over 14 bars, compared with its own 50-bar average. Above 1 means the market is moving more than it usually does — bigger stops, smaller size for the same risk.'],
  rvol:['Relative volume','The last COMPLETED hour\'s volume against the 20 hours before it. The hour in progress is excluded because only part of it has happened — including it makes every market look unconfirmed for most of every hour. Above 1.25 means the move is being paid for; below 0.6 it is drifting on almost nothing, and that counts against the read.'],
  fundapr:['Funding APR','The hourly funding rate annualised, for scale. Positive means longs pay shorts. It is not a yield you can collect risk-free — you carry the position\'s price risk to earn it.'],
  basis:['Mark vs oracle','How far the perp mark has run from the oracle (spot) price. A wide positive gap means perp buyers are paying up; funding usually pulls it back.'],
  oi:['Open interest','Dollar value of positions currently open. Unlike volume it does not reset daily — it is what is still at risk.'],
  vsoi:['Turnover vs OI','24h volume divided by open interest. High means fast hands churning; low means positions being held. Neither is good or bad, but they behave differently.'],
  spread:['Impact spread','The distance between the impact bid and ask — roughly what it costs to get in and straight back out at size. Thin books make good-looking setups expensive.'],
  hold:['Cost to hold','What funding alone costs or pays on the notional you entered, per 8 hours and per day, at the current rate. The rate changes hourly; this is the current rate held constant.'],
  breakeven:['Break-even move','How far price must move in your favour to cover taker fees both ways plus one day of funding at the current rate. Below that, the trade is paying the venue.'],
  flowsplit:['How much traded','Volume summed over completed bars, so it reconciles with the exchange\'s own 24h figure once you allow for the part of the current hour that has not finished. The split underneath is by bar direction — volume that traded on bars closing up against bars closing down. It is NOT buy volume against sell volume: the exchange attaches a side to live trades only, and its history is candles, which carry no side at all. Nobody can give you a real buy/sell split over a day, so this page does not pretend to.'],
  atrmove:['Expected move','One ATR expressed in dollars and percent — a rough scale for where a stop has to sit to not be noise.']

(function tips(){

    anchor=a; pop.innerHTML=html; place(a);
  }
  function hide(){ pop.dataset.on='0'; anchor=null; }
  document.addEventListener('pointerover',e=>{
    if(e.pointerType==='touch') return;
    const a=e.target.closest('[data-tip]'); if(!a) return;
    if(a===anchor) return; show(a);
  });
  document.addEventListener('pointerout',e=>{
    const a=e.target.closest('[data-tip]'); if(!a) return;
    clearTimeout(hideT);
    if(e.relatedTarget && (a.contains(e.relatedTarget)||pop.contains(e.relatedTarget))) return;
    hideT=setTimeout(hide,120);
  });
  /* Tap-to-toggle on touch, but never swallow a click on something that does a
     job. CAPTURE phase, not bubble: a tip inside a row header has to be able to
     stop the header's own handler, and a listener on document in the bubble
     phase runs after it — tapping "thin" to find out what it meant collapsed
     the row you were reading. */
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-tip]');
    if(!a){ if(anchor) hide(); return; }
    const helpOnly=a.classList.contains('qm');
    if(helpOnly){ e.preventDefault(); e.stopPropagation();
      if(anchor===a) hide(); else show(a); return; }
    if(FINE()) return;
    /* On touch a tip is opened by tapping the thing itself. If that thing is
       purely informative — a flag chip, a vote bar — the tap must not also
       reach the row it sits inside, or asking what "thin" means silently
       collapses the row you were reading. If it IS the control (a link, a
       button), the tip shows and the control still does its job. */
    const isControl = a.matches('a,button,[role="button"],input,select');
    if(!isControl){ e.preventDefault(); e.stopPropagation(); }
    if(anchor===a) hide(); else show(a);
  },true);
  addEventListener('scroll',()=>{ if(anchor) place(anchor); },{passive:true});
  addEventListener('resize',()=>{ if(anchor) place(anchor); });
})();
function qm(key){ const s=el('span','qm','?'); s.setAttribute('data-tip',key);
  s.setAttribute('tabindex','0'); s.setAttribute('role','button'); s.setAttribute('aria-label','What is this?'); return s; }

/* ═══════════════════════════════════════════════════════════════
   6 · reveal — staggered, and never replayed on a user repaint
   ═══════════════════════════════════════════════════════════════ */
const revIO=new IntersectionObserver(es=>{
  es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)
    .forEach((e,i)=>{ e.target.style.setProperty('--d',Math.min(i,8)*58+'ms');
      e.target.dataset.in='1'; revIO.unobserve(e.target); });
},{rootMargin:'0px 0px -10% 0px',threshold:.06});
let QUIET=false;
/* A repaint the user just asked for must not replay the entrance animation —
   everything dropping to opacity 0 and fading back reads as a full page reload.
   The flag has to survive an async re-render, so it is armed until the next
   reveal() consumes it rather than cleared on a timeout. */
function quietly(fn){ QUIET=true; try{ fn(); }catch(e){ QUIET=false; throw e; } }
/* Wiping a container that sits ABOVE the viewport shortens the document for a
   frame. If it shortens past scrollY the browser clamps the scroll position,
   and the reader — who was reading something else entirely — gets yanked
   upward. Holding the old height across the swap makes the repaint invisible
   to anyone not looking at it. */
function swap(host, fill){
  if(!host) return;
  const h=host.offsetHeight;
  if(h) host.style.minHeight=h+'px';
  host.innerHTML='';
  try{ fill(); } finally {
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ host.style.minHeight=''; }); });
  }
}
function reveal(scope){
  const q=QUIET; QUIET=false;
  $$('.rv:not([data-in])',scope||document).forEach(n=>{
    if(q){ n.dataset.now='1'; n.dataset.in='1'; } else revIO.observe(n);
  });
}
setInterval(()=>{ $$('.rv:not([data-in])').forEach(n=>{
  const r=n.getBoundingClientRect(); if(r.top<innerHeight&&r.bottom>0) n.dataset.in='1'; }); },1300);

   ═══════════════════════════════════════════════════════════════ */
(function fundingClock(){
  const arc=$('#fcArc'), t=$('#fcT'), C=2*Math.PI*9;
  arc.style.strokeDasharray=C;
  function tick(){
    const now=new Date();

    const left=3600-s;
    t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    arc.style.strokeDashoffset=C*(1-left/3600);
    setTimeout(tick,1000-(now.getMilliseconds()));
  }

})();

/* ═══════════════════════════════════════════════════════════════
   Coin marks
   ═══════════════════════════════════════════════════════════════
   Every logo on this site is fetched from Hyperliquid's own icon store, keyed
   by the exact ticker: app.hyperliquid.xyz/coins/<NAME>.svg. That is the same
   file the exchange serves next to that market on its own screens, so the mark
   here can never be a different coin's artwork than the one you see when you
   go to trade it. Nothing is drawn by hand and nothing is guessed from a name.

   The store is strict — it 404s on anything it does not have, which was worth
   checking, because a store that answered every request with a house image
   would be a machine for showing the wrong logo. It covers 230 of the 233
   perps. Two adjustments, both read off the exchange's own metadata:

   · the seven k-markets (kPEPE, kSHIB, kBONK, kLUNC, kFLOKI, kDOGS, kNEIRO)
     are the same asset quoted in thousands, so the k comes off.
   · nine spot tokens are Unit-bridged versions of an asset the store already
     has. The token's own fullName says which — "Unit Bitcoin", "Unit Zcash" —
     and each pair below was read off that field rather than inferred from the
     ticker. UANSEM is bridged too but has no listed underlying, so it is not
     in the list and falls through to a monogram.

   Everything else — three delisted perps, and most of the long tail of spot
   tokens — gets a monogram tile. A monogram is visibly not a logo, which is
   the whole point: a missing mark is honest, a confident wrong one is not. */
const ICON_HOST='https://app.hyperliquid.xyz/coins/';
/* ── the same asset under two names ──────────────────────────────────
   Spot XRP is listed as FXRP. Spot ENA is UENA, spot Monero is XMR1, spot LINK
   is LINK0, spot PENGU is HPENGU. There is no single prefix and no list to
   memorise: at least five different bridges put assets on this venue and each
   one names its tokens its own way. The first version of this guessed at
   Unit's U and got everything else wrong, which is how XRP stayed invisible.

   So the pairing is not guessed from the name at all — it is PROVED by price.
   A name test proposes a candidate: the spot ticker ends with the perp's
   ticker (UBTC, FXRP, HPENGU), or starts with it followed by digits (XMR1,
   LINK0, AVAX0), or the perp's ticker appears as a word in the token's own
   fullName ("Unit Bitcoin"). Then the mid has to agree with the perp mark, and
   that is what actually decides it, because two names for one asset cannot
   disagree on what it is worth.

   Checked against the live venue: 26 pairs land within 0.4%, and the closest
   thing to a false positive is 1.97% away. That gap is the whole design.
   FXMR calls itself "Freedom XMR" and passes every name test, but trades at
   $28 against Monero's $508 — it is not Monero, and the price says so where no
   amount of string matching would. Same for BZEC at a seventh of ZEC.

   Staking receipts are excluded by name as well as by price. KHYPE tracks HYPE
   to within 2%, close enough that a wider band would swallow it, but a staking
   receipt accrues — it is worth more than the thing it holds, by design and by
   a margin that grows. It is not the same asset and never becomes one.

   The seed map below covers the case where spot metadata is never fetched at
   all. Everything else is learned from the venue on the way in, so a bridge
   that lists something new next month is paired without an edit here. */
const ICON_ALIAS={UBTC:'BTC',UETH:'ETH',USOL:'SOL',UZEC:'ZEC',UPUMP:'PUMP',
  UFART:'FARTCOIN',UXPL:'XPL',UENA:'ENA',UMON:'MON',FXRP:'XRP',XMR1:'XMR'};
/* how far apart two names for one asset may trade. Above the 0.4% the real
   pairs actually show, and well under the 1.97% of the nearest impostor. */
const TWIN_TOL=0.025;
const TWIN_DERIV=/\b(staked|restaked|staking|vault|yield|liquid staking)\b/i;
let TWINS={s2p:{},p2s:{}}, twinsP=null;

/* a k-market is the same asset quoted in thousands: kBONK against UBONK is a
   1000x disagreement about price and no disagreement at all about the asset */
function twinUnit(pn){ return /^k[A-Z0-9]{2,}$/.test(pn)
  ? {t:pn.slice(1), div:1000} : {t:pn, div:1}; }

function learnTwins(spotRows, perpRows){
  if(!spotRows||!perpRows) return TWINS;
  const s2p={}, p2s={}, vol={};
  const wordIn=(h,t)=>new RegExp('(^|[^A-Z0-9])'+t+'([^A-Z0-9]|$)','i').test(h||'');
  for(const sp of spotRows){
    const nm=String(sp.name||'').toUpperCase();
    if(!nm||!(sp.mark>0)) continue;
    if(TWIN_DERIV.test(sp.full||'')) continue;
    let best=null;
    for(const pp of perpRows){
      if(pp.delisted||!(pp.mark>0)) continue;
      const u=twinUnit(pp.name); if(u.t.length<2) continue;
      if(nm===u.t) continue;                       /* same ticker, nothing to map */
      const affix = nm.endsWith(u.t) ||
        (nm.startsWith(u.t) && /^[0-9]*$/.test(nm.slice(u.t.length)));
      if(!(affix || wordIn(sp.full,u.t))) continue;
      const d=Math.abs(sp.mark/(pp.mark/u.div)-1);
      if(d<=TWIN_TOL && (!best || d<best.d)) best={p:pp.name, d};
    }
    if(!best) continue;
    s2p[nm]=best.p;
    /* two wrappers can carry one asset — AVAX0 and UAVAX both hold AVAX — so
       the perp points back at whichever of them anyone actually trades */
    const v=+sp.vol||0;
    if(!(best.p in p2s) || v>vol[best.p]){ p2s[best.p]=nm; vol[best.p]=v; }
    ICON_ALIAS[nm]=best.p;                         /* the mark follows the asset */
  }
  TWINS={s2p,p2s};
  return TWINS;
}
/* Both sides, cached, once. Cheap wherever it is called from: the page it
   matters on has already asked for at least one of these two responses. */
async function ensureTwins(){
  if(twinsP) return twinsP;
  twinsP=(async()=>{
    try{
      const [pr,sr]=await Promise.all([
        apiR({type:'metaAndAssetCtxs'},{ttl:300000}),
        apiR({type:'spotMetaAndAssetCtxs'},{ttl:300000})]);
      learnTwins(spotUniverse(sr[0],sr[1]), universe(pr[0],pr[1]));
    }catch(e){ twinsP=null; }                      /* a failure may be retried */
    return TWINS;
  })();
  return twinsP;
}
/* the counterpart of a name on the other venue, in whichever direction */
function twinOf(name, wantSpot){
  const n=String(name||'').toUpperCase();
  return (wantSpot? TWINS.p2s[n] : TWINS.s2p[n]) || null;
}
/* a name the store has already refused is not asked for again this session */
const ICON_MISS=new Set();
function iconKey(name){
  const n=String(name||'').trim().toUpperCase();
  if(!n) return '';
  if(ICON_ALIAS[n]) return ICON_ALIAS[n];
  /* the k prefix is lower-case on the exchange, so match the raw name */
  const raw=String(name).trim();
  if(/^k[A-Z0-9]/.test(raw)) return raw.slice(1);
  return raw;
}
function coinMark(name,size){
  const w=el('span','cmk');
  if(size) w.style.setProperty('--s',size+'px');
  w.setAttribute('aria-hidden','true');
  /* The monogram is the BASE state, not the failure state. Marks below the
     fold load lazily and a mark whose file 404s has a round trip to wait
     through, so building the tile empty meant rows of blank discs on every
     first paint. The letters are always there; the artwork lands on top of
     them and the letters go transparent once it has. */
  w.textContent=String(name||'?').replace(/^k/,'').slice(0,2).toUpperCase();
  const key=iconKey(name);
  if(!key||ICON_MISS.has(key)) return w;
  /* NOT loading="lazy". These start at opacity 0 inside a 22-40px box, and on
     the deployed site Chrome deferred every one of them indefinitely — the
     whole site rendered as monograms while a direct new Image() of the same
     URL loaded in under a second. It behaved differently in the test browser,
     which is the worst version of this: an icon layer that quietly does not
     appear on some machines. They are 1-3KB SVGs and at most a couple of dozen
     per page, so they load normally, at low priority so they never compete
     with the page's own data. */
  const img=el('img'); img.alt=''; img.decoding='async';
  try{ img.fetchPriority='low'; }catch(e){}
  img.addEventListener('load',()=>{ w.dataset.on='1'; },{once:true});
  img.addEventListener('error',()=>{ ICON_MISS.add(key); img.remove(); },{once:true});
  img.src=ICON_HOST+encodeURIComponent(key)+'.svg';
  /* a cached file can be complete before a frame has passed; the listener
     above is attached first so this is only a belt for the braces */
  if(img.complete&&img.naturalWidth) w.dataset.on='1';
  w.appendChild(img);
  return w;
}

/* ═══════════════════════════════════════════════════════════════
   A one-line reading, in the words someone would actually use.
   Deliberately describes a STATE — "leaning up", "under pressure" —
   rather than an action. It is the same sentence everywhere a market
   appears, so the board and the last-hour strip never disagree.
   ═══════════════════════════════════════════════════════════════ */
function verdict(m,a){
  const r=momentum(m,a);
  const strong=r.score>=70, weak=r.score<45;
  const conf=a&&a.rvol!=null? a.rvol : null;
  const thin=(r.flags||[]).some(f=>f.t==='thin');
  const unconf=(r.flags||[]).some(f=>f.t==='unconfirmed');
  let head, tone;
  if(r.dir==='long'){ tone='up';
    head = strong? 'Bullish, and the measures agree'
         : weak  ? 'Leaning bullish, but only just'
                 : 'Bullish right now'; }
  else if(r.dir==='short'){ tone='down';
    head = strong? 'Bearish, and the measures agree'
         : weak  ? 'Leaning bearish, but only just'
                 : 'Bearish right now'; }
  else { tone='flat'; head='No clear direction'; }

  /* the caveat that actually changes how much the headline is worth */
  let caveat=null;
  if(r.dir==='none') caveat='The measures point both ways, which is its own answer: there is no trend here to read.';
  else if(unconf) caveat='Worth less than it looks: almost nobody is trading it, and a move nobody paid for is the kind that gets given back.';
  else if(thin) caveat='Getting in and out at size will cost you here — the book is thin.';
  else if(conf!=null&&conf>1.5) caveat='Real volume is behind it, which is what separates a move from a drift.';
  return {head, tone, score:r.score, dir:r.dir, r,
    line: head + (caveat? ' — ' + caveat.charAt(0).toLowerCase()+caveat.slice(1) : '.'),
    caveat};
}

/* The evidence behind that one line, as short sentences a person can check
   against the rows above. Never more than four — the point is to explain,
   not to restate the whole table. */
function verdictWhy(m,a){
  const r=momentum(m,a), out=[];
  const ups=r.votes.filter(v=>v.vote==='for'), dns=r.votes.filter(v=>v.vote==='against');
  const side=r.dir==='long'?ups:r.dir==='short'?dns:[];
  const mas=r.votes.filter(v=>/^ma/.test(v.id)||v.id==='stack');
  const agree=mas.filter(v=>v.vote===(r.dir==='long'?'for':'against')).length;
  if(r.dir!=='none')
    out.push(agree+' of the 4 trend checks point '+(r.dir==='long'?'up':'down')+
      ' — that is price against its own recent averages, over roughly a day, two days and four days.');
  else
    out.push('The trend checks disagree with each other: price is above some of its averages and below others.');
  if(a&&a.rvol!=null)
    out.push(a.rvol>1.25? 'The last full hour traded '+a.rvol.toFixed(1)+'× its usual volume, so people are actually acting on this.'
      : a.rvol<0.6 ? 'The last full hour traded only '+a.rvol.toFixed(2)+'× its usual volume — this is drifting, not being bought or sold.'
      : 'Volume in the last full hour was ordinary, so nothing to add either way.');
  if(a&&a.rsi!=null)
    out.push(a.rsi>70? 'It has been bought hard enough to sit in what is usually called overbought ('+a.rsi.toFixed(0)+' out of 100) — that can run, and it can snap back.'
      : a.rsi<30 ? 'It has been sold hard enough to sit in what is usually called oversold ('+a.rsi.toFixed(0)+' out of 100).'
      : 'Neither side has the upper hand on the last 14 hours ('+a.rsi.toFixed(0)+' out of 100).');
  out.push('Over the day it is '+pct(m.chg)+', on $'+fmtC(m.vol)+' traded.');
  return out.slice(0,4);
}

/* ── mode ──────────────────────────────────────────────────────────
   Perps are what almost everyone came for, so they are the default and the
   choice is remembered. Spot is a real venue here but a small one: 309 USDC
   pairs of which nine trade more than $1M a day. */
let MODE='perp';
try{ if(localStorage.getItem('hf.mode')==='spot') MODE='spot'; }catch(e){}

const ROUTES={};
/* soft:true is the venue switch — same page, different market type. It keeps
   the scroll position and skips the enter animation, so the sections rebuild
   under their own skeletons instead of the whole page fading out and back. */
async function route(opts){
  const soft=!!(opts&&opts.soft);
  const h=(location.hash||'#/home').replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  const id=parts[0]||'home';
  killActive(); setNav(id); track(id); progress(.2);
  const keepY=soft?scrollY:0;
  PAGE.innerHTML='';
  if(soft) delete PAGE.dataset.enter; else PAGE.dataset.enter='1';
  if(!soft) scrollTo({top:0,behavior:RM()?'auto':'instant'});
  const fn=ROUTES[id]||ROUTES.home;
  /* the skeletons are already on screen by the first await, so restoring the
     scroll here lands the reader where they were looking */
  if(soft) requestAnimationFrame(()=>scrollTo({top:keepY,behavior:'instant'}));
  try{ await fn(parts.slice(1)); }
  catch(e){ console.error(e); }
  finally { progress(1); if(soft) scrollTo({top:keepY,behavior:'instant'}); }
}

/* ═══════════════════════════════════════════════════════════════
   9 · command palette
   ═══════════════════════════════════════════════════════════════ */
(function palette(){
  const pal=$('#pal'), input=$('#palIn'), list=$('#palList');
  let items=[], sel=0, universe=[];
  function open(){ pal.dataset.on='1'; input.value=''; sel=0; render(''); setTimeout(()=>input.focus(),40);

  function render(qs){

/* ═══════════════════════════════════════════════════════════════
   10 · indicators — plain arithmetic, every one of them checkable
   ═══════════════════════════════════════════════════════════════ */
function SMA(a,n){ if(a.length<n) return null; let s=0; for(let i=a.length-n;i<a.length;i++) s+=a[i]; return s/n; }
function RSI(c,n=14){
  if(c.length<n+1) return null;
  let g=0,l=0;
  for(let i=c.length-n;i<c.length;i++){ const d=c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/n, al=l/n;
  if(al===0) return 100;
  const rs=ag/al; return 100-100/(1+rs);
}
function ATR(bars,n=14){
  if(bars.length<n+1) return null;
  const tr=[];
  for(let i=1;i<bars.length;i++){
    const h=+bars[i].h,l=+bars[i].l,pc=+bars[i-1].c;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  const out=[]; let sum=0;
  for(let i=0;i<tr.length;i++){ sum+=tr[i]; if(i>=n) sum-=tr[i-n]; if(i>=n-1) out.push(sum/n); }
  return out;
}
const TAKER=0.00045;   /* published cross fee, before any tier or referral discount */
/* Funding is annualised from ONE hourly print, so on a thin book it produces
   numbers like −1211%/yr on $1.0M of open interest — arithmetically true and
   completely untradeable. Any headline that names "the widest funding" reads
   from markets above this floor; measured live, 46 of 233 markets clear it. */
const FUND_FLOOR=1e7;
/* The same judgement for the ranked board: $10M of 24-hour volume. Measured
   live, 25 of 233 markets clear it — enough to fill a top ten with room to
   skip the ones whose measures disagree. BOARD_MIN is the floor's own floor:
   if a quiet day leaves fewer than this many liquid markets, the board falls
   back to the most-traded BOARD_MIN rather than showing a short list. */
const VOL_FLOOR=1e7, BOARD_MIN=18;
/* Spot on this venue is a tenth the size: 309 USDC pairs, nine of which trade
   more than $1M a day. A $10M floor would leave four. */
const SPOT_FLOOR=2.5e5, SPOT_MIN=8;
/* Every coin on the site points at its own market on the exchange. Spot names
   arrive as @N or +N and have no perp page, so those fall back to the app. */
const TRADE_URL=name=>/^[@+]/.test(name||'')
  ? 'https://app.hyperliquid.xyz/trade'
  : 'https://app.hyperliquid.xyz/trade/'+encodeURIComponent(name);
/* Spot markets live at TOKEN/USDC — verified by loading them, not assumed. */
const SPOT_URL=base=>'https://app.hyperliquid.xyz/trade/'+encodeURIComponent(base)+'/USDC';
const marketUrl=m=>m&&m.kind==='spot'? SPOT_URL(m.name) : TRADE_URL(m&&m.name);

function analyse(m, bars){
  /* The final candle is the hour currently in progress. Its price is the newest
     information and should be used — but its VOLUME is only however many minutes
     of the hour have elapsed, so comparing it against completed bars understates
     participation by the fraction of the hour still to come. Measured on BTC 4.4
     minutes past the hour: 0.27x against the incomplete bar, 1.02x against the
     last completed one. Every market was being read as unconfirmed for most of
     every hour. Price comes off the live bar; volume comes off completed bars. */
  const now=Date.now();
  const partial = bars.length && +bars[bars.length-1].T > now;
  const done = partial ? bars.slice(0,-1) : bars;
  const c=bars.map(b=>+b.c);
  const vd=done.map(b=>+b.v);
  const last=c[c.length-1];
  const s20=SMA(c,20), s50=SMA(c,50), s100=SMA(c,100);
  const rsi=RSI(c,14);
  const atrS=ATR(done,14);
  const atr=atrS&&atrS.length?atrS[atrS.length-1]:null;
  const atrAvg=atrS&&atrS.length>=50? atrS.slice(-50).reduce((a,b)=>a+b,0)/50 : null;
  const atrExp=(atr&&atrAvg)? atr/atrAvg : null;
  const vAvg=vd.length>21? SMA(vd.slice(0,-1),20) : null;
  const rvol=(vAvg&&vAvg>0&&vd.length)? vd[vd.length-1]/vAvg : null;
  const minsIn = partial ? (now-+bars[bars.length-1].t)/60000 : 60;
  /* The last COMPLETED hour, as an event: what it did, and whether it crossed
     the 20-bar average on the way. Both come out of bars already in hand, so
     the "what just changed" section costs no extra call. */
  const dc=done.map(b=>+b.c);
  const hourChg = dc.length>1 ? (dc[dc.length-1]/dc[dc.length-2]-1)*100 : null;
  const prev20 = dc.length>20 ? SMA(dc.slice(0,-1),20) : null;
  const cross = (prev20!=null && s20!=null && dc.length>1)
    ? (dc[dc.length-2]<prev20 && dc[dc.length-1]>SMA(dc,20) ? 'up'
      : dc[dc.length-2]>prev20 && dc[dc.length-1]<SMA(dc,20) ? 'down' : null)
    : null;
  return {last,s20,s50,s100,rsi,atr,atrExp,rvol,partial,minsIn,hourChg,cross,
          bars:done.length, spark:c.slice(-72)};
}

/* momentum: seven independent measures, each one a single vote */
/* ═══════════════════════════════════════════════════════════════
   What each measure actually means, in the words someone would use
   out loud. Two parts on purpose: WHAT it is, which never changes,
   and WHAT IT SAYS RIGHT NOW, which is generated from this market's
   own numbers. The second part names a direction because that is
   the honest reading of the number — it never names an action.
   ═══════════════════════════════════════════════════════════════ */
const MEANING={
  ma20:(v,m,a)=>({
    brief:'Price against its own average over roughly the last day. Above it, buyers have been paying up.',
    what:'The 20-bar average is roughly the last day of hourly trading, smoothed. Price above it means buyers have been paying up recently; below it means sellers have been hitting bids. It is the quickest of the three averages, so it turns first — and it gives the most false turns.',
    now: a.s20==null ? 'There are not enough bars yet to have a 20-bar average.'
      : (v.vote==='for'
        ? 'Price is '+v.val+' above it, so the last day of trading reads up.'
        : 'Price is '+v.val.replace('−','')+' below it, so the last day of trading reads down.')
  }),
  ma50:(v,m,a)=>({
    brief:'The same test over about two days, so a single loud hour barely moves it.',
    what:'About two days of hourly bars. Slower than the 20, so one loud hour barely moves it — this is closer to the direction of the week than the direction of the morning.',
    now: a.s50==null ? 'Not enough history yet for a 50-bar average.'
      : (v.vote==='for'
        ? 'Price sits '+v.val+' above it, which is the shape of a move that has lasted more than a session.'
        : 'Price sits '+v.val.replace('−','')+' below it, which is the shape of a decline that has lasted more than a session.')
  }),
  ma100:(v,m,a)=>({
    brief:'The same test over about four days. The slow one — it only turns when a move has lasted.',
    what:'About four days. This is the slow one, and it only changes its mind when a move has really persisted. When price and the 100 disagree with the faster averages, the disagreement itself is the information.',
    now: a.s100==null ? 'Not enough history yet for a 100-bar average.'
      : (v.vote==='for'
        ? 'Price is '+v.val+' above it — the longer backdrop reads up too.'
        : 'Price is '+v.val.replace('−','')+' below it — the longer backdrop reads down.')
  }),
  stack:(v,m,a)=>({
    brief:'Whether the fast average sits above the slow one. Short above long is the textbook uptrend.',
    what:'Whether the fast average sits above the slow one. Short above long means recent prices are higher than older prices, which is as close to a definition of an uptrend as this gets. Stacked the other way is a downtrend. It is the single most-used trend test there is, which also means everyone else can see it.',
    now: (a.s20==null||a.s50==null) ? 'Not enough bars to compare the two averages.'
      : (v.vote==='for'
        ? 'The 20 is above the 50, so the stack reads up.'
        : 'The 50 is above the 20, so the stack reads down.')
  }),
  rsi:(v,m,a)=>({
    brief:'How one-sided the last 14 hours were, 0 to 100. Over 70 is called overbought, under 30 oversold.',
    what:'How one-sided the last 14 bars have been, on a 0 to 100 scale. Above 70 gets called overbought and below 30 oversold, but a strong trend can sit pinned at either end for days — so it describes pressure, not a turning point.',
    now: a.rsi==null ? 'Not enough bars to compute it.'
      : a.rsi>70 ? 'At '+a.rsi.toFixed(1)+' it is in the range usually called overbought: buying has been persistent, which reads up while it lasts and unwinds quickly when it stops.'
      : a.rsi<30 ? 'At '+a.rsi.toFixed(1)+' it is in the range usually called oversold: selling has been persistent, which reads down while it lasts.'
      : a.rsi>55 ? 'At '+a.rsi.toFixed(1)+' the last 14 bars lean to buyers without being stretched — it reads up, mildly.'
      : a.rsi<45 ? 'At '+a.rsi.toFixed(1)+' the last 14 bars lean to sellers without being stretched — it reads down, mildly.'
      : 'At '+a.rsi.toFixed(1)+' it is squarely in the middle. Neither side has had the upper hand, so this one casts no vote.'
  }),
  chg24:(v,m,a)=>({
    brief:'Where price is against this time yesterday. Says nothing about whether the move is still going.',
    what:'Where price is against this time yesterday. It is the number every other site leads with, and on its own it says nothing about whether the move is still going — a market can be up 8% and have spent the last six hours giving it back.',
    now: v.vote==='flat'
      ? 'At '+v.val+' it has barely moved in a day, so it casts no vote here.'
      : (v.vote==='for'
        ? 'Up '+v.val.replace('+','')+' on the day, which reads up — but check it against the hourly averages above before treating it as a trend.'
        : 'Down '+v.val.replace('−','')+' on the day, which reads down — the averages above say whether that is still in progress.')
  }),
  rvol:(v,m,a)=>({
    brief:'How busy the last full hour was against its own average. Heavy means people are acting; light means drifting.',
    what:'How much traded in the last finished hour, against the twenty hours before it. This is the confirmation measure: a move on heavy volume is people acting, and a move on almost none is a price drifting because nobody is on the other side. The hour in progress is excluded, because only part of it has happened.',
    now: a.rvol==null ? 'Not enough completed hours to compare against.'
      : a.rvol>1.25 ? 'At '+a.rvol.toFixed(2)+'× normal, real size is behind this move — it confirms whichever way price went.'
      /* the arrow on this row and the words have to agree: on a falling price,
         "the move is not being paid for" LEANS UP, and saying only that it
         counts against would read as a contradiction of its own arrow */
      : a.rvol<0.6 ? 'At '+a.rvol.toFixed(2)+'× normal, almost nobody is trading it. A move nobody paid for is the kind that gets given back, so this counts against the move rather than sitting neutral — with price '+
          (m.chg>=0?'up, that leans down.':'down, that leans up.')
      : 'At '+a.rvol.toFixed(2)+'× normal this is ordinary participation — neither confirmation nor a warning, so it casts no vote.'
  })
};
/* A tooltip has room for a sentence, not a paragraph: what the measure is,
   then what it currently reads. The old one said "Price vs 50-bar average —
   50-bar SMA $5.391", which restates the label and hands over a raw number. */
function meaningTip(v,m,a){
  const mn=meaningFor(v,m,a);
  if(!mn) return v.label+' — '+v.why+'.';
  /* two parts, visibly: what the measure is, then what it currently reads.
     Run together they read as one long sentence nobody finishes. */
  return '<b>'+v.label+'</b>'+(mn.brief||'')+'<em>'+mn.now+'</em>';
}
function meaningFor(v,m,a){
  const f=MEANING[v.id];
  if(!f) return null;
  try{ return f(v,m,a); }catch(e){ return null; }
}

function momentum(m,a){
  const V=[];
  const add=(id,k,label,val,vote,why)=>V.push({id,k,label,val,vote,why});
  const p=a.last;
  add('ma20','matrend','Price vs 20-bar average', a.s20? pct((p/a.s20-1)*100):'—',
      a.s20? (p>a.s20?'for':'against'):'flat', a.s20?('20-bar SMA '+px(a.s20)):'not enough bars');
  add('ma50','matrend','Price vs 50-bar average', a.s50? pct((p/a.s50-1)*100):'—',
      a.s50? (p>a.s50?'for':'against'):'flat', a.s50?('50-bar SMA '+px(a.s50)):'not enough bars');
  add('ma100','matrend','Price vs 100-bar average', a.s100? pct((p/a.s100-1)*100):'—',
      a.s100? (p>a.s100?'for':'against'):'flat', a.s100?('100-bar SMA '+px(a.s100)):'not enough bars');
  add('stack','matrend','Average stack aligned', (a.s20&&a.s50)? (a.s20>a.s50?'20 over 50':'50 over 20'):'—',
      (a.s20&&a.s50)? (a.s20>a.s50?'for':'against'):'flat','the short average above the long one is the classic trend test');
  add('rsi','rsi','RSI (14)', a.rsi!=null? a.rsi.toFixed(1):'—',
      a.rsi==null?'flat': a.rsi>55?'for': a.rsi<45?'against':'flat',
      a.rsi==null?'not enough bars': a.rsi>70?'above 70 — conventionally overbought': a.rsi<30?'below 30 — conventionally oversold':'between 30 and 70');
  add('chg24','rvol','24-hour change', pct(m.chg),
      m.chg>0.4?'for': m.chg<-0.4?'against':'flat','against the previous day close');
  /* an unconfirmed move counts AGAINST the read rather than sitting neutral —
     a 10% move on 2% of normal volume is not the same event as a 10% move on
     double it, and ranking them alike is how a stale market tops the board */
  add('rvol','rvol','Volume, last completed hour',
      a.rvol!=null? a.rvol.toFixed(2)+'× average':'—',
      a.rvol==null?'flat'
        : a.rvol>1.25 ? (m.chg>=0?'for':'against')
        : a.rvol<0.6  ? (m.chg>=0?'against':'for')
        : 'flat',
      a.rvol==null?'not enough completed bars'
        : a.rvol>1.25?'the move is being paid for'
        : a.rvol<0.6 ?'barely any participation — this move is not being paid for'
        :'ordinary participation');
  const f=V.filter(x=>x.vote==='for').length, ag=V.filter(x=>x.vote==='against').length;
  const dir = f>ag+1?'long' : ag>f+1?'short' : 'none';
  /* strength: agreement, then confirmed by how far it has actually travelled */
  const agree=Math.abs(f-ag)/V.length;
  const travel=Math.min(1,Math.abs(m.chg)/6);
  const conf=Math.min(1,(a.rvol||0)/1.6);
  const exp=Math.min(1,(a.atrExp||1)/1.8);
  let score=agree*46+travel*20+conf*22+exp*12;
  /* an unconfirmed move is demoted outright, not merely un-rewarded */
  const unconfirmed = a.rvol!=null && a.rvol<0.6;
  if(unconfirmed) score*=0.62;
  const thin = m.vol<5e6 || (m.spreadPct||0)>0.12;
  if(thin) score*=0.88;
  const flags=[];
  if(unconfirmed) flags.push({t:'unconfirmed',w:'the move is happening on '+(a.rvol*100).toFixed(0)+'% of normal hourly volume'});
  if(thin) flags.push({t:'thin',w:'$'+fmtC(m.vol)+' traded in 24h'+((m.spreadPct||0)>0.12?' and a '+m.spreadPct.toFixed(2)+'% impact spread':'')+' — harder to get in and out at size'});
  return {votes:V,dir,score:Math.round(clamp(score,0,100)),for:f,against:ag,flags,
          leanText: dir==='long'?'Trend measures read up':dir==='short'?'Trend measures read down':'Measures disagree — no trend'};
}

/* funding stress: who is paying, how hard, and does the size behind it matter */
function fundingStress(m,a){
  const V=[];
  const apr=m.fundingApr;
  const paidSide = apr>0 ? 'short' : apr<0 ? 'long' : 'none';
  V.push({k:'fundapr',label:'Funding, annualised',val:pct(apr,1),
    vote: Math.abs(apr)>20?'for':'flat',
    why: apr>0?'longs are paying shorts':apr<0?'shorts are paying longs':'flat'});
  V.push({k:'fundapr',label:'Hourly rate',val:(m.fundingHr>=0?'+':'−')+Math.abs(m.fundingHr).toFixed(4)+'%',
    vote:'flat',why:'charged on notional every hour, on the hour'});
  V.push({k:'oi',label:'Open interest behind it',val:'$'+fmtC(m.oiNtl),
    vote: m.oiNtl>5e6?'for':'flat', why: m.oiNtl>5e6?'enough size for the rate to mean something':'thin — the rate moves on very little'});
  V.push({k:'basis',label:'Mark vs oracle',val:pct(m.oracleGap,3),
    vote: Math.abs(m.oracleGap)>0.05?'for':'flat',
    why: m.oracleGap>0?'perp trading above spot':'perp trading below spot'});
  V.push({k:'vsoi',label:'Turnover vs open interest',val:m.volOverOi!=null?m.volOverOi.toFixed(2)+'×':'—',
    vote:'flat', why: (m.volOverOi||0)>1?'fast hands — positions turning over daily':'positions being held rather than churned'});
  const mag=Math.min(1,Math.log10(1+Math.abs(apr))/2.4);
  const size=Math.min(1,Math.log10(1+m.oiNtl/1e5)/3.2);
  const score=Math.round(clamp(mag*62+size*38,0,100));
  const flags=[];
  if(m.oiNtl<2e6) flags.push({t:'thin',w:'only $'+fmtC(m.oiNtl)+' of open interest behind this rate'});
  if(Math.abs(apr)>200) flags.push({t:'extreme',w:'a rate this far out usually means a dislocation rather than an opportunity'});
  return {votes:V,dir: paidSide==='short'?'short':paidSide==='long'?'long':'none',score,flags,
    for:V.filter(x=>x.vote==='for').length, against:0,
    leanText: apr>0?'Shorts are being paid to hold':apr<0?'Longs are being paid to hold':'Funding is flat'};
}

/* sparkline */
function spark(vals,col,w,h){
  if(!vals||vals.length<2) return '';
  w=w||120;h=h||34;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const p=vals.map((v,i)=>[(i/(vals.length-1))*w,h-((v-mn)/rg)*(h-6)-3]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const id='k'+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".34"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+p[p.length-1][0].toFixed(1)+'" cy="'+p[p.length-1][1].toFixed(1)+'" r="2.3" fill="'+col+'"/></svg>';
}

/* ═══════════════════════════════════════════════════════════════
   13 · RADAR
   One 20-weight call ranks all 233 markets. Candles for all of them

   only the shortlist gets charts. That constraint is on the page,
   not hidden behind it.
   ═══════════════════════════════════════════════════════════════ */
let LENS_ID='momentum', DEPTH=10;
try{ LENS_ID=localStorage.getItem('hf.lens')||'momentum'; }catch(e){}
let RADAR={t:0,U:null,short:null,det:null};
let PASSED=[], READN=0;

function universe(meta,ctxs){
  return meta.universe.map((u,i)=>{
    const c=ctxs[i]||{}, mark=+c.markPx, prev=+c.prevDayPx, oi=+c.openInterest;
    const imp=(c.impactPxs||[]).map(Number);
    /* The exchange keeps delisted perps in the universe response — 56 of the
       233 at the time of writing. They return a last price and zeroes for
       everything else, which is not missing data, it is a market that no
       longer trades. Carrying the flag lets the table say so instead of
       showing a wall of $0.00. */
    /* name is what a reader sees; key is what the API is asked for. They are
       the same for perps and different for spot, where the display name is the
       token (HYPE) and the market is a pair index (@107). Every call downstream
       uses key so nothing has to know which mode it is in. */
    return {name:u.name, key:u.name, kind:'perp',
      maxLev:u.maxLeverage, delisted:!!u.isDelisted,
      mark, oracle:+c.oraclePx,
      chg: prev? (mark-prev)/prev*100 : 0,
      fundingHr:+c.funding*100, fundingApr:+c.funding*24*365*100,
      oiNtl: oi*mark, vol:+c.dayNtlVlm,
      volOverOi: oi*mark? +c.dayNtlVlm/(oi*mark) : null,
      oracleGap: c.oraclePx? (mark-+c.oraclePx)/+c.oraclePx*100 : 0,
      spreadPct: (imp.length===2&&imp[0])? (imp[1]-imp[0])/imp[0]*100 : null
    };
  }).filter(m=>isFinite(m.mark)&&m.mark>0);
}

/* run n at a time and keep going — twelve 250ms calls cost 3.8s queued and
   about 1.1s overlapped, for exactly the same rate-limit weight */
async function inParallel(items, n, fn){
  let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ const k=i++; await fn(items[k],k); }
  }));
}

/* a pager that re-flicks its list, so a page change reads as movement */
function pager(host, total, per, page, onPage){
  host.innerHTML='';
  const pages=Math.ceil(total/per)||1;
  if(pages<2){ host.hidden=true; return; }
  host.hidden=false;
  const mk=(d,lbl,path)=>{ const b=el('button','pgb'); b.setAttribute('aria-label',lbl);
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg>';
    b.disabled = d<0 ? page===0 : page>=pages-1;
    b.addEventListener('click',()=>onPage(clamp(page+d,0,pages-1))); return b; };
  host.appendChild(mk(-1,'Previous page','M15 18l-6-6 6-6'));
  if(pages<=14){
    const d=el('div','pgd');
    for(let i=0;i<pages;i++){ const b=el('button'); if(i===page) b.className='on';
      b.setAttribute('aria-label','Page '+(i+1));
      b.addEventListener('click',()=>onPage(i)); d.appendChild(b); }
    host.appendChild(d);
  } else host.appendChild(el('span','pgn','page '+(page+1)+' of '+pages));
  host.appendChild(mk(1,'Next page','M9 6l6 6-6 6'));
  const from=page*per+1, to=Math.min(total,(page+1)*per);
  host.appendChild(el('span','pgn',from+'–'+to+' of '+total));
}
/* `both` meant these rows kept the animation's final opacity:1 FOREVER, as an
   inline animated value, and an animated value beats every ordinary
   declaration in the stylesheet. So the hover dim landed on the market table,
   the mini board, the top-10 and the last-hour strip as a desaturation with no
   fade — half the effect, silently, on four lists at once. `backwards` fills
   only before the animation starts, which is all the delay actually needs, and
   the inline rule is cleared once it has played so nothing lingers. */
function flick(box){
  if(RM()) return;
  [...box.children].forEach((n,i)=>{ n.style.animation='none'; void n.offsetWidth;
    n.style.animation='pgFlick .3s var(--ease-out) '+Math.min(i,9)*20+'ms backwards';
    n.addEventListener('animationend',()=>{ n.style.animation=''; },{once:true}); });
}
function secHead(title, sub, right){
  const h=el('div','sec-h');
  requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.add('drawn')));
  const l=el('div','l'); l.append(el('h2',null,title)); if(sub) l.append(el('p',null,sub));
  h.append(l);
  if(right) h.append(right);
  return h;
}

ROUTES.radar=async function(args){
  const wrap=el('div'); PAGE.appendChild(wrap);

  const head=el('div','rd-head');
  const L=el('div');
