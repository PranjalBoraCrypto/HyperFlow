<style>
/* ═══════════════════════════════════════════════════════════════
   HYPERFLOW DESIGN SYSTEM
   Ground and mint sampled from the Hyperliquid mark (#96FCE4 on
   #072722). Built as a ten-step ramp so elevation is a real axis
   rather than one border colour reused everywhere.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* surfaces, dark is home */
  --g0:#030C0A; --g1:#061613; --g2:#0A211C; --g3:#0E2C25; --g4:#12382F;
  --line:#102520; --line-2:#173A32; --line-3:#1F4D42;
  /* ink */
  --ink:#E6F5F0; --ink-2:#9FBCB4; --ink-3:#688A81; --ink-4:#456058;
  /* brand */
  --mint:#7DFCDD; --mint-2:#4FE0BE; --mint-3:#2FBFA0;
  --mint-wash:#0B2A24; --mint-glow:rgba(125,252,221,.14);
  --on-mint:#032019;
  /* semantic — separate from the accent on purpose */
  --up:#5CE6A8; --up-wash:rgba(92,230,168,.13);
  --down:#FF7A63; --down-wash:rgba(255,122,99,.13);
  --warn:#FFC163; --warn-wash:rgba(255,193,99,.13);
  --info:#7EC8FF; --info-wash:rgba(126,200,255,.13);
  /* elevation */
  --e1:0 1px 0 rgba(125,252,221,.05), 0 1px 2px rgba(0,0,0,.4);
  --e2:0 1px 0 rgba(125,252,221,.06), 0 6px 18px rgba(0,0,0,.42);
  --e3:0 1px 0 rgba(125,252,221,.08), 0 18px 44px rgba(0,0,0,.55);
  --e4:0 30px 80px rgba(0,0,0,.66);
  /* geometry */
  --r1:8px; --r2:12px; --r3:18px; --r4:26px;
  --rail:74px; --railw:246px; --top:60px;
  /* motion */
  --sp-fast:.16s; --sp:.24s; --sp-slow:.42s;
  --ease:cubic-bezier(.2,.8,.25,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.2,1.35,.35,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --g0:#EEF5F2; --g1:#FFFFFF; --g2:#F3F9F6; --g3:#E6F1EC; --g4:#D8E9E2;
  --line:#D3E6DE; --line-2:#BCD8CE; --line-3:#9CC4B7;
  --ink:#04201A; --ink-2:#3C574F; --ink-3:#5F7D74; --ink-4:#84A096;
  --mint:#06765F; --mint-2:#059578; --mint-3:#0BB392;
  --mint-wash:#D6FBF0; --mint-glow:rgba(6,118,95,.10);
  --on-mint:#FFFFFF;
  --up:#0B7A52; --up-wash:rgba(11,122,82,.11);
  --down:#B23A22; --down-wash:rgba(178,58,34,.10);
  --warn:#8A6208; --warn-wash:rgba(138,98,8,.11);
  --info:#1265A8; --info-wash:rgba(18,101,168,.10);
  --e1:0 1px 2px rgba(4,32,26,.06);
  --e2:0 2px 4px rgba(4,32,26,.05), 0 8px 20px rgba(4,32,26,.06);
  --e3:0 4px 8px rgba(4,32,26,.05), 0 20px 46px rgba(4,32,26,.09);
  --e4:0 30px 70px rgba(4,32,26,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --g0:#EEF5F2; --g1:#FFFFFF; --g2:#F3F9F6; --g3:#E6F1EC; --g4:#D8E9E2;
    --line:#D3E6DE; --line-2:#BCD8CE; --line-3:#9CC4B7;
    --ink:#04201A; --ink-2:#3C574F; --ink-3:#5F7D74; --ink-4:#84A096;
    --mint:#06765F; --mint-2:#059578; --mint-3:#0BB392;
    --mint-wash:#D6FBF0; --mint-glow:rgba(6,118,95,.10); --on-mint:#FFFFFF;
    --up:#0B7A52; --up-wash:rgba(11,122,82,.11);
    --down:#B23A22; --down-wash:rgba(178,58,34,.10);
    --warn:#8A6208; --warn-wash:rgba(138,98,8,.11);
    --info:#1265A8; --info-wash:rgba(18,101,168,.10);
    --e1:0 1px 2px rgba(4,32,26,.06);
    --e2:0 2px 4px rgba(4,32,26,.05), 0 8px 20px rgba(4,32,26,.06);
    --e3:0 4px 8px rgba(4,32,26,.05), 0 20px 46px rgba(4,32,26,.09);
    --e4:0 30px 70px rgba(4,32,26,.14);
    color-scheme:light;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--g0); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden; min-height:100vh;
}
/* engraved terminal grid, masked so it never fights the content */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 5%,transparent 72%);
  mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 5%,transparent 72%);
}
h1,h2,h3,h4{margin:0; font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  font-weight:800; letter-spacing:-.035em; text-wrap:balance; line-height:1.04}
p{margin:0}
a{color:inherit; text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--mint); outline-offset:3px; border-radius:6px}
::selection{background:var(--mint); color:var(--on-mint)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.micro{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{scrollbar-width:thin; scrollbar-color:var(--line-3) transparent}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:99px;border:3px solid var(--g0)}
*::-webkit-scrollbar-thumb:hover{background:var(--mint-3)}

/* ═══════════════ SHELL ═══════════════ */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

/* --- the rail. Icons only; labels fly out as pills, so nothing reflows. --- */
.rail{
  position:fixed; left:0; top:0; bottom:0; width:var(--rail); z-index:70;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--g1),var(--g0));
  border-right:1px solid var(--line);
}
.rail::after{content:"";position:absolute;top:0;right:-1px;width:1px;height:100%;
  background:linear-gradient(180deg,transparent,var(--mint-glow) 22%,transparent 62%);pointer-events:none}
.rl-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  margin-bottom:12px;transition:transform var(--sp) var(--spring)}
.rl-mark:hover{transform:scale(1.08) rotate(-4deg)}
.rl-mark canvas{width:42px;height:42px;display:block;border-radius:13px}
.rl-b{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  color:var(--ink-3);flex:none;transition:color var(--sp),background var(--sp),transform var(--sp) var(--spring)}
.rl-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--sp) var(--spring)}
.rl-b:hover{color:var(--ink);background:var(--g2)}
.rl-b:hover svg{transform:translateY(-2px) scale(1.06)}
.rl-b[aria-current="page"]{color:var(--mint);background:var(--mint-wash)}
.rl-b[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.rl-sp{flex:1}
.rl-tip{position:fixed;left:-9999px;top:0;z-index:120;pointer-events:none;background:var(--g3);color:var(--ink);
  border:1px solid var(--line-3);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;
  white-space:nowrap;box-shadow:var(--e3);opacity:0;transform:translateX(-6px);
  transition:opacity var(--sp-fast),transform var(--sp-fast) var(--ease-out)}
.rl-tip[data-on="1"]{opacity:1;transform:none}
.rl-tip:not([data-on="1"]){visibility:hidden}
.rl-tip s{text-decoration:none;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:10.5px;margin-left:8px}

/* --- top bar --- */
.top{position:sticky;top:0;z-index:60;height:var(--top);display:flex;align-items:center;gap:12px;
  padding:0 clamp(14px,2.4vw,26px);background:color-mix(in srgb,var(--g0) 82%,transparent);
  backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid transparent;
  transition:border-color var(--sp),background var(--sp)}
.top[data-stuck="1"]{border-bottom-color:var(--line);background:color-mix(in srgb,var(--g0) 94%,transparent)}
.crumb{display:flex;align-items:center;gap:9px;min-width:0}
.crumb .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .live{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);
  background:var(--mint-wash);border:1px solid color-mix(in srgb,var(--mint) 32%,transparent);
  border-radius:99px;padding:3px 9px}
.crumb .live i{width:5px;height:5px;border-radius:99px;background:var(--mint);animation:pulseDot 1.7s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.top .sp{flex:1}
.cmd{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--g1);color:var(--ink-3);font-size:13px;
  transition:border-color var(--sp),color var(--sp),background var(--sp),transform var(--sp) var(--spring)}
.cmd:hover{border-color:var(--line-3);color:var(--ink);background:var(--g2);transform:translateY(-1px)}
.cmd svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.cmd kbd{font-family:"IBM Plex Mono",monospace;font-size:10px;border:1px solid var(--line-2);
  border-radius:5px;padding:2px 5px;color:var(--ink-3);background:var(--g0)}
@media (max-width:720px){ .cmd kbd,.cmd .lbl{display:none} .cmd{width:38px;justify-content:center;padding:0} }

/* the funding clock — Hyperliquid funds hourly, so the whole venue shares one countdown */
.fclock{display:flex;align-items:center;gap:9px;padding:0 11px;height:36px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--g1);transition:border-color var(--sp)}
.fclock:hover{border-color:var(--line-3)}
.fclock svg{width:20px;height:20px;transform:rotate(-90deg)}
.fclock .trk{fill:none;stroke:var(--line-2);stroke-width:2.6}
.fclock .val{fill:none;stroke:var(--mint);stroke-width:2.6;stroke-linecap:round;
  transition:stroke-dashoffset 1s linear}
.fclock .t{display:flex;flex-direction:column;line-height:1.05}
.fclock .t b{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.fclock .t s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
@media (max-width:900px){ .fclock .t{display:none} .fclock{padding:0 8px} }
.iconb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);
  border:1px solid transparent;transition:background var(--sp),color var(--sp),border-color var(--sp),transform var(--sp) var(--spring)}
.iconb:hover{background:var(--g2);color:var(--ink);border-color:var(--line-2);transform:translateY(-1px) rotate(-8deg)}
.iconb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* --- route progress bar --- */
.rprog{position:fixed;top:0;left:0;height:2px;z-index:200;width:0;opacity:0;
  background:linear-gradient(90deg,var(--mint-3),var(--mint));box-shadow:0 0 12px var(--mint);
  transition:width .3s var(--ease-out),opacity .25s}
.rprog[data-on="1"]{opacity:1}

/* --- main --- */
.main{grid-column:2;min-width:0;display:flex;flex-direction:column}
.page{padding:clamp(18px,2.6vw,34px) clamp(14px,2.4vw,26px) 120px;max-width:1520px;width:100%;margin:0 auto}
.page[data-enter="1"]{animation:pgEnter .5s var(--ease-out) both}
@keyframes pgEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- mobile: rail becomes a dock, plus a drag-up sheet --- */
.dock{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{grid-column:1}
  .page{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .dock{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    z-index:80;height:62px;align-items:center;justify-content:space-around;gap:2px;padding:0 6px;
    background:color-mix(in srgb,var(--g1) 92%,transparent);backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--e3)}
  .dk{flex:1 1 0;min-width:44px;height:50px;border-radius:15px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;color:var(--ink-3);
    transition:color var(--sp),background var(--sp)}
  .dk svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dk s{text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.02em}
  .dk[aria-current="page"]{color:var(--mint);background:var(--mint-wash)}
  .dk:active{transform:scale(.93)}
}

/* --- the "more" sheet on mobile --- */
.sheet{position:fixed;inset:0;z-index:150;display:none}
.sheet[data-on="1"]{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity var(--sp)}
.sheet[data-on="1"] .scrim{opacity:1}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--g1);border-top:1px solid var(--line-2);
  border-radius:26px 26px 0 0;padding:10px 14px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform var(--sp-slow) var(--ease-out);box-shadow:var(--e4);
  max-height:82vh;overflow-y:auto}
.sheet[data-on="1"] .panel{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line-3);margin:6px auto 14px}
.sheet .items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .it{display:flex;align-items:center;gap:11px;padding:13px;border-radius:14px;background:var(--g2);
  border:1px solid var(--line);min-height:56px;transition:border-color var(--sp),transform var(--sp)}
.sheet .it:active{transform:scale(.97)}
.sheet .it[aria-current="page"]{border-color:var(--mint-2);color:var(--mint);background:var(--mint-wash)}
.sheet .it svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;flex:none}
.sheet .it b{font-size:13.5px;font-weight:600}

/* ═══════════════ PRIMITIVES ═══════════════ */
.card{position:relative;background:var(--g1);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--e1);transition:border-color var(--sp),box-shadow var(--sp),transform var(--sp) var(--ease)}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--mint-glow),transparent);opacity:0;transition:opacity var(--sp)}
.card:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.card:hover::before{opacity:1}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--e3)}
/* the pointer light: one shared rAF writes --mx/--my, every card reads them */
.card.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  transition:opacity var(--sp);
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),var(--mint-glow),transparent 60%)}
.card.glow:hover::after{opacity:1}
.pad{padding:clamp(15px,1.8vw,22px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;
  border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;
  border:1px solid var(--line-2);background:var(--g1);color:var(--ink);
  transition:transform var(--sp) var(--spring),border-color var(--sp),background var(--sp),color var(--sp),box-shadow var(--sp)}
.btn:hover{border-color:var(--line-3);background:var(--g2);transform:translateY(-2px);box-shadow:var(--e2)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:var(--mint);color:var(--on-mint);border-color:transparent;font-weight:700}
.btn.pri:hover{background:var(--mint);filter:brightness(1.06);box-shadow:0 8px 26px -8px var(--mint)}
.btn.ghost{background:transparent}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.seg{display:inline-flex;padding:3px;gap:2px;border-radius:13px;background:var(--g1);
  border:1px solid var(--line-2);position:relative;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;height:36px;padding:0 15px;border-radius:10px;font-size:13px;
  font-weight:600;color:var(--ink-3);white-space:nowrap;transition:color var(--sp)}
.seg button:hover:not(.on){color:var(--ink)}
.seg button.on{color:var(--on-mint)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:10px;background:var(--mint);z-index:0;
  transition:left var(--sp-slow) var(--spring),width var(--sp-slow) var(--spring)}
@media (max-width:640px){ .seg{width:100%} .seg button{flex:1 1 0;min-height:44px;padding:0 8px} }

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid transparent;white-space:nowrap}
.chip.up{color:var(--up);background:var(--up-wash);border-color:color-mix(in srgb,var(--up) 26%,transparent)}
.chip.down{color:var(--down);background:var(--down-wash);border-color:color-mix(in srgb,var(--down) 26%,transparent)}
.chip.warn{color:var(--warn);background:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.chip.info{color:var(--info);background:var(--info-wash);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.chip.mut{color:var(--ink-3);background:var(--g2);border-color:var(--line)}

/* help affordance */
.qm{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:99px;flex:none;
  border:1px solid var(--line-3);color:var(--ink-3);font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;font-weight:700;cursor:help;vertical-align:middle;
  transition:color var(--sp),border-color var(--sp),transform var(--sp) var(--spring)}
.qm:hover{color:var(--mint);border-color:var(--mint-2);transform:scale(1.16)}
.tip{position:fixed;z-index:220;max-width:min(320px,88vw);padding:12px 14px;background:var(--g3);
  border:1px solid var(--line-3);border-radius:12px;box-shadow:var(--e3);font-size:13px;line-height:1.55;
  color:var(--ink);opacity:0;transform:translateY(5px) scale(.98);pointer-events:none;
  transition:opacity var(--sp-fast),transform var(--sp-fast) var(--ease-out)}
.tip[data-on="1"]{opacity:1;transform:none}
.tip b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;
  margin-bottom:5px;letter-spacing:-.02em}

/* reveal */
.rv{opacity:0;transform:translateY(14px)}
.rv[data-in="1"]{animation:rvIn .6s var(--ease-out) forwards;animation-delay:var(--d,0ms)}
.rv[data-now="1"]{animation:none!important;opacity:1;transform:none}
@keyframes rvIn{to{opacity:1;transform:none}}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══════════════ SCAN LOADER (sc-) ═══════════════
   Not a spinner and not a progress bar pretending to know the future.
   It draws the actual universe as a lattice of cells, sweeps a radial
   line over it, and lights each cell as that market's data really
   lands — so the motion is the work, not a decoration of it. */
.sc{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);align-items:center;
  padding:clamp(20px,4vw,48px) 0}
.sc-stage{position:relative;width:clamp(180px,26vw,268px);aspect-ratio:1}
.sc-stage canvas{display:block;width:100%;height:100%}
.sc-pct{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-pct b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(26px,4.4vw,40px);
  letter-spacing:-.05em;line-height:1}
.sc-pct s{text-decoration:none;display:block;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.sc-side{min-width:0;display:flex;flex-direction:column;gap:13px}
.sc-side h2{font-size:clamp(21px,3.4vw,30px)}
.sc-steps{display:flex;flex-direction:column;gap:7px}
.sc-st{display:grid;grid-template-columns:16px 1fr auto;gap:11px;align-items:center;
  font-size:13px;color:var(--ink-4);transition:color var(--sp)}
.sc-st[data-s="run"]{color:var(--ink)}
.sc-st[data-s="done"]{color:var(--ink-2)}
.sc-st .d{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line-3);position:relative;
  transition:border-color var(--sp),background var(--sp)}
.sc-st[data-s="run"] .d{border-color:var(--mint)}
.sc-st[data-s="run"] .d::after{content:"";position:absolute;inset:3px;border-radius:99px;background:var(--mint);
  animation:pulseDot 1.1s ease-in-out infinite}
.sc-st[data-s="done"] .d{border-color:var(--mint-3);background:var(--mint-3)}
.sc-st[data-s="done"] .d::after{content:"";position:absolute;inset:0;display:grid;place-items:center;
  color:var(--on-mint);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.sc-st .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.sc-now{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mint-2);min-height:18px}
@media (max-width:700px){ .sc{grid-template-columns:1fr;justify-items:center;text-align:center}
  .sc-side{align-items:center} .sc-steps{align-items:flex-start} }

/* skeletons that match the real layout, so nothing jumps on arrival */
.sk{background:linear-gradient(100deg,var(--g2) 8%,var(--g3) 22%,var(--g2) 36%);
  background-size:280% 100%;animation:skS 1.6s linear infinite;border-radius:var(--r2)}
@keyframes skS{to{background-position:-280% 0}}
.sk-board{display:grid;gap:10px}
.sk-row{height:96px;border-radius:var(--r3)}
.sk-strip{height:74px;border-radius:var(--r3)}

/* ═══════════════ RADAR (rd-) ═══════════════ */
.rd-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin-bottom:16px}
.rd-h1{font-size:clamp(28px,5vw,46px);line-height:.98}
.rd-h1 em{font-style:normal;color:var(--mint)}
.rd-sub{color:var(--ink-2);font-size:clamp(14px,1.6vw,16px);max-width:58ch;margin-top:9px}

/* venue pulse strip */
.rd-pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(178px,100%),1fr));gap:9px;margin-bottom:18px}
.pl{position:relative;padding:14px 16px;border-radius:var(--r2);background:var(--g1);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;overflow:hidden;
  transition:border-color var(--sp),transform var(--sp) var(--ease)}
.pl:hover{border-color:var(--line-2);transform:translateY(-2px)}
.pl .k{display:flex;align-items:center;gap:6px}
.pl .v{font-family:"IBM Plex Mono",monospace;font-size:clamp(18px,2.3vw,23px);font-weight:600;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl .s{font-size:11.5px;color:var(--ink-3)}
.pl .spark{position:absolute;right:0;bottom:0;left:0;height:26px;opacity:.4;pointer-events:none}

/* lens bar */
.rd-lens{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rd-lensL{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rd-count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}

/* the board */
.rd-board{display:flex;flex-direction:column;gap:9px}
.mk{position:relative;border-radius:var(--r3);background:var(--g1);border:1px solid var(--line);
  overflow:hidden;transition:border-color var(--sp),box-shadow var(--sp),transform var(--sp) var(--ease)}
.mk::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  transition:opacity var(--sp);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--mint-glow),transparent 55%)}
.mk:hover{border-color:var(--line-2);box-shadow:var(--e2)}
.mk:hover::after{opacity:1}
.mk[data-open="1"]{border-color:var(--mint-2);box-shadow:var(--e3)}
/* rank stripe encodes the score, not decoration */
.mk .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2);
  transform-origin:top;transition:transform .8s var(--ease)}
.mk[data-dir="long"] .stripe{background:linear-gradient(180deg,var(--up),transparent)}
.mk[data-dir="short"] .stripe{background:linear-gradient(180deg,var(--down),transparent)}
.mk[data-dir="none"] .stripe{background:linear-gradient(180deg,var(--ink-4),transparent)}
.mk-h{display:grid;grid-template-columns:34px minmax(0,1.35fr) minmax(0,1fr) minmax(0,1.1fr) auto;
  gap:14px;align-items:center;padding:14px 16px 14px 19px;width:100%;text-align:left;cursor:pointer}
.mk-h:hover{background:color-mix(in srgb,var(--g2) 60%,transparent)}
.mk-rank{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;color:var(--ink-3);
  text-align:center;transition:color var(--sp)}
.mk[data-open="1"] .mk-rank{color:var(--mint)}
.mk-id{min-width:0;display:flex;flex-direction:column;gap:3px}
.mk-id .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk-id b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.03em}
.mk-id .px{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mk-spark{height:38px;min-width:0}
.mk-read{min-width:0;display:flex;flex-direction:column;gap:5px}
.mk-lean{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600}
.mk-lean .ar{width:16px;height:16px;flex:none}
.mk[data-dir="long"] .mk-lean{color:var(--up)} .mk[data-dir="short"] .mk-lean{color:var(--down)}
.mk[data-dir="none"] .mk-lean{color:var(--ink-3)}
.mk-votes{display:flex;gap:3px}
.mk-votes i{width:15px;height:4px;border-radius:99px;background:var(--line-2);transition:background var(--sp)}
.mk-votes i[data-v="for"]{background:var(--up)} .mk-votes i[data-v="against"]{background:var(--down)}
.mk-sc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.mk-sc b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.mk-sc s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.mk-cv{width:19px;height:19px;color:var(--ink-3);transition:transform var(--sp) var(--spring),color var(--sp);flex:none}
.mk[data-open="1"] .mk-cv{transform:rotate(180deg);color:var(--mint)}
@media (max-width:940px){
  .mk-h{grid-template-columns:28px 1fr auto auto;gap:11px;padding:13px 13px 13px 16px}
  .mk-spark{display:none}
}
@media (max-width:560px){
  .mk-h{grid-template-columns:1fr auto;grid-template-areas:"id sc" "read read";gap:9px}
  .mk-rank{display:none} .mk-cv{display:none}
  .mk-id{grid-area:id} .mk-sc{grid-area:sc} .mk-read{grid-area:read}
}

/* the working */
.mk-body{display:none;padding:0 16px 17px 19px;flex-direction:column;gap:14px}
.mk[data-open="1"] .mk-body{display:flex;animation:pgIn .34s var(--ease-out)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(268px,100%),1fr));gap:9px}
.wk-i{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 13px;
  border-radius:var(--r2);background:var(--g2);border:1px solid var(--line);
  transition:border-color var(--sp),background var(--sp)}
.wk-i:hover{border-color:var(--line-2);background:var(--g3)}
.wk-i .v{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.wk-i[data-v="for"] .v{background:var(--up-wash);color:var(--up)}
.wk-i[data-v="against"] .v{background:var(--down-wash);color:var(--down)}
.wk-i[data-v="flat"] .v{background:var(--g3);color:var(--ink-3)}
.wk-i .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.wk-i .t b{font-size:12.5px;font-weight:600}
.wk-i .t s{text-decoration:none;font-size:11px;color:var(--ink-3);line-height:1.35}
.wk-i .n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}

/* practical panel: what it costs, what it moves */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:9px}
.pr{padding:12px 14px;border-radius:var(--r2);background:var(--g2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;min-width:0}
.pr .k{display:flex;align-items:center;gap:6px}
.pr .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.pr .v::-webkit-scrollbar{display:none}
.pr .s{font-size:11px;color:var(--ink-3);line-height:1.35}
.pr .v.up{color:var(--up)} .pr .v.down{color:var(--down)} .pr .v.warn{color:var(--warn)}

/* size box — the trader actually types a number here */
.szbox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;border-radius:var(--r2);
  background:var(--g2);border:1px solid var(--line)}
.szbox label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3)}
.szbox input{width:118px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--g0);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:14px;padding:0 11px;outline:none;
  transition:border-color var(--sp),box-shadow var(--sp)}
.szbox input:focus{border-color:var(--mint-2);box-shadow:0 0 0 3px var(--mint-wash)}
.szbox .pre{display:flex;gap:5px}
.szbox .pre button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  transition:border-color var(--sp),color var(--sp),transform var(--sp) var(--spring)}
.szbox .pre button:hover{border-color:var(--mint-2);color:var(--mint);transform:translateY(-1px)}

/* ═══ the tension rope — verlet chain, real constraint solving ═══ */
.rope{position:relative;height:150px;border-radius:var(--r2);background:var(--g2);border:1px solid var(--line);
  overflow:hidden;touch-action:none;cursor:grab}
.rope:active{cursor:grabbing}
.rope canvas{display:block;width:100%;height:100%}
.rope .hint{position:absolute;left:12px;bottom:9px;pointer-events:none}
.rope .lbl{position:absolute;top:9px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.rope .lbl.l{left:12px;color:var(--up)} .rope .lbl.r{right:12px;color:var(--down)}

/* NFA */
.nfa{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:var(--r2);
  background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 26%,transparent)}
.nfa svg{width:17px;height:17px;flex:none;margin-top:1px;fill:none;stroke:var(--warn);stroke-width:1.8;stroke-linecap:round}
.nfa p{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.nfa b{color:var(--warn)}

/* referral, disclosed in place */
.rf{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:19px;border-radius:var(--r3);
  background:var(--g1);border:1px solid var(--line);position:relative;overflow:hidden}
.rf::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(520px circle at 88% 0%,var(--mint-glow),transparent 62%)}
.rf canvas{width:56px;height:56px;border-radius:16px;flex:none;position:relative}
.rf .t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.rf .t h3{font-size:16px}
.rf .t p{font-size:13.5px;color:var(--ink-2)}
.rf .t .disc{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.rf .btn{position:relative;flex:none}
@media (max-width:560px){ .rf .btn{width:100%} }

/* command palette */
.pal{position:fixed;inset:0;z-index:210;display:none}
.pal[data-on="1"]{display:block}
.pal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  opacity:0;transition:opacity var(--sp)}
.pal[data-on="1"] .scrim{opacity:1}
.pal .box{position:absolute;left:50%;top:14vh;transform:translateX(-50%) translateY(-12px) scale(.98);
  width:min(620px,92vw);background:var(--g1);border:1px solid var(--line-3);border-radius:var(--r3);
  box-shadow:var(--e4);overflow:hidden;opacity:0;transition:opacity var(--sp),transform var(--sp) var(--ease-out)}
.pal[data-on="1"] .box{opacity:1;transform:translateX(-50%) scale(1)}
.pal input{width:100%;height:56px;border:none;outline:none;background:transparent;color:var(--ink);
  font-size:16px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal input::placeholder{color:var(--ink-3)}
.pal .list{max-height:min(56vh,420px);overflow-y:auto;padding:7px}
.pal .row{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;padding:10px 11px;
  border-radius:10px;cursor:pointer;transition:background var(--sp-fast)}
.pal .row[data-sel="1"]{background:var(--mint-wash)}
.pal .row .i{color:var(--ink-3);display:grid;place-items:center}
.pal .row[data-sel="1"] .i{color:var(--mint)}
.pal .row svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.pal .row b{font-size:13.5px;font-weight:600}
.pal .row s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.pal .empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* every tappable control clears 44px on touch. Measured, not guessed —
   .cmd and .iconb were 36px and .btn 42px before this block existed. */
@media (max-width:860px){
  .cmd,.iconb{height:44px;min-width:44px}
  .btn{height:46px}
  .seg button{min-height:44px}
  .szbox input{height:44px}
  .szbox .pre button{height:40px;min-width:44px}
  .qm{width:22px;height:22px;font-size:11px}
  .top{height:auto;min-height:var(--top);padding-top:6px;padding-bottom:6px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  body::before{opacity:.3}
}
</style>
</head>
<body>
<div class="rprog" id="rprog"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="rl-tip" id="rltip" aria-hidden="true"></div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="main">
    <header class="top" id="top">
      <div class="crumb">
        <span class="t" id="crumbT">Radar</span>
        <span class="live"><i></i>Live</span>
      </div>
      <div class="sp"></div>
      <button class="cmd" id="cmdBtn" aria-label="Search markets and wallets">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <span class="lbl">Search</span><kbd>⌘K</kbd>
      </button>
      <div class="fclock" id="fclock" data-tip="funding">
        <svg viewBox="0 0 24 24"><circle class="trk" cx="12" cy="12" r="9"/>
          <circle class="val" id="fcArc" cx="12" cy="12" r="9"/></svg>
        <span class="t"><b id="fcT">--:--</b><s>funding</s></span>
      </div>
      <button class="iconb" id="themeBtn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg>
      </button>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<nav class="dock" id="dock" aria-label="Sections"></nav>
<div class="sheet" id="sheet"><div class="scrim"></div>
  <div class="panel"><div class="grab"></div><div class="items" id="sheetItems"></div></div></div>
<div class="pal" id="pal"><div class="scrim"></div>
  <div class="box"><input id="palIn" placeholder="Jump to a market, or paste a wallet address" spellcheck="false" autocomplete="off">
  <div class="list" id="palList"></div></div></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   0 · primitives
   ═══════════════════════════════════════════════════════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE=()=>matchMedia('(pointer:fine)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtN=(v,d=2)=>{const n=+v; return isFinite(n)? n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';};
const fmtC=v=>{const n=+v,a=Math.abs(n); if(!isFinite(n))return '—';
  if(a>=1e9)return (n/1e9).toFixed(2)+'B'; if(a>=1e6)return (n/1e6).toFixed(2)+'M';
  if(a>=1e3)return (n/1e3).toFixed(1)+'K'; return n.toFixed(2);};
const usd=(v,d)=>{const n=+v; if(!isFinite(n))return '—'; const a=Math.abs(n);
  const dd=d!=null?d:a>=1e6?2:a>=1000?0:a>=1?2:a>=0.01?4:6;
  return (n<0?'-$':'$')+a.toLocaleString('en-US',{minimumFractionDigits:dd,maximumFractionDigits:dd});};
const pct=(v,d=2)=>{const n=+v; return isFinite(n)? (n>=0?'+':'−')+Math.abs(n).toFixed(d)+'%':'—';};
const px=(v)=>{const n=+v; if(!isFinite(n))return '—';
  const d=n>=1000?1:n>=1?3:n>=0.01?5:7; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};

/* one shared pointer-light loop. Every .glow / .mk card reads --mx/--my.
   One rAF for the whole page instead of a listener per card. */
(function pointerField(){
  if(!FINE()||RM()) return;
  let tx=0,ty=0,raf=null,live=new Set();
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;
    if(!raf) raf=requestAnimationFrame(tick);},{passive:true});
  function tick(){
    raf=null;
    for(const n of live){
      if(!n.isConnected){live.delete(n);continue;}
      const r=n.getBoundingClientRect();
      if(r.bottom<-200||r.top>innerHeight+200) continue;
      n.style.setProperty('--mx',((tx-r.left)/r.width*100).toFixed(1)+'%');
      n.style.setProperty('--my',((ty-r.top)/r.height*100).toFixed(1)+'%');
    }
  }
  window.__field=(n)=>{ live.add(n); };
})();
function field(scope){ if(window.__field) $$('.glow,.mk,.pl',scope||document).forEach(window.__field); }

/* a critically-damped spring, used for anything that should settle rather than ease */
function spring(get,set,{k=0.14,d=0.78}={}){
  let v=0,cur=get(),raf=null;
  return function to(target){
    const step=()=>{
      const f=(target-cur)*k; v=(v+f)*d; cur+=v;
      set(cur);
      if(Math.abs(target-cur)>0.02||Math.abs(v)>0.02) raf=requestAnimationFrame(step);
      else { cur=target; set(cur); raf=null; }
    };
    if(!raf) raf=requestAnimationFrame(step);
  };
}

/* count-up. The true value is written FIRST — a frame that never arrives can
   only cost the animation, never the number. */
function countUp(node,to,fmt,ms){
  node.textContent=fmt(to);
  if(RM()||!isFinite(to)) return;
  const t0=performance.now(),dur=ms||760;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    node.textContent=fmt(to*e); if(p<1) requestAnimationFrame(step); else node.textContent=fmt(to);};
  requestAnimationFrame(step);
}

/* ═══════════════════════════════════════════════════════════════
   1 · data layer — cache + TTL + in-flight dedupe + abort + RATE
   ═══════════════════════════════════════════════════════════════ */
const API='https://api.hyperliquid.xyz/info';
const _c=new Map(), _f=new Map();
async function api(body,{ttl=30000,timeout=15000}={}){
  const k=JSON.stringify(body), now=Date.now(), hit=_c.get(k);
  if(hit && now-hit.t<ttl) return hit.v;
  if(_f.has(k)) return _f.get(k);
  const p=(async()=>{
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),timeout);
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),signal:ac.signal});
      if(r.status===429){const e=new Error('rate');e.code='RATE';throw e;}
      if(!r.ok){const e=new Error('http '+r.status);e.code='HTTP';throw e;}
      const v=await r.json(); _c.set(k,{t:Date.now(),v}); return v;
    } finally { clearTimeout(to); _f.delete(k); }
  })();
  _f.set(k,p); return p;
}
const BACKOFF=[1500,3500,7000,12000];
async function apiR(body,opt){
  let last;
  for(let i=0;i<=BACKOFF.length;i++){
    try{ return await api(body,opt); }
    catch(e){ last=e; if(i===BACKOFF.length) break;
      if(e.code!=='RATE'&&e.code!=='HTTP'&&e.name!=='AbortError') throw e;
      await new Promise(r=>setTimeout(r,BACKOFF[i])); }
  }
  throw last;
}

   3 · the mark, drawn not imported

function fit(cv,w,h,cap){const d=Math.min(devicePixelRatio||1,cap||2);
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function blob(c,S,col,sq){
  const k=S/100,q=sq==null?1:sq; c.fillStyle=col; c.beginPath();
  c.moveTo(20*k,50*k);
  c.bezierCurveTo(20*k,(50-22*q)*k,30*k,(50-28*q)*k,40*k,(50-12*q)*k);
  c.bezierCurveTo(48*k,(50-1*q)*k,54*k,(50-30*q)*k,66*k,(50-30*q)*k);
  c.bezierCurveTo(80*k,(50-30*q)*k,86*k,(50-14*q)*k,86*k,50*k);
  c.bezierCurveTo(86*k,(50+14*q)*k,80*k,(50+30*q)*k,66*k,(50+30*q)*k);
  c.bezierCurveTo(54*k,(50+30*q)*k,48*k,(50+1*q)*k,40*k,(50+12*q)*k);
  c.bezierCurveTo(30*k,(50+28*q)*k,20*k,(50+22*q)*k,20*k,50*k);
  c.closePath();c.fill();
}
function paintMark(cv,size){
  const c=fit(cv,size,size,2);
  c.clearRect(0,0,size,size);
  const g=c.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#0A2C25'); g.addColorStop(1,'#051A16');
  c.fillStyle=g; rr(c,0,0,size,size,size*.31); c.fill();
  c.save(); c.translate(size*.02,0); c.scale(.92,.92); blob(c,size,'#96FCE4',1); c.restore();
  c.strokeStyle='rgba(150,252,228,.18)'; c.lineWidth=1;
  rr(c,.5,.5,size-1,size-1,size*.31-.5); c.stroke();
}

(function tips(){

const revIO=new IntersectionObserver(es=>{

    .forEach((e,i)=>{ e.target.style.setProperty('--d',Math.min(i,8)*58+'ms');

   10 · indicators — plain arithmetic, every one of them checkable
   ═══════════════════════════════════════════════════════════════ */
function SMA(a,n){ if(a.length<n) return null; let s=0; for(let i=a.length-n;i<a.length;i++) s+=a[i]; return s/n; }
function RSI(c,n=14){
  if(c.length<n+1) return null;
  let g=0,l=0;
  for(let i=c.length-n;i<c.length;i++){ const d=c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/n, al=l/n;
  if(al===0) return 100;
  const rs=ag/al; return 100-100/(1+rs);
}
function ATR(bars,n=14){
  if(bars.length<n+1) return null;
  const tr=[];
  for(let i=1;i<bars.length;i++){
    const h=+bars[i].h,l=+bars[i].l,pc=+bars[i-1].c;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  const out=[]; let sum=0;
  for(let i=0;i<tr.length;i++){ sum+=tr[i]; if(i>=n) sum-=tr[i-n]; if(i>=n-1) out.push(sum/n); }
  return out;
}
const TAKER=0.00045;   /* published cross fee, before any tier or referral discount */

function analyse(m, bars){
  /* The final candle is the hour currently in progress. Its price is the newest
     information and should be used — but its VOLUME is only however many minutes
     of the hour have elapsed, so comparing it against completed bars understates
     participation by the fraction of the hour still to come. Measured on BTC 4.4
     minutes past the hour: 0.27x against the incomplete bar, 1.02x against the
     last completed one. Every market was being read as unconfirmed for most of
     every hour. Price comes off the live bar; volume comes off completed bars. */
  const now=Date.now();
  const partial = bars.length && +bars[bars.length-1].T > now;
  const done = partial ? bars.slice(0,-1) : bars;
  const c=bars.map(b=>+b.c);
  const vd=done.map(b=>+b.v);
  const last=c[c.length-1];
  const s20=SMA(c,20), s50=SMA(c,50), s100=SMA(c,100);
  const rsi=RSI(c,14);
  const atrS=ATR(done,14);
  const atr=atrS&&atrS.length?atrS[atrS.length-1]:null;
  const atrAvg=atrS&&atrS.length>=50? atrS.slice(-50).reduce((a,b)=>a+b,0)/50 : null;
  const atrExp=(atr&&atrAvg)? atr/atrAvg : null;
  const vAvg=vd.length>21? SMA(vd.slice(0,-1),20) : null;
  const rvol=(vAvg&&vAvg>0&&vd.length)? vd[vd.length-1]/vAvg : null;
  const minsIn = partial ? (now-+bars[bars.length-1].t)/60000 : 60;
  return {last,s20,s50,s100,rsi,atr,atrExp,rvol,partial,minsIn,
          bars:done.length, spark:c.slice(-72)};
}

/* momentum: seven independent measures, each one a single vote */
function momentum(m,a){
  const V=[];
  const add=(k,label,val,vote,why)=>V.push({k,label,val,vote,why});
  const p=a.last;
  add('matrend','Price vs 20-bar average', a.s20? pct((p/a.s20-1)*100):'—',
      a.s20? (p>a.s20?'for':'against'):'flat', a.s20?('20-bar SMA '+px(a.s20)):'not enough bars');
  add('matrend','Price vs 50-bar average', a.s50? pct((p/a.s50-1)*100):'—',
      a.s50? (p>a.s50?'for':'against'):'flat', a.s50?('50-bar SMA '+px(a.s50)):'not enough bars');
  add('matrend','Price vs 100-bar average', a.s100? pct((p/a.s100-1)*100):'—',
      a.s100? (p>a.s100?'for':'against'):'flat', a.s100?('100-bar SMA '+px(a.s100)):'not enough bars');
  add('matrend','Average stack aligned', (a.s20&&a.s50)? (a.s20>a.s50?'20 over 50':'50 over 20'):'—',
      (a.s20&&a.s50)? (a.s20>a.s50?'for':'against'):'flat','the short average above the long one is the classic trend test');
  add('rsi','RSI (14)', a.rsi!=null? a.rsi.toFixed(1):'—',
      a.rsi==null?'flat': a.rsi>55?'for': a.rsi<45?'against':'flat',
      a.rsi==null?'not enough bars': a.rsi>70?'above 70 — conventionally overbought': a.rsi<30?'below 30 — conventionally oversold':'between 30 and 70');
  add('rvol','24-hour change', pct(m.chg),
      m.chg>0.4?'for': m.chg<-0.4?'against':'flat','against the previous day close');
  /* an unconfirmed move counts AGAINST the read rather than sitting neutral —
     a 10% move on 2% of normal volume is not the same event as a 10% move on
     double it, and ranking them alike is how a stale market tops the board */
  add('rvol','Volume, last completed hour',
      a.rvol!=null? a.rvol.toFixed(2)+'× average':'—',
      a.rvol==null?'flat'
        : a.rvol>1.25 ? (m.chg>=0?'for':'against')
        : a.rvol<0.6  ? (m.chg>=0?'against':'for')
        : 'flat',
      a.rvol==null?'not enough completed bars'
        : a.rvol>1.25?'the move is being paid for'
        : a.rvol<0.6 ?'barely any participation — this move is not being paid for'
        :'ordinary participation');
  const f=V.filter(x=>x.vote==='for').length, ag=V.filter(x=>x.vote==='against').length;
  const dir = f>ag+1?'long' : ag>f+1?'short' : 'none';
  /* strength: agreement, then confirmed by how far it has actually travelled */
  const agree=Math.abs(f-ag)/V.length;
  const travel=Math.min(1,Math.abs(m.chg)/6);
  const conf=Math.min(1,(a.rvol||0)/1.6);
  const exp=Math.min(1,(a.atrExp||1)/1.8);
  let score=agree*46+travel*20+conf*22+exp*12;
  /* an unconfirmed move is demoted outright, not merely un-rewarded */
  const unconfirmed = a.rvol!=null && a.rvol<0.6;
  if(unconfirmed) score*=0.62;
  const thin = m.vol<5e6 || (m.spreadPct||0)>0.12;
  if(thin) score*=0.88;
  const flags=[];
  if(unconfirmed) flags.push({t:'unconfirmed',w:'the move is happening on '+(a.rvol*100).toFixed(0)+'% of normal hourly volume'});
  if(thin) flags.push({t:'thin',w:'$'+fmtC(m.vol)+' traded in 24h'+((m.spreadPct||0)>0.12?' and a '+m.spreadPct.toFixed(2)+'% impact spread':'')+' — harder to get in and out at size'});
  return {votes:V,dir,score:Math.round(clamp(score,0,100)),for:f,against:ag,flags,
          leanText: dir==='long'?'Trend measures read up':dir==='short'?'Trend measures read down':'Measures disagree — no trend'};
}

/* funding stress: who is paying, how hard, and does the size behind it matter */
function fundingStress(m,a){
  const V=[];
  const apr=m.fundingApr;
  const paidSide = apr>0 ? 'short' : apr<0 ? 'long' : 'none';
  V.push({k:'fundapr',label:'Funding, annualised',val:pct(apr,1),
    vote: Math.abs(apr)>20?'for':'flat',
    why: apr>0?'longs are paying shorts':apr<0?'shorts are paying longs':'flat'});
  V.push({k:'fundapr',label:'Hourly rate',val:(m.fundingHr>=0?'+':'−')+Math.abs(m.fundingHr).toFixed(4)+'%',
    vote:'flat',why:'charged on notional every hour, on the hour'});
  V.push({k:'oi',label:'Open interest behind it',val:'$'+fmtC(m.oiNtl),
    vote: m.oiNtl>5e6?'for':'flat', why: m.oiNtl>5e6?'enough size for the rate to mean something':'thin — the rate moves on very little'});
  V.push({k:'basis',label:'Mark vs oracle',val:pct(m.oracleGap,3),
    vote: Math.abs(m.oracleGap)>0.05?'for':'flat',
    why: m.oracleGap>0?'perp trading above spot':'perp trading below spot'});
  V.push({k:'vsoi',label:'Turnover vs open interest',val:m.volOverOi!=null?m.volOverOi.toFixed(2)+'×':'—',
    vote:'flat', why: (m.volOverOi||0)>1?'fast hands — positions turning over daily':'positions being held rather than churned'});
  const mag=Math.min(1,Math.log10(1+Math.abs(apr))/2.4);
  const size=Math.min(1,Math.log10(1+m.oiNtl/1e5)/3.2);
  const score=Math.round(clamp(mag*62+size*38,0,100));
  const flags=[];
  if(m.oiNtl<2e6) flags.push({t:'thin',w:'only $'+fmtC(m.oiNtl)+' of open interest behind this rate'});
  if(Math.abs(apr)>200) flags.push({t:'extreme',w:'a rate this far out usually means a dislocation rather than an opportunity'});
  return {votes:V,dir: paidSide==='short'?'short':paidSide==='long'?'long':'none',score,flags,
    for:V.filter(x=>x.vote==='for').length, against:0,
    leanText: apr>0?'Shorts are being paid to hold':apr<0?'Longs are being paid to hold':'Funding is flat'};
}

/* ═══════════════════════════════════════════════════════════════
   11 · the scan loader — the lattice IS the universe, and each
   cell lights when that market's data actually lands
   ═══════════════════════════════════════════════════════════════ */
function scanLoader(mount,total,steps){
  const wrap=el('div','sc');
  const stage=el('div','sc-stage'); const cv=el('canvas'); cv.setAttribute('aria-hidden','true');
  const pctBox=el('div','sc-pct'); const pb=el('b','','0%'); const ps=el('s',null,'scanned');
  pctBox.append(pb,ps); stage.append(cv,pctBox);
  const side=el('div','sc-side');
  side.append(el('h2',null,'Reading the board'));
  const stepBox=el('div','sc-steps');
  const stepNodes=steps.map((s,i)=>{
    const n=el('div','sc-st'); n.dataset.s='wait';
    n.append(el('span','d'), el('span',null,s), el('span','n','—'));
    stepBox.appendChild(n); return n;
  });
  const now=el('div','sc-now','');
  side.append(stepBox,now);
  wrap.append(stage,side); mount.appendChild(wrap);

  let W=0,H=0,c=null,lit=new Set(),raf=null,t0=performance.now(),done=false,prog=0;
  const cols=Math.ceil(Math.sqrt(total*1.25)), rows=Math.ceil(total/cols);
  function size(){ const r=stage.getBoundingClientRect(); if(!r.width) return false;
    W=r.width;H=r.height;c=fit(cv,W,H,1.75); return true; }
  size();
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ cancelAnimationFrame(raf); return; }
    if(!W&&!size()) return;
    const e=(t-t0)/1000;
    prog += ((done?1:Math.max(prog,lit.size/total*0.94)) - prog)*0.12;
    const mint=tok('--mint'), line=tok('--line-2'), ink=tok('--ink-4');
    c.clearRect(0,0,W,H);
    const pad=10, gw=(W-pad*2)/cols, gh=(H-pad*2)/rows, s=Math.min(gw,gh)*0.62;
    const cx=W/2, cy=H/2;
    /* the sweep */
    const ang=e*1.5;
    const grad=c.createConicGradient? c.createConicGradient(ang,cx,cy):null;
    if(grad){ grad.addColorStop(0,'rgba(125,252,221,.20)'); grad.addColorStop(.10,'rgba(125,252,221,0)');
      grad.addColorStop(1,'rgba(125,252,221,0)');
      c.fillStyle=grad; c.beginPath(); c.arc(cx,cy,Math.min(W,H)*.5,0,7); c.fill(); }
    for(let i=0;i<total;i++){
      const r=Math.floor(i/cols), col=i%cols;
      const x=pad+col*gw+gw/2, y=pad+r*gh+gh/2;
      const on=lit.has(i);
      c.fillStyle= on? mint : line;
      c.globalAlpha= on? .95 : .30;
      c.beginPath(); c.arc(x,y,on? s*.30 : s*.16, 0, 7); c.fill();
      if(on){ c.globalAlpha=.16; c.beginPath(); c.arc(x,y,s*.62,0,7); c.fill(); }
    }
    c.globalAlpha=1;
    /* the ring, drawn as real progress */
    const R=Math.min(W,H)*0.46;
    c.strokeStyle=line; c.lineWidth=2.5;
    c.beginPath(); c.arc(cx,cy,R,0,6.283); c.stroke();
    c.strokeStyle=mint; c.lineWidth=3; c.lineCap='round';
    c.beginPath(); c.arc(cx,cy,R,-1.5708,-1.5708+6.283*prog); c.stroke();
    const ha=-1.5708+6.283*prog;
    c.fillStyle=mint; c.beginPath(); c.arc(cx+Math.cos(ha)*R,cy+Math.sin(ha)*R,4,0,7); c.fill();
    pb.textContent=Math.round(prog*100)+'%';
  }
  if(!RM()) raf=requestAnimationFrame(frame); else pb.textContent='…';
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected)size();},150);};
  addEventListener('resize',onR);
  return {
    light(i){ lit.add(i); },
    step(i,state,n){ const nd=stepNodes[i]; if(!nd) return; nd.dataset.s=state;
      if(n!=null) nd.lastChild.textContent=n; },
    say(t){ now.textContent=t||''; },
    finish(){ done=true; },
    destroy(){ done=true; cancelAnimationFrame(raf); removeEventListener('resize',onR); wrap.remove(); }
  };
}

/* ═══════════════════════════════════════════════════════════════
   12 · the tension rope — verlet integration with distance
   constraints, not a CSS transition dressed up as physics.
   Anchored at both ends; the load hangs where funding and basis
   put it; you can grab it and it settles back to the true point.
   ═══════════════════════════════════════════════════════════════ */
function tensionRope(host, biasFn){
  const cv=el('canvas'); host.appendChild(cv);
  let W=0,H=0,c=null,raf=null,run=false;
  const N=26, pts=[], rest=[];
  function size(){ const r=host.getBoundingClientRect(); if(!r.width) return false;
    W=r.width;H=r.height;c=fit(cv,W,H,1.6);
    const y=H*0.42, span=W-44;
    for(let i=0;i<N;i++){ const x=22+span*(i/(N-1));
      if(!pts[i]) pts[i]={x,y,px:x,py:y}; }
    for(let i=0;i<N-1;i++) rest[i]=span/(N-1)*1.06;   /* slight slack, so it sags */
    return true; }
  size();
  let grab=-1, mx=0, my=0, mvx=0, mvy=0;
  function nearest(x,y){ let b=-1,bd=999; pts.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;b=i;}});
    return bd<38? b : -1; }
  host.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect();
    mx=e.clientX-r.left; my=e.clientY-r.top; grab=nearest(mx,my);
    if(grab>=0) host.setPointerCapture(e.pointerId); });
  host.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect();
    const nx=e.clientX-r.left, ny=e.clientY-r.top; mvx=nx-mx; mvy=ny-my; mx=nx; my=ny; },{passive:true});
  const release=()=>{ if(grab>=0){ const p=pts[grab]; p.px=p.x-mvx*1.4; p.py=p.y-mvy*1.4; } grab=-1; };
  host.addEventListener('pointerup',release); host.addEventListener('pointercancel',release);
  host.addEventListener('pointerleave',release);

  function frame(){
    if(!run) return;
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ run=false; cancelAnimationFrame(raf); return; }
    if(!W&&!size()) return;
    const bias=clamp(biasFn(),-1,1);                  /* −1 all long, +1 all short */
    const loadI=Math.round((N-1)*(0.5+bias*0.38));
    /* verlet step */
    for(let i=1;i<N-1;i++){
      const p=pts[i];
      const vx=(p.x-p.px)*0.985, vy=(p.y-p.py)*0.985;
      p.px=p.x; p.py=p.y;
      p.x+=vx; p.y+=vy+0.34;                          /* gravity */
      if(i===loadI) p.y+=1.5*Math.abs(bias)+0.5;      /* the load hangs here */
    }
    if(grab>=0 && grab>0 && grab<N-1){ pts[grab].x=mx; pts[grab].y=my; }
    /* constraint relaxation */
    for(let k=0;k<5;k++){
      for(let i=0;i<N-1;i++){
        const a=pts[i], b=pts[i+1];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
        const diff=(d-rest[i])/d*0.5;
        const ox=dx*diff, oy=dy*diff;
        if(i!==0 && !(grab===i)){ a.x+=ox; a.y+=oy; }
        if(i+1!==N-1 && !(grab===i+1)){ b.x-=ox; b.y-=oy; }
      }
      pts[0].x=22; pts[0].y=H*0.34; pts[N-1].x=W-22; pts[N-1].y=H*0.34;
    }
    /* draw */
    const up=tok('--up'), dn=tok('--down'), line=tok('--line-2'), ink3=tok('--ink-3');
    c.clearRect(0,0,W,H);
    c.strokeStyle=line; c.lineWidth=1;
    c.beginPath(); c.moveTo(W/2,10); c.lineTo(W/2,H-10); c.stroke();
    /* posts */
    [[22,up],[W-22,dn]].forEach(([x,col])=>{
      c.strokeStyle=col; c.lineWidth=3; c.globalAlpha=.55;
      c.beginPath(); c.moveTo(x,H*0.34); c.lineTo(x,H-14); c.stroke(); c.globalAlpha=1;
      c.fillStyle=col; c.beginPath(); c.arc(x,H*0.34,4.5,0,7); c.fill();
    });
    /* the rope, coloured by which way it is pulled */
    const g=c.createLinearGradient(22,0,W-22,0);
    g.addColorStop(0,up); g.addColorStop(1,dn);
    c.strokeStyle=g; c.lineWidth=2.6; c.lineJoin='round'; c.lineCap='round';
    c.beginPath();
    pts.forEach((p,i)=>{ if(!i) c.moveTo(p.x,p.y);
      else { const q=pts[i-1]; c.quadraticCurveTo(q.x,q.y,(q.x+p.x)/2,(q.y+p.y)/2); } });
    c.stroke();
    /* the load */
    const L=pts[loadI];
    const col = bias>0? dn : bias<0? up : ink3;
    c.fillStyle=col; c.beginPath(); c.arc(L.x,L.y,8,0,7); c.fill();
    c.fillStyle=tok('--g1'); c.beginPath(); c.arc(L.x,L.y,3.4,0,7); c.fill();
    c.globalAlpha=.2; c.fillStyle=col; c.beginPath(); c.arc(L.x,L.y,16,0,7); c.fill(); c.globalAlpha=1;
  }
  const io=new IntersectionObserver(es=>{
    const on=es[0].isIntersecting && !RM();
    if(on&&!run){ if(size()){ run=true; raf=requestAnimationFrame(frame); } }
    else if(!on&&run){ run=false; cancelAnimationFrame(raf); }
  },{threshold:.05});
  io.observe(host);
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected)size();},150);};
  addEventListener('resize',onR);
  ACTIVE.push(()=>{ run=false; cancelAnimationFrame(raf); io.disconnect(); removeEventListener('resize',onR); });
  if(RM()&&size()){ run=true; frame(); run=false; }
}

/* sparkline */
function spark(vals,col,w,h){
  if(!vals||vals.length<2) return '';
  w=w||120;h=h||34;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const p=vals.map((v,i)=>[(i/(vals.length-1))*w,h-((v-mn)/rg)*(h-6)-3]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const id='k'+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".34"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+p[p.length-1][0].toFixed(1)+'" cy="'+p[p.length-1][1].toFixed(1)+'" r="2.3" fill="'+col+'"/></svg>';
}

/* ═══════════════════════════════════════════════════════════════
   13 · RADAR
   One 20-weight call ranks all 233 markets. Candles for all of them
   would cost 5,592 weight — 4.7 minutes of the per-IP budget — so
   only the shortlist gets charts. That constraint is on the page,
   not hidden behind it.
   ═══════════════════════════════════════════════════════════════ */
let LENS_ID='momentum', DEPTH=12, NOTIONAL=10000;
/* the scan is expensive; a lens switch is a re-sort of data already in hand */

function universe(meta,ctxs){
  return meta.universe.map((u,i)=>{
    const c=ctxs[i]||{}, mark=+c.markPx, prev=+c.prevDayPx, oi=+c.openInterest;
    const imp=(c.impactPxs||[]).map(Number);
    return {name:u.name, maxLev:u.maxLeverage, szDec:u.szDecimals,
      mark, oracle:+c.oraclePx, mid:+c.midPx,
      chg: prev? (mark-prev)/prev*100 : 0,
      fundingHr:+c.funding*100, fundingApr:+c.funding*24*365*100,
      oiNtl: oi*mark, vol:+c.dayNtlVlm,
      volOverOi: oi*mark? +c.dayNtlVlm/(oi*mark) : null,
      oracleGap: c.oraclePx? (mark-+c.oraclePx)/+c.oraclePx*100 : 0,
      spreadPct: (imp.length===2&&imp[0])? (imp[1]-imp[0])/imp[0]*100 : null
    };
  }).filter(m=>isFinite(m.mark)&&m.mark>0);
}

ROUTES.radar=async function(args){
  const wrap=el('div');
  PAGE.appendChild(wrap);

  const head=el('div','rd-head');
  const L=el('div');
  const h1=el('h1','rd-h1'); h1.innerHTML='What is worth <em>watching</em> right now.';
  const sub=el('p','rd-sub','Every Hyperliquid perp, ranked live from the exchange in your own browser. Nothing here is a signal — each row shows the measures behind it, and you can see exactly why it sits where it does.');
  L.append(h1,sub); head.appendChild(L);
  wrap.appendChild(head);

  const pulse=el('div','rd-pulse');
  ['Markets scanned','Board direction','Widest funding','Most turnover'].forEach(()=>{
    const s=el('div','pl'); s.appendChild(el('div','sk',' ')); s.firstChild.style.height='46px'; pulse.appendChild(s);
  });
  wrap.appendChild(pulse);

  const mount=el('div'); wrap.appendChild(mount);
  const steps=['Reading every market from one call','Ranking the universe','Pulling charts for the shortlist','Computing the measures'];
  let ld=null, U=[], detail={};

  /* re-entering the page inside the cache window skips the scan entirely */
  if(RADAR.U && Date.now()-RADAR.t < 45000){
    U=RADAR.U; detail=RADAR.det;
    quietly(()=>render(RADAR.U,RADAR.short,RADAR.det));
    return;
  }
  try{
    const t0=performance.now();
    ld=scanLoader(mount,233,steps);
    ld.step(0,'run');
    const [meta,ctxs]=await apiR({type:'metaAndAssetCtxs'},{ttl:20000});
    U=universe(meta,ctxs);
    ld.step(0,'done',U.length+' markets'); ld.step(1,'run');
    for(let i=0;i<U.length;i++) ld.light(i);
    await new Promise(r=>setTimeout(r,240));
    ld.step(1,'done','20 weight');

    const lens=LENS[LENS_ID]||LENS.momentum;
    const pre = LENS_ID==='funding'
      ? U.filter(m=>m.oiNtl>3e5).sort((a,b)=>Math.abs(b.fundingApr)*Math.log10(1+b.oiNtl)-Math.abs(a.fundingApr)*Math.log10(1+a.oiNtl))
      : U.filter(m=>m.vol>2e6).sort((a,b)=>Math.abs(b.chg)*Math.log10(1+b.vol)-Math.abs(a.chg)*Math.log10(1+a.vol));
    const shortlist=pre.slice(0,DEPTH);

    ld.step(2,'run','0 / '+shortlist.length);
    const now=Date.now();
    for(let i=0;i<shortlist.length;i++){
      const m=shortlist[i];
      ld.say('reading '+m.name);
      try{
        const bars=await apiR({type:'candleSnapshot',req:{coin:m.name,interval:'1h',
          startTime:now-230*3600*1000,endTime:now}},{ttl:60000});
        if(Array.isArray(bars)&&bars.length>30) detail[m.name]=analyse(m,bars);
      }catch(e){}
      ld.step(2,'run',(i+1)+' / '+shortlist.length);
    }
    ld.step(2,'done',shortlist.length+' charts · '+Math.round(shortlist.length*24)+' weight');
    ld.step(3,'run'); ld.say('');
    await new Promise(r=>setTimeout(r,180));
    ld.step(3,'done',Math.round(performance.now()-t0)+' ms total');
    ld.finish();
    await new Promise(r=>setTimeout(r,420));
    ld.destroy();
    RADAR={t:Date.now(),U,short:shortlist,det:detail};
    render(U,shortlist,detail);
  }catch(e){
    if(ld) ld.destroy();
    const c=el('div','card pad');
    c.append(el('h2',null, e.code==='RATE'?'The exchange rate-limited this browser':'Could not read the board'));
    const p=el('p',null, e.code==='RATE'
      ? 'Rate limits are per IP, so this is about this browser and not the site. A full board scan costs about 310 weight against a budget of 1,200 a minute. Give it a minute.'
      : 'The request did not complete. The exchange may be briefly unreachable.');
    p.style.color='var(--ink-2)'; p.style.marginTop='8px'; c.appendChild(p);
    const b=el('button','btn pri','Try again'); b.style.marginTop='14px';
    b.addEventListener('click',()=>route()); c.appendChild(b);
    mount.appendChild(c);
  }

  function render(all, shortlist, det){
    mount.innerHTML='';
    const lens=LENS[LENS_ID]||LENS.momentum;
    const scored=shortlist.map(m=>({m,a:det[m.name],r:det[m.name]?lens.calc(m,det[m.name]):null}))
      .filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score);

    /* ---- venue pulse, computed not decorative ---- */
    const upN=all.filter(m=>m.chg>0).length;
    const widest=all.filter(m=>m.oiNtl>1e6).sort((a,b)=>Math.abs(b.fundingApr)-Math.abs(a.fundingApr))[0];
    const churn=all.filter(m=>m.oiNtl>1e6&&m.volOverOi!=null).sort((a,b)=>b.volOverOi-a.volOverOi)[0];
    const totalOi=all.reduce((s,m)=>s+m.oiNtl,0);
    pulse.innerHTML='';
    const P=(k,v,s,tip,cls)=>{
      const n=el('div','pl');
      const kk=el('div','k'); kk.append(el('span','micro',k)); if(tip) kk.appendChild(qm(tip));
      const vv=el('div','v'+(cls?' '+cls:''),v);
      n.append(kk,vv,el('div','s',s)); pulse.appendChild(n); return n;
    };
    P('Board direction',Math.round(upN/all.length*100)+'% up',
      upN+' of '+all.length+' markets above yesterday’s close');
    P('Open interest','$'+fmtC(totalOi),'across every perp market','oi');
    if(widest) P('Widest funding',pct(widest.fundingApr,0),
      widest.name+' — '+(widest.fundingApr>0?'longs paying':'shorts paying'),'fundapr',
      Math.abs(widest.fundingApr)>60?'warn':'');
    if(churn) P('Most turnover',churn.volOverOi.toFixed(1)+'×',
      churn.name+' — 24h volume against open interest','vsoi');
    field(pulse);

    /* ---- lens bar ---- */
    const bar=el('div','rd-lens rv');
    const left=el('div','rd-lensL');
    const seg=el('div','seg');
    const pill=el('div','pill'); seg.appendChild(pill);
    Object.values(LENS).forEach(x=>{
      const b=el('button',null,x.label); b.dataset.lens=x.id;
      if(x.id===LENS_ID) b.className='on';
      b.addEventListener('click',()=>{
        if(LENS_ID===x.id) return;
        LENS_ID=x.id; try{ localStorage.setItem('hf.lens',x.id); }catch(e){}
        $$('button',seg).forEach(y=>y.classList.toggle('on',y.dataset.lens===x.id));
        movePill();
        /* no rescan and no loader — the universe is already in memory, this is
           a re-sort. Quiet so the section does not flash to invisible and back. */
        const nl=LENS[LENS_ID];
        const nextShort = nl.id==='funding'
          ? RADAR.U.filter(m=>m.oiNtl>3e5).sort((p,q)=>Math.abs(q.fundingApr)*Math.log10(1+q.oiNtl)-Math.abs(p.fundingApr)*Math.log10(1+p.oiNtl)).slice(0,DEPTH)
          : RADAR.U.filter(m=>m.vol>2e6).sort((p,q)=>Math.abs(q.chg)*Math.log10(1+q.vol)-Math.abs(p.chg)*Math.log10(1+p.vol)).slice(0,DEPTH);
        const need=nextShort.filter(m=>!RADAR.det[m.name]);
        if(!need.length){ quietly(()=>render(RADAR.U,nextShort,RADAR.det)); return; }
        /* only the markets the new lens surfaces that we have not charted yet */
        const skel=el('div','sk-board');
        for(let i=0;i<DEPTH;i++){ const r=el('div','sk sk-row'); skel.appendChild(r); }
        mount.innerHTML=''; mount.appendChild(skel);
        (async()=>{
          const now2=Date.now();
          for(const m of need){
            try{ const bars=await apiR({type:'candleSnapshot',req:{coin:m.name,interval:'1h',
              startTime:now2-230*3600*1000,endTime:now2}},{ttl:60000});
              if(Array.isArray(bars)&&bars.length>30) RADAR.det[m.name]=analyse(m,bars); }catch(e){}
          }
          quietly(()=>render(RADAR.U,nextShort,RADAR.det));
        })();
      });
      seg.appendChild(b);
    });
    function movePill(){ const on=$('button.on',seg); if(!on) return;
      pill.style.left=on.offsetLeft+'px'; pill.style.width=on.offsetWidth+'px'; }
    left.append(seg);
    bar.append(left,el('div','rd-count','top '+scored.length+' of '+all.length+' · charts only for the shortlist'));
    wrapInsert(bar);
    requestAnimationFrame(movePill); setTimeout(movePill,60);
    const blurb=el('p','rd-count rv'); blurb.style.marginBottom='14px'; blurb.textContent=lens.blurb;
    wrapInsert(blurb);

    /* ---- NFA ---- */
    const nfa=el('div','nfa rv');
    nfa.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 8.5v5M12 16.6v.2"/><path d="M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20.4h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'+
      '<p><b>Not financial advice, and not a signal.</b> Every row below is arithmetic on public exchange data with the inputs shown. It describes what the measures currently read — it does not know what price does next, and none of it accounts for your position size, your risk, or what happens in the next hour.</p>';
    wrapInsert(nfa);

    /* ---- board ---- */
    const board=el('div','rd-board');
    scored.forEach((x,i)=>board.appendChild(row(x,i,lens)));
    wrapInsert(board);
    field(board);

    wrapInsert(refBlock('board'));
    reveal(mount);
    if(args&&args[0]){ const t=$$('.mk',board).find(n=>n.dataset.coin===args[0]);
      if(t){ t.dataset.open='1'; buildBody(t); t.scrollIntoView({block:'center'}); } }
  }
  function wrapInsert(n){ n.classList.add('rv'); mount.appendChild(n); }

  function row(x,i,lens){
    const {m,a,r}=x;
    const n=el('div','mk'); n.dataset.dir=r.dir; n.dataset.coin=m.name;
    n.appendChild(el('div','stripe'));
    const h=el('button','mk-h'); h.type='button';
    h.appendChild(el('div','mk-rank',String(i+1).padStart(2,'0')));
    const id=el('div','mk-id');
    const nm=el('div','n');
    nm.append(el('b',null,m.name));
    const ch=el('span','chip '+(m.chg>=0?'up':'down'), pct(m.chg));
    nm.appendChild(ch);
    if(m.maxLev>=20) nm.appendChild(el('span','chip mut',m.maxLev+'×'));
    (r.flags||[]).forEach(f=>{ const c2=el('span','chip warn',f.t);
      c2.setAttribute('data-tip',f.w); nm.appendChild(c2); });
    id.append(nm, el('div','px', px(m.mark)+'  ·  $'+fmtC(m.vol)+' 24h'));
    h.appendChild(id);
    const sp=el('div','mk-spark');
    sp.innerHTML=spark(a.spark, m.chg>=0?tok('--up'):tok('--down'), 160, 38);
    h.appendChild(sp);
    const read=el('div','mk-read');
    const lean=el('div','mk-lean');
    lean.innerHTML='<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
      (r.dir==='long'?'<path d="M12 19V5M6 11l6-6 6 6"/>':r.dir==='short'?'<path d="M12 5v14M6 13l6 6 6-6"/>':'<path d="M5 12h14"/>')+'</svg>'+
      '<span>'+r.leanText+'</span>';
    const votes=el('div','mk-votes');
    r.votes.forEach(v=>{ const b=el('i'); if(v.vote!=='flat') b.dataset.v=v.vote; votes.appendChild(b); });
    read.append(lean,votes);
    h.appendChild(read);
    const sc=el('div','mk-sc');
    const b=el('b','',''); countUp(b,r.score,v=>String(Math.round(v)),620);
    sc.append(b, el('s',null,lens.label));
    h.appendChild(sc);
    const cv=el('span','mk-cv');
    cv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
    h.appendChild(cv);
    n.appendChild(h);
    n.appendChild(el('div','mk-body'));
    h.addEventListener('click',()=>{
      const open=n.dataset.open==='1';
      $$('.mk[data-open="1"]').forEach(o=>{ if(o!==n) o.dataset.open='0'; });
      n.dataset.open=open?'0':'1';
      if(!open) buildBody(n);
    });
    n.__x=x;
    return n;
  }

  function buildBody(n){
    const body=$('.mk-body',n);
    if(body.dataset.built==='1') return;
    body.dataset.built='1';
    const {m,a,r}=n.__x;

    /* the working */
    const wk=el('div','wk');
    r.votes.forEach(v=>{
      const i=el('div','wk-i'); i.dataset.v=v.vote;
      i.append(el('div','v', v.vote==='for'?'↑':v.vote==='against'?'↓':'·'));
      const t=el('div','t'); t.append(el('b',null,v.label), el('s',null,v.why)); i.append(t);
      i.append(el('div','n',v.val));
      wk.appendChild(i);
    });
    body.appendChild(wk);

    /* practical: what it costs, what it moves */
    const szb=el('div','szbox');
    szb.append(el('label',null,'Position size'));
    const inp=el('input'); inp.type='text'; inp.value=NOTIONAL.toLocaleString('en-US');
    inp.setAttribute('aria-label','Notional position size in dollars');
    szb.appendChild(inp);
    const pre=el('div','pre');
    [1000,10000,100000].forEach(v=>{ const b=el('button',null,'$'+fmtC(v));
      b.addEventListener('click',()=>{ NOTIONAL=v; inp.value=v.toLocaleString('en-US'); paintPractical(); });
      pre.appendChild(b); });
    szb.appendChild(pre);
    szb.appendChild(el('span','s'));
    body.appendChild(szb);
    inp.addEventListener('input',()=>{ const v=+inp.value.replace(/[^0-9.]/g,'');
      if(isFinite(v)&&v>0){ NOTIONAL=v; paintPractical(); } });

    const grid=el('div','pr-grid'); body.appendChild(grid);
    function paintPractical(){
      grid.innerHTML='';
      const P=(k,v,s,tip,cls)=>{
        const n2=el('div','pr');
        const kk=el('div','k'); kk.append(el('span','micro',k)); if(tip) kk.appendChild(qm(tip));
        n2.append(kk, el('div','v'+(cls?' '+cls:''),v), el('div','s',s)); grid.appendChild(n2);
      };
      const fund8=NOTIONAL*(m.fundingHr/100)*8;
      const fundD=NOTIONAL*(m.fundingHr/100)*24;
      const feeRt=NOTIONAL*TAKER*2;
      const beMove=(feeRt+Math.max(0,fundD))/NOTIONAL*100;
      const atrPct=a.atr? a.atr/a.last*100 : null;
      P('Expected move (1×ATR)', a.atr? px(a.atr):'—',
        atrPct? atrPct.toFixed(2)+'% of price · a stop inside this is inside the noise':'not enough bars','atrmove');
      P('Volatility now', a.atrExp? a.atrExp.toFixed(2)+'×':'—',
        a.atrExp? (a.atrExp>1.25?'moving more than its own average':a.atrExp<0.8?'unusually quiet':'about normal'):'—','atr',
        a.atrExp>1.25?'warn':'');
      P('Funding on this size', (fund8>=0?'−':'+')+usd(Math.abs(fund8)),
        'per 8 hours '+(m.fundingApr>0?'if long, received if short':'if short, received if long')+' · '+usd(Math.abs(fundD))+' a day','hold',
        fund8>0?'down':fund8<0?'up':'');
      P('Break-even move', beMove.toFixed(3)+'%',
        'taker in and out ('+usd(feeRt)+') plus a day of funding at the current rate','breakeven');
      P('Round-trip cost', usd(feeRt),'0.045% taker each way at published rates, before any tier or referral discount');
      P('Impact spread', m.spreadPct!=null? m.spreadPct.toFixed(3)+'%':'—',
        m.spreadPct!=null? 'roughly '+usd(NOTIONAL*m.spreadPct/100)+' to cross at this size':'no impact quote','spread',
        (m.spreadPct||0)>0.08?'warn':'');
      P('Open interest','$'+fmtC(m.oiNtl), (m.volOverOi!=null? m.volOverOi.toFixed(2)+'× turned over in 24h':'—'),'vsoi');
      P('Bars used', a.bars+' completed', a.partial? 'the hour in progress is '+a.minsIn.toFixed(0)+' minutes old — its price is used, its volume is not':'no partial bar');
      P('Mark vs oracle', pct(m.oracleGap,3), m.oracleGap>0?'perp above spot':'perp below spot','basis');
    }
    paintPractical();

    /* the rope */
    const ropeWrap=el('div');
    const lbl=el('div','micro'); lbl.style.marginBottom='7px';
    lbl.textContent='Positioning tension — grab it';
    const rope=el('div','rope');
    rope.innerHTML='<span class="lbl l">longs</span><span class="lbl r">shorts</span>'+
      '<span class="hint micro">the load sits where funding and basis put it · it settles back</span>';
    ropeWrap.append(lbl,rope);
    body.appendChild(ropeWrap);
    tensionRope(rope,()=>{
      const f=clamp(m.fundingApr/60,-1,1), b=clamp(m.oracleGap/0.25,-1,1);
      return clamp(f*0.7+b*0.3,-1,1);
    });
    const ropeNote=el('p','rd-count');
    ropeNote.textContent='The load hangs toward whichever side is paying — funding '+pct(m.fundingApr,1)+
      ' annualised, mark '+pct(m.oracleGap,3)+' from oracle. It is a picture of those two numbers, not a forecast.';
    body.appendChild(ropeNote);

    const links=el('div'); links.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
    const a1=el('a','btn ghost','Trade '+m.name+' on Hyperliquid');
    a1.href=REF; a1.target='_blank'; a1.rel='noopener';
    a1.addEventListener('click',()=>track('ref:row'));
    links.appendChild(a1);
    body.appendChild(links);
    const disc=el('p','rd-count');
    disc.textContent='That link is Pranjal’s referral — he earns a share, you get 4% off taker fees. It changes nothing about the numbers above.';
    body.appendChild(disc);
    field(body);
  }
};

function soon(title,copy,bullets){
  return async function(){
    const c=el('div','card pad rv'); c.style.maxWidth='760px';
    c.append(el('h1',null,title));
    const p=el('p',null,copy); p.style.cssText='color:var(--ink-2);margin-top:10px;font-size:15px'; c.appendChild(p);
    if(bullets){ const u=el('ul'); u.style.cssText='margin:14px 0 0;padding-left:19px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:6px';
      bullets.forEach(b=>{ const li=el('li'); li.innerHTML=b; u.appendChild(li); }); c.appendChild(u); }
    const b=el('a','btn pri','Back to the radar'); b.href='#/radar'; b.style.marginTop='18px';
    c.appendChild(b);
    PAGE.appendChild(c); reveal(PAGE);
  };
}
