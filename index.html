<script>
/* Vercel Web Analytics. The router keeps wallet addresses in the hash, so the
   URL is reduced to origin + pathname before anything leaves the browser. */
window.va = window.va || function(){ (window.vaq = window.vaq || []).push(arguments); };
window.va('beforeSend', function(e){
  try{ var u=new URL(e.url); return Object.assign({}, e, {url: u.origin + u.pathname}); }
  catch(err){ return e; }
});
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   TOKENS — palette derived from the Hyperliquid mark:
   mint #96FCE4, ground #072722, frame #0F3A34
   Dark is the design's home. Light is designed, not inverted.
   ============================================================ */
:root{
  --bg:#041512; --panel:#072722; --raised:#0B332C; --line:#12403A; --line-2:#1B5449;
  --ink:#E2F3ED; --ink-2:#9CB9B2; --ink-3:#65847D;
  --mint:#96FCE4; --mint-2:#5BD9BC; --mint-wash:#0E332C; --on-mint:#04211C;
  --up:#7BE8B0; --down:#FF8A6E; --flag:#F2C879;
  --focus:#96FCE4;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --shade:0 1px 0 rgba(150,252,228,.04), 0 12px 34px rgba(0,0,0,.45);
  --step:1.5rem;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EFF6F3; --panel:#FFFFFF; --raised:#E3EFEA; --line:#C9E0D8; --line-2:#A9CDC1;
  --ink:#04211C; --ink-2:#3C574F; --ink-3:#6A8880;
  --mint:#07705A; --mint-2:#0A8E72; --mint-wash:#D5FAEF; --on-mint:#04211C;
  --up:#0E7A50; --down:#A83A20; --flag:#7A5809;
  --focus:#07705A;
  --shade:0 1px 2px rgba(4,33,28,.05), 0 12px 30px rgba(4,33,28,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EFF6F3; --panel:#FFFFFF; --raised:#E3EFEA; --line:#C9E0D8; --line-2:#A9CDC1;
    --ink:#04211C; --ink-2:#3C574F; --ink-3:#6A8880;
    --mint:#07705A; --mint-2:#0A8E72; --mint-wash:#D5FAEF; --on-mint:#04211C;
    --up:#0E7A50; --down:#A83A20; --flag:#7A5809;
    --focus:#07705A;
    --shade:0 1px 2px rgba(4,33,28,.05), 0 12px 30px rgba(4,33,28,.07);
    color-scheme:light;
  }
}

*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:Chivo,"Helvetica Neue",Arial,sans-serif; margin:0; letter-spacing:-.03em; text-wrap:balance; font-weight:800}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.lab{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* scrollbars — styled, not foreign */
*{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
*::-webkit-scrollbar{width:10px; height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px; border:3px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--mint-2)}

/* ============================================================
   SHELL  (sh-)  — search-first. The address field IS the nav.
   ============================================================ */
.sh-top{
  position:sticky; top:0; z-index:60;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid transparent; transition:border-color .2s ease;
}
.sh-top[data-stuck="1"]{border-bottom-color:var(--line)}
.sh-topin{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:12px}
.sh-mark{display:flex; align-items:center; gap:9px; flex:0 0 auto; text-decoration:none}
.sh-mark canvas{display:block; width:28px; height:28px; border-radius:7px}
.sh-name{font-family:Chivo; font-weight:900; font-size:15px; letter-spacing:-.04em}
.sh-name em{font-style:normal; color:var(--mint)}
@media (max-width:600px){ .sh-name{display:none} }

/* the shrunken address field that lives in the header */
.sh-field{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--line); border-radius:99px;
  padding:0 6px 0 14px; height:40px; transition:border-color .2s, box-shadow .2s;
}
.sh-field:focus-within{border-color:var(--mint-2); box-shadow:0 0 0 3px var(--mint-wash)}
.sh-field input{
  flex:1 1 auto; min-width:0; background:none; border:none; outline:none; color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; letter-spacing:-.01em;
}
.sh-field input::placeholder{color:var(--ink-3)}
.sh-go{
  flex:0 0 auto; height:28px; min-width:28px; padding:0 10px; border-radius:99px;
  background:var(--mint); color:var(--on-mint); font-weight:600; font-size:12.5px;
  display:grid; place-items:center; transition:transform .18s ease, filter .18s ease;
}
.sh-go:hover{transform:translateY(-1px); filter:brightness(1.06)}
.sh-go:active{transform:translateY(0)}
.sh-icons{flex:0 0 auto; display:flex; gap:4px}
.sh-ico{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--ink-2);
  transition:background .18s, color .18s}
.sh-ico:hover{background:var(--raised); color:var(--ink)}
.sh-ico svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round}

/* section chips — horizontal, scrollable, replaces a rail */
.sh-secs{max-width:1180px; margin:0 auto; padding:0 16px; overflow-x:auto; scrollbar-width:none}
.sh-secs::-webkit-scrollbar{display:none}
.sh-secsin{display:flex; gap:6px; padding:8px 0 10px; width:max-content}
.sh-chip{
  height:34px; padding:0 14px; border-radius:99px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink-2); font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  transition:border-color .2s, color .2s, background .2s, transform .2s;
}
.sh-chip:hover{border-color:var(--line-2); color:var(--ink); transform:translateY(-1px)}
.sh-chip[aria-current="true"]{background:var(--mint-wash); border-color:var(--mint-2); color:var(--mint)}
.sh-chip .dot{width:5px; height:5px; border-radius:99px; background:currentColor; opacity:.55}

.sh-main{max-width:1180px; margin:0 auto; padding:24px 16px calc(72px + env(safe-area-inset-bottom))}

/* the left-gutter rhythm: a mono marker beside the block, hairline between */
.blk{display:grid; grid-template-columns:112px 1fr; gap:0 24px; padding:28px 0; border-top:1px solid var(--line)}
.blk:first-child{border-top:none}
.blk > .blkm{display:flex; flex-direction:column; gap:5px; position:sticky; top:112px; align-self:start}
.blk > .mrk .n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--mint); font-weight:600}
.blk > .bd{min-width:0; display:flex; flex-direction:column; gap:16px}
@media (max-width:760px){
  .blk{grid-template-columns:1fr; gap:12px; padding:22px 0}
  .blk > .blkm{position:static; flex-direction:row; align-items:center; gap:8px}
}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shade)}
.pad{padding:18px 20px}
@media (max-width:420px){ .pad{padding:15px 15px} }

/* ============================================================
   HOME  (hm-)
   ============================================================ */
.hm-hero{position:relative; padding:clamp(36px,9vw,90px) 0 clamp(28px,6vw,56px); overflow:hidden}
.hm-canvas{position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0}
.hm-heroin{position:relative; z-index:1; display:flex; flex-direction:column; gap:22px; max-width:760px}
.hm-h1{font-size:clamp(34px,7.4vw,64px); line-height:.98; font-weight:900}
.hm-h1 em{font-style:normal; color:var(--mint)}
.hm-sub{font-size:clamp(15px,2.2vw,18px); color:var(--ink-2); max-width:52ch}
.hm-big{
  display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-l); padding:8px 8px 8px 20px;
  transition:border-color .22s, box-shadow .22s;
}
.hm-big:focus-within{border-color:var(--mint-2); box-shadow:0 0 0 4px var(--mint-wash)}
.hm-big input{
  flex:1 1 auto; min-width:0; background:none; border:none; outline:none; color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:clamp(13px,2.4vw,16px); padding:12px 0;
}
.hm-big input::placeholder{color:var(--ink-3)}
.hm-read{
  flex:0 0 auto; height:48px; padding:0 22px; border-radius:99px; background:var(--mint); color:var(--on-mint);
  font-family:Chivo; font-weight:800; font-size:15px; letter-spacing:-.02em;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2), filter .18s;
}
.hm-read:hover{transform:translateY(-2px); filter:brightness(1.07)}
@media (max-width:520px){
  .hm-big{flex-direction:column; align-items:stretch; padding:14px; gap:10px; border-radius:var(--r-m)}
  .hm-big input{padding:6px 4px; font-size:14px}
  .hm-read{width:100%; height:48px}
}
.hm-promise{display:flex; flex-wrap:wrap; gap:8px}
.hm-pill{
  display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px; border-radius:99px;
  border:1px solid var(--line); background:var(--panel); font-size:12.5px; color:var(--ink-2);
}
.hm-pill b{color:var(--mint); font-weight:600}

.hm-trylab{margin-top:4px}
.hm-tries{display:flex; flex-wrap:wrap; gap:8px}
.hm-try{
  display:flex; align-items:center; gap:9px; height:44px; padding:0 14px 0 8px;
  border-radius:99px; border:1px solid var(--line); background:var(--panel);
  transition:border-color .2s, transform .2s, background .2s;
}
.hm-try:hover{border-color:var(--mint-2); transform:translateY(-2px)}
.hm-try canvas{width:28px; height:28px; border-radius:8px; display:block}
.hm-try .t{display:flex; flex-direction:column; align-items:flex-start; line-height:1.15}
.hm-try .t b{font-size:12.5px; font-weight:600}
.hm-try .t span{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3)}

/* physics field of live markets */
.hm-field{position:relative; height:clamp(230px,38vw,330px); border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--panel); overflow:hidden}
.hm-field canvas{display:block; width:100%; height:100%}
.hm-fieldnote{position:absolute; left:14px; bottom:12px; pointer-events:none}

/* ============================================================
   LOADER  (ld-)  — an order book filling outward from the spread
   ============================================================ */
.ld{display:flex; flex-direction:column; align-items:center; gap:14px; padding:44px 16px}
.ld canvas{display:block; width:min(340px,84vw); height:170px}
.ld-step{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); text-align:center; min-height:18px}
.ld-bar{width:min(340px,84vw); height:2px; background:var(--line); border-radius:99px; overflow:hidden}
.ld-bar i{display:block; height:100%; width:0%; background:var(--mint); transition:width .35s ease}

/* skeleton under known structure */
.sk{background:linear-gradient(90deg,var(--raised),color-mix(in srgb,var(--raised) 60%, var(--line)),var(--raised));
  background-size:220% 100%; border-radius:var(--r-s); animation:skshift 1.5s linear infinite}
@keyframes skshift{to{background-position:-220% 0}}

/* ============================================================
   WALLET  (wl-)
   ============================================================ */
.wl-id{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.wl-seal{width:96px; height:96px; border-radius:22px; display:block; flex:0 0 auto; background:var(--raised)}
.wl-idt{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 260px}
.wl-arch{font-size:clamp(24px,4.4vw,34px); line-height:1.05}
.wl-tag{color:var(--ink-2); font-size:14px}
.wl-addr{display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; min-width:0; max-width:100%}
.wl-addr code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3);
  background:var(--raised); border-radius:5px; padding:3px 7px; transition:filter .2s;
  overflow-wrap:anywhere; min-width:0; max-width:100%}
.wl-addr code[data-masked="1"]{filter:blur(4px)}
.wl-mini{min-height:44px; min-width:44px; display:grid; place-items:center; border-radius:9px; color:var(--ink-3)}
.wl-mini:hover{background:var(--raised); color:var(--ink)}
.wl-mini svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round}

.wl-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:10px}
.wl-tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 16px;
  display:flex; flex-direction:column; gap:5px; min-width:0; overflow-wrap:anywhere;
  transition:border-color .22s, transform .22s}
.wl-tile:hover{border-color:var(--line-2); transform:translateY(-2px)}
.wl-tile .v{font-family:"IBM Plex Mono",monospace; font-size:clamp(19px,3.2vw,24px); font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.wl-tile .s{font-size:12px; color:var(--ink-3)}
.wl-tile .v.up{color:var(--up)} .wl-tile .v.down{color:var(--down)} .wl-tile .v.none{color:var(--ink-3); font-size:16px}
@media (max-width:400px){ .wl-tiles{grid-template-columns:1fr; gap:8px} .wl-tile{padding:12px 12px} }
@media (min-width:401px) and (max-width:520px){ .wl-tiles{grid-template-columns:1fr 1fr; gap:8px} }

/* score breakdown */
.wl-score{display:flex; flex-direction:column; gap:12px}
.wl-comp{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center}
.wl-comp .cn{font-size:13.5px; display:flex; align-items:center; gap:6px}
.wl-comp .cv{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.wl-track{grid-column:1/-1; height:8px; border-radius:99px; background:var(--raised); overflow:hidden; position:relative}
.wl-fill{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--mint-2),var(--mint));
  transform-origin:left center; transform:scaleX(0); transition:transform .9s cubic-bezier(.2,.8,.25,1)}
.wl-track[data-missing="1"]{background:repeating-linear-gradient(-45deg,var(--raised) 0 6px,transparent 6px 12px)}
.wl-miss{font-size:12px; color:var(--ink-3); font-style:italic}

/* positions + fills table */
.wl-tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel)}
.wl-tw table{border-collapse:collapse; width:100%; min-width:540px; font-size:13px}
.wl-tw th,.wl-tw td{padding:10px 14px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
.wl-tw thead th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; background:var(--raised)}
.wl-tw tbody tr:last-child td{border-bottom:none}
.wl-tw tbody tr{transition:background .16s}
.wl-tw tbody tr:hover{background:var(--raised)}
.wl-tw td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.wl-side{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 7px; border-radius:4px; font-weight:600}
.wl-side.l{background:color-mix(in srgb,var(--up) 18%,transparent); color:var(--up)}
.wl-side.s{background:color-mix(in srgb,var(--down) 18%,transparent); color:var(--down)}

.wl-pager{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px}
.wl-pgb{height:36px; min-width:44px; padding:0 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); font-size:13px; transition:border-color .2s, color .2s}
.wl-pgb:hover:not(:disabled){border-color:var(--mint-2); color:var(--mint)}
.wl-pgb:disabled{opacity:.35; cursor:default}

/* was display:flex — flex children do not wrap, so the long "Checked:" line
   ran 250px past a 320px viewport and gave the whole page a horizontal scroll */
.wl-note{font-size:12.5px; color:var(--ink-3); display:block; overflow-wrap:anywhere; min-width:0}
.wl-note b{color:var(--ink-2); font-weight:500}
.wl-note .num{overflow-wrap:anywhere}

/* empty state */
.wl-empty{display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 20px; text-align:center}
.wl-empty canvas{width:88px; height:88px}
.wl-empty p{color:var(--ink-2); max-width:38ch; font-size:14px}

/* ============================================================
   TOOLTIPS (tp-)
   ============================================================ */
.tp-q{
  display:inline-grid; place-items:center; width:15px; height:15px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-3); font-size:9.5px; font-weight:700;
  font-family:"IBM Plex Mono",monospace; cursor:help; vertical-align:middle; flex:0 0 auto;
  transition:color .18s, border-color .18s;
}
.tp-q:hover{color:var(--mint); border-color:var(--mint-2)}
.tp-pop{
  position:fixed; z-index:200; max-width:min(300px,88vw); padding:11px 13px;
  background:var(--raised); border:1px solid var(--line-2); border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.5); font-size:13px; line-height:1.5; color:var(--ink);
  opacity:0; transform:translateY(4px); transition:opacity .16s, transform .16s; pointer-events:none;
}
.tp-pop[data-on="1"]{opacity:1; transform:translateY(0)}

/* ============================================================
   SHARE CARD (sc-)
   ============================================================ */
.sc-wrap{display:flex; flex-direction:column; gap:14px; align-items:center}
.sc-stage{perspective:1100px; width:100%; display:grid; place-items:center}
.sc-tilt{transform-style:preserve-3d; will-change:transform; border-radius:var(--r-m)}
.sc-card{position:relative; border-radius:var(--r-m); overflow:hidden; box-shadow:0 26px 60px rgba(0,0,0,.5);
  background:var(--panel); display:block}
.sc-card canvas{display:block; width:100%; height:auto}
.sc-sheen{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(150,252,228,.20), transparent 60%)}
.sc-tilt:hover .sc-sheen{opacity:1}
.sc-ctrls{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.sc-btn{height:44px; padding:0 16px; border-radius:99px; border:1px solid var(--line); background:var(--panel);
  font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:8px;
  transition:border-color .2s, transform .2s, color .2s}
.sc-btn:hover{border-color:var(--mint-2); color:var(--mint); transform:translateY(-2px)}
.sc-btn.pri{background:var(--mint); color:var(--on-mint); border-color:transparent; font-weight:600}
.sc-btn.pri:hover{color:var(--on-mint); filter:brightness(1.07)}
.sc-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round}
.sc-toggles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.sc-tog{height:36px; padding:0 13px; border-radius:99px; border:1px solid var(--line); background:var(--panel);
  font-size:12.5px; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px; transition:all .2s}
.sc-tog[aria-pressed="true"]{border-color:var(--mint-2); color:var(--mint); background:var(--mint-wash)}
.sc-tog .box{width:13px; height:13px; border-radius:4px; border:1.5px solid currentColor; display:grid; place-items:center}
.sc-tog[aria-pressed="true"] .box{background:currentColor}

/* archetype cast */
.cast{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px}
.cast-c{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); padding:14px 12px;
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  transition:border-color .22s, transform .22s}
.cast-c:hover{border-color:var(--mint-2); transform:translateY(-3px)}
.cast-c canvas{width:64px; height:64px; display:block}
.cast-c b{font-family:Chivo; font-size:13px; font-weight:800; letter-spacing:-.02em}
.cast-c span{font-size:11.5px; color:var(--ink-3); line-height:1.35}
.cast-c[data-you="1"]{border-color:var(--mint); box-shadow:0 0 0 3px var(--mint-wash)}
/* legibility proof strip: same art at row size */
.cast-mini{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding-top:4px}
.cast-mini canvas{width:28px; height:28px; border-radius:8px; display:block}

/* reveal on scroll */
.rev-hl{opacity:0; transform:translateY(14px)}
.rev-hl[data-in="1"]{animation:revin .62s cubic-bezier(.2,.8,.25,1) forwards; animation-delay:var(--d,0ms)}
.rev-hl[data-instant="1"]{animation:none !important; opacity:1; transform:none}
@keyframes revin{to{opacity:1; transform:none}}
@keyframes pgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* referral — disclosed, never disguised (rf-) */
.rf-box{display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); padding:20px}
.rf-box canvas{width:60px; height:60px; border-radius:16px; flex:0 0 auto}
.rf-t{flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:5px}
.rf-t h3{font-size:17px}
.rf-t p{font-size:13.5px; color:var(--ink-2)}
.rf-t .disc{font-size:12px; color:var(--ink-3)}
.rf-cta{flex:0 0 auto; height:46px; padding:0 20px; border-radius:99px; background:var(--mint); color:var(--on-mint);
  font-family:Chivo; font-weight:800; font-size:14.5px; letter-spacing:-.02em; text-decoration:none;
  display:inline-flex; align-items:center; gap:8px; transition:transform .18s, filter .18s}
.rf-cta:hover{transform:translateY(-2px); filter:brightness(1.07)}
.rf-inline{color:var(--mint); text-decoration:none; border-bottom:1px solid color-mix(in srgb,var(--mint) 40%,transparent)}
.rf-inline:hover{border-bottom-color:var(--mint)}
@media (max-width:520px){ .rf-box{padding:16px} .rf-cta{width:100%; justify-content:center} }

.foot{border-top:1px solid var(--line); margin-top:40px; padding:22px 0 8px;
  display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between;
  font-size:12.5px; color:var(--ink-3)}
.foot a{color:var(--mint); text-decoration:none}
.foot a:hover{text-decoration:underline}

/* ============================================================
   WALLET PAGE v2 — namespaced wl- / eq- / dp- / rn- / nr- / mk-
   ============================================================ */

/* ---- identity ---- */
.wl-hero{display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:start}
.wl-hero .sealwrap{position:relative; width:104px; height:104px; flex:0 0 auto}
.wl-hero .sealwrap canvas{width:104px; height:104px; display:block; border-radius:24px}
.wl-hero .sealwrap::after{content:""; position:absolute; inset:-6px; border-radius:30px; pointer-events:none;
  background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--mint) 22%,transparent), transparent 70%);
  opacity:0; transition:opacity .4s}
.wl-hero:hover .sealwrap::after{opacity:1}
.wl-idt{min-width:0; display:flex; flex-direction:column; gap:6px}
.wl-arch{font-size:clamp(26px,5vw,40px); line-height:1; font-weight:800}
.wl-tag{color:var(--ink-2); font-size:14.5px; max-width:58ch}
.wl-why{font-size:12.5px; color:var(--ink-3); display:flex; gap:7px; align-items:baseline}
.wl-why b{color:var(--mint-2); font-weight:600; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; flex:0 0 auto}
.wl-runners{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px}
.wl-runner{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  border:1px dashed var(--line); border-radius:99px; padding:3px 9px; transition:border-color .2s,color .2s}
.wl-runner:hover{border-color:var(--line-2); color:var(--ink-2)}
.wl-idrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; min-width:0}
.wl-idrow code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3);
  background:var(--raised); border:1px solid transparent; border-radius:6px; padding:4px 8px;
  overflow-wrap:anywhere; min-width:0; max-width:100%; transition:filter .3s, border-color .2s, color .2s}
.wl-idrow code:hover{border-color:var(--line); color:var(--ink-2)}
.wl-idrow code[data-masked="1"]{filter:blur(5px)}
.wl-mini{min-height:34px; min-width:34px; display:grid; place-items:center; border-radius:9px; color:var(--ink-3);
  border:1px solid transparent; transition:background .18s, color .18s, border-color .18s, transform .18s}
.wl-mini:hover{background:var(--raised); color:var(--mint); border-color:var(--line); transform:translateY(-1px)}
.wl-mini:active{transform:translateY(0) scale(.94)}
.wl-mini[aria-pressed="true"]{color:var(--mint); background:var(--mint-wash); border-color:var(--mint-2)}
.wl-mini svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wl-role{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3)}
.wl-role b{color:var(--mint-2); font-weight:600}
@media (max-width:560px){
  .wl-hero{grid-template-columns:1fr; gap:14px}
  .wl-hero .sealwrap, .wl-hero .sealwrap canvas{width:84px; height:84px}
}

/* ---- tiles ---- */
.wl-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr)); gap:10px}
.wl-tile{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m);
  padding:14px 16px 13px; display:flex; flex-direction:column; gap:4px; min-width:0; overflow:hidden;
  overflow-wrap:anywhere; transition:border-color .24s, transform .24s, box-shadow .24s}
.wl-tile::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%), color-mix(in srgb,var(--mint) 9%,transparent), transparent 62%)}
.wl-tile:hover{border-color:var(--line-2); transform:translateY(-2px); box-shadow:var(--shade)}
.wl-tile:hover::before{opacity:1}
.wl-tile .k{display:flex; align-items:center; gap:6px}
.wl-tile .v{font-family:"IBM Plex Mono",monospace; font-size:clamp(19px,3.2vw,25px); font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.025em; line-height:1.15}
.wl-tile .s{font-size:12px; color:var(--ink-3); line-height:1.35}
.wl-tile .v.up{color:var(--up)} .wl-tile .v.down{color:var(--down)}
.wl-tile .v.none{color:var(--ink-3); font-size:16px; font-weight:500}
.wl-tile .sp{height:26px; margin-top:4px; opacity:.9}
@media (max-width:400px){ .wl-tiles{grid-template-columns:1fr; gap:8px} .wl-tile{padding:12px} }
@media (min-width:401px) and (max-width:520px){ .wl-tiles{grid-template-columns:1fr 1fr; gap:8px} }

/* ---- segmented control ---- */
.wl-seg{display:inline-flex; background:var(--raised); border:1px solid var(--line); border-radius:11px;
  padding:3px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none}
.wl-seg::-webkit-scrollbar{display:none}
.wl-seg button{padding:7px 13px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-3);
  white-space:nowrap; transition:background .2s, color .2s}
.wl-seg button:hover:not(.on){color:var(--ink); background:color-mix(in srgb,var(--line) 60%,transparent)}
.wl-seg button.on{background:var(--mint); color:var(--on-mint)}
@media (max-width:768px){ .wl-seg{width:100%} .wl-seg button{flex:1 1 0; min-height:38px} }

/* ---- equity chart (eq-) ----
   Composition: labels sit ON the gridlines at the left, a band shades the
   distance from the starting value, and the readout is a fixed rail under the
   plot rather than a floating bubble — which is what makes it usable on a phone. */
.eq-wrap{display:flex; flex-direction:column; gap:0; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden}
.eq-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:14px 16px 10px}
.eq-plot{position:relative; height:clamp(190px,30vw,260px); touch-action:pan-y}
.eq-plot canvas{display:block; width:100%; height:100%}
.eq-rail{display:grid; grid-template-columns:1fr auto auto; gap:10px 16px; align-items:baseline;
  padding:11px 16px; border-top:1px solid var(--line); background:var(--raised); min-height:52px}
.eq-rail .r1{font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
.eq-rail .r2{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.eq-rail .r3{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600}
.eq-rail .r3.up{color:var(--up)} .eq-rail .r3.down{color:var(--down)}
@media (max-width:520px){ .eq-rail{grid-template-columns:1fr auto} .eq-rail .r2{grid-column:1/-1} }
.eq-empty{padding:34px 16px; text-align:center; color:var(--ink-3); font-size:13.5px}

/* ---- depth meter (dp-) ----
   One stacked bar showing each component's weighted contribution, then the rows.
   Missing components are hatched and contribute nothing rather than zero. */
.dp-top{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.dp-num{font-family:Chivo; font-weight:900; font-size:clamp(40px,7vw,58px); line-height:.9; letter-spacing:-.05em}
.dp-of{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.dp-stack{display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--raised);
  border:1px solid var(--line); gap:2px; padding:2px}
.dp-seg{height:100%; border-radius:99px; transform-origin:left center; transform:scaleX(0);
  transition:transform .9s cubic-bezier(.2,.85,.25,1), filter .2s}
.dp-seg:hover{filter:brightness(1.25)}
.dp-seg[data-missing="1"]{background:repeating-linear-gradient(-45deg,var(--line) 0 4px,transparent 4px 8px) !important}
.dp-rows{display:flex; flex-direction:column; gap:11px}
.dp-row{display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center;
  padding:9px 11px; border-radius:10px; border:1px solid transparent; transition:background .2s, border-color .2s}
.dp-row:hover{background:var(--raised); border-color:var(--line)}
.dp-row .n{font-size:13.5px; display:flex; align-items:center; gap:7px}
.dp-row .n i{width:8px; height:8px; border-radius:3px; flex:0 0 auto}
.dp-row .v{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.dp-row .tr{grid-column:1/-1; height:6px; border-radius:99px; background:var(--raised); overflow:hidden; margin-top:3px}
.dp-row .tr[data-missing="1"]{background:repeating-linear-gradient(-45deg,var(--raised) 0 5px,transparent 5px 10px)}
.dp-row .fl{display:block; height:100%; border-radius:99px; transform-origin:left center; transform:scaleX(0);
  transition:transform 1s cubic-bezier(.2,.85,.25,1)}
.dp-row .d{grid-column:1/-1; font-size:12px; color:var(--ink-3); margin-top:2px}
.dp-row .d.miss{font-style:italic}
.dp-row .w{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3)}

/* ---- runs (rn-) — reconstructed trades ---- */
.rn-list{display:flex; flex-direction:column; gap:10px}
.rn{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden;
  transition:border-color .24s, transform .24s}
.rn:hover{border-color:var(--line-2)}
.rn[data-open="1"]{border-color:var(--mint-2)}
.rn-h{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:13px 15px;
  cursor:pointer; width:100%; text-align:left}
.rn-h:hover{background:var(--raised)}
.rn-side{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; letter-spacing:.07em;
  padding:4px 8px; border-radius:5px; white-space:nowrap}
.rn-side.l{background:color-mix(in srgb,var(--up) 17%,transparent); color:var(--up)}
.rn-side.s{background:color-mix(in srgb,var(--down) 17%,transparent); color:var(--down)}
.rn-m{min-width:0; display:flex; flex-direction:column; gap:2px}
.rn-m b{font-size:14px; font-weight:600}
.rn-m s{text-decoration:none; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.rn-p{text-align:right; display:flex; flex-direction:column; gap:2px}
.rn-p b{font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.rn-p b.up{color:var(--up)} .rn-p b.down{color:var(--down)} .rn-p b.na{color:var(--ink-3); font-size:12px}
.rn-p s{text-decoration:none; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3)}
.rn-flag{display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--flag);
  background:color-mix(in srgb,var(--flag) 14%,transparent); border-radius:4px; padding:2px 6px}
.rn-body{display:none; padding:0 15px 15px; flex-direction:column; gap:12px}
.rn[data-open="1"] .rn-body{display:flex}
.rn-strip{position:relative; height:118px; border-radius:10px; background:var(--raised);
  border:1px solid var(--line); overflow:hidden}
.rn-strip canvas{display:block; width:100%; height:100%}
.rn-facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(122px,100%),1fr)); gap:8px}
.rn-fact{background:var(--raised); border:1px solid var(--line); border-radius:9px; padding:9px 11px;
  display:flex; flex-direction:column; gap:2px; min-width:0}
.rn-fact .k{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.rn-fact .v{font-family:"IBM Plex Mono",monospace; font-size:13.5px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.rn-legs{display:flex; flex-direction:column; gap:1px; max-height:none}
.rn-leg{display:grid; grid-template-columns:auto auto 1fr auto; gap:10px; align-items:center;
  padding:7px 9px; border-radius:7px; font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  transition:background .16s}
.rn-leg:hover{background:var(--raised)}
.rn-leg .kd{font-size:9px; letter-spacing:.08em; padding:2px 6px; border-radius:4px; white-space:nowrap;
  background:var(--raised); color:var(--ink-3)}
.rn-leg .kd.entry{background:color-mix(in srgb,var(--mint) 16%,transparent); color:var(--mint)}
.rn-leg .kd.add{background:color-mix(in srgb,var(--mint) 10%,transparent); color:var(--mint-2)}
.rn-leg .kd.exit{background:color-mix(in srgb,var(--ink-3) 18%,transparent); color:var(--ink-2)}
.rn-leg .kd.liq{background:color-mix(in srgb,var(--down) 20%,transparent); color:var(--down)}
.rn-leg .t{color:var(--ink-3)}
.rn-leg .pn{text-align:right; font-variant-numeric:tabular-nums}
.rn-leg .pn.up{color:var(--up)} .rn-leg .pn.down{color:var(--down)}

/* ---- narrative (nr-) ---- */
.nr{display:flex; flex-direction:column; gap:9px}
.nr-l{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:12px 14px;
  border-radius:11px; background:var(--panel); border:1px solid var(--line);
  transition:transform .26s cubic-bezier(.2,.9,.3,1), border-color .26s}
.nr-l:hover{transform:translateX(4px); border-color:var(--line-2)}
.nr-l .d{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:0 0 auto;
  font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:700}
.nr-l.good .d{background:color-mix(in srgb,var(--up) 15%,transparent); color:var(--up)}
.nr-l.bad .d{background:color-mix(in srgb,var(--down) 15%,transparent); color:var(--down)}
.nr-l.neu .d{background:var(--raised); color:var(--ink-3)}
.nr-l .t{font-size:14px; line-height:1.55}
.nr-l .t b{font-weight:600; color:var(--ink)}
.nr-more{align-self:flex-start; height:40px; padding:0 16px; border-radius:99px; border:1px solid var(--line);
  background:var(--panel); font-size:13px; color:var(--ink-2); transition:border-color .2s,color .2s,transform .2s}
.nr-more:hover{border-color:var(--mint-2); color:var(--mint); transform:translateY(-1px)}

/* ---- marks (mk-) — our own classification, clearly labelled ---- */
.mrk-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(148px,100%),1fr)); gap:9px}
.mrk{position:relative; border-radius:12px; padding:13px 12px; text-align:center; overflow:hidden;
  border:1px solid var(--line); background:var(--panel);
  transition:transform .3s cubic-bezier(.2,1.25,.4,1), border-color .28s}
.mrk .i{width:34px; height:34px; margin:0 auto 8px; border-radius:10px; display:grid; place-items:center;
  background:var(--raised); color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:13px;
  font-weight:700; transition:background .3s, color .3s}
.mrk .n{font-size:12.5px; font-weight:600; line-height:1.25}
.mrk .r{font-size:10.5px; color:var(--ink-3); margin-top:3px; line-height:1.35}
.mrk[data-got="0"]{opacity:.44; filter:saturate(.3)}
.mrk[data-got="1"]{border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.mrk[data-got="1"] .i{background:var(--mint-wash); color:var(--mint)}
.mrk[data-got="1"]:hover{transform:translateY(-4px); border-color:var(--mint)}
.mrk[data-got="1"]::after{content:""; position:absolute; top:-40%; left:-60%; width:38%; height:200%;
  transform:rotate(17deg); opacity:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--mint) 20%,transparent),transparent)}
.mrk[data-got="1"]:hover::after{opacity:1; animation:mkSweep .8s ease}
@keyframes mkSweep{from{left:-60%}to{left:120%}}

/* ---- proof panel ---- */
.wl-proof{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--mint);
  border-radius:0 var(--r-m) var(--r-m) 0; padding:14px 16px; display:flex; flex-direction:column; gap:7px}
.wl-proof h4{font-family:Chivo; font-size:13px; font-weight:800; margin:0; letter-spacing:-.02em}
.wl-proof .p{display:grid; grid-template-columns:1fr auto; gap:4px 14px; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; align-items:baseline}
.wl-proof .p .k{color:var(--ink-3); overflow-wrap:anywhere}
.wl-proof .p .v{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.wl-proof .p .v.ok{color:var(--mint)} .wl-proof .p .v.bad{color:var(--down)}
.wl-proof p{font-size:12.5px; color:var(--ink-3); line-height:1.55}

/* ---- loader v2 ---- */
.ld2{display:flex; flex-direction:column; align-items:center; gap:16px; padding:34px 0 8px}
.ld2-stage{position:relative; width:min(360px,88vw); height:186px}
.ld2-stage canvas{display:block; width:100%; height:100%}
.ld2-pct{position:absolute; right:0; top:0; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.ld2-addr{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.ld2-step{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2); text-align:center; min-height:19px}
.ld2-step i{display:inline-block; width:5px; height:5px; border-radius:99px; background:var(--mint);
  margin-left:7px; vertical-align:middle; animation:ld2p 1s ease-in-out infinite}
@keyframes ld2p{0%,100%{opacity:.25}50%{opacity:1}}
.ld2-bar{width:min(360px,88vw); height:2px; background:var(--line); border-radius:99px; overflow:hidden}
.ld2-bar i{display:block; height:100%; width:0%; background:var(--mint); transition:width .4s ease}
.ld2-skel{width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px; margin-top:16px}
.ld2-skrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.sk{background:linear-gradient(90deg,var(--raised),color-mix(in srgb,var(--raised) 55%,var(--line)),var(--raised));
  background-size:220% 100%; border-radius:var(--r-m); animation:skshift 1.5s linear infinite}

             placeholder="0x… paste any Hyperliquid address" aria-label="Hyperliquid address">
