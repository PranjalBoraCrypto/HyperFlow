  <span>Built by Pranjal · <a href="https://x.com/Crypto_Pranjal" target="_blank" rel="noopener">@Crypto_Pranjal</a>
    · <a class="rf-inline" href="https://app.hyperliquid.xyz/join/REWARDS" target="_blank" rel="noopener">Pranjal’s Hyperliquid referral</a></span>
</footer>

<script>
"use strict";
/* ============================================================
   0. tiny utils
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
const RM = ()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtUsd=(v,d)=>{const n=+v; if(!isFinite(n))return '—';
  const a=Math.abs(n); const dd = d!=null?d : a>=1e6?2:a>=1000?0:2;
  return (n<0?'-$':'$')+a.toLocaleString('en-US',{minimumFractionDigits:dd,maximumFractionDigits:dd});};
const fmtCompact=v=>{const n=+v; if(!isFinite(n))return '—'; const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2)+'B'; if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1e3) return (n/1e3).toFixed(1)+'K'; return n.toFixed(2);};
const fmtNum=(v,d=4)=>{const n=+v; return isFinite(n)? n.toLocaleString('en-US',{maximumFractionDigits:d}) : '—';};
const shortAddr=a=>a? a.slice(0,6)+'…'+a.slice(-4) : '';
const dayStr=t=>new Date(t).toISOString().slice(0,10);
const daysAgo=t=>Math.floor((Date.now()-t)/86400000);

/* ============================================================
   1. api() — cache w/ per-call TTL, in-flight dedupe, abort, RATE
   ============================================================ */
const API='https://api.hyperliquid.xyz/info';
const _cache=new Map(), _inflight=new Map();
function apiKey(body){ return JSON.stringify(body); }
async function api(body,{ttl=30000, timeout=15000}={}){
  const k=apiKey(body), now=Date.now();
  const hit=_cache.get(k);
  if(hit && now-hit.t < ttl) return hit.v;
  if(_inflight.has(k)) return _inflight.get(k);
  const run=(async()=>{
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),timeout);
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),signal:ac.signal});
      if(r.status===429){ const e=new Error('rate limited'); e.code='RATE'; throw e; }
      if(!r.ok){ const e=new Error('http '+r.status); e.code='HTTP'; e.status=r.status; throw e; }
      const j=await r.json();
      _cache.set(k,{t:Date.now(),v:j});
      return j;
    } finally { clearTimeout(timer); _inflight.delete(k); }
  })();
  _inflight.set(k,run);
  return run;
}
const BACKOFF=[1500,3500,7000,12000];
async function apiRetry(body,opts){
  let last;
  for(let i=0;i<=BACKOFF.length;i++){
    try{ return await api(body,opts); }
    catch(e){
      last=e;
      if(e.code!=='RATE' && e.name!=='AbortError' && e.code!=='HTTP') throw e;
      if(i===BACKOFF.length) break;
      await new Promise(r=>setTimeout(r,BACKOFF[i]));
    }
  }
  throw last;
}

/* ============================================================
   2. theme
   ============================================================ */
(function(){
  let saved=null; try{ saved=localStorage.getItem('hf-theme'); }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme',saved);
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const sysDark=!matchMedia('(prefers-color-scheme: light)').matches;
    const next = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('hf-theme',next); }catch(e){}
    document.dispatchEvent(new CustomEvent('hf:theme'));
  });
})();
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ============================================================
   3. tooltips — key OR free text, pointer-safe, click-safe
   ============================================================ */
const TIPS={
  oi:'Open interest: the total dollar value of positions this wallet has open right now, long and short added together as absolute size.',
  lev:'Leverage as the exchange reports it for the position — not a number we infer. Cross means one shared margin pool; isolated means margin ring-fenced to that market.',
  liq:'The price at which the exchange would close this position. Blank means the exchange reports no liquidation price for it.',
  vlm:'Lifetime notional traded, from the portfolio endpoint. We cross-check it against the referral endpoint and only show it when both agree.',
  equity:'Account value as the exchange reports it. It equals cash net of position plus the signed notional of every open position — we recompute it and only print it if our number matches theirs.',
  staked:'HYPE currently delegated to validators. Held separately from spot balance, so a big staker does not look empty.',
  since:'The first entry in this wallet’s ledger — its earliest deposit or transfer on Hyperliquid. Survives the fills cap, unlike first-fill date.',
  fillwin:'The fills endpoint returns 2,000 at a time. This is the window we actually read, not the wallet’s whole history — every number derived from fills covers this window only.',
  genesis:'The genesis distribution this wallet received, straight from its ledger — token, amount and date as recorded by the exchange.',
  subacc:'Subaccounts belonging to this address. Their balances are shown separately and are never folded into the headline numbers.',
  curve:'Account value over time, from the perpAllTime series — the one that ends exactly on the account value shown above. The allTime series folds in spot and staked HYPE and does not reconcile with the perp account, so it is not drawn here.',
  winrate:'Of the trades we could rebuild end to end inside the fill window, the share that closed in profit. Positions still open, and positions that were already running when the window opens, are excluded.',
  hold:'The median time from a position leaving flat to returning to flat, across complete trades in the read window.',
  depth:'HyperFlow’s own descriptive measure of how much this wallet has done on Hyperliquid. Components with no data are dropped and the remaining weights renormalised, so nothing is scored zero for being absent. Not a rank, not a grade, and it says nothing about what happens next.'
};
(function(){
  const pop=$('#tpPop'); let anchor=null, hideT=null;
  function place(a){
    const r=a.getBoundingClientRect(); pop.style.visibility='hidden'; pop.dataset.on='1';
    const pr=pop.getBoundingClientRect();
    let x=r.left+r.width/2-pr.width/2;
    x=Math.max(10,Math.min(x,innerWidth-pr.width-10));
    let y=r.top-pr.height-10;
    if(y<8) y=r.bottom+10;
    pop.style.left=x+'px'; pop.style.top=y+'px'; pop.style.visibility='';
  }
  function show(a){
    clearTimeout(hideT);                    // clear BEFORE identity check
    const raw=a.getAttribute('data-tip')||'';
    const text = TIPS[raw] || raw;          // key OR free text
    if(!text) return;                       // never show an empty bubble
    anchor=a; pop.textContent=text; place(a);
  }
  function hide(){ pop.dataset.on='0'; anchor=null; }
  document.addEventListener('pointerover',e=>{
    const a=e.target.closest('[data-tip]'); if(!a) return;
    if(e.pointerType==='touch') return;
    show(a);
  });
  document.addEventListener('pointerout',e=>{
    const a=e.target.closest('[data-tip]'); if(!a) return;
    clearTimeout(hideT);                                     // clear first
    if(e.relatedTarget && a.contains(e.relatedTarget)) return; // still inside anchor
    hideT=setTimeout(hide,90);
  });
  // touch: tap toggles; scrolling repositions rather than dismissing
  document.addEventListener('click',e=>{
    const a=e.target.closest('.tp-q'); if(!a){ if(anchor) hide(); return; }
    e.preventDefault();
    if(anchor===a) hide(); else show(a);
  });
  addEventListener('scroll',()=>{ if(anchor) place(anchor); },{passive:true});
  addEventListener('resize',()=>{ if(anchor) place(anchor); });
  // NOTE: no capture-phase handler and no stopPropagation — a tooltip anchor
  // that is also a link or tile must still navigate.
})();
function q(key){ const s=el('span','tp-q','?'); s.setAttribute('data-tip',key);
  s.setAttribute('tabindex','0'); s.setAttribute('role','button');
  s.setAttribute('aria-label','What is this?'); return s; }

/* ============================================================
   4. reveal on scroll — staggered, no replay on user repaint
   ============================================================ */
const revObs = new IntersectionObserver((entries)=>{
  const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
  vis.forEach((e,i)=>{
    e.target.style.setProperty('--d', Math.min(i*55,330)+'ms');
    e.target.dataset.in='1';
    revObs.unobserve(e.target);
  });
},{rootMargin:'0px 0px -8% 0px', threshold:.05});
function reveal(root, instant){
  root.querySelectorAll('.rev-hl:not([data-in])').forEach(n=>{
    if(instant){ n.dataset.instant='1'; n.dataset.in='1'; }   // explicit no-animation path
    else revObs.observe(n);
  });
}
// safety net: only force-reveal things ALREADY in the viewport
setInterval(()=>{
  document.querySelectorAll('.rev-hl:not([data-in])').forEach(n=>{
    const r=n.getBoundingClientRect();
    if(r.top < innerHeight && r.bottom > 0){ n.dataset.in='1'; }
  });
},1200);

/* ============================================================
   5. CANVAS ART SYSTEM — "Seals"
   A plaque (the mark's own tile), a generative ground, and one
   bold silhouette. Detail is only drawn above a size threshold,
   so the same rig reads at 28px and at 300px.
   ============================================================ */
function dpr(cap){ return Math.min(devicePixelRatio||1, cap||1.5); }
function fitCanvas(cv, w, h, cap){
  const d=dpr(cap); cv.width=Math.round(w*d); cv.height=Math.round(h*d);
  const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0); return c;
}
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* the mark itself — the two-lobed form, drawn not imported */
function drawBlob(c,S,color,squash){
  const k=S/100, sq=squash==null?1:squash;
  c.fillStyle=color; c.beginPath();
  c.moveTo(20*k, 50*k);
  c.bezierCurveTo(20*k,(50-22*sq)*k, 30*k,(50-28*sq)*k, 40*k,(50-12*sq)*k);
  c.bezierCurveTo(48*k,(50-1*sq)*k, 54*k,(50-30*sq)*k, 66*k,(50-30*sq)*k);
  c.bezierCurveTo(80*k,(50-30*sq)*k, 86*k,(50-14*sq)*k, 86*k,50*k);
  c.bezierCurveTo(86*k,(50+14*sq)*k, 80*k,(50+30*sq)*k, 66*k,(50+30*sq)*k);
  c.bezierCurveTo(54*k,(50+30*sq)*k, 48*k,(50+1*sq)*k, 40*k,(50+12*sq)*k);
  c.bezierCurveTo(30*k,(50+28*sq)*k, 20*k,(50+22*sq)*k, 20*k,50*k);
  c.closePath(); c.fill();
}
function paintMark(cv,size){
  const c=fitCanvas(cv,size,size,2);
  c.fillStyle='#072722'; rr(c,0,0,size,size,size*0.22); c.fill();
  c.save(); c.translate(size*0.03,0); c.scale(0.94,0.94);
  drawBlob(c,size,'#96FCE4',1); c.restore();
}

/* --- the cast ------------------------------------------------ */
const CAST=[
 {id:'anchor',      name:'The Anchor',      hue:'#7FE9FF', tag:'Stakes deep, trades rarely.',
  desc:'Most of what this wallet has on Hyperliquid is delegated, not deployed. Long staking tenure, modest trading footprint.'},
 {id:'tidewalker',  name:'The Tidewalker',  hue:'#96FCE4', tag:'Holds through the funding clock.',
  desc:'Positions survive many funding hours. Cumulative funding is a meaningful share of this wallet’s realised outcome.'},
 {id:'splinter',    name:'The Splinter',    hue:'#D7F58A', tag:'Many small fills, many markets.',
  desc:'High fill count against low average size, spread across an unusually wide set of markets.'},
 {id:'deepwater',   name:'The Deepwater',   hue:'#4FD4B4', tag:'One position, enormous.',
  desc:'Notional concentrated into very few markets. What this wallet has at risk right now is large relative to its equity.'},
 {id:'cartograph',  name:'The Cartographer',hue:'#C4A8FF', tag:'Trades every venue there is.',
  desc:'Active across the main perp book, builder-deployed markets, spot and outcome markets. Breadth of venue, not just of ticker.'},
 {id:'metronome',   name:'The Metronome',   hue:'#9BF6A8', tag:'Posts, waits, repeats.',
  desc:'Overwhelmingly maker-side with a regular cadence. Earns the spread rather than crossing it.'},
 {id:'ember',       name:'The Ember',       hue:'#FFA98E', tag:'Bursts, then goes quiet.',
  desc:'Activity arrives in short concentrated runs separated by long dormant stretches.'},
 {id:'oracle',      name:'The Oracle',      hue:'#FFCF5C', tag:'Takes sides on outcomes.',
  desc:'Holds positions in outcome markets alongside — or instead of — directional perp exposure.'},
 {id:'bricklayer',  name:'The Bricklayer',  hue:'#F2D98A', tag:'Accumulates, course by course.',
  desc:'Spot-weighted and additive. Balance grows through deposits and buys more than through leverage.'},
 {id:'fuse',        name:'The Fuse',        hue:'#FF9BC0', tag:'High leverage, short fuse.',
  desc:'Runs leverage near the top of what the market allows and holds for a short time.'},
 {id:'homestead',   name:'The Homesteader', hue:'#CFEFFF', tag:'Here since the early ledger.',
  desc:'One of the older ledgers on the network, and still active. Tenure measured in years, not months.'}
];
const CAST_IX=Object.fromEntries(CAST.map((c,i)=>[c.id,i]));

/* silhouettes — one per type, distinct at row size */
function sil(c,S,id){
  const k=S/100;
  const P=(fn)=>{ c.beginPath(); fn(); c.closePath(); c.fill(); };
  switch(id){
    case 'anchor': // plumb wedge on a wide base
      P(()=>{ c.moveTo(50*k,14*k); c.lineTo(66*k,54*k); c.lineTo(34*k,54*k); });
      rr(c,24*k,60*k,52*k,12*k,6*k); c.fill();
      break;
    case 'tidewalker': // the mark's own form, rotated to a swell
      c.save(); c.translate(50*k,50*k); c.rotate(-0.34); c.translate(-50*k,-50*k);
      drawBlob(c,S,c.fillStyle,.86); c.restore(); break;
    case 'splinter': { // fan of shards
      for(let i=0;i<5;i++){ const a=-1.05+i*0.52;
        c.save(); c.translate(50*k,72*k); c.rotate(a);
        P(()=>{ c.moveTo(-3.4*k,0); c.lineTo(3.4*k,0); c.lineTo(1.3*k,-46*k); c.lineTo(-1.3*k,-46*k); });
        c.restore(); }
      break; }
    case 'deepwater': // one huge lobe
      P(()=>{ c.ellipse(50*k,50*k,33*k,36*k,0,0,7); }); break;
    case 'cartograph': { // grid of plates + bridging arc
      for(let r=0;r<3;r++) for(let col=0;col<3;col++){
        if(r===1&&col===1) continue;
        rr(c,(20+col*23)*k,(20+r*23)*k,15*k,15*k,4*k); c.fill(); }
      c.lineWidth=6*k; c.strokeStyle=c.fillStyle; c.lineCap='round';
      c.beginPath(); c.arc(50*k,50*k,10*k,0.5,4.2); c.stroke(); break; }
    case 'metronome': // column + pivot + swing
      P(()=>{ c.moveTo(44*k,18*k); c.lineTo(56*k,18*k); c.lineTo(60*k,70*k); c.lineTo(40*k,70*k); });
      rr(c,26*k,74*k,48*k,10*k,5*k); c.fill();
      c.beginPath(); c.arc(50*k,30*k,6.5*k,0,7); c.fill(); break;
    case 'ember': // teardrop + sparks
      P(()=>{ c.moveTo(50*k,14*k); c.bezierCurveTo(74*k,40*k,72*k,60*k,50*k,76*k);
              c.bezierCurveTo(28*k,60*k,26*k,40*k,50*k,14*k); });
      c.beginPath(); c.arc(30*k,26*k,4.4*k,0,7); c.fill();
      c.beginPath(); c.arc(72*k,32*k,3.4*k,0,7); c.fill(); break;
    case 'oracle': // split ring + dot
      c.lineWidth=11*k; c.strokeStyle=c.fillStyle; c.lineCap='butt';
      c.beginPath(); c.arc(50*k,50*k,27*k,-1.15,1.15); c.stroke();
      c.beginPath(); c.arc(50*k,50*k,27*k,2.0,4.28); c.stroke();
      c.beginPath(); c.arc(50*k,50*k,7*k,0,7); c.fill(); break;
    case 'bricklayer': // offset courses
      rr(c,20*k,24*k,52*k,14*k,4*k); c.fill();
      rr(c,30*k,43*k,52*k,14*k,4*k); c.fill();
      rr(c,20*k,62*k,52*k,14*k,4*k); c.fill(); break;
    case 'fuse': // taper bolt
      P(()=>{ c.moveTo(62*k,12*k); c.lineTo(40*k,48*k); c.lineTo(54*k,48*k);
              c.lineTo(36*k,88*k); c.lineTo(66*k,44*k); c.lineTo(50*k,44*k); }); break;
    case 'homestead': // the mark, ringed
      c.lineWidth=5*k; c.strokeStyle=c.fillStyle;
      c.beginPath(); c.arc(50*k,50*k,40*k,0,7); c.stroke();
      c.save(); c.scale(.72,.72); c.translate(19*k,19*k); drawBlob(c,S,c.fillStyle,1); c.restore(); break;
    default: P(()=>{ c.arc(50*k,50*k,30*k,0,7); });
  }
}
/* full seal: plaque + generative ground + silhouette */
function drawSeal(cv, size, id, seedStr){
  const c=fitCanvas(cv,size,size, size>120?2:1.5);
  const t=CAST[CAST_IX[id]] || CAST[0];
  const R=rng(hashStr((seedStr||'')+id));
  const detail = size>=80;
  c.clearRect(0,0,size,size);
  // plaque
  c.fillStyle='#062421'; rr(c,0,0,size,size,size*0.22); c.fill();
  c.save(); rr(c,0,0,size,size,size*0.22); c.clip();
  // generative ground: concentric contour bands, seeded
  c.globalAlpha=detail?0.16:0.11;
  c.strokeStyle=t.hue; c.lineWidth=Math.max(1,size*0.012);
  const bands = detail? 9 : 4;
  for(let i=0;i<bands;i++){
    const rad=size*(0.16+i*0.075);
    c.beginPath();
    const steps=detail?42:16;
    for(let s=0;s<=steps;s++){
      const a=s/steps*Math.PI*2;
      const wob=1+(R()-0.5)*(detail?0.10:0.04);
      const x=size/2+Math.cos(a)*rad*wob, y=size/2+Math.sin(a)*rad*wob*0.92;
      s?c.lineTo(x,y):c.moveTo(x,y);
    }
    c.closePath(); c.stroke();
  }
  c.globalAlpha=1;
  // tenure ticks around the edge (detail only)
  if(detail){
    c.fillStyle=t.hue; c.globalAlpha=.5;
    const ticks=Math.floor(10+R()*14);
    for(let i=0;i<ticks;i++){
      const a=(i/ticks)*Math.PI*2, rad=size*0.435;
      c.save(); c.translate(size/2+Math.cos(a)*rad, size/2+Math.sin(a)*rad); c.rotate(a);
      c.fillRect(-size*0.012,-size*0.006,size*0.024,size*0.012); c.restore();
    }
    c.globalAlpha=1;
  }
  // silhouette
  c.save(); c.translate(size*0.5,size*0.5); c.scale(0.80,0.80); c.translate(-size*0.5,-size*0.5);
  c.fillStyle=t.hue;
  c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=detail?size*0.05:0; c.shadowOffsetY=detail?size*0.015:0;
  sil(c,size,id);
  c.restore();
  // inner frame
  c.shadowBlur=0; c.strokeStyle='rgba(150,252,228,.14)'; c.lineWidth=Math.max(1,size*0.008);
  rr(c,c.lineWidth/2,c.lineWidth/2,size-c.lineWidth,size-c.lineWidth,size*0.21); c.stroke();
  c.restore();
}

/* ============================================================
   6. SIGNATURE LOADER — a book filling outward from the spread
   ============================================================ */
/* ============================================================
   LOADER v2 — an order book building outward from the spread.
   It eases toward 92% and WAITS there: the data decides when it
   finishes, so the bar never lies about progress. A skeleton of
   the page sits underneath so nothing jumps when the data lands.
   Depth seeding is hashed off the address, so two wallets do not
   load identically.
   ============================================================ */
function makeLoader2(mount, steps, addr){
  const wrap=el('div','ld2');
  const stage=el('div','ld2-stage');
  const cv=el('canvas'); cv.setAttribute('aria-hidden','true');
  const pct=el('div','ld2-pct','0%');
  stage.append(cv,pct);
  const ad=el('div','ld2-addr', shortAddr(addr||''));
  const step=el('div','ld2-step'); step.append(document.createTextNode(steps[0]||'Reading…'), el('i'));
  const bar=el('div','ld2-bar'); const fill=el('i'); bar.appendChild(fill);
  const skel=el('div','ld2-skel');
  const r1=el('div','ld2-skrow'); [0,1,2].forEach(()=>r1.appendChild(el('div','sk t')));
  skel.append(r1, el('div','sk c'), el('div','sk l'));
  wrap.append(stage,ad,step,bar,skel);
  mount.appendChild(wrap);

  const c=fitCanvas(cv,Math.min(360,innerWidth*0.88),186,1.5);
  const R=rng(hashStr(addr||'x')||9);
  const ROWS=14, depth=[], jitter=[];
  for(let i=0;i<ROWS;i++){ depth.push(0.18+R()*0.82); jitter.push(R()*6.283); }
  let prog=0, done=false, raf=null, t0=performance.now(), W=0, H=0;
  function measure(){ const r=stage.getBoundingClientRect(); if(!r.width) return false;
    W=r.width; H=r.height; fitCanvas(cv,W,H,1.5); return true; }
  measure();
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ cancelAnimationFrame(raf); return; }
    if(!W && !measure()) return;
    const ctx=cv.getContext('2d');
    const elp=(now-t0)/1000;
    /* asymptotic to 0.92 while waiting, then a quick run to 1 once the data is in */
    prog = done ? Math.min(1, prog+0.055) : 0.92*(1-Math.exp(-elp*0.5));
    const mint=tok('--mint'), dim=tok('--ink-3'), line=tok('--line');
    const mid=H/2, gap=Math.max(8,H/22), h=Math.max(5,gap-4);
    ctx.clearRect(0,0,W,H);
    /* the spread line, with a travelling highlight */
    ctx.strokeStyle=mint; ctx.lineWidth=1.5; ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.moveTo(10,mid); ctx.lineTo(W-10,mid); ctx.stroke();
    const hx=10+((elp*0.34)%1)*(W-20);
    const hg=ctx.createLinearGradient(hx-40,0,hx+40,0);
    hg.addColorStop(0,'rgba(0,0,0,0)'); hg.addColorStop(.5,mint); hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.strokeStyle=hg; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(hx-40,mid); ctx.lineTo(hx+40,mid); ctx.stroke();
    ctx.globalAlpha=1;
    for(let i=0;i<ROWS;i++){
      const reach=prog*ROWS-i; if(reach<=0) continue;
      const a=Math.min(1,reach), e=1-Math.pow(1-a,3);
      const breathe=1+Math.sin(elp*1.4+jitter[i])*0.045;
      const w=(W-30)*depth[i]*e*breathe;
      ctx.globalAlpha=e*0.8;
      ctx.fillStyle=dim;
      ctx.fillRect(W/2-w/2, mid-gap-(i*gap)-h, w, h);
      ctx.globalAlpha=e*0.92; ctx.fillStyle=mint;
      const wb=w*0.88;
      ctx.fillRect(W/2-wb/2, mid+gap+(i*gap), wb, h);
      ctx.globalAlpha=1;
    }
    ctx.strokeStyle=line; ctx.lineWidth=1; ctx.strokeRect(.5,.5,W-1,H-1);
    pct.textContent=Math.round(prog*100)+'%';
    fill.style.width=(prog*100).toFixed(1)+'%';
  }
  if(!RM()) raf=requestAnimationFrame(frame);
  else { pct.textContent='…'; }
  let rt; const onR=()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(cv.isConnected) measure(); },150); };
  addEventListener('resize',onR);
  return {
    step(i){ if(steps[i]) step.firstChild.nodeValue=steps[i]; },
    finish(){ done=true; },
    done(){ done=true; cancelAnimationFrame(raf); removeEventListener('resize',onR); wrap.remove(); }
  };
}

/* ============================================================
   POSITION RECONSTRUCTION
   Hyperliquid stamps every fill with startPosition — the size held
   immediately before it. That is venue truth, so there is no need to
   rebuild size by counting forwards (which drifts permanently once the
   capped window opens mid-position).
   The catch, and it is a silent one: userFills is returned NEWEST FIRST,
   and many fills share a millisecond. A stable sort by `time` therefore
   leaves same-millisecond fills in reverse order. Measured on live data:
   sorting by time gives 1,628 broken links across 2,000 BTC fills, worst
   gap 55.4 BTC, and lands 1.87 BTC away from the size the exchange
   reports. Simply reversing the array gives 0 broken links and lands
   exactly on it. Ordering is the whole ball game here.
   ============================================================ */
const isSpotCoin = c => /^[@+]/.test(c);
function chrono(fills){ return (fills||[]).slice().reverse(); }   // oldest-first

function buildRuns(fills, livePos){
  const perp = chrono(fills).filter(f=>!isSpotCoin(f.coin));
  const byCoin={};
  perp.forEach(f=>{ (byCoin[f.coin]=byCoin[f.coin]||[]).push(f); });
  const runs=[], checks={links:0, linkBreaks:0, worstLink:0, endChecked:0, endBreaks:0, worstEnd:0, backMax:0};
  const FLAT=1e-9;

  Object.keys(byCoin).forEach(coin=>{
    const fs=byCoin[coin];
    const after=fs.map(f=>+f.startPosition + (f.side==='B'? +f.sz : -f.sz));

    /* check 1: does each fill's result equal the next fill's stated start? */
    for(let i=0;i<fs.length-1;i++){
      checks.links++;
      const d=Math.abs(after[i]-(+fs[i+1].startPosition));
      if(d>1e-8){ checks.linkBreaks++; checks.worstLink=Math.max(checks.worstLink,d); }
    }
    /* check 2: does the walk land on the size the exchange reports right now? */
    const live = livePos[coin]!=null ? livePos[coin] : 0;
    if(fs.length){
      checks.endChecked++;
      const d=Math.abs(after[after.length-1]-live);
      if(d>1e-6){ checks.endBreaks++; checks.worstEnd=Math.max(checks.worstEnd,d); }
    }
    /* check 3: an independent backwards walk from venue truth, for cross-check */
    const back=new Array(fs.length); let acc=live;
    for(let i=fs.length-1;i>=0;i--){ back[i]=acc; acc-=(fs[i].side==='B'?1:-1)*Math.abs(+fs[i].sz); }
    for(let i=0;i<fs.length;i++) checks.backMax=Math.max(checks.backMax, Math.abs(back[i]-after[i]));
    const before0 = fs.length ? +fs[0].startPosition : 0;

    let cur=null;
    fs.forEach((f,i)=>{
      const prev = i===0 ? before0 : after[i-1];
      if(!cur){
        cur={coin, t0:f.time, legs:[], realized:0, notional:0, peakSize:0,
             dir: after[i]>0?'LONG': after[i]<0?'SHORT':(f.side==='B'?'LONG':'SHORT'),
             /* already running before this window opened: we can see its exits but
                not its entry, so its PnL is a fragment and must not read as a trade */
             partial: Math.abs(prev)>FLAT};
      }
      const leg={t:f.time, px:+f.px, sz:Math.abs(+f.sz), side:f.side, dir:f.dir,
                 pnl:+f.closedPnl, fee:+f.fee, after:after[i], maker:f.crossed===false,
                 liq: /liquidat/i.test(f.dir||'') || f.liquidation!=null};
      leg.kind = leg.liq ? 'LIQ'
               : Math.abs(prev)<FLAT ? 'ENTRY'
               : Math.abs(after[i])<FLAT ? 'EXIT'
               : Math.abs(after[i])>Math.abs(prev) ? 'ADD' : 'TRIM';
      cur.legs.push(leg);
      cur.realized+=leg.pnl; cur.notional+=leg.sz*leg.px;
      cur.peakSize=Math.max(cur.peakSize, Math.abs(after[i]));
      if(Math.abs(after[i])<FLAT){ cur.t1=f.time; cur.open=false; runs.push(cur); cur=null; }
    });
    if(cur){ cur.open=true; cur.t1=Date.now(); cur.liveSize=live; runs.push(cur); }
  });
  runs.sort((a,b)=>b.t1-a.t1);
  return {runs, checks};
}

/* Weighted-average cost, not cash flow.
   Cash flow double-counts the moment a position is partly closed: the proceeds
   sit in the cash total AND in the venue's realised PnL. Proof: short 10 @ 100,
   buy back 5 @ 90, mark 95 → truth is $75, cash flow says $125.
   Realised comes straight from the venue's closedPnl; only the open remainder is
   marked, and only when we know what it cost. */
function runPnl(run, mark){
  let sz=0, basis=0, realized=0;
  for(const l of run.legs){
    const s=(l.side==='B'?1:-1)*l.sz;
    if(Math.abs(sz)<1e-9 || Math.sign(s)===Math.sign(sz)) basis=(Math.abs(sz)*basis + l.sz*l.px)/(Math.abs(sz)+l.sz);
    else if(l.sz>Math.abs(sz)) basis=l.px;                     /* flipped through flat */
    sz = l.after;                                              /* trimming keeps the basis */
    if(Math.abs(sz)<1e-9){ sz=0; basis=0; }
    realized+=l.pnl;
  }
  /* no honest mark for a run whose entry we never saw */
  const canMark = !run.partial && Math.abs(sz)>1e-9 && basis>0 && mark>0;
  const unreal = canMark ? sz*(mark-basis) : 0;
  const fees = run.legs.reduce((s,l)=>s+(l.fee||0),0);
  return {realized, unreal, basis, size:sz, fees, total:realized+unreal, canMark};
}

/* ============================================================
   7. READ A WALLET — every number from a live call
   ============================================================ */
const STEPS=[
 'Checking what this address is',
 'Reading the perp account',
 'Reading spot and outcome balances',
 'Reading lifetime volume',
 'Reading staking and validators',
 'Walking the ledger back to the first entry',
 'Reading the most recent fills',
 'Checking builder-deployed markets',
 'Checking subaccounts'
];
async function readWallet(addr, onStep){
  const S=(i)=>onStep&&onStep(i,STEPS.length);
  S(0); const role   = await apiRetry({type:'userRole',user:addr},{ttl:300000});
  S(1); const ch     = await apiRetry({type:'clearinghouseState',user:addr},{ttl:15000});
  S(2); const spot   = await apiRetry({type:'spotClearinghouseState',user:addr},{ttl:15000});
  S(3); const [pf,ref] = await Promise.all([
          apiRetry({type:'portfolio',user:addr},{ttl:60000}),
          apiRetry({type:'referral',user:addr},{ttl:300000}).catch(()=>null)
        ]);
  S(4);
  const [dsum,dels,dhist,drew,vals] = await Promise.all([
    apiRetry({type:'delegatorSummary',user:addr},{ttl:60000}),
    apiRetry({type:'delegations',user:addr},{ttl:60000}),
    apiRetry({type:'delegatorHistory',user:addr},{ttl:300000}),
    apiRetry({type:'delegatorRewards',user:addr},{ttl:300000}),
    apiRetry({type:'validatorSummaries'},{ttl:600000})
  ]);
  S(5); const ledger = await apiRetry({type:'userNonFundingLedgerUpdates',user:addr,startTime:0},{ttl:600000});
  S(6); const fills  = await apiRetry({type:'userFills',user:addr},{ttl:20000});
  S(7);
  const dexs = await apiRetry({type:'perpDexs'},{ttl:600000});
  const dexNames = dexs.filter(Boolean).map(d=>d.name);
  const dexStates = await Promise.all(dexNames.map(n=>
    api({type:'clearinghouseState',user:addr,dex:n},{ttl:30000}).then(v=>({dex:n,v})).catch(()=>({dex:n,v:null}))
  ));
  S(8);
  let subs=[]; try{ subs = await api({type:'subAccounts',user:addr},{ttl:60000}) || []; }catch(e){ subs=[]; }
  const mids = await api({type:'allMids'},{ttl:15000}).catch(()=>({}));
  return {addr, role, ch, spot, pf, ref, dsum, dels, dhist, drew, vals, ledger, fills, dexStates, subs, mids};
}

/* ---- derive features, showing the working ------------------- */
function derive(d){
  const f={};
  const ms = d.ch?.marginSummary || {};
  const pos = (d.ch?.assetPositions||[]).map(p=>p.position);
  f.positions = pos;
  f.equity = +(ms.accountValue||0);
  f.rawUsd = +(ms.totalRawUsd||0);
  f.oi     = +(ms.totalNtlPos||0);
  f.marginUsed = +(ms.totalMarginUsed||0);
  // recompute the exchange's own identity and record the residual
  f.sumAbsNtl = pos.reduce((s,p)=>s+Math.abs(+p.positionValue),0);
  f.sumSignedNtl = pos.reduce((s,p)=>s+Math.sign(+p.szi)*(+p.positionValue),0);
  f.oiResidual = f.sumAbsNtl - f.oi;
  f.equityResidual = (f.rawUsd + f.sumSignedNtl) - f.equity;
  f.maxLev = pos.reduce((m,p)=>Math.max(m, +(p.leverage?.value||0)),0);
  f.concentration = f.oi>0 ? Math.max(0,...pos.map(p=>Math.abs(+p.positionValue)))/f.oi : null;
  f.cumFunding = pos.reduce((s,p)=>s+(+(p.cumFunding?.allTime||0)),0);

  /* portfolio has two families and they are NOT interchangeable.
     Verified on three wallets: perpAllTime.accountValueHistory ends exactly on
     clearinghouseState.accountValue every time; allTime never does — it folds in
     spot, staked HYPE and whatever else the address holds. So the series that may
     sit beside a perp account value is perpAllTime, and only perpAllTime. */
  const pmap = Object.fromEntries(d.pf||[]);
  const pa = pmap.perpAllTime, at = pmap.allTime;
  f.perpVlm   = pa ? +pa.vlm : null;                 // perp only
  f.totalVlm  = at ? +at.vlm : null;                 // perp + spot
  f.refVlm    = d.ref ? +d.ref.cumVlm : null;
  // print the total only when two independent endpoints agree on it
  f.totalVlmAgrees = (f.totalVlm!=null && f.refVlm!=null)
    && Math.abs(f.totalVlm-f.refVlm) <= Math.max(1, f.totalVlm*1e-6);
  f.equitySeries = pa ? pa.accountValueHistory : [];
  f.pnlSeries    = pa ? pa.pnlHistory : [];
  f.perpPnl      = f.pnlSeries?.length ? +f.pnlSeries[f.pnlSeries.length-1][1] : null;
  f.perpSeriesEnd = f.equitySeries?.length ? +f.equitySeries[f.equitySeries.length-1][1] : null;
  f.seriesResidual = (f.perpSeriesEnd!=null) ? f.perpSeriesEnd - +(ms.accountValue||0) : null;
  // kept, but only ever shown inside the subaccounts/aggregate context
  f.aggPnl = at?.pnlHistory?.length ? +at.pnlHistory[at.pnlHistory.length-1][1] : null;
  f.aggEquity = at?.accountValueHistory?.length ? +at.accountValueHistory[at.accountValueHistory.length-1][1] : null;

  const bal=d.spot?.balances||[];
  f.hype = +( (bal.find(b=>b.coin==='HYPE')||{}).total || 0 );
  f.spotCoins = bal.filter(b=>+b.total>0 && !/^\+/.test(b.coin)).length;
  f.outcomeCoins = bal.filter(b=>/^\+/.test(b.coin));
  f.outcomeHeld = f.outcomeCoins.filter(b=>+b.total>0).length;
  f.hypeMid = +(d.mids?.HYPE||d.mids?.['@107']||0) || null;

  f.staked = +(d.dsum?.delegated||0);
  f.undelegated = +(d.dsum?.undelegated||0);
  f.validators = (d.dels||[]).length;
  f.validatorNames = (d.dels||[]).map(x=>{
    const v=(d.vals||[]).find(v=>v.validator.toLowerCase()===x.validator.toLowerCase());
    return v? v.name : shortAddr(x.validator);
  });
  f.validatorDetail = (d.dels||[]).map(x=>{
    const v=(d.vals||[]).find(v=>v.validator.toLowerCase()===x.validator.toLowerCase());
    const st=v? Object.fromEntries(v.stats||[]) : {};
    return {name: v? v.name : shortAddr(x.validator), amount:+x.amount,
            commission: v? +v.commission : null,
            uptime: st.month? +st.month.uptimeFraction : null,
            apr: st.month? +st.month.predictedApr : null,
            jailed: v? !!v.isJailed : false,
            locked: x.lockedUntilTimestamp||null};
  });
  f.rewards = (d.drew||[]).reduce((s,x)=>s+(+x.totalAmount||0),0);
  f.stakingSince = (d.dhist||[]).length ? Math.min(...d.dhist.map(x=>x.time)) : null;

  const led=d.ledger||[];
  f.firstLedger = led.length ? led[0].time : null;
  f.genesis = led.filter(x=>x.delta?.type==='spotGenesis')
                 .map(x=>({token:x.delta.token, amount:+x.delta.amount, time:x.time}));
  f.tenureDays = f.firstLedger ? daysAgo(f.firstLedger) : null;

  const fl=d.fills||[];
  f.fillCount = fl.length;
  f.fillWindow = fl.length ? {from:fl[fl.length-1].time, to:fl[0].time} : null;
  f.makerShare = fl.length ? fl.filter(x=>x.crossed===false).length/fl.length : null;
  f.markets = new Set(fl.map(x=>x.coin)).size;
  f.avgFillNtl = fl.length ? fl.reduce((s,x)=>s+Math.abs((+x.px)*(+x.sz)),0)/fl.length : null;
  const closed = fl.filter(x=>+x.closedPnl!==0);
  f.closedCount = closed.length;
  f.winRate = closed.length ? closed.filter(x=>+x.closedPnl>0).length/closed.length : null;

  f.dexActive = (d.dexStates||[]).filter(x=>x.v && (+(x.v.marginSummary?.accountValue||0)>0 || (x.v.assetPositions||[]).length))
                                 .map(x=>x.dex);
  f.subCount = (d.subs||[]).length;
  f.subEquity = (d.subs||[]).reduce((s,x)=>s+(+(x.clearinghouseState?.marginSummary?.accountValue||0)),0);
  f.subNtl    = (d.subs||[]).reduce((s,x)=>s+(+(x.clearinghouseState?.marginSummary?.totalNtlPos||0)),0);

  f.venues = 0;
  if(f.oi>0 || f.equity>0) f.venues++;
  if(f.spotCoins>0) f.venues++;
  if(f.outcomeHeld>0) f.venues++;
  f.venues += f.dexActive.length;
  return f;
}

/* ---- archetype, earned from the data ----------------------- */
function assign(f){
  const stakedUsd = f.hypeMid ? f.staked*f.hypeMid : null;
  const stakeWeight = (stakedUsd!=null && (stakedUsd+f.equity)>0) ? stakedUsd/(stakedUsd+f.equity) : 0;
  const C=[];
  const push=(id,score,why)=>C.push({id,score,why});
  push('anchor', stakeWeight*1.6 + (f.stakingSince? Math.min(1,daysAgo(f.stakingSince)/365)*0.5:0) - (f.fillCount>800?0.5:0),
       `${(stakeWeight*100).toFixed(0)}% of this address’s own account value is delegated rather than deployed${f.subCount?' (its '+f.subCount+' subaccounts are excluded)':''}`);
  push('tidewalker', (Math.abs(f.cumFunding) > Math.max(200, f.oi*0.001) ? 0.9 : 0) + (f.oi>0?0.3:0),
       `${fmtUsd(f.cumFunding)} of cumulative funding accrued on open positions`);
  push('splinter', (f.markets>=8?0.8:f.markets/10) + (f.fillCount>=1500?0.5:0) + (f.avgFillNtl && f.avgFillNtl<8000?0.4:0),
       `${f.markets} markets touched across ${f.fillCount} fills read`);
  push('deepwater', (f.concentration!=null && f.concentration>0.85 ? 0.9:0) + (f.oi>1e6?0.7:f.oi>1e5?0.3:0),
       `${f.concentration!=null?(f.concentration*100).toFixed(0)+'% of open notional sits in one market':'no open position'}`);
  push('cartograph', f.venues>=4?1.2:f.venues*0.28, `active across ${f.venues} distinct venues`);
  push('metronome', (f.makerShare!=null && f.makerShare>0.7 ? 1.1:0) + (f.makerShare||0)*0.4,
       `${f.makerShare!=null?(f.makerShare*100).toFixed(0)+'% of fills were maker-side':'no fills read'}`);
  push('ember', (f.fillCount>0 && f.tenureDays>240 && f.fillCount<300 ? 0.9:0),
       `${f.fillCount} fills against ${f.tenureDays} days on the ledger`);
  push('oracle', f.outcomeHeld>0 ? 1.3 : (f.outcomeCoins.length? 0.45:0),
       `${f.outcomeHeld} outcome-market position${f.outcomeHeld===1?'':'s'} held`);
  push('bricklayer', (f.spotCoins>=4?0.7:f.spotCoins*0.16) + (f.oi===0 && f.equity>0 ?0.6:0),
       `${f.spotCoins} spot balances held, ${f.oi===0?'no open perp position':'perp position open'}`);
  push('fuse', (f.maxLev>=15?0.9:f.maxLev/20) + (f.marginUsed && f.equity ? Math.min(0.6,(f.marginUsed/f.equity)) : 0),
       `${f.maxLev||0}× top leverage in use`);
  push('homestead', f.tenureDays!=null ? Math.min(1.4, f.tenureDays/540) + (f.genesis.length?0.6:0) : 0,
       `ledger opens ${f.tenureDays!=null? f.tenureDays+' days ago':'—'}${f.genesis.length?' and includes a genesis distribution':''}`);
  C.sort((a,b)=>b.score-a.score);
  const top=C[0];
  return {...top, weak: top.score<0.45, runners:C.slice(1,4)};
}

/* ---- depth: descriptive, component-wise, missing ≠ zero ----- */
function depth(f){
  const cap=(v,m)=>Math.max(0,Math.min(100, v/m*100));
  const comps=[
    {k:'Trading',  v: (f.perpVlm!=null && f.perpVlm>0)? cap(Math.log10(f.perpVlm),10):null,
     detail: f.perpVlm? fmtUsd(f.perpVlm,0)+' lifetime perp notional':null, miss:'no trading recorded'},
    /* nothing open is a fact about this minute, not a measurement of depth —
       scoring it zero would punish a wallet for being flat right now */
    {k:'Position', v: f.oi>0? cap(Math.log10(f.oi),8):null,
     detail: f.oi>0? fmtUsd(f.oi,0)+' open right now, '+(f.maxLev||0)+'× top leverage':null,
     miss:'nothing open right now'},
    {k:'Staking',  v: f.staked>0? cap(Math.log10(Math.max(1,f.staked)),6):null,
     detail: f.staked>0? fmtNum(f.staked,2)+' HYPE with '+f.validators+' validator'+(f.validators===1?'':'s'):null,
     miss:'hasn’t staked'},
    {k:'Holdings', v: (f.hype>0||f.spotCoins>0)? cap(Math.log10(Math.max(1,f.hype+1)),5)*0.6+cap(f.spotCoins,12)*0.4:null,
     detail: (f.hype>0||f.spotCoins>0)? fmtNum(f.hype,2)+' HYPE, '+f.spotCoins+' spot balances':null,
     miss:'no spot balances'},
    {k:'Spread',   v: f.venues>0? cap(f.venues,6):null,
     detail: f.venues>0? f.venues+' venues'+(f.dexActive.length?' incl. '+f.dexActive.join(', '):''):null,
     miss:'single venue only'},
    {k:'Tenure',   v: f.tenureDays!=null? cap(f.tenureDays,900):null,
     detail: f.tenureDays!=null? 'first ledger entry '+dayStr(f.firstLedger):null, miss:'no ledger history'}
  ];
  /* declared weights. Missing components are dropped and the remaining weights
     renormalised, so a wallet is never scored down for data that does not exist. */
  const W_={Trading:.24, Position:.16, Staking:.20, Holdings:.14, Spread:.14, Tenure:.12};
  comps.forEach(c=>c.weight=W_[c.k]);
  const known=comps.filter(c=>c.v!=null);
  const wsum=known.reduce((s,c)=>s+c.weight,0);
  const total = known.length? Math.round(known.reduce((s,c)=>s+c.v*c.weight,0)/wsum) : null;
  return {comps,total,knownCount:known.length};
}

/* ============================================================
   8. PHYSICS FIELD — elastic collisions, repulsion gated by
   cursor SPEED so a resting cursor lets you read a tile.
   ============================================================ */
function marketField(host, markets){
  const cv=el('canvas'); host.appendChild(cv);
  let W=0,H=0,c=null,raf=null,running=false;
  const bodies = markets.slice(0,16).map((m,i)=>({
    n:m.name, v:m.vlm, r:0, x:0, y:0, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5
  }));
  let px=-1e4, py=-1e4, lx=-1e4, ly=-1e4, speed=0;
  function size(){
    const r=host.getBoundingClientRect();      // measure the container, never hardcode
    if(!r.width||!host.isConnected) return false;
    W=r.width; H=r.height; c=fitCanvas(cv,W,H,1.5);
    const maxV=Math.max(...bodies.map(b=>b.v||1));
    bodies.forEach((b,i)=>{
      b.r=Math.max(15, Math.min(W,H)*0.055 + (b.v/maxV)*Math.min(W,H)*0.075);
      if(!b.init){ b.x=b.r+Math.random()*(W-2*b.r); b.y=b.r+Math.random()*(H-2*b.r); b.init=1; }
      b.x=Math.max(b.r,Math.min(W-b.r,b.x)); b.y=Math.max(b.r,Math.min(H-b.r,b.y));
    });
    return true;
  }
  function step(){
    if(!running) return;
    speed*=0.86;
    const mint=tok('--mint'), line=tok('--line-2'), ink=tok('--ink');
    c.clearRect(0,0,W,H);
    for(const b of bodies){
      if(px>-1e3){
        const dx=b.x-px, dy=b.y-py, d=Math.hypot(dx,dy)||1;
        if(d < b.r+90){
          const push = (speed/60) * (1 - d/(b.r+90)) * 2.6;   // scaled BY cursor speed
          b.vx += dx/d*push; b.vy += dy/d*push;
        }
      }
      b.x+=b.vx; b.y+=b.vy; b.vx*=0.988; b.vy*=0.988;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.82} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.82}
      if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.82} if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.82}
    }
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i], b=bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, min=a.r+b.r;
      if(d<min){
        const nx=dx/d, ny=dy/d, ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        const p=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;   // equal-mass elastic exchange
        a.vx-=p*nx; a.vy-=p*ny; b.vx+=p*nx; b.vy+=p*ny;
      }
    }
    for(const b of bodies){
      const hov = Math.hypot(b.x-px,b.y-py) < b.r;
      c.beginPath(); c.arc(b.x,b.y,b.r,0,7);
      c.fillStyle = hov ? mint : 'rgba(150,252,228,.07)';
      c.fill();
      c.lineWidth=1; c.strokeStyle= hov? mint : line; c.stroke();
      c.fillStyle = hov ? tok('--on-mint') : ink;
      c.font='600 '+Math.max(9,Math.min(13,b.r*0.36))+'px "IBM Plex Mono", monospace';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText(b.n, b.x, b.y);
    }
    raf=requestAnimationFrame(step);
  }
  function onMove(e){
    const r=cv.getBoundingClientRect();
    const nx=e.clientX-r.left, ny=e.clientY-r.top;
    if(lx>-1e3) speed = Math.min(60, Math.hypot(nx-lx, ny-ly)*4 + speed*0.5);
    lx=nx; ly=ny; px=nx; py=ny;
  }
  cv.addEventListener('pointermove',onMove);
  cv.addEventListener('pointerleave',()=>{px=py=-1e4; lx=ly=-1e4; speed=0;});
  const io=new IntersectionObserver(es=>{
    const on=es[0].isIntersecting && !RM();
    if(on && !running){ if(size()){ running=true; raf=requestAnimationFrame(step);} }
    else if(!on && running){ running=false; cancelAnimationFrame(raf); }
  },{threshold:.02});
  io.observe(host);
  let rt; const onResize=()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(!host.isConnected){ teardown(); return; } size(); },140); };
  addEventListener('resize',onResize);
  function teardown(){ running=false; cancelAnimationFrame(raf); io.disconnect(); removeEventListener('resize',onResize); }
  ACTIVE.push(teardown);
  if(size() && !RM()){ running=true; raf=requestAnimationFrame(step); } else if(size()){ step.call(null); }
}

/* ============================================================
   COUNT-UP — one number, one series. Whatever counts up here is the
   same computed value the card and the tile show; they can never
   disagree because there is only one of them.

/* ---- small shared utilities ---- */
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1;
  return s.length%2? s[m] : (s[m-1]+s[m])/2; }
function dur(ms){
  if(ms==null||!isFinite(ms)) return '—';
  const s=ms/1000;
  if(s<90) return Math.round(s)+'s';
  if(s<5400) return (s/60).toFixed(s<600?1:0)+' min';
  if(s<172800) return (s/3600).toFixed(s<36000?1:0)+' h';
  if(s<2592000) return (s/86400).toFixed(1)+' days';
  return (s/2592000).toFixed(1)+' months';
}

/* ============================================================
   NARRATIVE — thresholds, each one naming the number behind it.
   Tone is descriptive, never advisory: it says what happened, not
   what to do, and never what happens next.
   ============================================================ */
function narrative(f, d, runs){
  const L=[], add=(tone,text)=>L.push({tone,text});
  const m=v=>'<b>'+fmtUsd(v)+'</b>';
  if(!f.fillCount && !f.staked && !f.equity){
    add('neu','This address has no perp account, no fills and no delegation on Hyperliquid. If you expected activity, check the address — or it may only exist on another chain.');
    return L;
  }
  add('neu','The exchange reports this address as a <b>'+(d.role?.role||'unknown')+'</b>, and its ledger opens on <b>'+
    (f.firstLedger? dayStr(f.firstLedger):'—')+'</b>'+(f.tenureDays!=null?', '+f.tenureDays+' days ago':'')+'.');
  if(f.oi>0){
    const p=f.positions.slice().sort((a,b)=>Math.abs(+b.positionValue)-Math.abs(+a.positionValue))[0];
    const long=+p.szi>0;
    add(+p.unrealizedPnl>=0?'good':'bad',
      'Right now it is '+(long?'long':'short')+' <b>'+p.coin+'</b> — '+fmtNum(Math.abs(+p.szi),4)+' units worth '+m(+p.positionValue)+
      ' at '+(p.leverage?.value||'—')+'× '+(p.leverage?.type||'')+' margin, entered around '+fmtUsd(p.entryPx)+
      '. On paper that is '+(+p.unrealizedPnl>=0?'ahead':'behind')+' by <b>'+fmtUsd(Math.abs(+p.unrealizedPnl))+'</b>.');
    if(f.positions.length>1) add('neu','It holds '+f.positions.length+' positions at once, '+m(f.oi)+' of notional in total.');
    if(p.liquidationPx){
      const gap=Math.abs((+p.liquidationPx-+p.entryPx)/+p.entryPx*100);
      add(gap<12?'bad':'neu','The exchange puts the liquidation price for that position at <b>'+fmtUsd(p.liquidationPx)+
        '</b> — about '+gap.toFixed(0)+'% from the entry. That is the exchange’s number, not ours.');
    }
  } else if(f.equity>0){
    add('neu','Completely flat on perps right now — the account holds '+m(f.equity)+' and nothing is open.');
  }
  if(f.runsClosed){
    add(f.runRealized>=0?'good':'bad','Across the '+f.runsClosed+' complete trades we could rebuild from the fill window, this wallet banked <b>'+
      fmtUsd(f.runRealized)+'</b>, winning '+Math.round(f.runWinRate*100)+'% of them. A trade here means position opened and returned to flat, not a single fill.');
  }
  if(f.partialRuns) add('neu','Another '+f.partialRuns+' position'+(f.partialRuns===1?' was':'s were')+
    ' already running when the fill window opens. We can see the exits but not the entries, so those are shown as fragments and excluded from the win rate.');
  if(f.medHold!=null) add('neu','A typical complete trade lasts <b>'+dur(f.medHold)+'</b>.');
  if(f.makerShare!=null){
    add(f.makerShare>0.6?'good':'neu', Math.round(f.makerShare*100)+'% of the fills we read were maker-side'+
      (f.makerShare>0.6?', which is the side that earns the spread rather than paying it':', so most of them crossed the book and paid the taker fee')+'.');
  }
  const fund=f.positions.reduce((s,p)=>s+(+(p.cumFunding?.sinceOpen||0)),0);
  if(Math.abs(fund)>1){
    add(fund<0?'good':'bad', fund<0
      ? 'Funding is running in this wallet’s favour on its open positions — <b>'+fmtUsd(-fund)+'</b> received for sitting on the less crowded side.'
      : 'Holding costs money here: <b>'+fmtUsd(fund)+'</b> paid in funding since these positions opened. That is the hourly fee for being on the crowded side.');
  }
  if(f.staked>0){
    add('good','It has <b>'+fmtNum(f.staked,2)+' HYPE</b> delegated to '+f.validators+' validator'+(f.validators===1?'':'s')+
      (f.validatorNames.length?' ('+f.validatorNames.join(', ')+')':'')+
      (f.stakingSince?', and has been staking since <b>'+dayStr(f.stakingSince)+'</b>':'')+
      (f.rewards>0?'. '+fmtNum(f.rewards,2)+' HYPE of rewards have accrued so far':'')+'.');
  } else add('neu','This wallet has never delegated HYPE. That is an absence of data rather than a zero, and the staking component of the depth read is excluded because of it.');
  if(f.genesis.length){
    const g=f.genesis.find(x=>x.token==='HYPE')||f.genesis[0];
    add('neu','Its ledger records a genesis distribution of <b>'+maskNum(fmtNum(g.amount,2))+' '+g.token+'</b> on <b>'+dayStr(g.time)+'</b>. Past tense, straight from the ledger.');
  }
  if(f.dexActive.length) add('neu','It is active on '+f.dexActive.length+' builder-deployed market'+(f.dexActive.length===1?'':'s')+
    ' — '+f.dexActive.join(', ')+' — as well as the main book.');
  if(f.outcomeHeld>0) add('neu','It holds '+f.outcomeHeld+' outcome-market position'+(f.outcomeHeld===1?'':'s')+', so it takes sides on events as well as on price.');
  if(f.subCount) add('neu','This address has <b>'+f.subCount+' subaccounts</b> holding '+fmtUsd(f.subEquity,0)+
    ' between them. None of that is folded into the headline numbers above, which are this address alone.');
  if(f.fillWindow && Date.now()-f.fillWindow.to > 6048e5)
    add('neu','Nothing new since <b>'+dayStr(f.fillWindow.to)+'</b> — this wallet has gone quiet, at least on the markets we can see.');
  add('neu','None of the above is advice, and none of it predicts anything. It is a description of a record, and every sentence names the field it came from.');
  return L;
}

function countUp(node,to,fmt,ms){
  /* The true value is written synchronously FIRST. requestAnimationFrame is
     throttled or suspended in a background tab, a hidden pane and a bfcache
     restore, and a count-up that starts at zero and never gets a frame leaves
     a $6.1M account reading $0.00. The animation is an enhancement layered on
     top of a correct value, never the thing that produces it. */
  node.textContent=fmt(to);
  if(RM()||!isFinite(to)) return;
  const t0=performance.now(), dur=ms||850;
  let raf=null;
  const step=(t)=>{
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    node.textContent=fmt(to*e);
    if(p<1) raf=requestAnimationFrame(step); else node.textContent=fmt(to);
  };
  raf=requestAnimationFrame(step);
  /* if no frame arrives within a beat, the value already on screen is correct */
  setTimeout(()=>{ if(raf!=null && node.isConnected && node.textContent!==fmt(to)) {} },dur+400);
}
function sparkSvg(vals,color){
  if(!vals||vals.length<2) return '';
  const w=120,h=26,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w, h-((v-mn)/rg)*(h-5)-2.5]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id='s'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="${color}" stop-opacity=".3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>
   <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.2" fill="${color}"/></svg>`;
}

/* ============================================================
   EQUITY CHART — labels sit on the gridlines, a band shades the
   distance travelled from the opening value, and the readout is a
   fixed rail beneath the plot rather than a floating bubble, so it
   works the same under a thumb as under a cursor.
   ============================================================ */
function equityChart(plot, rail, series){
  /* portfolio returns its values as STRINGS. Without coercing, `LAST>=START`
     compares lexicographically — "9" >= "10" is true — so the chart could pick
     the wrong colour and shade the band the wrong way, and Math.abs(START) on a
     string zero divides the percentage by zero. */
  const vals=series.map(p=>+p[1]), times=series.map(p=>+p[0]);
  if(plot.__raf){ cancelAnimationFrame(plot.__raf); plot.__raf=null; }
  plot.innerHTML='';
  const cv=el('canvas'); plot.appendChild(cv);
  const c=cv.getContext('2d');
  let W=0,H=0,pts=[],hi=-1,hx=null,hxT=null,intro=0,pulse=0,mn=0,mx=1,rg=1,ticks=[];
  const PL=12, PR=12, PT=18, PB=22;
  const START=vals[0], LAST=vals[vals.length-1], up=LAST>=START;
  const col=()=>up?tok('--up'):tok('--down');
  function size(){
    const r=plot.getBoundingClientRect(); if(!r.width) return false;
    W=r.width; H=r.height; fitCanvas(cv,W,H,2);
    const lo=Math.min(...vals), h2=Math.max(...vals);
    const pad=((h2-lo)||Math.abs(h2)||1)*0.14;
    mn=lo-pad; mx=h2+pad; rg=(mx-mn)||1;
    const n=H<210?3:4;
    ticks=Array.from({length:n+1},(_,i)=>mn+rg*i/n);
    pts=vals.map((v,i)=>[PL+(i/Math.max(1,vals.length-1))*(W-PL-PR), yOf(v)]);
    return true;
  }
  const yOf=v=>PT+(1-(v-mn)/rg)*(H-PT-PB);
  function draw(){
    if(!W) return;
    const C=col(), ink3=tok('--ink-3'), line=tok('--line');
    c.clearRect(0,0,W,H);
    const n=Math.max(2,Math.round(pts.length*intro)), seg=pts.slice(0,n), base=H-PB;
    /* gridlines with the value written on the line itself */
    c.font='500 10px "IBM Plex Mono", monospace'; c.textBaseline='alphabetic';
    ticks.forEach(t=>{
      const y=yOf(t);
      c.strokeStyle=line; c.lineWidth=1;
      c.beginPath(); c.moveTo(PL,y+.5); c.lineTo(W-PR,y+.5); c.stroke();
      const lbl='$'+fmtCompact(t);
      const tw=c.measureText(lbl).width;
      c.fillStyle=tok('--panel'); c.fillRect(PL,y-11,tw+10,12);
      c.fillStyle=ink3; c.textAlign='left'; c.fillText(lbl,PL+4,y-2);
    });
    /* the band between where it started and where it is */
    const sy=yOf(START);
    c.save(); c.beginPath(); c.rect(PL,PT-4,W-PL-PR,base-PT+4); c.clip();
    const bg=c.createLinearGradient(0,Math.min(sy,seg[seg.length-1][1]),0,Math.max(sy,seg[seg.length-1][1]));
    bg.addColorStop(0,hexA(C,.14)); bg.addColorStop(1,hexA(C,.02));
    c.beginPath(); c.moveTo(seg[0][0],sy);
    seg.forEach(p=>c.lineTo(p[0],p[1]));
    c.lineTo(seg[seg.length-1][0],sy); c.closePath(); c.fillStyle=bg; c.fill();
    c.restore();
    /* opening value, dashed */
    c.strokeStyle=hexA(ink3,.5); c.lineWidth=1; c.setLineDash([3,5]);
    c.beginPath(); c.moveTo(PL,sy); c.lineTo(W-PR,sy); c.stroke(); c.setLineDash([]);
    /* the line */
    c.save(); c.beginPath(); c.rect(PL-2,PT-8,W-PL-PR+4,base-PT+10); c.clip();
    c.beginPath(); seg.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.strokeStyle=C; c.lineWidth=2.2; c.lineJoin='round'; c.lineCap='round';
    c.shadowColor=hexA(C,.5); c.shadowBlur=12; c.stroke(); c.shadowBlur=0;
    c.restore();
    /* endpoint, breathing */
    const e=seg[seg.length-1], pr=1+Math.sin(pulse)*0.16;
    c.fillStyle=hexA(C,.2); c.beginPath(); c.arc(e[0],e[1],8*pr,0,7); c.fill();
    c.fillStyle=C; c.beginPath(); c.arc(e[0],e[1],3.8,0,7); c.fill();
    /* crosshair */
    if(hi>=0 && hx!=null){
      const py=yOf(vals[hi]);
      c.strokeStyle=hexA(C,.55); c.lineWidth=1; c.setLineDash([3,4]);
      c.beginPath(); c.moveTo(hx,PT-4); c.lineTo(hx,base); c.stroke(); c.setLineDash([]);
      c.fillStyle=C; c.beginPath(); c.arc(hx,py,5.5,0,7); c.fill();
      c.fillStyle=tok('--panel'); c.beginPath(); c.arc(hx,py,2.4,0,7); c.fill();
    }
  }
  function paintRail(i){
    const v=vals[i], d=v-START;
    /* a percentage against a starting value of zero is not a large number,
       it is undefined — say so rather than printing Infinity */
    const meaningful = Math.abs(START) > 1e-6;
    const dp = meaningful ? d/Math.abs(START)*100 : null;
    const back=vals.length-1-i;
    rail.innerHTML=`<span class="r1">${fmtUsd(v)}</span>
      <span class="r3 ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${fmtUsd(Math.abs(d))} ${dp==null?'(started from zero)':`(${d>=0?'+':'−'}${Math.abs(dp).toFixed(1)}%)`}</span>
      <span class="r2">${back===0?'latest sample':back+' sample'+(back===1?'':'s')+' back'} · ${new Date(times[i]).toISOString().slice(0,16).replace('T',' ')}</span>`;
  }
  function anim(){
    if(!cv.isConnected){ plot.__raf=null; return; }
    intro=Math.min(1,intro+0.05); pulse+=0.055;
    if(hxT!=null) hx = hx==null? hxT : hx+(hxT-hx)*0.3;
    draw();
    plot.__raf=requestAnimationFrame(anim);
  }
  function nearest(x){ let b=0,bd=1e9; pts.forEach((p,i)=>{const d=Math.abs(p[0]-x); if(d<bd){bd=d;b=i;}}); return b; }
  plot.addEventListener('pointermove',ev=>{
    const r=cv.getBoundingClientRect(); hi=nearest(ev.clientX-r.left); hxT=pts[hi][0];
    if(RM()){ hx=hxT; draw(); }
    paintRail(hi);
  },{passive:true});
  plot.addEventListener('pointerleave',()=>{ hi=-1; hx=hxT=null; paintRail(vals.length-1); },{passive:true});
  if(!size()) return;
  paintRail(vals.length-1);
  intro=1; draw();                 /* correct chart first, no frame required */
  if(!RM()){ intro=0; anim(); }    /* then replay the intro as an enhancement */
  let rz; const onR=()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(cv.isConnected && size()) draw(); },170); };
  addEventListener('resize',onR);
  ACTIVE.push(()=>{ if(plot.__raf) cancelAnimationFrame(plot.__raf); removeEventListener('resize',onR); });
}
function hexA(col,a){
  col=(col||'').trim();
  if(col.startsWith('#')){ const n=parseInt(col.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  if(col.startsWith('rgb')) return col.replace(/rgba?\(([^)]+)\)/,(m,g)=>`rgba(${g.split(',').slice(0,3).join(',')},${a})`);
  return col;
}

/* ---- a run drawn as a price path with its legs marked ---- */
function runStrip(cv, run){
  const legs=run.legs;
  if(legs.length<1) return;
  const host=cv.parentElement;
  function paint(){
    const r=host.getBoundingClientRect(); if(!r.width) return;
    const c=fitCanvas(cv,r.width,r.height,1.5), W=r.width, H=r.height;
    const pad={l:10,r:10,t:16,b:16};
    const t0=legs[0].t, t1=Math.max(legs[legs.length-1].t, t0+1);
    const px=legs.map(l=>l.px);
    const lo=Math.min(...px), hi=Math.max(...px), rg=(hi-lo)||Math.abs(hi)||1;
    const X=t=>pad.l+((t-t0)/(t1-t0))*(W-pad.l-pad.r);
    const Y=p=>pad.t+(1-(p-lo+rg*0.12)/(rg*1.24))*(H-pad.t-pad.b);
    const mint=tok('--mint'), up=tok('--up'), dn=tok('--down'), ink3=tok('--ink-3'), line=tok('--line');
    c.clearRect(0,0,W,H);
    c.strokeStyle=line; c.lineWidth=1;
    [0.5,1].forEach(f=>{ const y=pad.t+(H-pad.t-pad.b)*f; c.beginPath(); c.moveTo(0,y+.5); c.lineTo(W,y+.5); c.stroke(); });
    /* the path the fills trace */
    c.beginPath(); legs.forEach((l,i)=>{ const x=X(l.t), y=Y(l.px); i?c.lineTo(x,y):c.moveTo(x,y); });
    c.strokeStyle=hexA(ink3,.7); c.lineWidth=1.4; c.lineJoin='round'; c.stroke();
    legs.forEach(l=>{
      const x=X(l.t), y=Y(l.px);
      const col = l.kind==='LIQ'?dn : l.kind==='ENTRY'?mint : l.kind==='ADD'?mint : l.pnl>0?up : l.pnl<0?dn : ink3;
      if(l.kind==='ENTRY'||l.kind==='ADD'){
        c.fillStyle=col; c.beginPath();
        c.moveTo(x,y-5); c.lineTo(x+4.5,y+3); c.lineTo(x-4.5,y+3); c.closePath(); c.fill();
      } else if(l.kind==='LIQ'){
        c.strokeStyle=col; c.lineWidth=2; c.beginPath();
        c.moveTo(x-4,y-4); c.lineTo(x+4,y+4); c.moveTo(x+4,y-4); c.lineTo(x-4,y+4); c.stroke();
      } else {
        c.fillStyle=col; c.beginPath(); c.arc(x,y,3.4,0,7); c.fill();
        c.fillStyle=tok('--raised'); c.beginPath(); c.arc(x,y,1.4,0,7); c.fill();
      }
    });
    c.font='500 9px "IBM Plex Mono", monospace'; c.fillStyle=ink3;
    c.textAlign='left'; c.fillText('$'+fmtCompact(hi), 8, 11);
    c.textAlign='left'; c.fillText('$'+fmtCompact(lo), 8, H-5);
    c.textAlign='right'; c.fillText(legs.length+' fills', W-8, 11);
  }
  paint();
  let rz; const onR=()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(cv.isConnected) paint(); },160); };
  addEventListener('resize',onR);
  ACTIVE.push(()=>removeEventListener('resize',onR));
}

/* ---- one run, as a card ---- */
function runCard(r, mark){
  const n=el('div','rn');
  const long=r.dir==='LONG';
  const h=el('button','rn-h'); h.type='button';
  const side=el('span','rn-side '+(long?'l':'s'), long?'LONG':'SHORT');
  const m=el('div','rn-m');
  const title=el('b',null,r.coin);
  if(r.open){ const f2=el('span','rn-flag','open'); f2.style.marginLeft='7px'; title.appendChild(f2); }
  if(r.partial){ const f2=el('span','rn-flag','entry not in window'); f2.style.marginLeft='7px'; title.appendChild(f2); }
  m.append(title, el('s',null, dayStr(r.t0)+' → '+(r.open?'now':dayStr(r.t1))+' · '+dur(r.t1-r.t0)+' · '+r.legs.length+' fills'));
  const p=el('div','rn-p');
  const val=r.partial ? null : (r.open ? r.pnl.total : r.pnl.realized);
  const b=el('b', val==null?'na':(val>0?'up':val<0?'down':''), val==null? 'fragment' : fmtUsd(val));
  p.append(b, el('s',null, r.partial? 'exits only' : r.open? (r.pnl.canMark?'realised + open':'realised only') : 'realised'));
  h.append(side,m,p);
  const body=el('div','rn-body');
  const strip=el('div','rn-strip'); const cv=el('canvas'); strip.appendChild(cv);
  const facts=el('div','rn-facts');
  const F=(k,v)=>{ const d2=el('div','rn-fact'); d2.append(el('div','k',k), el('div','v',v)); return d2; };
  facts.append(
    F('Peak size', fmtNum(r.peakSize,6)+' '+r.coin),
    F('Avg cost', r.pnl.basis>0? fmtUsd(r.pnl.basis) : '—'),
    F('Turnover', fmtUsd(r.notional,0)),
    F('Fees', fmtUsd(r.pnl.fees)),
    F('Realised', fmtUsd(r.pnl.realized)),
    F(r.open? 'Open (marked)' : 'Legs', r.open? (r.pnl.canMark? fmtUsd(r.pnl.unreal) : 'not markable') : String(r.legs.length))
  );
  const legs=el('div','rn-legs');
  r.legs.slice().reverse().slice(0,24).forEach(l=>{
    const row=el('div','rn-leg');
    const kd=el('span','kd '+(l.kind==='ENTRY'?'entry':l.kind==='ADD'?'add':l.kind==='LIQ'?'liq':'exit'), l.kind);
    row.append(kd,
      el('span','t', new Date(l.t).toISOString().slice(5,16).replace('T',' ')),
      el('span',null, fmtNum(l.sz,5)+' @ '+fmtUsd(l.px)+(l.maker?' · maker':'')),
      el('span','pn '+(l.pnl>0?'up':l.pnl<0?'down':''), l.pnl? fmtUsd(l.pnl):'—'));
    legs.appendChild(row);
  });
  if(r.legs.length>24) legs.appendChild(el('div','wl-miss','showing the 24 most recent of '+r.legs.length+' fills in this trade'));
  body.append(strip,facts,legs);
  if(r.partial) body.appendChild(el('div','wl-miss','This trade was already running when the fill window opens, so its entry price is unknown and only the exits are visible. Its PnL is a fragment and is deliberately not presented as a trade result.'));
  n.append(h,body);
  h.addEventListener('click',()=>{
    const open=n.dataset.open==='1';
    n.dataset.open=open?'0':'1';
    if(!open) runStrip(cv,r);
  });
  return n;
}

/* ============================================================
   10. SHARE CARD
   Composed from a declared block: every gap is named up front and
   the whole stack is positioned as one unit, so nothing drifts or
   collides when a number gets longer or the type gets bigger.
   The footer band is reserved BEFORE anything else is laid out.
   ============================================================ */
function paintShare(cv, ratio, addr, f, a, sc){
  const wide = ratio==='16:9';
  const W = wide?1200:1080, H = wide?630:1920;
  const c = fitCanvas(cv, W, H, 1);            // DPR capped at 1 for export — phones die otherwise
  const t = CAST[CAST_IX[a.id]] || CAST[0];

  const SP = {                                  // declared spacing — no hand-tuned offsets
    pad:      wide?56:72,
    footBand: wide?84:120,
    sealSize: wide?230:420,
    gapSeal:  wide?44:52,
    gapName:  14,
    gapTag:   wide?26:34,
    gapScore: wide?30:40,
    tileH:    wide?92:132,
    tileGap:  12
  };
  c.fillStyle='#041512'; c.fillRect(0,0,W,H);
  // ground: the mark's form, low contrast, clipped to the card
  c.save(); c.beginPath(); c.rect(0,0,W,H); c.clip();
  c.globalAlpha=0.06;
  const bs=H*1.25; c.save(); c.translate(W-bs*0.42, H*0.5-bs*0.5); drawBlob(c,bs,t.hue,1); c.restore();
  c.globalAlpha=1; c.restore();

  const contentTop = SP.pad;
  const contentBottom = H - SP.footBand - SP.pad;   // reserve the footer band first
  const innerW = W - SP.pad*2;

  // --- footer band ---
  c.fillStyle='rgba(150,252,228,.05)'; c.fillRect(0,H-SP.footBand,W,SP.footBand);
  c.fillStyle='#12403A'; c.fillRect(0,H-SP.footBand,W,1);
  c.font='600 '+(wide?19:26)+'px Chivo, sans-serif'; c.fillStyle='#96FCE4'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText('hyperflow', SP.pad, H-SP.footBand/2);
  c.font='400 '+(wide?15:21)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D'; c.textAlign='right';
  c.fillText('a reading, not a rank · read-only', W-SP.pad, H-SP.footBand/2);

  // --- the stack, measured then placed as one unit ---
  const sealX = wide? SP.pad : (W-SP.sealSize)/2;
  const textX = wide? SP.pad+SP.sealSize+SP.gapSeal : SP.pad;
  const textW = wide? innerW-SP.sealSize-SP.gapSeal : innerW;
  const alignC = !wide;

  const nameSize  = wide?58:84;
  const tagSize   = wide?21:30;
  const scoreSize = wide?96:150;
  const stackH = nameSize*1.0 + SP.gapName + tagSize*1.3 + SP.gapTag + scoreSize*0.86 + SP.gapScore + SP.tileH;
  const availH = contentBottom - contentTop;
  let y = contentTop + Math.max(0,(availH - (wide? stackH : stackH+SP.sealSize+SP.gapSeal))/2);

  if(!wide){
    drawSeal(_sealBuf(SP.sealSize, a.id, addr), SP.sealSize, a.id, addr);
    c.drawImage(_SEALCV, sealX, y, SP.sealSize, SP.sealSize);
    y += SP.sealSize + SP.gapSeal;
  } else {
    drawSeal(_sealBuf(SP.sealSize, a.id, addr), SP.sealSize, a.id, addr);
    c.drawImage(_SEALCV, sealX, contentTop + (availH-SP.sealSize)/2, SP.sealSize, SP.sealSize);
  }

  c.textAlign = alignC?'center':'left'; c.textBaseline='top';
  const tx = alignC? W/2 : textX;
  c.font='800 '+nameSize+'px Chivo, sans-serif'; c.fillStyle='#E2F3ED';
  c.fillText(t.name, tx, y); y += nameSize + SP.gapName;
  c.font='400 '+tagSize+'px "Public Sans", sans-serif'; c.fillStyle='#9CB9B2';
  c.fillText(t.tag, tx, y); y += tagSize*1.3 + SP.gapTag;

  c.font='900 '+scoreSize+'px Chivo, sans-serif'; c.fillStyle=t.hue;
  const scTxt = sc.total!=null? String(sc.total) : '—';
  c.fillText(scTxt, tx, y);
  const scW = c.measureText(scTxt).width;
  c.font='500 '+(wide?18:26)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D';
  c.textAlign='left';
  c.fillText('depth', (alignC? W/2 - scW/2 : tx) + scW + 14, y + scoreSize*0.5);
  y += scoreSize*0.86 + SP.gapScore;

  // --- stat tiles, laid into what is left, never touching the band ---
  const stats=[
    ['Open now', f.oi>0? '$'+fmtCompact(f.oi):'—'],
    ['Perp volume', f.perpVlm!=null? '$'+fmtCompact(f.perpVlm):'—'],
    ['HYPE staked', f.staked>0? fmtCompact(f.staked):'none'],
    ['Since', f.firstLedger? dayStr(f.firstLedger).slice(0,7):'—']
  ].map(([k,v])=>[k, MASK.amounts? '•••••' : v]);
  const tileW=(textW-SP.tileGap*3)/4;
  const tileY=Math.min(y, contentBottom-SP.tileH);
  stats.forEach((s,i)=>{
    const x=textX + i*(tileW+SP.tileGap);
    c.fillStyle='rgba(150,252,228,.06)'; rr(c,x,tileY,tileW,SP.tileH,12); c.fill();
    c.strokeStyle='#12403A'; c.lineWidth=1; rr(c,x+.5,tileY+.5,tileW-1,SP.tileH-1,12); c.stroke();
    c.textAlign='left'; c.textBaseline='top';
    c.font='500 '+(wide?12:17)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D';
    c.fillText(s[0].toUpperCase(), x+14, tileY+ (wide?16:22));
    c.font='600 '+(wide?26:38)+'px "IBM Plex Mono", monospace'; c.fillStyle='#E2F3ED';
    c.fillText(s[1], x+14, tileY+ (wide?44:64));
  });

  // --- address line, inside the band's gutter ---
  c.font='400 '+(wide?15:21)+'px "IBM Plex Mono", monospace';
  c.fillStyle='#65847D'; c.textAlign= alignC?'center':'left'; c.textBaseline='bottom';
  const addrTxt = MASK.addr ? addr.slice(0,4)+'…'+'•'.repeat(8) : addr;
  c.fillText(addrTxt, alignC? W/2 : textX, H - SP.footBand - 18);
  return cv;
}
let _SEALCV=null;
function _sealBuf(size){ if(!_SEALCV) _SEALCV=document.createElement('canvas'); return _SEALCV; }

function shareCard(addr,f,a,sc){
  const wrap=el('div','sc-wrap');
  const stage=el('div','sc-stage');
  const tilt=el('div','sc-tilt');
  const card=el('div','sc-card'); card.style.maxWidth='620px'; card.style.width='100%';
  const cv=el('canvas'); const sheen=el('div','sc-sheen');
  card.append(cv,sheen); tilt.appendChild(card); stage.appendChild(tilt);

  let ratio='16:9';
  const repaint=()=>{ document.fonts.ready.then(()=>paintShare(cv,ratio,addr,f,a,sc)); };
  repaint();

  // toggles
  const togs=el('div','sc-toggles');
  function mkTog(label,get,set){
    const t=el('button','sc-tog'); t.setAttribute('aria-pressed',String(get()));
    t.append(el('span','box'), document.createTextNode(label));
    t.addEventListener('click',()=>{ set(!get()); t.setAttribute('aria-pressed',String(get())); repaint(); });
    return t;
  }
  const rt=el('button','sc-tog'); rt.setAttribute('aria-pressed','false');
  rt.append(el('span','box'), document.createTextNode('9:16 for stories'));
  rt.addEventListener('click',()=>{ ratio = ratio==='16:9'?'9:16':'16:9';
    rt.setAttribute('aria-pressed', String(ratio==='9:16'));
    card.style.maxWidth = ratio==='16:9'?'620px':'340px'; repaint(); });
  togs.append(
    mkTog('Blur the address', ()=>MASK.addr, v=>MASK.addr=v),
    mkTog('Hide the numbers', ()=>MASK.amounts, v=>MASK.amounts=v),
    rt
  );

  // controls
  const ctrls=el('div','sc-ctrls');
  const dl=el('button','sc-btn pri');
  dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Download';
  dl.addEventListener('click',()=>{ const a2=document.createElement('a');
    a2.download='hyperflow-'+addr.slice(0,8)+'-'+ratio.replace(':','x')+'.png';
    a2.href=cv.toDataURL('image/png'); a2.click(); });
  const cpb=el('button','sc-btn');
  cpb.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy image';
  cpb.addEventListener('click',async()=>{
    try{ const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      cpb.lastChild.textContent='Copied'; setTimeout(()=>cpb.lastChild.textContent='Copy image',1600);
    }catch(e){ cpb.lastChild.textContent='Copy unsupported here'; }
  });
  const xb=el('button','sc-btn');
  xb.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>Share on X';
  xb.addEventListener('click',()=>{
    const t=CAST[CAST_IX[a.id]];
    const txt=`This wallet reads as ${t.name} on Hyperliquid — ${t.tag.toLowerCase().replace(/\.$/,'')}. Depth ${sc.total ?? '—'}, and the whole breakdown is shown.`;
    open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt)+'&url='+encodeURIComponent(location.href),'_blank','noopener');
  });
  ctrls.append(dl,cpb,xb);

  const scNote=el('p','wl-miss','The image is drawn in your browser. Nothing is uploaded, and the toggles above change the exported file, not just the preview.');

  wrap.append(stage,togs,ctrls,scNote);

  // 3D tilt — listener on the CARD, transform on the TILT wrapper only,
  // so the controls underneath never inherit it.
  if(!RM()){
    let raf=null, tx=0, ty=0, cx=0, cy=0;
    const apply=()=>{ cx+=(tx-cx)*.14; cy+=(ty-cy)*.14;
      tilt.style.transform=`rotateY(${cx}deg) rotateX(${cy}deg)`;
      raf = (Math.abs(tx-cx)>.05||Math.abs(ty-cy)>.05) ? requestAnimationFrame(apply) : null; };
    const kick=()=>{ if(!raf) raf=requestAnimationFrame(apply); };
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      tx=(px-.5)*13; ty=-(py-.5)*11;
      sheen.style.setProperty('--mx',(px*100)+'%'); sheen.style.setProperty('--my',(py*100)+'%');
      kick();
    });
    card.addEventListener('pointerleave',()=>{ tx=0; ty=0; kick(); });
    ACTIVE.push(()=>{ if(raf) cancelAnimationFrame(raf); });
  }
  return wrap;
}

/* ============================================================
   11. ROUTER
   ============================================================ */
function isAddr(s){ return /^0x[0-9a-fA-F]{40}$/.test(s.trim()); }
function go(v){
  const s=(v||'').trim();
  if(!isAddr(s)){ $('#shInput').setAttribute('data-tip','That is not a 40-character Hyperliquid address.'); return; }
  location.hash='#/wallet/'+s.toLowerCase();
}
$('#shForm').addEventListener('submit',e=>{ e.preventDefault(); go($('#shInput').value); });
addEventListener('scroll',()=>{ $('#shTop').dataset.stuck = scrollY>4?'1':'0'; },{passive:true});

function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  const m=h.match(/^\/wallet\/(0x[0-9a-fA-F]{40})/);
  scrollTo(0,0);
  if(m){ $('#shInput').value=m[1]; track('wallet'); viewWallet(m[1].toLowerCase()); }
  else if(h.startsWith('/cast')){ track('cast'); viewCast(); }
  else { $('#shInput').value=''; track('home'); viewHome(); }
}
/* analytics: hash routing means one page forever, so send a named
   event per route — page name only, never the URL. */
function track(name){ try{ window.va && window.va('event',{name:'route:'+name}); }catch(e){} }
addEventListener('hashchange',route);
paintMark($('#markCv'),28);
document.addEventListener('hf:theme',()=>{ paintMark($('#markCv'),28); });
document.fonts.ready.then(route);
</script>
