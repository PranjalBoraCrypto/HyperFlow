/* ═══════════════════════════════════════════════════════════════
   10 · indicators — plain arithmetic, every one of them checkable
   ═══════════════════════════════════════════════════════════════ */
function SMA(a,n){ if(a.length<n) return null; let s=0; for(let i=a.length-n;i<a.length;i++) s+=a[i]; return s/n; }
function RSI(c,n=14){
  if(c.length<n+1) return null;
  let g=0,l=0;
  for(let i=c.length-n;i<c.length;i++){ const d=c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/n, al=l/n;
  if(al===0) return 100;
  const rs=ag/al; return 100-100/(1+rs);
}
function ATR(bars,n=14){
  if(bars.length<n+1) return null;
  const tr=[];
  for(let i=1;i<bars.length;i++){
    const h=+bars[i].h,l=+bars[i].l,pc=+bars[i-1].c;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  const out=[]; let sum=0;
  for(let i=0;i<tr.length;i++){ sum+=tr[i]; if(i>=n) sum-=tr[i-n]; if(i>=n-1) out.push(sum/n); }
  return out;
}
const TAKER=0.00045;   /* published cross fee, before any tier or referral discount */
/* Funding is annualised from ONE hourly print, so on a thin book it produces
   numbers like −1211%/yr on $1.0M of open interest — arithmetically true and
   completely untradeable. Any headline that names "the widest funding" reads
   from markets above this floor; measured live, 46 of 233 markets clear it. */
const FUND_FLOOR=1e7;
/* The same judgement for the ranked board: $10M of 24-hour volume. Measured
   live, 25 of 233 markets clear it — enough to fill a top ten with room to
   skip the ones whose measures disagree. BOARD_MIN is the floor's own floor:
   if a quiet day leaves fewer than this many liquid markets, the board falls
   back to the most-traded BOARD_MIN rather than showing a short list. */
const VOL_FLOOR=1e7, BOARD_MIN=18;
/* Every coin on the site points at its own market on the exchange. Spot names
   arrive as @N or +N and have no perp page, so those fall back to the app. */
const TRADE_URL=name=>/^[@+]/.test(name||'')
  ? 'https://app.hyperliquid.xyz/trade'
  : 'https://app.hyperliquid.xyz/trade/'+encodeURIComponent(name);

function analyse(m, bars){
  /* The final candle is the hour currently in progress. Its price is the newest
     information and should be used — but its VOLUME is only however many minutes
     of the hour have elapsed, so comparing it against completed bars understates
     participation by the fraction of the hour still to come. Measured on BTC 4.4
     minutes past the hour: 0.27x against the incomplete bar, 1.02x against the
     last completed one. Every market was being read as unconfirmed for most of
     every hour. Price comes off the live bar; volume comes off completed bars. */
  const now=Date.now();
  const partial = bars.length && +bars[bars.length-1].T > now;
  const done = partial ? bars.slice(0,-1) : bars;
  const c=bars.map(b=>+b.c);
  const vd=done.map(b=>+b.v);
  const last=c[c.length-1];
  const s20=SMA(c,20), s50=SMA(c,50), s100=SMA(c,100);
  const rsi=RSI(c,14);
  const atrS=ATR(done,14);
  const atr=atrS&&atrS.length?atrS[atrS.length-1]:null;
  const atrAvg=atrS&&atrS.length>=50? atrS.slice(-50).reduce((a,b)=>a+b,0)/50 : null;
  const atrExp=(atr&&atrAvg)? atr/atrAvg : null;
  const vAvg=vd.length>21? SMA(vd.slice(0,-1),20) : null;
  const rvol=(vAvg&&vAvg>0&&vd.length)? vd[vd.length-1]/vAvg : null;
  const minsIn = partial ? (now-+bars[bars.length-1].t)/60000 : 60;
  return {last,s20,s50,s100,rsi,atr,atrExp,rvol,partial,minsIn,
          bars:done.length, spark:c.slice(-72)};
}

/* momentum: seven independent measures, each one a single vote */
function momentum(m,a){
  const V=[];
  const add=(k,label,val,vote,why)=>V.push({k,label,val,vote,why});
  const p=a.last;
  add('matrend','Price vs 20-bar average', a.s20? pct((p/a.s20-1)*100):'—',
      a.s20? (p>a.s20?'for':'against'):'flat', a.s20?('20-bar SMA '+px(a.s20)):'not enough bars');
  add('matrend','Price vs 50-bar average', a.s50? pct((p/a.s50-1)*100):'—',
      a.s50? (p>a.s50?'for':'against'):'flat', a.s50?('50-bar SMA '+px(a.s50)):'not enough bars');
  add('matrend','Price vs 100-bar average', a.s100? pct((p/a.s100-1)*100):'—',
      a.s100? (p>a.s100?'for':'against'):'flat', a.s100?('100-bar SMA '+px(a.s100)):'not enough bars');
  add('matrend','Average stack aligned', (a.s20&&a.s50)? (a.s20>a.s50?'20 over 50':'50 over 20'):'—',
      (a.s20&&a.s50)? (a.s20>a.s50?'for':'against'):'flat','the short average above the long one is the classic trend test');
  add('rsi','RSI (14)', a.rsi!=null? a.rsi.toFixed(1):'—',
      a.rsi==null?'flat': a.rsi>55?'for': a.rsi<45?'against':'flat',
      a.rsi==null?'not enough bars': a.rsi>70?'above 70 — conventionally overbought': a.rsi<30?'below 30 — conventionally oversold':'between 30 and 70');
  add('rvol','24-hour change', pct(m.chg),
      m.chg>0.4?'for': m.chg<-0.4?'against':'flat','against the previous day close');
  /* an unconfirmed move counts AGAINST the read rather than sitting neutral —
     a 10% move on 2% of normal volume is not the same event as a 10% move on
     double it, and ranking them alike is how a stale market tops the board */
  add('rvol','Volume, last completed hour',
      a.rvol!=null? a.rvol.toFixed(2)+'× average':'—',
      a.rvol==null?'flat'
        : a.rvol>1.25 ? (m.chg>=0?'for':'against')
        : a.rvol<0.6  ? (m.chg>=0?'against':'for')
        : 'flat',
      a.rvol==null?'not enough completed bars'
        : a.rvol>1.25?'the move is being paid for'
        : a.rvol<0.6 ?'barely any participation — this move is not being paid for'
        :'ordinary participation');
  const f=V.filter(x=>x.vote==='for').length, ag=V.filter(x=>x.vote==='against').length;
  const dir = f>ag+1?'long' : ag>f+1?'short' : 'none';
  /* strength: agreement, then confirmed by how far it has actually travelled */
  const agree=Math.abs(f-ag)/V.length;
  const travel=Math.min(1,Math.abs(m.chg)/6);
  const conf=Math.min(1,(a.rvol||0)/1.6);
  const exp=Math.min(1,(a.atrExp||1)/1.8);
  let score=agree*46+travel*20+conf*22+exp*12;
  /* an unconfirmed move is demoted outright, not merely un-rewarded */
  const unconfirmed = a.rvol!=null && a.rvol<0.6;
  if(unconfirmed) score*=0.62;
  const thin = m.vol<5e6 || (m.spreadPct||0)>0.12;
  if(thin) score*=0.88;
  const flags=[];
  if(unconfirmed) flags.push({t:'unconfirmed',w:'the move is happening on '+(a.rvol*100).toFixed(0)+'% of normal hourly volume'});
  if(thin) flags.push({t:'thin',w:'$'+fmtC(m.vol)+' traded in 24h'+((m.spreadPct||0)>0.12?' and a '+m.spreadPct.toFixed(2)+'% impact spread':'')+' — harder to get in and out at size'});
  return {votes:V,dir,score:Math.round(clamp(score,0,100)),for:f,against:ag,flags,
          leanText: dir==='long'?'Trend measures read up':dir==='short'?'Trend measures read down':'Measures disagree — no trend'};
}

/* funding stress: who is paying, how hard, and does the size behind it matter */
function fundingStress(m,a){
  const V=[];
  const apr=m.fundingApr;
  const paidSide = apr>0 ? 'short' : apr<0 ? 'long' : 'none';
  V.push({k:'fundapr',label:'Funding, annualised',val:pct(apr,1),
    vote: Math.abs(apr)>20?'for':'flat',
    why: apr>0?'longs are paying shorts':apr<0?'shorts are paying longs':'flat'});
  V.push({k:'fundapr',label:'Hourly rate',val:(m.fundingHr>=0?'+':'−')+Math.abs(m.fundingHr).toFixed(4)+'%',
    vote:'flat',why:'charged on notional every hour, on the hour'});
  V.push({k:'oi',label:'Open interest behind it',val:'$'+fmtC(m.oiNtl),
    vote: m.oiNtl>5e6?'for':'flat', why: m.oiNtl>5e6?'enough size for the rate to mean something':'thin — the rate moves on very little'});
  V.push({k:'basis',label:'Mark vs oracle',val:pct(m.oracleGap,3),
    vote: Math.abs(m.oracleGap)>0.05?'for':'flat',
    why: m.oracleGap>0?'perp trading above spot':'perp trading below spot'});
  V.push({k:'vsoi',label:'Turnover vs open interest',val:m.volOverOi!=null?m.volOverOi.toFixed(2)+'×':'—',
    vote:'flat', why: (m.volOverOi||0)>1?'fast hands — positions turning over daily':'positions being held rather than churned'});
  const mag=Math.min(1,Math.log10(1+Math.abs(apr))/2.4);
  const size=Math.min(1,Math.log10(1+m.oiNtl/1e5)/3.2);
  const score=Math.round(clamp(mag*62+size*38,0,100));
  const flags=[];
  if(m.oiNtl<2e6) flags.push({t:'thin',w:'only $'+fmtC(m.oiNtl)+' of open interest behind this rate'});
  if(Math.abs(apr)>200) flags.push({t:'extreme',w:'a rate this far out usually means a dislocation rather than an opportunity'});
  return {votes:V,dir: paidSide==='short'?'short':paidSide==='long'?'long':'none',score,flags,
    for:V.filter(x=>x.vote==='for').length, against:0,
    leanText: apr>0?'Shorts are being paid to hold':apr<0?'Longs are being paid to hold':'Funding is flat'};
}

  momentum:{id:'momentum',label:'Momentum',calc:momentum,
    blurb:'How much of the trend picture agrees, confirmed by travel and volume.',

/* ═══════════════════════════════════════════════════════════════
   11 · the scan loader — the lattice IS the universe, and each
   cell lights when that market's data actually lands
   ═══════════════════════════════════════════════════════════════ */
/* The scan-loader curtain is gone. Nothing waits for everything: the page
   paints from the first call and the ranked rows fill in under a skeleton. */

function tensionRope(host, biasFn){
  const cv=el('canvas'); host.appendChild(cv);
  let W=0,H=0,c=null,raf=null,run=false;
  const N=22, pts=[]; let rest=0, anchorY=0, maxY=0;
  function size(){
    const r=host.getBoundingClientRect(); if(!r.width) return false;
    W=r.width;H=r.height;c=fit(cv,W,H,1.6);
    const span=W-48; anchorY=H*0.34;
    /* Slack is measured, not eyeballed. A hanging line with slack s over span L
       sags about sqrt(3*L*s/8): at 1.5% over a 1058px span that is 79px, which
       in a 132px box is most of the height — which is exactly what it did.
       0.2% puts the sag near 25px, a taut cable with a gentle dip, and it holds
       that shape at any width because both terms scale with the span. */
    rest=span/(N-1)*1.002;
    maxY=anchorY+H*0.40;
    for(let i=0;i<N;i++){
      const x=24+span*(i/(N-1));
      if(!pts[i]) pts[i]={x,y:anchorY+10,px:x,py:anchorY+10};
    }
    return true;
  }
  size();
  let grab=-1,mx=0,my=0,mvx=0,mvy=0;
  const near=(x,y)=>{ let b=-1,bd=1e9;
    pts.forEach((p,i)=>{ if(i===0||i===N-1) return; const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;b=i;} });
    return bd<44?b:-1; };
  host.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top;
    grab=near(mx,my); if(grab>=0){ host.setPointerCapture(e.pointerId); e.preventDefault(); } });
  host.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect();
    const nx=e.clientX-r.left, ny=e.clientY-r.top; mvx=nx-mx; mvy=ny-my; mx=nx; my=ny; },{passive:true});
  const release=()=>{ if(grab>=0){ const p=pts[grab]; p.px=p.x-clamp(mvx,-14,14); p.py=p.y-clamp(mvy,-14,14); } grab=-1; };
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>host.addEventListener(ev,release));

  function frame(){
    if(!run) return;
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ run=false; cancelAnimationFrame(raf); return; }
    if(!W&&!size()) return;
    try{ step(); }catch(err){ host.dataset.rope='error: '+(err&&err.message); run=false; cancelAnimationFrame(raf); }
  }
  function step(){
    const bias=clamp(biasFn(),-1,1);
    const loadI=Math.round((N-1)*(0.5+bias*0.34));
    const G=0.12;                                   /* gentle — the rope is taut, not a swing */
    for(let i=1;i<N-1;i++){
      const p=pts[i];
      const vx=clamp((p.x-p.px)*0.97,-9,9), vy=clamp((p.y-p.py)*0.97,-9,9);
      p.px=p.x; p.py=p.y; p.x+=vx; p.y+=vy+G;
      if(i===loadI) p.y+=0.18+Math.abs(bias)*0.28;  /* the load, where funding puts it */
    }
    if(grab>0&&grab<N-1){ pts[grab].x=clamp(mx,10,W-10); pts[grab].y=clamp(my,10,H-10); }
    /* 16 relaxation passes, and a pinned neighbour hands its whole share to the
       free one — half-corrections against a fixed anchor never converge */
    for(let k=0;k<16;k++){
      for(let i=0;i<N-1;i++){
        const a=pts[i], b2=pts[i+1];
        const aFixed = i===0 || grab===i, bFixed = i+1===N-1 || grab===i+1;
        if(aFixed&&bFixed) continue;
        const dx=b2.x-a.x, dy=b2.y-a.y, d=Math.hypot(dx,dy)||1;
        const diff=(d-rest)/d;
        const wA = aFixed?0 : (bFixed?1:0.5), wB = bFixed?0 : (aFixed?1:0.5);
        a.x+=dx*diff*wA; a.y+=dy*diff*wA;
        b2.x-=dx*diff*wB; b2.y-=dy*diff*wB;
      }
      pts[0].x=24; pts[0].y=anchorY; pts[N-1].x=W-24; pts[N-1].y=anchorY;
    }
    /* nothing leaves the box, and nothing sags past its allowance */
    for(let i=1;i<N-1;i++){ pts[i].x=clamp(pts[i].x,8,W-8); pts[i].y=clamp(pts[i].y,10,Math.min(maxY,H-10)); }

    const up=tok('--up'), dn=tok('--down'), line=tok('--line-2'), ink3=tok('--ink-3');
    c.clearRect(0,0,W,H);
    c.strokeStyle=line; c.lineWidth=1; c.setLineDash([3,5]);
    c.beginPath(); c.moveTo(W/2,12); c.lineTo(W/2,H-12); c.stroke(); c.setLineDash([]);
    [[24,up],[W-24,dn]].forEach(([x,col])=>{
      c.strokeStyle=col; c.globalAlpha=.4; c.lineWidth=2.5;
      c.beginPath(); c.moveTo(x,anchorY); c.lineTo(x,H-12); c.stroke(); c.globalAlpha=1;
      c.fillStyle=col; c.beginPath(); c.arc(x,anchorY,4.5,0,7); c.fill();
    });
    const g=c.createLinearGradient(24,0,W-24,0);
    g.addColorStop(0,up); g.addColorStop(.5,ink3); g.addColorStop(1,dn);
    c.strokeStyle=g; c.lineWidth=2.4; c.lineJoin='round'; c.lineCap='round';
    c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<N-1;i++){ const p=pts[i],q=pts[i+1];
      c.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2); }
    c.lineTo(pts[N-1].x,pts[N-1].y); c.stroke();
    const L=pts[loadI], col=bias>0?dn:bias<0?up:ink3;
    c.globalAlpha=.18; c.fillStyle=col; c.beginPath(); c.arc(L.x,L.y,15,0,7); c.fill(); c.globalAlpha=1;
    c.fillStyle=col; c.beginPath(); c.arc(L.x,L.y,7,0,7); c.fill();
    c.fillStyle=tok('--g2'); c.beginPath(); c.arc(L.x,L.y,2.8,0,7); c.fill();
  }
  /* Start immediately and let the observer PAUSE it, rather than making the
     observer the only thing that can ever start it. A loop that only begins on
     an intersection callback never begins at all when the element is already
     on screen and the callback's first delivery is missed — which is exactly
     how this rendered a blank canvas. host.dataset.rope reports the state so
     it can be inspected from outside instead of guessed at. */
  function start(){ if(run) return; if(!size()) return; run=true; host.dataset.rope='running';
    raf=requestAnimationFrame(frame); }
  function stop(){ if(!run) return; run=false; host.dataset.rope='paused'; cancelAnimationFrame(raf); }
  host.dataset.rope='init';
  if(RM()){ if(size()){ run=true; frame(); run=false; host.dataset.rope='static'; } }
  else start();
  const io=new IntersectionObserver(es=>{ es[0].isIntersecting? start() : stop(); },{threshold:0});
  io.observe(host);
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected){pts.length=0;size();}},150);};
  addEventListener('resize',onR);
  ACTIVE.push(()=>{ stop(); io.disconnect(); removeEventListener('resize',onR); });
}

/* sparkline */
function spark(vals,col,w,h){
  if(!vals||vals.length<2) return '';
  w=w||120;h=h||34;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const p=vals.map((v,i)=>[(i/(vals.length-1))*w,h-((v-mn)/rg)*(h-6)-3]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const id='k'+Math.random().toString(36).slice(2,8);
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".34"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L'+w+' '+h+' L0 '+h+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+p[p.length-1][0].toFixed(1)+'" cy="'+p[p.length-1][1].toFixed(1)+'" r="2.3" fill="'+col+'"/></svg>';
}

/* ═══════════════════════════════════════════════════════════════
   13 · RADAR
   One 20-weight call ranks all 233 markets. Candles for all of them
   would cost 5,592 weight — 4.7 minutes of the per-IP budget — so
   only the shortlist gets charts. That constraint is on the page,
   not hidden behind it.
   ═══════════════════════════════════════════════════════════════ */
let LENS_ID='momentum', DEPTH=10;
try{ LENS_ID=localStorage.getItem('hf.lens')||'momentum'; }catch(e){}
let RADAR={t:0,U:null,short:null,det:null};
let PASSED=[], READN=0;

function universe(meta,ctxs){
  return meta.universe.map((u,i)=>{
    const c=ctxs[i]||{}, mark=+c.markPx, prev=+c.prevDayPx, oi=+c.openInterest;
    const imp=(c.impactPxs||[]).map(Number);
    return {name:u.name, maxLev:u.maxLeverage,
      mark, oracle:+c.oraclePx,
      chg: prev? (mark-prev)/prev*100 : 0,
      fundingHr:+c.funding*100, fundingApr:+c.funding*24*365*100,
      oiNtl: oi*mark, vol:+c.dayNtlVlm,
      volOverOi: oi*mark? +c.dayNtlVlm/(oi*mark) : null,
      oracleGap: c.oraclePx? (mark-+c.oraclePx)/+c.oraclePx*100 : 0,
      spreadPct: (imp.length===2&&imp[0])? (imp[1]-imp[0])/imp[0]*100 : null
    };
  }).filter(m=>isFinite(m.mark)&&m.mark>0);
}

/* run n at a time and keep going — twelve 250ms calls cost 3.8s queued and
   about 1.1s overlapped, for exactly the same rate-limit weight */
async function inParallel(items, n, fn){
  let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{
    while(i<items.length){ const k=i++; await fn(items[k],k); }
  }));
}

/* a pager that re-flicks its list, so a page change reads as movement */
function pager(host, total, per, page, onPage){
  host.innerHTML='';
  const pages=Math.ceil(total/per)||1;
  if(pages<2){ host.hidden=true; return; }
  host.hidden=false;
  const mk=(d,lbl,path)=>{ const b=el('button','pgb'); b.setAttribute('aria-label',lbl);
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg>';
    b.disabled = d<0 ? page===0 : page>=pages-1;
    b.addEventListener('click',()=>onPage(clamp(page+d,0,pages-1))); return b; };
  host.appendChild(mk(-1,'Previous page','M15 18l-6-6 6-6'));
  if(pages<=14){
    const d=el('div','pgd');
    for(let i=0;i<pages;i++){ const b=el('button'); if(i===page) b.className='on';
      b.setAttribute('aria-label','Page '+(i+1));
      b.addEventListener('click',()=>onPage(i)); d.appendChild(b); }
    host.appendChild(d);
  } else host.appendChild(el('span','pgn','page '+(page+1)+' of '+pages));
  host.appendChild(mk(1,'Next page','M9 6l6 6-6 6'));
  const from=page*per+1, to=Math.min(total,(page+1)*per);
  host.appendChild(el('span','pgn',from+'–'+to+' of '+total));
}
function flick(box){
  if(RM()) return;
  [...box.children].forEach((n,i)=>{ n.style.animation='none'; void n.offsetWidth;
    n.style.animation='pgFlick .3s var(--ease-out) '+Math.min(i,9)*20+'ms both'; });
}
function secHead(title, sub, right){
  const h=el('div','sec-h');
  requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.add('drawn')));
  const l=el('div','l'); l.append(el('h2',null,title)); if(sub) l.append(el('p',null,sub));
  h.append(l);
  if(right) h.append(right);
  return h;
}

ROUTES.radar=async function(args){
  const wrap=el('div'); PAGE.appendChild(wrap);

  const head=el('div','rd-head');
  const L=el('div');
  const h1=el('h1','rd-h1'); h1.innerHTML='What is worth <em>watching</em> right now.';
  L.append(h1, el('p','rd-sub','Every Hyperliquid perp, ranked live in your browser. Open any row to see the measures behind it.'));
  head.appendChild(L); wrap.appendChild(head);

  const pulse=el('div','rd-pulse');
  for(let i=0;i<4;i++){ const s=el('div','pl'); const k=el('div','sk'); k.style.height='52px'; s.appendChild(k); pulse.appendChild(s); }
  wrap.appendChild(pulse);

  const mount=el('div'); wrap.appendChild(mount);
  let U=[], detail={}, boardHost=null, progHost=null;

  /* Nothing waits for everything any more. The universe call lands in about
     800ms and already carries price, change, funding, open interest and volume
     for every market — enough to paint the pulse, the funding board and the
     whole 233-row table immediately. Only the ten ranked rows need charts, and
     they fill in underneath a skeleton of their own shape. */
  if(RADAR.U && Date.now()-RADAR.t < 45000){
    U=RADAR.U; detail=RADAR.det;
    quietly(()=>{ render(U,RADAR.det); paintBoard(RADAR.short,RADAR.det); });
    return;
  }
  try{
    const t0=performance.now();
    mount.appendChild(pageSkeleton());
    const [meta,ctxs]=await apiR({type:'metaAndAssetCtxs'},{ttl:20000});
    U=universe(meta,ctxs);
    render(U,detail);                                   /* everything except the ranked rows */
    const built=await fillBoard(U,LENS_ID,detail,(done,total)=>{
      if(progHost) progHost.textContent='reading charts · '+done+' of '+total;
    });
    PASSED=built.passed; READN=built.read;
    RADAR={t:Date.now(),U,short:built.chosen,det:detail};
    paintBoard(built.chosen,detail);
  }catch(e){
    mount.innerHTML='';
    const c=el('div','card pad');
    c.append(el('h2',null, e.code==='RATE'?'The exchange rate-limited this browser':'Could not read the board'));
    const p=el('p',null, e.code==='RATE'
      ? 'Rate limits are per IP, so this is about this browser and not the site. A board scan costs about 260 weight against a budget of 1,200 a minute. Give it a minute.'
      : 'The request did not complete. The exchange may be briefly unreachable.');
    p.style.cssText='color:var(--ink-2);margin-top:8px'; c.appendChild(p);
    const b=el('button','btn pri mag','Try again'); b.style.marginTop='14px';
    b.addEventListener('click',()=>route()); c.appendChild(b);
    mount.appendChild(c); magnetise(c);
  }

  function pageSkeleton(){
    const s=el('div');
    const a=el('div','sk-board'); a.style.marginTop='26px';
    for(let i=0;i<6;i++) a.appendChild(el('div','sk sk-row'));
    s.appendChild(a);
    return s;
  }

  /* The board answers "what is worth trading right now", so it may only contain
     markets a reader could actually trade. The old gate was $2M of 24-hour
     volume, which let a market where a 22% move means somebody bought $50,000
     outrank SOL, ETH and HYPE — the ranking multiplied the move by log10 of
     volume, and log10 spans 6.4 to 9.0 across the whole exchange while the move
     spans 2% to 23%, so volume was decoration. Measured at the time of the fix:
     53 markets clear $2M, 25 clear $10M, and the top of the $2M pool was ACE
     $2.7M, CHIP $5.1M, FIL $2.5M, 0G $3.3M.

     So: floor the universe at real volume and chart every survivor, rather than
     pre-ranking by a heuristic and charting the winners. The ordering that
     reaches the reader is then the lens score itself, computed on charts, not a
     proxy for it. If the floor leaves too few markets to fill a board, it falls
     back to the most-traded MIN of them so the page is never empty. */
  function preselect(all,lensId,n){
    const cap=n||DEPTH;
    const key = lensId==='funding' ? (m=>m.oiNtl) : (m=>m.vol);
    const floor= lensId==='funding' ? FUND_FLOOR : VOL_FLOOR;
    const byLiq=all.slice().sort((a,b)=>key(b)-key(a));
    const liquid=byLiq.filter(m=>key(m)>floor);
    return (liquid.length>=BOARD_MIN ? liquid : byLiq.slice(0,BOARD_MIN)).slice(0,cap);
  }

  /* Every market in the pool is charted before any of them is ranked. The old
     version walked down a pre-ranked pool and stopped at ten, which meant the
     preselect heuristic — not the lens — decided the board; now the pool is
     just "markets liquid enough to trade" and the score does the ranking.
     ~24 calls at six concurrent is four waves, about a second, and roughly 120
     weight against a budget of 1,200 a minute.
     A market whose measures disagree has nothing to say, so it is dropped
     rather than ranked low. */
  async function fillBoard(all, lensId, det, onProg){
    const lens=LENS[lensId]||LENS.momentum;
    const pool=preselect(all,lensId,DEPTH+14);
    const CONC=6;
    let pulled=0;
    const missing=pool.filter(m=>!det[m.name]);
    await inParallel(missing, CONC, async m=>{
      try{
        const now=Date.now();
        const bars=await apiR({type:'candleSnapshot',req:{coin:m.name,interval:'1h',
          startTime:now-230*3600*1000,endTime:now}},{ttl:60000});
        if(Array.isArray(bars)&&bars.length>30) det[m.name]=analyse(m,bars);
      }catch(e){}
      pulled++;
      onProg && onProg(pulled, missing.length);
    });
    const passed=[], scored=[];
    for(const m of pool){
      const a=det[m.name]; if(!a) continue;
      const r=lens.calc(m,a);
      if(r.dir==='none'){ passed.push(m.name); continue; }
      scored.push({m,score:r.score});
    }
    scored.sort((a,b)=>b.score-a.score);
    /* `read` is every market this scan actually charted — not the ten that
       reached the board. Counting the shown rows instead said "3 of 13" when
       the scan had read 24, which understates the work and misstates the odds
       of a market having no trend. */
    return {chosen:scored.slice(0,DEPTH).map(x=>x.m), passed, pulled,
            read:scored.length+passed.length};
  }

  function render(all, det){
    mount.innerHTML='';
    const lens=LENS[LENS_ID]||LENS.momentum;

    const upN=all.filter(m=>m.chg>0).length;
    const widest=all.filter(m=>m.oiNtl>FUND_FLOOR).sort((a,b)=>Math.abs(b.fundingApr)-Math.abs(a.fundingApr))[0];
    const churn=all.filter(m=>m.oiNtl>FUND_FLOOR&&m.volOverOi!=null).sort((a,b)=>b.volOverOi-a.volOverOi)[0];
    const totalOi=all.reduce((s,m)=>s+m.oiNtl,0);
    pulse.innerHTML=''; pulse.classList.add('lead');
    const P=(k,v,s,tip,cls)=>{ const n=el('div','pl tilt edge');
      const kk=el('div','k'); kk.append(el('span','micro',k)); if(tip) kk.appendChild(qm(tip));
      n.append(kk, el('div','v'+(cls?' '+cls:''),v), el('div','s',s)); pulse.appendChild(n); };
    P('Board direction',Math.round(upN/all.length*100)+'% up', upN+' of '+all.length+' above yesterday’s close');
    P('Open interest','$'+fmtC(totalOi),'across every perp market','oi');
    if(widest) P('Widest funding',pct(widest.fundingApr,0), widest.name+' — '+(widest.fundingApr>0?'longs paying':'shorts paying')+' · $'+fmtC(FUND_FLOOR)+'+ open interest','fundapr',Math.abs(widest.fundingApr)>60?'warn':'');
    if(churn) P('Most turnover',churn.volOverOi.toFixed(1)+'×', churn.name+' — volume against open interest','vsoi');
    field(pulse);

    const nfa=el('details','nfa rv');
    const sum=el('summary');
    sum.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4M12 7.8v.2"/></svg>'+
      '<span>Not advice, and not a signal — this is arithmetic on public data, with every input shown.</span>'+
      '<i>What it cannot do</i>';
    const nfaBody=el('p');
    nfaBody.textContent='It does not know what price does next. It does not account for your position size, '+
      'your risk, or the next hour. Scores are a sort order inside the selected lens, not a rating of the '+
      'market and not a probability.';
    nfa.append(sum,nfaBody); mount.appendChild(nfa);

    /* ── the board ── */
    const s1=el('section','sec rv');
    const segWrap=el('div','r');
    const seg=el('div','seg'); const pill=el('div','pill'); seg.appendChild(pill);
    Object.values(LENS).forEach(x=>{
      const b=el('button',null,x.label); b.dataset.lens=x.id;
      if(x.id===LENS_ID) b.className='on';
      b.addEventListener('click',()=>switchLens(x.id,seg,pill));
      seg.appendChild(b);
    });
    segWrap.appendChild(seg);
    /* The head carries the lens blurb and nothing else. The passed-over list
       used to be stitched onto the end of it, so switching lens changed the
       height of a paragraph sitting above the rows and shoved the whole page —
       the disclaimer included — which read as the page reloading. It lives
       under the board now, where it belongs and where it can grow freely. */
    s1.appendChild(secHead('Top '+DEPTH+' right now', lens.blurb, segWrap));
    const movePill=()=>{ const on=$('button.on',seg); if(on){ pill.style.left=on.offsetLeft+'px'; pill.style.width=on.offsetWidth+'px'; } };
    requestAnimationFrame(movePill); setTimeout(movePill,80);
    boardHost=el('div','rd-board lead');
    progHost=el('div','rd-count'); progHost.style.marginTop='10px';
    s1.append(boardHost,progHost);
    mount.appendChild(s1);
    boardSkeleton();

    /* ── who is paying ── */
    const s2=el('section','sec rv');
    s2.appendChild(secHead('Who is paying to hold',
      'Funding settles hourly; the rate here is that hour annualised. Only markets above $'
      +fmtC(FUND_FLOOR)+' open interest — below that, one print annualises to a number nobody can trade.'));
    const liq=all.filter(m=>m.oiNtl>FUND_FLOOR);
    const payShorts=liq.filter(m=>m.fundingApr>0).sort((a,b)=>b.fundingApr-a.fundingApr).slice(0,6);
    const payLongs =liq.filter(m=>m.fundingApr<0).sort((a,b)=>a.fundingApr-b.fundingApr).slice(0,6);
    const fb=el('div','fb');
    [['Shorts collect',payShorts,'up','longs are paying'],
     ['Longs collect', payLongs,'down','shorts are paying']].forEach(([t,list,cls,why])=>{
      const col=el('div','fb-col lead');
      const hd=el('div','fb-hd'); hd.append(el('span','chip '+cls,t), el('span','micro',why)); col.appendChild(hd);
      const mx=Math.max(...list.map(m=>Math.abs(m.fundingApr)),1);
      list.forEach(m=>{
        const r=el('div','fb-r edge');
        const mm=el('div','m'); mm.append(el('b',null,m.name), el('s',null,'$'+fmtC(m.oiNtl)+' OI'));
        const bar=el('div','bar'); const bi=el('i'); bi.style.background='var(--'+cls+')'; bar.appendChild(bi);
        r.append(mm,bar,el('div','a',pct(m.fundingApr,0)));
        r.style.cursor='pointer';
        r.addEventListener('click',()=>{ location.hash='#/radar/'+m.name; });
        col.appendChild(r);
        void bi.offsetWidth; bi.style.transform='scaleX('+(Math.abs(m.fundingApr)/mx)+')';
      });
      if(!list.length) col.appendChild(el('p','rd-count','No market with meaningful size is paying this side right now.'));
      fb.appendChild(col);
    });
    s2.appendChild(fb); mount.appendChild(s2);

    /* ── every market ── */

  function boardSkeleton(){
    if(!boardHost) return;

  function paintBoard(list, det){
    if(!boardHost) return;
    const lens=LENS[LENS_ID]||LENS.momentum;
    /* dir is recomputed here against live prices over cached candles, so a row
       chosen a minute ago can have lost its direction since. Drop it rather
       than render "measures disagree — no trend" inside a list of things worth
       watching, which is what a stale cache used to put on screen. */
    const scored=list.map(m=>({m,a:det[m.name],r:det[m.name]?lens.calc(m,det[m.name]):null}))
      .filter(x=>x.r&&x.r.dir!=='none').sort((a,b)=>b.r.score-a.r.score);
    boardHost.innerHTML='';

    if(args&&args[0]){ const t=$$('.mk',boardHost).find(n=>n.dataset.coin===args[0]);

  /* Switching lens must change the rows and nothing else. It used to clear the
     board to skeletons, which collapsed the section, moved everything below it
     and made the whole page look like it had reloaded. Both lenses read the
     same cached candles, so the old rows can simply stay on screen, dimmed,
     until the new ones are ready — the board never loses its height and no
     other part of the page moves at all. */
  function switchLens(id,seg,pill){
    if(LENS_ID===id || boardHost?.dataset.busy) return;
    LENS_ID=id; try{ localStorage.setItem('hf.lens',id); }catch(e){}
    $$('button',seg).forEach(y=>y.classList.toggle('on',y.dataset.lens===id));

    const sub=$('.sec-h p',boardHost.closest('section'));

    (async()=>{
      try{
        const built=await fillBoard(RADAR.U,id,RADAR.det,(d,t)=>{

        RADAR.short=built.chosen; PASSED=built.passed; READN=built.read;
        delete boardHost.dataset.busy;
        paintBoard(built.chosen,RADAR.det);
      } finally { delete boardHost.dataset.busy; }
    })();
  }

  /* Which markets were dropped and why, under the rows rather than above them. */

      ? PASSED.length+' of the '+(READN||PASSED.length)+' markets read were passed over for having no trend: '+

/* ═══════════════════════════════════════════════════════════════
   14 · HOME
   The hero is a spring mesh with real markets falling through it.
   The grid is a chart grid; the discs are markets, massed by open
   interest. The cursor is a mass that bends the mesh, and the push
   on the discs is gated by cursor SPEED — sweep fast to scatter
   them, rest the pointer and you can read one.
   ═══════════════════════════════════════════════════════════════ */
function heroField(host, markets){
  markets=markets||[];
  const cv=el('canvas'); host.appendChild(cv);
  let W=0,H=0,c=null,raf=null,run=false;
  const COLS=17, ROWS=11;
  let nodes=[], bodies=[];
  let mx=-1e4,my=-1e4,lx=-1e4,ly=-1e4,speed=0,grab=-1,T=Math.random()*100;

  function size(){
    const r=host.getBoundingClientRect(); if(!r.width||!r.height) return false;
    const same = Math.abs(r.width-W)<0.5 && Math.abs(r.height-H)<0.5 && nodes.length;
    W=r.width; H=r.height;
    /* Markets landing mid-flight must not reset the mesh under the reader's
       cursor, so the lattice is only rebuilt when the box actually changed. */
    if(!same){
      c=fit(cv,W,H,1.75);
      nodes=[];
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
        const rx=(x/(COLS-1))*W, ry=(y/(ROWS-1))*H;
        nodes.push({gx:x,gy:y,rx,ry,x:rx,y:ry,vx:0,vy:0,q:0});
      }
    }
    /* Radius encodes open interest as area^0.35 — big enough a difference to
       read at a glance, gentle enough that BTC doesn't swallow the box. The
       discs are furniture on top of the mesh, so they stay small. */
    const S=Math.min(W,H), N=W<520?5:7;
    const maxOi=Math.max(...markets.map(m=>m.oiNtl),1);
    bodies=markets.slice(0,N).map((m,i)=>{
      const rel=Math.pow(Math.max(m.oiNtl,1)/maxOi,0.35);
      const r0=clamp(S*0.052+rel*S*0.048, 17, S*0.115);
      const b=bodies[i], pad=r0*1.36;
      return {n:m.name, chg:m.chg, r:r0,
        x:b?b.x:(pad+Math.random()*Math.max(1,W-2*pad)), y:b?b.y:(pad+Math.random()*Math.max(1,H-2*pad)),
        vx:b?b.vx:(Math.random()-.5)*.4, vy:b?b.vy:(Math.random()-.5)*.4};
    });
    return true;
  }
  size();

  const nearBody=(x,y)=>{ for(let i=0;i<bodies.length;i++){ const b=bodies[i];
    if(Math.hypot(b.x-x,b.y-y)<b.r) return i; } return -1; };
  host.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect();
    mx=e.clientX-r.left; my=e.clientY-r.top; grab=nearBody(mx,my);
    if(grab>=0){ host.setPointerCapture(e.pointerId); e.preventDefault(); } });
  host.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect();
    host.classList.add('touched');           /* the hint has done its job */
    const nx=e.clientX-r.left, ny=e.clientY-r.top;
    if(lx>-1e3) speed=Math.min(70, Math.hypot(nx-lx,ny-ly)*3.4 + speed*0.55);
    lx=nx; ly=ny; mx=nx; my=ny; },{passive:true});
  const release=()=>{ grab=-1; };
  ['pointerup','pointercancel'].forEach(ev=>host.addEventListener(ev,release));
  host.addEventListener('pointerleave',()=>{ release(); mx=my=-1e4; lx=ly=-1e4; speed=0; });

  function frame(){
    if(!run) return;
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ run=false; cancelAnimationFrame(raf); return; }
    step();
  }

  function step(){
    if(!W&&!size()) return;
    speed*=0.9;
    T+=0.016;

    /* the mesh: every node is a spring back to its rest position, pushed away
       from the pointer with a smooth falloff. A slow two-harmonic swell rides
       on top of the rest positions so the surface is alive before anyone
       touches it — on a phone, that swell is the whole animation. */
    const R=Math.min(W,H)*0.42, R2=R*R;
    const AMB=Math.min(W,H)*0.014, REACH=Math.min(W,H)*0.085;
    for(const n of nodes){
      let px=0,py=0;
      if(mx>-1e3){
        const dx=n.rx-mx, dy=n.ry-my, d2=dx*dx+dy*dy;
        if(d2<R2){ const d=Math.sqrt(d2)||1, f=(1-d/R); const push=f*f*REACH;
          px=dx/d*push; py=dy/d*push; }
      }
      const wy=Math.sin(n.gx*0.78+T*0.85)*AMB + Math.sin(n.gy*1.16-T*0.57)*AMB*0.62;
      const wx=Math.sin(n.gy*0.64+T*0.48)*AMB*0.5;
      const tx=n.rx+px+wx, ty=n.ry+py+wy;
      n.vx=(n.vx+(tx-n.x)*0.16)*0.82;
      n.vy=(n.vy+(ty-n.y)*0.16)*0.82;
      n.x+=n.vx; n.y+=n.vy;
      /* how far this node has been dragged off rest, past the ambient swell —
         0 at rest, 1 under the cursor. This drives colour, not position. */
      n.q=clamp((Math.hypot(n.x-n.rx,n.y-n.ry)-AMB*1.35)/(REACH*0.62),0,1);
    }

    /* the markets: elastic collisions, walls, and a push gated by cursor speed */
    for(const b of bodies){
      if(mx>-1e3){
        const dx=b.x-mx, dy=b.y-my, d=Math.hypot(dx,dy)||1;
        if(d<b.r+110){ const push=(speed/70)*(1-d/(b.r+110))*2.9;
          b.vx+=dx/d*push; b.vy+=dy/d*push; }
      }
      b.x+=b.vx; b.y+=b.vy; b.vx*=0.985; b.vy*=0.985;
      /* bounce on the halo, not the disc — otherwise the soft ring clips the box */
      const p=b.r*1.36;
      if(b.x<p){b.x=p;b.vx=Math.abs(b.vx)*.8}
      if(b.x>W-p){b.x=W-p;b.vx=-Math.abs(b.vx)*.8}
      if(b.y<p){b.y=p;b.vy=Math.abs(b.vy)*.8}
      if(b.y>H-p){b.y=H-p;b.vy=-Math.abs(b.vy)*.8}
    }
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i], b2=bodies[j];
      const dx=b2.x-a.x, dy=b2.y-a.y, d=Math.hypot(dx,dy)||1, min=a.r+b2.r;
      if(d<min){
        const nx=dx/d, ny=dy/d, ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b2.x+=nx*ov; b2.y+=ny*ov;
        const p=(a.vx-b2.vx)*nx+(a.vy-b2.vy)*ny;     /* equal-mass elastic exchange */
        a.vx-=p*nx; a.vy-=p*ny; b2.vx+=p*nx; b2.vy+=p*ny;
      }
    }
    if(grab>=0){ const b=bodies[grab];
      b.vx=(mx-b.x)*0.3; b.vy=(my-b.y)*0.3; b.x=mx; b.y=my; }

    draw();
  }

  /* Drawing is split from stepping so the surface can be painted once with no
     animation frame at all. A canvas that only ever paints inside rAF is blank
     in any context that suspends frames — a background tab, a hidden pane, a
     reduced-motion setting — and blank looks like a bug, not a preference. */
  function draw(){
    if(!W&&!size()) return;
    const R=Math.min(W,H)*0.42;
    const mint=tok('--mint'), line=tok('--line-3'), ink=tok('--ink'), up=tok('--up'), dn=tok('--down');
    c.clearRect(0,0,W,H);
    c.lineJoin='round'; c.lineCap='round';

    /* pass 1 — the resting grid, one stroke per line */
    c.lineWidth=1;
    for(let y=0;y<ROWS;y++){ c.beginPath();
      for(let x=0;x<COLS;x++){ const n=nodes[y*COLS+x]; x?c.lineTo(n.x,n.y):c.moveTo(n.x,n.y); }
      const t=Math.abs(0.5-y/(ROWS-1))*2;                     /* fade toward top and bottom edges */
      c.strokeStyle=hexA(line,.62-t*0.26); c.stroke(); }
    for(let x=0;x<COLS;x++){ c.beginPath();
      for(let y=0;y<ROWS;y++){ const n=nodes[y*COLS+x]; y?c.lineTo(n.x,n.y):c.moveTo(n.x,n.y); }
      const t=Math.abs(0.5-x/(COLS-1))*2;
      c.strokeStyle=hexA(line,.50-t*0.22); c.stroke(); }

    /* pass 2 — energy. Only the segments actually bent get restroked in mint,
       brightness and weight proportional to how far they were pulled. Typically
       a few dozen segments, so this is cheap; at rest it draws nothing. */
    const seg=(a,b2)=>{ const q=(a.q+b2.q)/2; if(q<0.06) return;
      c.lineWidth=1+q*1.5; c.strokeStyle=hexA(mint,0.18+q*0.72);
      c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b2.x,b2.y); c.stroke(); };
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS-1;x++) seg(nodes[y*COLS+x],nodes[y*COLS+x+1]);
    for(let x=0;x<COLS;x++) for(let y=0;y<ROWS-1;y++) seg(nodes[y*COLS+x],nodes[(y+1)*COLS+x]);
    for(const n of nodes){ if(n.q<0.34) continue;
      c.fillStyle=hexA(mint,(n.q-0.34)*1.2); c.beginPath(); c.arc(n.x,n.y,1.1+n.q*1.7,0,7); c.fill(); }

    if(mx>-1e3){
      const g=c.createRadialGradient(mx,my,0,mx,my,R*0.8);
      g.addColorStop(0,hexA(mint,.15)); g.addColorStop(1,hexA(mint,0));
      c.fillStyle=g; c.beginPath(); c.arc(mx,my,R*0.8,0,7); c.fill();
    }
    for(const b of bodies){
      const hov=Math.hypot(b.x-mx,b.y-my)<b.r;
      const col=b.chg>=0?up:dn;
      c.globalAlpha=.16; c.fillStyle=col;
      c.beginPath(); c.arc(b.x,b.y,b.r*1.34,0,7); c.fill(); c.globalAlpha=1;
      c.fillStyle=hov?col:tok('--g2');
      c.beginPath(); c.arc(b.x,b.y,b.r,0,7); c.fill();
      c.lineWidth=1.4; c.strokeStyle=col; c.globalAlpha=hov?1:.7; c.stroke(); c.globalAlpha=1;
      c.fillStyle=hov?tok('--on-mint'):ink;
      c.font='600 '+Math.max(10,Math.min(14,b.r*.36))+'px "IBM Plex Mono", monospace';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText(b.n,b.x,b.y-3);
      c.font='500 '+Math.max(8,Math.min(11,b.r*.28))+'px "IBM Plex Mono", monospace';
      c.fillStyle=hov?tok('--on-mint'):col;
      c.fillText((b.chg>=0?'+':'−')+Math.abs(b.chg).toFixed(1)+'%', b.x, b.y+Math.max(9,b.r*.36));
    }
  }
  /* Paint before anything is scheduled: one settled frame that stands on its
     own if no animation frame ever arrives. */
  const paintOnce=()=>{ if(!size()) return false; step(); draw(); return true; };
  let retry=null;
  if(!paintOnce()){
    /* The stage can still have no height on first mount. Retry on a timer, not
       an animation frame: timers keep running in the contexts where frames are
       suspended, which are exactly the contexts this fallback exists for. */
    let tries=0;
    retry=setInterval(()=>{ if(!cv.isConnected||paintOnce()||++tries>60) { clearInterval(retry); retry=null; } },50);
  }
  const io=new IntersectionObserver(es=>{
    const on=es[0].isIntersecting&&!RM();
    if(on&&!run){ if(size()){ run=true; raf=requestAnimationFrame(frame); } }
    else if(!on&&run){ run=false; cancelAnimationFrame(raf); }
  },{threshold:0});
  io.observe(host);
  if(!RM()&&W){ run=true; raf=requestAnimationFrame(frame); }
  /* If the pane is hidden or the tab is backgrounded, rAF never fires. Repaint
     when it comes back, so a reader who switches to the tab sees the surface
     immediately rather than waiting on the next frame. */
  const onVis=()=>{ if(!document.hidden && cv.isConnected){ paintOnce();
    if(!run&&!RM()){ run=true; raf=requestAnimationFrame(frame); } } };
  document.addEventListener('visibilitychange',onVis);
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected){size(); if(!run) draw();}},150);};
  addEventListener('resize',onR);
  ACTIVE.push(()=>{ run=false; cancelAnimationFrame(raf); io.disconnect(); if(retry) clearInterval(retry);
    removeEventListener('resize',onR); document.removeEventListener('visibilitychange',onVis); });
  /* The mesh runs from the first frame with no data at all, and the markets
     drop into it when the call lands. A hero that is an empty box until the
     network answers is a worse first impression than no hero. */
  return { setMarkets(list){ markets=list||[]; if(size()){ step(); draw(); } },
           state(){ return {run, W, H, nodes:nodes.length, bodies:bodies.length}; } };
}

ROUTES.home=async function(){
  const hero=el('section','hm-hero');
  const copy=el('div','hm-copy');
  const h1=el('h1','hm-h1'); h1.innerHTML='See the whole <em>board</em>.';

  const cta=el('div','hm-cta');

  go.innerHTML='Open the radar<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
  const wal=el('a','btn ghost mag'); wal.href='#/wallet';
  wal.innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>Read a wallet';

  const stage=el('div','hm-stage');

  stage.appendChild(heroHint);
  hero.append(copy,stage);
  PAGE.appendChild(hero);

  const cards=el('section','sec rv');
  const grid=el('div','hm-cards lead');
  [['radar','Read the board','233 markets ranked by momentum or funding stress, with every input on screen.','#/radar','Open the radar',0],
   ['wallet','Read a wallet','Paste an address: what it holds, what it traded, and the type of trader the record says it is.','#/wallet','Read a wallet',1],
   ['run','Replay a trade','Watch a single position play out bar by bar, from entry to the closing verdict.','#/run','Replay a trade',1]
  ].forEach(([ic,t,p,href,go2,soon])=>{
    const a=el('a','hm-c tilt edge'); a.href=href; if(soon) a.dataset.soon='1';
    const i=el('div','ico'); i.innerHTML='<svg viewBox="0 0 24 24">'+IC[ic]+'</svg>';
    a.append(i, el('b',null,t), el('p',null,p));
    const g=el('span','go');
    g.innerHTML=(soon?'Coming next':go2)+'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>';
    a.appendChild(g); grid.appendChild(a);
  });
  cards.appendChild(grid);
  PAGE.appendChild(cards);

  /* ── 1 · the board, live ──────────────────────────────────────────
     Proof before promise. The same three rows the radar would rank, with
     real names and real scores, before the reader has clicked anything. */
  const sBoard=el('section','sec rv');
  sBoard.appendChild(secHead('The top of the board, right now',
    'Ranked out of every market with real volume behind it. Same arithmetic as the radar, same numbers.'));
  const miniHost=el('div','hm-mini lead');
  for(let i=0;i<3;i++){ const s=el('div','sk sk-row'); s.style.height='62px'; miniHost.appendChild(s); }
  sBoard.appendChild(miniHost);
  const boardMore=el('a','hm-more'); boardMore.href='#/radar';
  boardMore.innerHTML='See all ten, with every measure<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>';
  sBoard.appendChild(boardMore);
  PAGE.appendChild(sBoard);

  /* ── 2 · how a reading is built ───────────────────────────────────
     The method, performed rather than described: one real market taken
     apart into the seven measures that vote on it. */
  const sHow=el('section','sec rv');
  sHow.appendChild(secHead('How a reading is built',
    'Seven measures vote. Nothing is weighted by opinion, and every one of them is on screen.'));
  const howHost=el('div','hm-how');
  sHow.appendChild(howHost);
  PAGE.appendChild(sHow);

  /* ── 3 · read any wallet ──────────────────────────────────────────
     The other half of the site, one field wide. */
  const sWal=el('section','sec rv');
  sWal.appendChild(secHead('Or read somebody’s account',
    'Paste an address and get the record behind it — what it holds, what it has traded, and what that says about how it trades.'));
  const wbox=el('form','hm-wal card pad');
  const wf2=el('div','hm-wf');
  const wi=el('input'); wi.type='text'; wi.spellcheck=false; wi.autocomplete='off';
  wi.placeholder='0x… paste any address';
  wi.setAttribute('aria-label','Wallet address');
  const wb=el('button','btn pri mag','Read wallet'); wb.type='submit';
  wf2.append(wi,wb); wbox.appendChild(wf2);
  const werr=el('p','hm-werr'); werr.hidden=true; wbox.appendChild(werr);
  wbox.addEventListener('submit',e=>{
    e.preventDefault();
    const v=(wi.value||'').trim();
    /* Checked here rather than after a route change, so a typo costs nothing */
    if(!/^0x[0-9a-fA-F]{40}$/.test(v)){
      werr.textContent='That is not an address. An EVM address is 0x followed by 40 hex characters.';
      werr.hidden=false; wi.focus(); return;
    }
    werr.hidden=true; location.hash='#/wallet/'+v.toLowerCase();
  });
  wi.addEventListener('input',()=>{ werr.hidden=true; });
  sWal.appendChild(wbox);
  PAGE.appendChild(sWal);

  /* ── 4 · referral, last ───────────────────────────────────────────*/
  const ref=el('section','sec rv');
  ref.appendChild(secHead('Reading is free. Trading needs an account.'));
  ref.appendChild(refBlock('home'));
  PAGE.appendChild(ref);

  field(PAGE); magnetise(PAGE); reveal(PAGE);
  const mesh=heroField(stage, []);          /* alive immediately, empty for now */
  window.__mesh=mesh;                       /* handle for the render tests */

  /* one call. It fills the live strip, feeds the hero, and warms the cache the
     radar reads from — so clicking through costs nothing. */
  try{
    const [meta,ctxs]=await apiR({type:'metaAndAssetCtxs'},{ttl:20000});
    const U=universe(meta,ctxs);
    RADAR={t:Date.now(),U,short:RADAR.short,det:RADAR.det||{}};
    const oi=U.reduce((s,m)=>s+m.oiNtl,0);
    const up=U.filter(m=>m.chg>0).length;
    const wf=U.filter(m=>m.oiNtl>FUND_FLOOR).sort((a,b)=>Math.abs(b.fundingApr)-Math.abs(a.fundingApr))[0];
    live.innerHTML='';
    const U2=(html)=>{ const n=el('span','u'); n.innerHTML=html; live.appendChild(n); };
    U2('<i></i><b>'+U.length+'</b> markets live');
    U2('<b>$'+fmtC(oi)+'</b> open interest');
    U2('<b>'+Math.round(up/U.length*100)+'%</b> above yesterday');
    if(wf){ U2('widest funding <b>'+pct(wf.fundingApr,0)+'</b> on '+wf.name);
      live.lastChild.title='Annualised from the current hourly rate. Markets under $'
        +fmtC(FUND_FLOOR)+' open interest are excluded — one hourly print on a thin book '
        +'annualises to a number nobody can trade.'; }
    mesh.setMarkets(U.slice().sort((a,b)=>b.vol-a.vol));

    /* The board preview and the worked example both need candles, so they are
       filled from ONE set of chart calls, after the strip and the mesh are
       already on screen. Six markets, six at a time: one wave, ~250ms, and the
       results land in the same RADAR.det the radar reads — so clicking through
       to the radar arrives with a third of its work already done. */
    fillHome(U).catch(()=>{
      miniHost.innerHTML='';
      miniHost.appendChild(el('p','rd-count','The charts did not answer just now — the radar reads them again on arrival.'));
      howHost.innerHTML='';
    });
  }catch(e){
    live.innerHTML='';
    const n=el('span','u'); n.textContent='the exchange is not answering right now';
    live.appendChild(n);
    if(heroHint) heroHint.textContent='sweep the mesh';   /* nothing to drag yet */
    miniHost.innerHTML=''; howHost.innerHTML='';
  }

  async function fillHome(U){
    const det=RADAR.det||(RADAR.det={});
    const byVol=U.slice().filter(m=>m.vol>VOL_FLOOR).sort((a,b)=>b.vol-a.vol);
    const pool=(byVol.length>=6?byVol:U.slice().sort((a,b)=>b.vol-a.vol)).slice(0,14);
    await inParallel(pool.filter(m=>!det[m.name]), 6, async m=>{
      try{
        const now=Date.now();
        const bars=await apiR({type:'candleSnapshot',req:{coin:m.name,interval:'1h',
          startTime:now-230*3600*1000,endTime:now}},{ttl:60000});
        if(Array.isArray(bars)&&bars.length>30) det[m.name]=analyse(m,bars);
      }catch(e){}
    });
    const ranked=pool.map(m=>({m,a:det[m.name],r:det[m.name]?momentum(m,det[m.name]):null}))
      .filter(x=>x.r&&x.r.dir!=='none').sort((a,b)=>b.r.score-a.r.score);
    if(!ranked.length){ miniHost.innerHTML=''; howHost.innerHTML=''; return; }

    /* the three rows */
    miniHost.innerHTML='';
    ranked.slice(0,3).forEach((x,i)=>miniHost.appendChild(miniRow(x,i)));
    field(miniHost); flick(miniHost);

    /* the worked example — the market at the top, taken apart */
    howHost.innerHTML='';
    howHost.appendChild(measureTable(ranked[0]));
    field(howHost);
  }

  /* Every class here is hm- prefixed. Bare names like .sc, .id and .n are
     already taken by unscoped global rules elsewhere in this stylesheet — .sc
     is the share-card grid, and using it here silently made each row 147px
     tall with a 36px gap inside the score cell. Fourth collision of this kind
     in the project; see the bare-class list printed by the build check. */
  function miniRow(x,i){
    const {m,r}=x;
    const a=el('a','hm-row tilt edge'); a.href='#/radar/'+encodeURIComponent(m.name);
    a.dataset.dir=r.dir;
    a.appendChild(el('div','hm-stripe'));
    a.appendChild(el('div','hm-rk',String(i+1).padStart(2,'0')));
    const id=el('div','hm-idc');
    const nm=el('div','hm-nm');
    nm.append(el('b',null,m.name), el('span','chip '+(m.chg>=0?'up':'down'),pct(m.chg)));
    id.append(nm, el('div','hm-px', px(m.mark)+'  ·  $'+fmtC(m.vol)+' 24h'));
    a.appendChild(id);
    const lean=el('div','hm-ln');
    lean.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
      (r.dir==='long'?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>')+
      '</svg><span>'+r.leanText+'</span>';
    a.appendChild(lean);
    const sc=el('div','hm-sc'); const b=el('b'); countUp(b,r.score,v=>String(Math.round(v)),620);
    sc.append(b, el('s',null,'momentum')); a.appendChild(sc);
    return a;
  }

  /* Seven rows, one per measure, each with its number and the vote it casts.
     This is the same votes array the radar renders — not a mock-up of it. */
  function measureTable(x){
    const {m,r}=x;
    const wrap=el('div','hm-hw card');
    const hd=el('div','hm-hd');
    hd.innerHTML='<b>'+m.name+'</b><span class="chip '+(m.chg>=0?'up':'down')+'">'+pct(m.chg)+'</span>'+
      '<s>the market at the top of the board</s>';
    wrap.appendChild(hd);
    const list=el('div','hm-ms');
    r.votes.forEach(v=>{
      const row=el('div','hm-msr'); row.dataset.v=v.vote;
      const ic=el('span','hm-v');
      ic.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+
        (v.vote==='for'?'<path d="M12 19V5M6 11l6-6 6 6"/>':
         v.vote==='against'?'<path d="M12 5v14M6 13l6 6 6-6"/>':'<path d="M5 12h14"/>')+'</svg>';
      row.append(ic, el('span','hm-l',v.label), el('span','hm-n',v.val));
      list.appendChild(row);
    });
    wrap.appendChild(list);
    const foot=el('div','hm-ft');
    foot.innerHTML='<span><b>'+r.for+'</b> for · <b>'+r.against+'</b> against</span>'+
      '<span class="hm-tot"><b>'+r.score+'</b><s>momentum</s></span>';
    wrap.appendChild(foot);
    wrap.appendChild(el('p','hm-fp','A vote needs a two-measure majority before it counts as a direction at all. '+
      'The score below sorts inside that — it is a sort order, not a probability, and it does not know what price does next.'));
    return wrap;
  }
};
