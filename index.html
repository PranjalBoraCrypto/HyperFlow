    e.append(el('h3',null,'Hasn’t staked'), el('p',null,'No delegation history for this address. That is missing data, not a zero — the staking component of the depth score is shown as missing above.'));
    b5.body.appendChild(e); requestAnimationFrame(()=>drawSeal(cv,88,'anchor',addr));
  }
  app.appendChild(b5.node);

  /* ---- genesis ---- */
  if(f.genesis.length){
    const b6=blk('Genesis','07');
    const c=el('div','card pad'); c.style.display='flex'; c.style.flexDirection='column'; c.style.gap='10px';
    const h=el('div'); h.style.display='flex'; h.style.alignItems='center'; h.style.gap='8px'; h.style.flexWrap='wrap';
    h.append(el('h3',null,'Received at genesis'), q('genesis'));
    const tg=el('button','sc-tog'); tg.setAttribute('aria-pressed', String(MASK.amounts));
    const bx=el('span','box'); tg.append(bx, document.createTextNode('Hide amounts'));
    h.appendChild(tg);
    c.appendChild(h);
    const rows=el('div'); rows.style.display='flex'; rows.style.flexDirection='column'; rows.style.gap='6px';
    function paintG(){
      rows.innerHTML='';
      f.genesis.forEach(g=>{
        const r=el('div'); r.style.display='flex'; r.style.gap='12px'; r.style.alignItems='baseline'; r.style.flexWrap='wrap';
        const amt=el('span','num'); amt.style.fontSize='19px'; amt.style.fontWeight='600';
        amt.textContent=maskNum(fmtNum(g.amount,2))+' '+g.token;
        const dt=el('span','lab'); dt.textContent=dayStr(g.time);
        r.append(amt,dt); rows.appendChild(r);
      });
    }
    tg.addEventListener('click',()=>{ MASK.amounts=!MASK.amounts; tg.setAttribute('aria-pressed',String(MASK.amounts)); paintG(); });
    paintG();
    c.appendChild(rows);
    c.appendChild(el('p','wl-miss','Recorded on this wallet’s own ledger as a spotGenesis entry. Historical fact, past tense — it describes what happened, nothing more.'));
    b6.body.appendChild(c); app.appendChild(b6.node);
  }

  /* ---- subaccounts, never merged ---- */
  if(f.subCount){
    const b7=blk('Subaccounts','08');
    const c=el('div','card pad'); c.style.display='flex'; c.style.flexDirection='column'; c.style.gap='12px';
    const h=el('div'); h.style.display='flex'; h.style.alignItems='center'; h.style.gap='8px';
    h.append(el('h3',null,f.subCount+' subaccount'+(f.subCount===1?'':'s')), q('subacc'));
    c.appendChild(h);
    const t=el('div','wl-tiles');
    t.append(
      tile('Children account value', fmtUsd(f.subEquity,0), 'summed across '+f.subCount+' subaccounts'),
      tile('Children open interest', fmtUsd(f.subNtl,0), 'not included in the headline above')
    );
    if(f.aggPnl!=null){
      const agg=el('div','wl-tiles');
      agg.append(
        tile('Aggregate PnL', fmtUsd(f.aggPnl), 'portfolio · allTime — spans more than the perp account'),
        tile('Aggregate value', f.aggEquity!=null? fmtUsd(f.aggEquity,0):'—', 'does not equal this address’s perp account')
      );
      c.appendChild(agg);
    }
    c.append(t, el('p','wl-miss','Kept separate on purpose. The headline numbers at the top are the pasted address’s perp account only, exactly as the exchange reports it for that address. The aggregate figures come from portfolio.allTime, which folds in spot, staked HYPE and other holdings — on every wallet tested it failed to reconcile with the perp account, so it is never shown as a headline.'));
    b7.body.appendChild(c); app.appendChild(b7.node);
  }

  /* ---- share ---- */
  const b8=blk('Share it','09');
  b8.body.appendChild(shareCard(addr,f,a,sc));
  app.appendChild(b8.node);
  reveal(app);
}

/* ============================================================
   10. SHARE CARD
   Composed from a declared block: every gap is named up front and
   the whole stack is positioned as one unit, so nothing drifts or
   collides when a number gets longer or the type gets bigger.
   The footer band is reserved BEFORE anything else is laid out.
   ============================================================ */
function paintShare(cv, ratio, addr, f, a, sc){
  const wide = ratio==='16:9';
  const W = wide?1200:1080, H = wide?630:1920;
  const c = fitCanvas(cv, W, H, 1);            // DPR capped at 1 for export — phones die otherwise
  const t = CAST[CAST_IX[a.id]] || CAST[0];

  const SP = {                                  // declared spacing — no hand-tuned offsets
    pad:      wide?56:72,
    footBand: wide?84:120,
    sealSize: wide?230:420,
    gapSeal:  wide?44:52,
    gapName:  14,
    gapTag:   wide?26:34,
    gapScore: wide?30:40,
    tileH:    wide?92:132,
    tileGap:  12
  };
  c.fillStyle='#041512'; c.fillRect(0,0,W,H);
  // ground: the mark's form, low contrast, clipped to the card
  c.save(); c.beginPath(); c.rect(0,0,W,H); c.clip();
  c.globalAlpha=0.06;
  const bs=H*1.25; c.save(); c.translate(W-bs*0.42, H*0.5-bs*0.5); drawBlob(c,bs,t.hue,1); c.restore();
  c.globalAlpha=1; c.restore();

  const contentTop = SP.pad;
  const contentBottom = H - SP.footBand - SP.pad;   // reserve the footer band first
  const innerW = W - SP.pad*2;

  // --- footer band ---
  c.fillStyle='rgba(150,252,228,.05)'; c.fillRect(0,H-SP.footBand,W,SP.footBand);
  c.fillStyle='#12403A'; c.fillRect(0,H-SP.footBand,W,1);
  c.font='600 '+(wide?19:26)+'px Chivo, sans-serif'; c.fillStyle='#96FCE4'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText('hyperflow', SP.pad, H-SP.footBand/2);
  c.font='400 '+(wide?15:21)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D'; c.textAlign='right';
  c.fillText('a reading, not a rank · read-only', W-SP.pad, H-SP.footBand/2);

  // --- the stack, measured then placed as one unit ---
  const sealX = wide? SP.pad : (W-SP.sealSize)/2;
  const textX = wide? SP.pad+SP.sealSize+SP.gapSeal : SP.pad;
  const textW = wide? innerW-SP.sealSize-SP.gapSeal : innerW;
  const alignC = !wide;

  const nameSize  = wide?58:84;
  const tagSize   = wide?21:30;
  const scoreSize = wide?96:150;
  const stackH = nameSize*1.0 + SP.gapName + tagSize*1.3 + SP.gapTag + scoreSize*0.86 + SP.gapScore + SP.tileH;
  const availH = contentBottom - contentTop;
  let y = contentTop + Math.max(0,(availH - (wide? stackH : stackH+SP.sealSize+SP.gapSeal))/2);

  if(!wide){
    drawSeal(_sealBuf(SP.sealSize, a.id, addr), SP.sealSize, a.id, addr);
    c.drawImage(_SEALCV, sealX, y, SP.sealSize, SP.sealSize);
    y += SP.sealSize + SP.gapSeal;
  } else {
    drawSeal(_sealBuf(SP.sealSize, a.id, addr), SP.sealSize, a.id, addr);
    c.drawImage(_SEALCV, sealX, contentTop + (availH-SP.sealSize)/2, SP.sealSize, SP.sealSize);
  }

  c.textAlign = alignC?'center':'left'; c.textBaseline='top';
  const tx = alignC? W/2 : textX;
  c.font='800 '+nameSize+'px Chivo, sans-serif'; c.fillStyle='#E2F3ED';
  c.fillText(t.name, tx, y); y += nameSize + SP.gapName;
  c.font='400 '+tagSize+'px "Public Sans", sans-serif'; c.fillStyle='#9CB9B2';
  c.fillText(t.tag, tx, y); y += tagSize*1.3 + SP.gapTag;

  c.font='900 '+scoreSize+'px Chivo, sans-serif'; c.fillStyle=t.hue;
  const scTxt = sc.total!=null? String(sc.total) : '—';
  c.fillText(scTxt, tx, y);
  const scW = c.measureText(scTxt).width;
  c.font='500 '+(wide?18:26)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D';
  c.textAlign='left';
  c.fillText('depth', (alignC? W/2 - scW/2 : tx) + scW + 14, y + scoreSize*0.5);
  y += scoreSize*0.86 + SP.gapScore;

  // --- stat tiles, laid into what is left, never touching the band ---
  const stats=[
    ['Open now', f.oi>0? '$'+fmtCompact(f.oi):'—'],
    ['Perp volume', f.perpVlm!=null? '$'+fmtCompact(f.perpVlm):'—'],
    ['HYPE staked', f.staked>0? fmtCompact(f.staked):'none'],
    ['Since', f.firstLedger? dayStr(f.firstLedger).slice(0,7):'—']
  ].map(([k,v])=>[k, MASK.amounts? '•••••' : v]);
  const tileW=(textW-SP.tileGap*3)/4;
  const tileY=Math.min(y, contentBottom-SP.tileH);
  stats.forEach((s,i)=>{
    const x=textX + i*(tileW+SP.tileGap);
    c.fillStyle='rgba(150,252,228,.06)'; rr(c,x,tileY,tileW,SP.tileH,12); c.fill();
    c.strokeStyle='#12403A'; c.lineWidth=1; rr(c,x+.5,tileY+.5,tileW-1,SP.tileH-1,12); c.stroke();
    c.textAlign='left'; c.textBaseline='top';
    c.font='500 '+(wide?12:17)+'px "IBM Plex Mono", monospace'; c.fillStyle='#65847D';
    c.fillText(s[0].toUpperCase(), x+14, tileY+ (wide?16:22));
    c.font='600 '+(wide?26:38)+'px "IBM Plex Mono", monospace'; c.fillStyle='#E2F3ED';
    c.fillText(s[1], x+14, tileY+ (wide?44:64));
  });

  // --- address line, inside the band's gutter ---
  c.font='400 '+(wide?15:21)+'px "IBM Plex Mono", monospace';
  c.fillStyle='#65847D'; c.textAlign= alignC?'center':'left'; c.textBaseline='bottom';
  const addrTxt = MASK.addr ? addr.slice(0,4)+'…'+'•'.repeat(8) : addr;
  c.fillText(addrTxt, alignC? W/2 : textX, H - SP.footBand - 18);
  return cv;
}
let _SEALCV=null;
function _sealBuf(size){ if(!_SEALCV) _SEALCV=document.createElement('canvas'); return _SEALCV; }

function shareCard(addr,f,a,sc){
  const wrap=el('div','sc-wrap');
  const stage=el('div','sc-stage');
  const tilt=el('div','sc-tilt');
  const card=el('div','sc-card'); card.style.maxWidth='620px'; card.style.width='100%';
  const cv=el('canvas'); const sheen=el('div','sc-sheen');
  card.append(cv,sheen); tilt.appendChild(card); stage.appendChild(tilt);

  let ratio='16:9';
  const repaint=()=>{ document.fonts.ready.then(()=>paintShare(cv,ratio,addr,f,a,sc)); };
  repaint();

  // toggles
  const togs=el('div','sc-toggles');
  function mkTog(label,get,set){
    const t=el('button','sc-tog'); t.setAttribute('aria-pressed',String(get()));
    t.append(el('span','box'), document.createTextNode(label));
    t.addEventListener('click',()=>{ set(!get()); t.setAttribute('aria-pressed',String(get())); repaint(); });
    return t;
  }
  const rt=el('button','sc-tog'); rt.setAttribute('aria-pressed','false');
  rt.append(el('span','box'), document.createTextNode('9:16 for stories'));
  rt.addEventListener('click',()=>{ ratio = ratio==='16:9'?'9:16':'16:9';
    rt.setAttribute('aria-pressed', String(ratio==='9:16'));
    card.style.maxWidth = ratio==='16:9'?'620px':'340px'; repaint(); });
  togs.append(
    mkTog('Blur the address', ()=>MASK.addr, v=>MASK.addr=v),
    mkTog('Hide the numbers', ()=>MASK.amounts, v=>MASK.amounts=v),
    rt
  );

  // controls
  const ctrls=el('div','sc-ctrls');
  const dl=el('button','sc-btn pri');
  dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Download';
  dl.addEventListener('click',()=>{ const a2=document.createElement('a');
    a2.download='hyperflow-'+addr.slice(0,8)+'-'+ratio.replace(':','x')+'.png';
    a2.href=cv.toDataURL('image/png'); a2.click(); });
  const cpb=el('button','sc-btn');
  cpb.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy image';
  cpb.addEventListener('click',async()=>{
    try{ const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      cpb.lastChild.textContent='Copied'; setTimeout(()=>cpb.lastChild.textContent='Copy image',1600);
    }catch(e){ cpb.lastChild.textContent='Copy unsupported here'; }
  });
  const xb=el('button','sc-btn');
  xb.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>Share on X';
  xb.addEventListener('click',()=>{
    const t=CAST[CAST_IX[a.id]];
    const txt=`This wallet reads as ${t.name} on Hyperliquid — ${t.tag.toLowerCase().replace(/\.$/,'')}. Depth ${sc.total ?? '—'}, and the whole breakdown is shown.`;
    open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt)+'&url='+encodeURIComponent(location.href),'_blank','noopener');
  });
  ctrls.append(dl,cpb,xb);

  const note=el('p','wl-miss','The image is drawn in your browser. Nothing is uploaded, and the toggles above change the exported file, not just the preview.');

  wrap.append(stage,togs,ctrls,note);

  // 3D tilt — listener on the CARD, transform on the TILT wrapper only,
  // so the controls underneath never inherit it.
  if(!RM()){
    let raf=null, tx=0, ty=0, cx=0, cy=0;
    const apply=()=>{ cx+=(tx-cx)*.14; cy+=(ty-cy)*.14;
      tilt.style.transform=`rotateY(${cx}deg) rotateX(${cy}deg)`;
      raf = (Math.abs(tx-cx)>.05||Math.abs(ty-cy)>.05) ? requestAnimationFrame(apply) : null; };
    const kick=()=>{ if(!raf) raf=requestAnimationFrame(apply); };
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      tx=(px-.5)*13; ty=-(py-.5)*11;
      sheen.style.setProperty('--mx',(px*100)+'%'); sheen.style.setProperty('--my',(py*100)+'%');
      kick();
    });
    card.addEventListener('pointerleave',()=>{ tx=0; ty=0; kick(); });
    ACTIVE.push(()=>{ if(raf) cancelAnimationFrame(raf); });
  }
  return wrap;
}

/* ============================================================
   11. ROUTER
   ============================================================ */
function isAddr(s){ return /^0x[0-9a-fA-F]{40}$/.test(s.trim()); }
function go(v){
  const s=(v||'').trim();
  if(!isAddr(s)){ $('#shInput').setAttribute('data-tip','That is not a 40-character Hyperliquid address.'); return; }
  location.hash='#/wallet/'+s.toLowerCase();
}
$('#shForm').addEventListener('submit',e=>{ e.preventDefault(); go($('#shInput').value); });
addEventListener('scroll',()=>{ $('#shTop').dataset.stuck = scrollY>4?'1':'0'; },{passive:true});

function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  const m=h.match(/^\/wallet\/(0x[0-9a-fA-F]{40})/);
  scrollTo(0,0);
  if(m){ $('#shInput').value=m[1]; track('wallet'); viewWallet(m[1].toLowerCase()); }
  else if(h.startsWith('/cast')){ track('cast'); viewCast(); }
  else { $('#shInput').value=''; track('home'); viewHome(); }
}
/* analytics: hash routing means one page forever, so send a named
   event per route — page name only, never the URL. */
function track(name){ try{ window.va && window.va('event',{name:'route:'+name}); }catch(e){} }
addEventListener('hashchange',route);
paintMark($('#markCv'),28);
document.addEventListener('hf:theme',()=>{ paintMark($('#markCv'),28); });
document.fonts.ready.then(route);
</script>
