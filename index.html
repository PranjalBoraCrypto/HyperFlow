  L.append(h1, el('p','rd-sub', isSpot()
    ? 'Every Hyperliquid spot pair, ranked live in your browser. Open any row to see the measures behind it.'
    : 'Every Hyperliquid perp, ranked live in your browser. Open any row to see the measures behind it.'));
  head.appendChild(L); wrap.appendChild(head);

  /* The first thing on the page used to be four venue statistics — board
     direction, total open interest, widest funding, most turnover. All true,
     none of them a reason to do anything. Somebody opening this page is about
     to trade; what they want in the first screen is what has just moved. */
  const pulse=el('div','rd-hour');
  const pulseHd=el('div','rd-hourhd');
  pulseHd.innerHTML='<span class="micro">What changed in the last hour</span>';
  const pulseList=el('div','rd-hourl lead');
  for(let i=0;i<3;i++){ const k=el('div','sk sk-row'); k.style.height='54px'; pulseList.appendChild(k); }
  pulse.append(pulseHd,pulseList);
  wrap.appendChild(pulse);

  const mount=el('div'); wrap.appendChild(mount);
  let U=[], detail={}, boardHost=null, progHost=null;

  /* Nothing waits for everything any more. The universe call lands in about
     800ms and already carries price, change, funding, open interest and volume
     for every market — enough to paint the pulse, the funding board and the
     whole 233-row table immediately. Only the ten ranked rows need charts, and
     they fill in underneath a skeleton of their own shape. */
  /* The cache holds a universe and, SOMETIMES, a built board. The home page
     and the coin page both warm RADAR with `short: RADAR.short`, which is null
     on a fresh session — so arriving at the radar from either of them within
     the cache window used to call paintBoard(null). That threw inside
     quietly(), which rethrows, the rejection went nowhere, and the skeleton
     drawn by render() stayed on screen forever. Switching lens fixed it
     because switchLens builds the board itself.
     So: paint instantly from cache when there IS a board, and otherwise take
     the cached universe (which is the slow part) and go build one. */
  if(RADAR.U && Date.now()-RADAR.t < 45000){
    U=RADAR.U; detail=RADAR.det||{};
    const cached=Array.isArray(RADAR.short)&&RADAR.short.length;
    quietly(()=>{ render(U,detail); if(cached) paintBoard(RADAR.short,detail); });
    if(cached) return;
    try{
      const built=await fillBoard(U,LENS_ID,detail,()=>{});
      PASSED=built.passed; READN=built.read;
      RADAR={t:Date.now(),U,short:built.chosen,det:detail};
      paintBoard(built.chosen,detail);
      paintHour(U,detail);
    }catch(e){ boardFailed(e); }
    return;
  }
  try{
    const t0=performance.now();
    mount.appendChild(pageSkeleton());
    U=await loadUniverse();
    render(U,detail);                                   /* everything except the ranked rows */
    try{
      const built=await fillBoard(U,LENS_ID,detail,(done,total)=>{
        if(progHost) progHost.textContent='reading charts · '+done+' of '+total;
      });
      PASSED=built.passed; READN=built.read;
      RADAR={t:Date.now(),U,short:built.chosen,det:detail};
      paintBoard(built.chosen,detail);
      paintHour(U,detail);            /* now that the candles are in hand */
    }catch(e){ boardFailed(e); }
  }catch(e){
    mount.innerHTML='';
    const c=el('div','card pad');
    c.append(el('h2',null, e.code==='RATE'?'The exchange rate-limited this browser':'Could not read the board'));
    const p=el('p',null, e.code==='RATE'
      ? 'Rate limits are per IP, so this is about this browser and not the site. A board scan costs about 260 weight against a budget of 1,200 a minute. Give it a minute.'
      : 'The request did not complete. The exchange may be briefly unreachable.');
    p.style.cssText='color:var(--ink-2);margin-top:8px'; c.appendChild(p);
    const b=el('button','btn pri mag','Try again'); b.style.marginTop='14px';
    b.addEventListener('click',()=>route()); c.appendChild(b);
    mount.appendChild(c); magnetise(c);
  }

  function pageSkeleton(){
    const s=el('div');
    const a=el('div','sk-board'); a.style.marginTop='26px';
    for(let i=0;i<6;i++) a.appendChild(el('div','sk sk-row'));
    s.appendChild(a);
    return s;
  }

  /* The board answers "what is worth trading right now", so it may only contain
     markets a reader could actually trade. The old gate was $2M of 24-hour
     volume, which let a market where a 22% move means somebody bought $50,000
     outrank SOL, ETH and HYPE — the ranking multiplied the move by log10 of
     volume, and log10 spans 6.4 to 9.0 across the whole exchange while the move
     spans 2% to 23%, so volume was decoration. Measured at the time of the fix:
     53 markets clear $2M, 25 clear $10M, and the top of the $2M pool was ACE
     $2.7M, CHIP $5.1M, FIL $2.5M, 0G $3.3M.

     So: floor the universe at real volume and chart every survivor, rather than
     pre-ranking by a heuristic and charting the winners. The ordering that
     reaches the reader is then the lens score itself, computed on charts, not a
     proxy for it. If the floor leaves too few markets to fill a board, it falls
     back to the most-traded MIN of them so the page is never empty. */
  function preselect(all,lensId,n){
    const cap=n||DEPTH;
    /* Spot has no open interest and no funding, so it is always ranked and
       floored on traded volume — and on a venue where nine markets clear $1M a
       day, the floor drops to match or the board would be empty. */
    const useFunding = lensId==='funding' && !isSpot();
    const key = useFunding ? (m=>m.oiNtl) : (m=>m.vol);
    const floor= useFunding ? FUND_FLOOR : (isSpot()? SPOT_FLOOR : VOL_FLOOR);
    /* a delisted market cannot be traded, so it can never be an answer to
       "what is worth trading now" — even on a day quiet enough to hit the
       BOARD_MIN fallback below */
    const byLiq=all.filter(m=>!m.delisted).sort((a,b)=>key(b)-key(a));
    const liquid=byLiq.filter(m=>key(m)>floor);
    const min=isSpot()?SPOT_MIN:BOARD_MIN;
    return (liquid.length>=min ? liquid : byLiq.slice(0,min)).slice(0,cap);
  }

  /* Every market in the pool is charted before any of them is ranked. The old
     version walked down a pre-ranked pool and stopped at ten, which meant the
     preselect heuristic — not the lens — decided the board; now the pool is
     just "markets liquid enough to trade" and the score does the ranking.
     ~24 calls at six concurrent is four waves, about a second, and roughly 120
     weight against a budget of 1,200 a minute.
     A market whose measures disagree has nothing to say, so it is dropped
     rather than ranked low. */
  async function fillBoard(all, lensId, det, onProg){
    const lens=LENS[lensId]||LENS.momentum;
    const pool=preselect(all,lensId,DEPTH+14);
    const CONC=6;
    let pulled=0;
    const missing=pool.filter(m=>!det[m.name]);
    await inParallel(missing, CONC, async m=>{
      try{
        const now=Date.now();
        const bars=await apiR({type:'candleSnapshot',req:{coin:m.key||m.name,interval:'1h',
          startTime:now-230*3600*1000,endTime:now}},{ttl:60000});
        if(Array.isArray(bars)&&bars.length>30) det[m.name]=analyse(m,bars);
      }catch(e){}
      pulled++;
      onProg && onProg(pulled, missing.length);
    });
    const passed=[], scored=[];
    for(const m of pool){
      const a=det[m.name]; if(!a) continue;
      const r=lens.calc(m,a);
      if(r.dir==='none'){ passed.push(m.name); continue; }
      scored.push({m,score:r.score});
    }
    scored.sort((a,b)=>b.score-a.score);
    /* `read` is every market this scan actually charted — not the ten that
       reached the board. Counting the shown rows instead said "3 of 13" when
       the scan had read 24, which understates the work and misstates the odds
       of a market having no trend. */
    return {chosen:scored.slice(0,DEPTH).map(x=>x.m), passed, pulled,
            read:scored.length+passed.length};
  }

  function render(all, det){
    mount.innerHTML='';
    const lens=LENS[LENS_ID]||LENS.momentum;

    paintHour(all,det);

    const nfa=el('details','nfa rv');
    const sum=el('summary');
    sum.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4M12 7.8v.2"/></svg>'+
      '<span>Not advice, and not a signal — this is arithmetic on public data, with every input shown.</span>'+
      '<i>What it cannot do</i>';
    const nfaBody=el('p');
    nfaBody.textContent='It does not know what price does next. It does not account for your position size, '+
      'your risk, or the next hour. Scores are a sort order inside the selected lens, not a rating of the '+
      'market and not a probability.';
    nfa.append(sum,nfaBody); mount.appendChild(nfa);

    /* ── the board ── */
    const s1=el('section','sec rv');
    const segWrap=el('div','r');
    const seg=el('div','seg'); const pill=el('div','pill'); seg.appendChild(pill);
    /* Spot has no funding, so the funding lens is not offered rather than
       offered and empty. If it was the remembered choice, fall back. */
    const lenses=Object.values(LENS).filter(x=>!(isSpot()&&x.id==='funding'));
    if(isSpot()&&LENS_ID==='funding') LENS_ID='momentum';
    lenses.forEach(x=>{
      const b=el('button',null,x.label); b.dataset.lens=x.id;
      if(x.id===LENS_ID) b.className='on';
      b.addEventListener('click',()=>switchLens(x.id,seg,pill));
      seg.appendChild(b);
    });
    if(lenses.length<2) seg.dataset.single='1';
    segWrap.appendChild(seg);
    /* The head carries the lens blurb and nothing else. The passed-over list
       used to be stitched onto the end of it, so switching lens changed the
       height of a paragraph sitting above the rows and shoved the whole page —
       the disclaimer included — which read as the page reloading. It lives
       under the board now, where it belongs and where it can grow freely. */
    s1.appendChild(secHead('Top '+DEPTH+' right now', lens.blurb, segWrap));
    const movePill=()=>{ const on=$('button.on',seg); if(on){ pill.style.left=on.offsetLeft+'px'; pill.style.width=on.offsetWidth+'px'; } };
    requestAnimationFrame(movePill); setTimeout(movePill,80);
    boardHost=el('div','rd-board lead');
    progHost=el('div','rd-count'); progHost.style.marginTop='10px';
    s1.append(boardHost,progHost);
    mount.appendChild(s1);
    boardSkeleton();

    /* ── who is paying ── (funding is a perp mechanism; spot has none) */
    const s2=el('section','sec rv');
    if(!isSpot()){
    s2.appendChild(secHead('Who is paying to hold',
      'Funding settles hourly; the rate here is that hour annualised. Only markets above $'
      +fmtC(FUND_FLOOR)+' open interest — below that, one print annualises to a number nobody can trade.'));
    const liq=all.filter(m=>m.oiNtl>FUND_FLOOR);
    const payShorts=liq.filter(m=>m.fundingApr>0).sort((a,b)=>b.fundingApr-a.fundingApr).slice(0,6);
    const payLongs =liq.filter(m=>m.fundingApr<0).sort((a,b)=>a.fundingApr-b.fundingApr).slice(0,6);
    const fb=el('div','fb');
    [['Shorts collect',payShorts,'up','longs are paying'],
     ['Longs collect', payLongs,'down','shorts are paying']].forEach(([t,list,cls,why])=>{
      const col=el('div','fb-col lead');
      const hd=el('div','fb-hd'); hd.append(el('span','chip '+cls,t), el('span','micro',why)); col.appendChild(hd);
      const mx=Math.max(...list.map(m=>Math.abs(m.fundingApr)),1);
      list.forEach(m=>{
        /* This row is a market, so it goes to that market on the exchange in a
           new tab — it used to route back into this same page, which is where
           the reader already was. */
        const r=el('a','fb-r edge');
        r.href=TRADE_URL(m.name); r.target='_blank'; r.rel='noopener';
        r.title='Open '+m.name+' on Hyperliquid';
        const mm=el('div','m');
        mm.append(el('b',null,m.name), el('s',null,'$'+fmtC(m.oiNtl)+' OI'));
        const bar=el('div','bar'); const bi=el('i'); bi.style.background='var(--'+cls+')'; bar.appendChild(bi);
        const amt=el('div','a');
        amt.innerHTML=pct(m.fundingApr,0)+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
          'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 15.5l7-7M9.5 8.5H16v6.5"/></svg>';
        r.append(coinMark(m.name,24),mm,bar,amt);
        col.appendChild(r);
        void bi.offsetWidth; bi.style.transform='scaleX('+(Math.abs(m.fundingApr)/mx)+')';
      });
      if(!list.length) col.appendChild(el('p','rd-count','No market with meaningful size is paying this side right now.'));
      fb.appendChild(col);
    });
    s2.appendChild(fb); mount.appendChild(s2);
    }

    /* ── every market ── */
    const s3=el('section','sec rv');
    const filt=el('div','r');
    const search=el('input'); search.type='search'; search.placeholder='Filter markets';
    search.setAttribute('aria-label','Filter markets');
    search.style.cssText='height:44px;border-radius:11px;border:1px solid var(--line-2);background:var(--g1);'+
      'color:var(--ink);font-family:\'IBM Plex Mono\',monospace;font-size:13px;padding:0 13px;outline:none;min-width:0;width:min(220px,60vw)';
    /* 56 of the 233 are delisted: a last price and zeroes for everything else.
       They are still the exchange's own answer, so they stay reachable behind
       a toggle rather than being quietly dropped — but they are not what
       "every market" means to anyone reading it. */
    const nDead=all.filter(m=>m.delisted).length;
    const deadBtn=el('button','chip','Show '+nDead+' delisted'); deadBtn.type='button';
    deadBtn.style.cssText='cursor:pointer;height:44px;padding:0 13px;flex:none';
    if(nDead) filt.appendChild(deadBtn);
    /* Markets that exist on the OTHER side. Kept out of the ranking — they are
       not tradeable here — but reachable, because "where else does this trade"
       is a fair question. Hidden by default: in spot mode there are 200-odd of
       them and a wall of unavailable rows is not a market list. */
    const otherBtn=el('button','chip'); otherBtn.type='button';
    otherBtn.style.cssText='cursor:pointer;height:44px;padding:0 13px;flex:none';
    otherBtn.hidden=true;
    filt.appendChild(otherBtn);
    filt.appendChild(search);
    /* the row wraps rather than crushing its own buttons to 35px at 320 */
    filt.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center';
    const live=all.length-nDead;
    /* state first: the subtitle is built from it, so it cannot be declared
       after the header that reads it */
    let sortKey='vol', sortDir=-1, tPage=0, query='', showDead=false;
    const tableSub=()=>'All '+live+' '+(isSpot()?'spot pairs':'perps')+' trading right now, from the same single call. Sortable.'+
      (!nDead? '' : showDead
        ? '  ·  showing the '+nDead+' delisted markets too — the exchange still lists them, but nothing trades on them.'
        : '  ·  '+nDead+' delisted markets are hidden — the exchange still lists them, but they have no volume and no open interest.');
    s3.appendChild(secHead('Every market',tableSub(),filt));
    const tw=el('div','tw'), pg=el('div','pgr');
    const tableSubEl=$('.sec-h p',s3);
    const setSub=()=>{ if(tableSubEl) tableSubEl.textContent=tableSub(); };
    setSub();
    /* The other venue's names, marked absent, appended after everything that
       actually trades here. Loaded on demand — nobody should pay a call for a
       list they have not asked for. */
    let absentRows=null, showAbsent=false;
    /* A market answers to both names. Without this, Spot listed ENA as a
       "perps only" market while UENA — the same asset, trading right there —
       sat a few rows above it. */
    const here=new Set(all.flatMap(m=>[m.name,m.alt].filter(Boolean)));
    otherSide().then(list=>{
      absentRows=(list||[]).filter(m=>!here.has(m.name)&&!(m.alt&&here.has(m.alt)))
        .sort((a,b)=>b.vol-a.vol)
        .map(m=>({...m, absent:true, vol:0, mark:m.mark}));
      if(!absentRows.length) return;
      otherBtn.hidden=false;
      otherBtn.textContent='Show '+absentRows.length+' '+(isSpot()?'perps-only':'spot-only')+' markets';
      otherBtn.addEventListener('click',()=>{
        showAbsent=!showAbsent; tPage=0;
        otherBtn.textContent=(showAbsent?'Hide ':'Show ')+absentRows.length+' '+
          (isSpot()?'perps-only':'spot-only')+' markets';
        otherBtn.classList.toggle('warn',showAbsent);
        paintTable();
      });
    }).catch(()=>{});
    deadBtn.addEventListener('click',()=>{
      showDead=!showDead; tPage=0;
      deadBtn.textContent=showDead? 'Hide '+nDead+' delisted' : 'Show '+nDead+' delisted';
      deadBtn.classList.toggle('warn',showDead);
      setSub(); paintTable();
    });
    const TPER=15;
    /* Spot has no open interest, funding, turnover ratio or impact spread. It
       has supply, so it has a market cap — which perps do not. Showing four
       empty columns would be worse than showing the ones that exist. */
    const COLS = isSpot()
      ? [['name','Market',0],['mark','Price',1],['chg','24h',1],['vol','24h volume',1],
         ['mcap','Market cap',1]]
      : [['name','Market',0],['mark','Price',1],['chg','24h',1],['vol','24h volume',1],
         ['oiNtl','Open interest',1],['fundingApr','Funding APR',1],['volOverOi','Vol / OI',1],['spreadPct','Spread',1]];
    function paintTable(){
      const base=all.concat(showAbsent&&absentRows?absentRows:[]);
      const rows=base.filter(m=>(showDead||!m.delisted)&&(!query||m.name.toLowerCase().includes(query)))
        /* The sign was backwards. sortDir=-1 is meant to be descending, and the
           header arrow renders ▼ for it, but the comparator was sortDir*(y-x),
           which makes -1 ASCENDING — so the default view of the table was the
           233 markets smallest-first, i.e. fifteen rows of $0.00, under a ▼
           that claimed the opposite. It is sortDir*(x-y) now.
           Nulls sink to the bottom in both directions rather than flipping to
           the top when the arrow turns. */
        .slice().sort((a,b)=>{
          if(!!a.absent!==!!b.absent) return a.absent?1:-1;   /* never tradeable here: last */
          const x=a[sortKey],y=b[sortKey];
          if(sortKey==='name') return sortDir*String(x).localeCompare(String(y));
          if(x==null&&y==null) return 0;
          if(x==null) return 1;
          if(y==null) return -1;
          return sortDir*(x-y); });
      const pages=Math.ceil(rows.length/TPER)||1; tPage=clamp(tPage,0,pages-1);
      const _twh=tw.offsetHeight; if(_twh) tw.style.minHeight=_twh+'px';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ tw.style.minHeight=''; }));
      tw.innerHTML='<table><thead><tr>'+COLS.map(c=>
        '<th class="'+(c[2]?'r':'')+'" data-k="'+c[0]+'"'+(c[0]===sortKey?' data-sort="1"':'')+'>'+c[1]+
        '<span class="ar">'+(c[0]===sortKey?(sortDir<0?'▼':'▲'):'')+'</span></th>').join('')+
        '<th class="r nos"></th></tr></thead><tbody></tbody></table>';
      const tb=$('tbody',tw); tb.classList.add('lead');
      rows.slice(tPage*TPER,(tPage+1)*TPER).forEach(m=>{
        const tr=el('tr'); tr.dataset.coin=m.name; if(m.delisted) tr.dataset.dead='1';
        if(m.absent) tr.dataset.dead='1';
        const z=v=>m.delisted?'—':v;
        const nameCell='<td><a class="tw-name" href="'+marketUrl(m)+'" target="_blank" rel="noopener">'+
            '<b>'+m.name+'</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '+
            'stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 15.5l7-7M9.5 8.5H16v6.5"/></svg></a>'+
            (m.delisted?'<span class="chip dead">delisted</span>':'')+
            (m.bridged?'<span class="chip dead">bridged</span>':'')+
            (m.absent?'<span class="chip dead">'+(isSpot()?'perps only':'spot only')+'</span>':'')+'</td>';
        tr.innerHTML = isSpot()
          ? nameCell+
            '<td class="n r">'+px(m.mark)+'</td>'+
            '<td class="n r '+(m.absent?'dim':m.chg>=0?'up':'down')+'">'+(m.absent?'—':pct(m.chg))+'</td>'+
            '<td class="n r">'+(m.absent?'—':'$'+fmtC(m.vol))+'</td>'+
            '<td class="n r dim">'+(m.mcap?'$'+fmtC(m.mcap):'—')+'</td>'
          : nameCell+
            '<td class="n r">'+px(m.mark)+'</td>'+
            '<td class="n r '+(m.delisted||m.absent?'dim':m.chg>=0?'up':'down')+'">'+(m.absent?'—':z(pct(m.chg)))+'</td>'+
            '<td class="n r">'+(m.absent?'—':z('$'+fmtC(m.vol)))+'</td><td class="n r">'+(m.absent?'—':z('$'+fmtC(m.oiNtl)))+'</td>'+
            '<td class="n r '+(m.delisted||m.absent?'dim':m.fundingApr>0?'up':m.fundingApr<0?'down':'dim')+'">'+(m.absent?'—':z(pct(m.fundingApr,1)))+'</td>'+
            '<td class="n r dim">'+(m.volOverOi!=null?m.volOverOi.toFixed(2)+'×':'—')+'</td>'+
            '<td class="n r dim">'+(m.spreadPct!=null?m.spreadPct.toFixed(3)+'%':'—')+'</td>';
        $('.tw-name',tr).prepend(coinMark(m.name,20));
        $('.tw-name',tr).addEventListener('click',e=>e.stopPropagation());
        if(!m.absent){ const td=el('td','r'); td.appendChild(coinLinks(m,{compact:true})); tr.appendChild(td); }
        else tr.appendChild(el('td','r'));
        tr.addEventListener('click',()=>{ location.hash='#/coin/'+encodeURIComponent(m.name); });
        tb.appendChild(tr);
      });
      flick(tb);
      $$('thead th',tw).forEach(th=>th.addEventListener('click',()=>{
        const k=th.dataset.k;
        if(k===sortKey) sortDir*=-1; else { sortKey=k; sortDir=k==='name'?1:-1; }
        tPage=0; paintTable();
      }));
      pager(pg, rows.length, TPER, tPage, i=>{ tPage=i; paintTable(); });
    }
    let sT; search.addEventListener('input',()=>{ clearTimeout(sT);
      sT=setTimeout(()=>{ query=search.value.trim().toLowerCase(); tPage=0; paintTable(); },130); });
    s3.append(tw,pg); mount.appendChild(s3); paintTable();

    const s4=el('section','sec rv');
    s4.appendChild(secHead('Where the trade actually happens',
      'This board reads the exchange. It cannot place an order — that part is yours, on Hyperliquid.'));
    s4.appendChild(refBlock('board')); mount.appendChild(s4);

    const s5=el('section','sec rv');
    /* Six paragraphs of methodology at the bottom of a trading page is a wall
       nobody reads. The same six facts, one line each — and the detail that
       used to be in the paragraph is on the row that needs it. */
    s5.appendChild(secHead('How this board is built',
      'Read straight from the exchange, in your browser. Nothing stored, nothing through a server of\u00a0ours.'));
    const mt=el('div','mt');
    [['api','One call','All '+all.length+' markets — price, change, funding, open interest, volume — in a single request.'],
     ['chart','Charts for the shortlist','Only the ranked rows get candles. Charting all '+all.length+' would take 4.7 minutes of the rate limit.'],
     ['clock','Full hours only','The hour in progress counts for price, not for volume — half an hour of volume is not a low hour.'],
     ['skip','No-trend skipped','Markets whose measures disagree are passed over, and named underneath the board.'],
     ['flat','No predictions','The score is a sort order inside one lens. Change the lens and the same market moves.'],
     ['lock','Reads only','No custody, no funds, no orders. Arithmetic on data anyone can fetch.']]
      .forEach(([ic,t,p])=>{ const c=el('div','mt-c');
        c.innerHTML='<span class="mt-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
          'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+MTI[ic]+'</svg></span>';
        c.append(el('b',null,t), el('p',null,p)); mt.appendChild(c); });
    s5.appendChild(mt); mount.appendChild(s5);

    field(mount); magnetise(mount); reveal(mount);
  }

  /* Everything here comes out of the hourly candles the board already pulled,
     so this section costs no extra call. Three kinds of event, and a market
     only appears if something actually happened to it:
       moved     — the last COMPLETED hour's move, ranked by size
       paid for  — that hour traded well above its own 20-hour average
       crossed   — price crossed its 20-bar average during that hour
     If nothing happened it says so, rather than padding the list with the
     calmest markets on the board and calling them news. */
  function paintHour(all, det){
    pulse.classList.add('lead');
    const liq=all.filter(m=>!m.delisted && m.vol>(isSpot()?SPOT_FLOOR:VOL_FLOOR));
    const rows=[];
    for(const m of liq){
      const a=det&&det[m.name]; if(!a||a.hourChg==null) continue;
      const moved=Math.abs(a.hourChg)>=0.4;
      const paid=a.rvol!=null&&a.rvol>=1.8;
      const crossed=!!a.cross;
      if(!moved&&!paid&&!crossed) continue;
      /* a market whose measures disagree has no reading to give, so it ranks
         below every market that does — "what changed" should open with
         something a reader can act on, not a shrug */
      const dir=momentum(m,a).dir;
      rows.push({m,a,paid,crossed,dir,
        rank:Math.abs(a.hourChg)*(paid?1.6:1)+(crossed?1.2:0)+(dir==='none'?-6:0)});
    }
    rows.sort((x,y)=>y.rank-x.rank);
    const paint=()=>{
    if(!rows.length){
      const q=el('div','rd-quiet');
      q.innerHTML='<b>Nothing moved much.</b><span>No liquid market travelled more than 0.4% or traded '+
        'unusually in the last completed hour. That is a reading, not a missing one.</span>';
      pulseList.appendChild(q);
      return;
    }
    rows.slice(0,4).forEach(r=>{
      const {m,a}=r;
      const vd=verdict(m,a);
      const n=el('div','rd-hr tilt edge'); n.dataset.dir=vd.tone;
      const hd=el('button','rd-hh'); hd.type='button';
      /* Just the number. The strip is headed "what changed in the last hour",
         so "this hour" on every chip was both a repetition and the reason a
         six-letter ticker pushed the chip onto a second line — UANSEM and
         UPUMP wrapped while UFART and SEDA did not, and the verdicts under
         them stopped lining up across the row. */
      const nm=el('div','n'); nm.append(coinMark(m.name,24), el('b',null,m.name),
        Object.assign(el('span','chip '+(a.hourChg>=0?'up':'down')),
          {textContent:pct(a.hourChg), title:pct(a.hourChg)+' over the last completed hour'}));
      hd.appendChild(nm);
      /* the verdict, not the mechanics — the mechanics are one tap away */
      hd.appendChild(Object.assign(el('div','vd'),{textContent:vd.head}));
      const cv=el('span','rd-hcv');
      cv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
      hd.appendChild(cv);
      n.appendChild(hd);
      const body=el('div','rd-hb');
      const why=el('ul','rd-why');
      verdictWhy(m,a).forEach(t=>why.appendChild(el('li',null,t)));
      body.appendChild(why);
      const acts=el('div','rd-hacts');
      acts.appendChild(coinLinks(m));
      body.appendChild(acts);
      n.appendChild(body);
      hd.addEventListener('click',()=>{
        const open=n.dataset.open==='1';
        $$('.rd-hr[data-open="1"]',pulseList).forEach(o=>{ if(o!==n) o.dataset.open='0'; });
        n.dataset.open=open?'0':'1';
      });
      pulseList.appendChild(n);
    });
    if(rows.length>4) pulseList.appendChild(Object.assign(el('p','rd-hmore'),
      {textContent:(rows.length-4)+' more moved — the full ranking is below.'}));
    field(pulseList); flick(pulseList);
    };
    swap(pulseList,paint);
  }

  /* A failure has to replace the skeleton. An unresolved skeleton is the worst
     of both worlds: it looks like work in progress forever. */
  function boardFailed(e){
    if(!boardHost) return;
    boardHost.innerHTML='';
    const c=el('div','card pad');
    c.append(el('p',null, e&&e.code==='RATE'
      ? 'The exchange rate-limited this browser while reading the charts. The rest of the page is live; give it a minute.'
      : 'The charts behind the ranking did not load. The rest of the page is live.'));
    const b=el('button','btn ghost mag','Try again'); b.type='button'; b.style.marginTop='12px';
    b.addEventListener('click',()=>{
      boardSkeleton();
      fillBoard(RADAR.U||U, LENS_ID, RADAR.det||detail, ()=>{})
        .then(built=>{ PASSED=built.passed; READN=built.read;
          RADAR={t:Date.now(),U:RADAR.U||U,short:built.chosen,det:RADAR.det||detail};
          paintBoard(built.chosen,RADAR.det||detail); })
        .catch(boardFailed);
    });
    c.appendChild(b);
    boardHost.appendChild(c); magnetise(c);
  }

  function boardSkeleton(){
    if(!boardHost) return;
    boardHost.innerHTML='';
    for(let i=0;i<DEPTH;i++){ const r=el('div','sk sk-row');
      r.style.opacity=String(1-i*0.055); boardHost.appendChild(r); }
  }

  function paintBoard(list, det){
    if(!boardHost) return;
    if(!Array.isArray(list)||!list.length){ boardSkeleton(); return; }
    const lens=LENS[LENS_ID]||LENS.momentum;
    /* dir is recomputed here against live prices over cached candles, so a row
       chosen a minute ago can have lost its direction since. Drop it rather
       than render "measures disagree — no trend" inside a list of things worth
       watching, which is what a stale cache used to put on screen. */
    const scored=list.map(m=>({m,a:det[m.name],r:det[m.name]?lens.calc(m,det[m.name]):null}))
      .filter(x=>x.r&&x.r.dir!=='none').sort((a,b)=>b.r.score-a.r.score);
    swap(boardHost,()=>{ scored.forEach((x,i)=>boardHost.appendChild(row(x,i,lens))); });
    flick(boardHost); field(boardHost); boardNote();
    const sh=$('.sec-h h2',boardHost.closest('section'));
    if(sh) sh.textContent='Top '+scored.length+' right now';
    if(args&&args[0]){ const t=$$('.mk',boardHost).find(n=>n.dataset.coin===args[0]);
      if(t){ t.dataset.open='1'; buildBody(t); setTimeout(()=>t.scrollIntoView({block:'center'}),80); } }
  }

  /* Switching lens must change the rows and nothing else. It used to clear the
     board to skeletons, which collapsed the section, moved everything below it
     and made the whole page look like it had reloaded. Both lenses read the
     same cached candles, so the old rows can simply stay on screen, dimmed,
     until the new ones are ready — the board never loses its height and no
     other part of the page moves at all. */
  function switchLens(id,seg,pill){
    if(LENS_ID===id || boardHost?.dataset.busy) return;
    LENS_ID=id; try{ localStorage.setItem('hf.lens',id); }catch(e){}
    $$('button',seg).forEach(y=>y.classList.toggle('on',y.dataset.lens===id));
    const on=$('button.on',seg); if(on){ pill.style.left=on.offsetLeft+'px'; pill.style.width=on.offsetWidth+'px'; }
    const sub=$('.sec-h p',boardHost.closest('section'));
    if(sub) sub.textContent=LENS[id].blurb;
    boardHost.dataset.busy='1';
    (async()=>{
      try{
        const built=await fillBoard(RADAR.U,id,RADAR.det,(d,t)=>{
          if(progHost) progHost.textContent='reading charts · '+d+' of '+t; });
        RADAR.short=built.chosen; PASSED=built.passed; READN=built.read;
        delete boardHost.dataset.busy;
        paintBoard(built.chosen,RADAR.det);
      }catch(e){ boardFailed(e); } finally { delete boardHost.dataset.busy; }
    })();
  }

  /* Which markets were dropped and why, under the rows rather than above them. */
  function boardNote(){
    if(!progHost) return;
    /* "of N read", not "of N liquid": N is the pool this scan charted, which
       is neither the ten shown nor every market above the volume floor. */
    progHost.textContent = PASSED.length
      ? PASSED.length+' of the '+(READN||PASSED.length)+' markets read were passed over for having no trend: '+
        PASSED.slice(0,6).join(', ')+(PASSED.length>6?' and '+(PASSED.length-6)+' more':'')
      : '';
  }

  function row(x,i,lens){
    const {m,a,r}=x;
    const n=el('div','mk tilt edge'); n.dataset.dir=r.dir; n.dataset.coin=m.name;
    n.appendChild(el('div','stripe'));
    /* Not a <button>: the coin name inside it is a link to the market on
       Hyperliquid, and a link nested in a button is invalid and unreliable.
       role + tabindex + a keydown handler give back what the button gave. */
    const h=el('div','mk-h'); h.setAttribute('role','button'); h.tabIndex=0;
    h.appendChild(el('div','mk-rank',String(i+1).padStart(2,'0')));
    const id=el('div','mk-id');
    const nm=el('div','n');
    const link=el('a','mk-name'); link.href=TRADE_URL(m.name);
    link.target='_blank'; link.rel='noopener';
    link.title='Open '+m.name+' on Hyperliquid';
    link.innerHTML='<b>'+m.name+'</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M8.5 15.5l7-7M9.5 8.5H16v6.5"/></svg>';
    link.addEventListener('click',e=>e.stopPropagation());
    nm.append(coinMark(m.name,26), link, el('span','chip '+(m.chg>=0?'up':'down'), pct(m.chg)));
    (r.flags||[]).forEach(f=>{ const c2=el('span','chip warn',f.t); c2.setAttribute('data-tip',f.w); nm.appendChild(c2); });
    id.append(nm, el('div','px', px(m.mark)+'  ·  $'+fmtC(m.vol)+' 24h'));
    h.appendChild(id);
    const sp=el('div','mk-spark');
    sp.innerHTML=spark(a.spark, m.chg>=0?tok('--up'):tok('--down'), 160, 38);
    h.appendChild(sp);
    const read=el('div','mk-read');
    const lean=el('div','mk-lean');
    lean.innerHTML='<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
      (r.dir==='long'?'<path d="M12 19V5M6 11l6-6 6 6"/>':r.dir==='short'?'<path d="M12 5v14M6 13l6 6 6-6"/>':'<path d="M5 12h14"/>')+'</svg><span>'+r.leanText+'</span>';
    const votes=el('div','mk-votes');
    r.votes.forEach(v=>{ const b=el('i'); if(v.vote!=='flat') b.dataset.v=v.vote; votes.appendChild(b); });
    read.append(lean,votes); h.appendChild(read);
    const sc=el('div','mk-sc');
    const b=el('b'); countUp(b,r.score,v=>String(Math.round(v)),620);
    sc.append(b, el('s',null,lens.label)); h.appendChild(sc);
    h.appendChild(coinLinks(m,{compact:true}));
    const cv=el('span','mk-cv');
    cv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
    h.appendChild(cv);
    n.append(h, el('div','mk-body'));
    const toggle=()=>{
      const open=n.dataset.open==='1';
      $$('.mk[data-open="1"]').forEach(o=>{ if(o!==n) o.dataset.open='0'; });
      n.dataset.open=open?'0':'1';
      if(!open) buildBody(n);
    };
    h.addEventListener('click',toggle);
    h.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    n.__x=x;
    return n;
  }

  function buildBody(n){
    const body=$('.mk-body',n);
    if(body.dataset.built==='1') return;
    body.dataset.built='1';
    const {m,a,r}=n.__x;
    /* the row opened with a wall of numbers and no sentence. The sentence
       comes first now, in the same words the last-hour strip uses. */
    const vd=verdict(m,a);
    const say=el('div','mk-say'); say.dataset.tone=vd.tone;
    say.append(el('b',null,vd.head));
    const why=el('ul','rd-why');
    verdictWhy(m,a).forEach(t=>why.appendChild(el('li',null,t)));
    say.appendChild(why);
    body.appendChild(say);
    const wk=el('div','wk');
    r.votes.forEach(v=>{
      const i=el('div','wk-i'); i.dataset.v=v.vote;
      i.setAttribute('data-tip', meaningTip(v,m,a));
      i.append(el('div','v', v.vote==='for'?'↑':v.vote==='against'?'↓':'·'),
               el('b',null,v.label), el('div','n',v.val));
      wk.appendChild(i);
    });
    body.appendChild(wk);
    const grid=el('div','pr-grid');
    const P=(k,v,s,tip,cls)=>{ const n2=el('div','pr');
      const kk=el('div','k'); kk.append(el('span','micro',k)); if(tip) kk.appendChild(qm(tip));
      n2.append(kk, el('div','v'+(cls?' '+cls:''),v), el('div','s',s)); grid.appendChild(n2); };
    const atrPct=a.atr? a.atr/a.last*100 : null;
    const cost=(TAKER*2*100)+(m.spreadPct||0);
    P('Expected move', atrPct? atrPct.toFixed(2)+'%':'—','1×ATR · '+(a.atr?px(a.atr):'—'),'atrmove');
    P('Volatility', a.atrExp? a.atrExp.toFixed(2)+'×':'—',
      a.atrExp? (a.atrExp>1.25?'above its own average':a.atrExp<0.8?'unusually quiet':'about normal'):'—','atr',
      a.atrExp>1.25?'warn':'');
    P('Funding', pct(m.fundingApr,1), m.fundingApr>0?'longs pay shorts':m.fundingApr<0?'shorts pay longs':'flat','fundapr',
      m.fundingApr>0?'down':m.fundingApr<0?'up':'');
    P('Cost to trade', cost.toFixed(3)+'%','taker both ways plus the impact spread','breakeven',cost>0.2?'warn':'');
    body.appendChild(grid);
    /* A button that says "trade BTC" has to open BTC. It used to open the
       referral link, which lands in the app on whatever market it feels like —
       the label was writing a cheque the link didn't cash. The referral is a
       separate, quieter line underneath, for a reader who has no account yet. */
    const a1=el('a','btn ghost mag');
    a1.href=TRADE_URL(m.name); a1.target='_blank'; a1.rel='noopener';
    a1.innerHTML='<svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>Open '+m.name+' on Hyperliquid';
    a1.style.alignSelf='flex-start';
    a1.addEventListener('click',()=>track('trade:row'));
    body.appendChild(a1);
    const nx=el('p','rd-count');
    nx.innerHTML='No account there yet? <a href="'+REF+'" target="_blank" rel="noopener">Open one</a> — '+
      'a referral link, 4% off taker fees, and it changes nothing above.';
    $('a',nx).addEventListener('click',()=>track('ref:row'));
    body.appendChild(nx);
    field(body); magnetise(body);
  }
};

/* ═══════════════════════════════════════════════════════════════
   14 · HOME
   The hero is a spring mesh with real markets falling through it.
   The grid is a chart grid; the discs are markets, massed by open
   interest. The cursor is a mass that bends the mesh, and the push
   on the discs is gated by cursor SPEED — sweep fast to scatter
   them, rest the pointer and you can read one.
   ═══════════════════════════════════════════════════════════════ */
function heroField(host, markets){
  markets=markets||[];
  const cv=el('canvas'); host.appendChild(cv);
  let W=0,H=0,c=null,raf=null,run=false;
  const COLS=17, ROWS=11;
  let nodes=[], bodies=[];
  let mx=-1e4,my=-1e4,lx=-1e4,ly=-1e4,speed=0,grab=-1,T=Math.random()*100;

  function size(){
    const r=host.getBoundingClientRect(); if(!r.width||!r.height) return false;
    const same = Math.abs(r.width-W)<0.5 && Math.abs(r.height-H)<0.5 && nodes.length;
    W=r.width; H=r.height;
    /* Markets landing mid-flight must not reset the mesh under the reader's
       cursor, so the lattice is only rebuilt when the box actually changed. */
    if(!same){
      c=fit(cv,W,H,1.75);
      nodes=[];
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
        const rx=(x/(COLS-1))*W, ry=(y/(ROWS-1))*H;
        nodes.push({gx:x,gy:y,rx,ry,x:rx,y:ry,vx:0,vy:0,q:0});
      }
    }
    /* Radius encodes open interest as area^0.35 — big enough a difference to
       read at a glance, gentle enough that BTC doesn't swallow the box. The
       discs are furniture on top of the mesh, so they stay small. */
    const S=Math.min(W,H), N=W<520?5:7;
    const maxOi=Math.max(...markets.map(m=>m.oiNtl),1);
    bodies=markets.slice(0,N).map((m,i)=>{
      const rel=Math.pow(Math.max(m.oiNtl,1)/maxOi,0.35);
      const r0=clamp(S*0.052+rel*S*0.048, 17, S*0.115);
      /* Uniform random start clumps: with seven discs in a box, three of them
         landing in one corner is the common case, not the unlucky one, and the
         first frame is the whole first impression. A golden-angle spiral from
         the centre spreads them evenly every time and still looks unplanned,
         with a little jitter so it is not visibly a pattern. */
      const b=bodies[i], pad=r0*1.36;
      const ang=i*2.39996323, rad=Math.sqrt((i+0.55)/N);
      const jx=(Math.random()-.5)*S*0.05, jy=(Math.random()-.5)*S*0.05;
      const sx=clamp(W/2+Math.cos(ang)*rad*(W/2-pad)+jx, pad, Math.max(pad,W-pad));
      const sy=clamp(H/2+Math.sin(ang)*rad*(H/2-pad)+jy, pad, Math.max(pad,H-pad));
      return {n:m.name, chg:m.chg, r:r0,
        x:b?b.x:sx, y:b?b.y:sy,
        vx:b?b.vx:(Math.random()-.5)*.4, vy:b?b.vy:(Math.random()-.5)*.4};
    });
    return true;
  }
  size();

  const nearBody=(x,y)=>{ for(let i=0;i<bodies.length;i++){ const b=bodies[i];
    if(Math.hypot(b.x-x,b.y-y)<b.r) return i; } return -1; };
  host.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect();
    mx=e.clientX-r.left; my=e.clientY-r.top; grab=nearBody(mx,my);
    if(grab>=0){ host.setPointerCapture(e.pointerId); e.preventDefault(); } });
  host.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect();
    host.classList.add('touched');           /* the hint has done its job */
    const nx=e.clientX-r.left, ny=e.clientY-r.top;
    if(lx>-1e3) speed=Math.min(70, Math.hypot(nx-lx,ny-ly)*3.4 + speed*0.55);
    lx=nx; ly=ny; mx=nx; my=ny; },{passive:true});
  const release=()=>{ grab=-1; };
  ['pointerup','pointercancel'].forEach(ev=>host.addEventListener(ev,release));
  host.addEventListener('pointerleave',()=>{ release(); mx=my=-1e4; lx=ly=-1e4; speed=0; });

  function frame(){
    if(!run) return;
    raf=requestAnimationFrame(frame);
    if(!cv.isConnected){ run=false; cancelAnimationFrame(raf); return; }
    step();
  }

  function step(){
    if(!W&&!size()) return;
    speed*=0.9;
    T+=0.016;

    /* the mesh: every node is a spring back to its rest position, pushed away
       from the pointer with a smooth falloff. A slow two-harmonic swell rides
       on top of the rest positions so the surface is alive before anyone
       touches it — on a phone, that swell is the whole animation. */
    const R=Math.min(W,H)*0.42, R2=R*R;
    const AMB=Math.min(W,H)*0.014, REACH=Math.min(W,H)*0.085;
    for(const n of nodes){
      let px=0,py=0;
      if(mx>-1e3){
        const dx=n.rx-mx, dy=n.ry-my, d2=dx*dx+dy*dy;
        if(d2<R2){ const d=Math.sqrt(d2)||1, f=(1-d/R); const push=f*f*REACH;
          px=dx/d*push; py=dy/d*push; }
      }
      const wy=Math.sin(n.gx*0.78+T*0.85)*AMB + Math.sin(n.gy*1.16-T*0.57)*AMB*0.62;
      const wx=Math.sin(n.gy*0.64+T*0.48)*AMB*0.5;
      const tx=n.rx+px+wx, ty=n.ry+py+wy;
      n.vx=(n.vx+(tx-n.x)*0.16)*0.82;
      n.vy=(n.vy+(ty-n.y)*0.16)*0.82;
      n.x+=n.vx; n.y+=n.vy;
      /* how far this node has been dragged off rest, past the ambient swell —
         0 at rest, 1 under the cursor. This drives colour, not position. */
      n.q=clamp((Math.hypot(n.x-n.rx,n.y-n.ry)-AMB*1.35)/(REACH*0.62),0,1);
    }

    /* the markets: elastic collisions, walls, and a push gated by cursor speed */
    for(const b of bodies){
      if(mx>-1e3){
        const dx=b.x-mx, dy=b.y-my, d=Math.hypot(dx,dy)||1;
        if(d<b.r+110){ const push=(speed/70)*(1-d/(b.r+110))*2.9;
          b.vx+=dx/d*push; b.vy+=dy/d*push; }
      }
      b.x+=b.vx; b.y+=b.vy; b.vx*=0.985; b.vy*=0.985;
      /* bounce on the halo, not the disc — otherwise the soft ring clips the box */
      const p=b.r*1.36;
      if(b.x<p){b.x=p;b.vx=Math.abs(b.vx)*.8}
      if(b.x>W-p){b.x=W-p;b.vx=-Math.abs(b.vx)*.8}
      if(b.y<p){b.y=p;b.vy=Math.abs(b.vy)*.8}
      if(b.y>H-p){b.y=H-p;b.vy=-Math.abs(b.vy)*.8}
    }
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i], b2=bodies[j];
      const dx=b2.x-a.x, dy=b2.y-a.y, d=Math.hypot(dx,dy)||1, min=a.r+b2.r;
      if(d<min){
        const nx=dx/d, ny=dy/d, ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b2.x+=nx*ov; b2.y+=ny*ov;
        const p=(a.vx-b2.vx)*nx+(a.vy-b2.vy)*ny;     /* equal-mass elastic exchange */
        a.vx-=p*nx; a.vy-=p*ny; b2.vx+=p*nx; b2.vy+=p*ny;
      }
    }
    if(grab>=0){ const b=bodies[grab];
      b.vx=(mx-b.x)*0.3; b.vy=(my-b.y)*0.3; b.x=mx; b.y=my; }

    draw();
  }

  /* Drawing is split from stepping so the surface can be painted once with no
     animation frame at all. A canvas that only ever paints inside rAF is blank
     in any context that suspends frames — a background tab, a hidden pane, a
     reduced-motion setting — and blank looks like a bug, not a preference. */
  function draw(){
    if(!W&&!size()) return;
    const R=Math.min(W,H)*0.42;
    const mint=tok('--mint'), line=tok('--line-3'), ink=tok('--ink'), up=tok('--up'), dn=tok('--down');
    c.clearRect(0,0,W,H);
    c.lineJoin='round'; c.lineCap='round';

    /* pass 1 — the resting grid, one stroke per line */
    c.lineWidth=1;
    for(let y=0;y<ROWS;y++){ c.beginPath();
      for(let x=0;x<COLS;x++){ const n=nodes[y*COLS+x]; x?c.lineTo(n.x,n.y):c.moveTo(n.x,n.y); }
      const t=Math.abs(0.5-y/(ROWS-1))*2;                     /* fade toward top and bottom edges */
      c.strokeStyle=hexA(line,.62-t*0.26); c.stroke(); }
    for(let x=0;x<COLS;x++){ c.beginPath();
      for(let y=0;y<ROWS;y++){ const n=nodes[y*COLS+x]; y?c.lineTo(n.x,n.y):c.moveTo(n.x,n.y); }
      const t=Math.abs(0.5-x/(COLS-1))*2;
      c.strokeStyle=hexA(line,.50-t*0.22); c.stroke(); }

    /* pass 2 — energy. Only the segments actually bent get restroked in mint,
       brightness and weight proportional to how far they were pulled. Typically
       a few dozen segments, so this is cheap; at rest it draws nothing. */
    const seg=(a,b2)=>{ const q=(a.q+b2.q)/2; if(q<0.06) return;
      c.lineWidth=1+q*1.5; c.strokeStyle=hexA(mint,0.18+q*0.72);
      c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b2.x,b2.y); c.stroke(); };
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS-1;x++) seg(nodes[y*COLS+x],nodes[y*COLS+x+1]);
    for(let x=0;x<COLS;x++) for(let y=0;y<ROWS-1;y++) seg(nodes[y*COLS+x],nodes[(y+1)*COLS+x]);
    for(const n of nodes){ if(n.q<0.34) continue;
      c.fillStyle=hexA(mint,(n.q-0.34)*1.2); c.beginPath(); c.arc(n.x,n.y,1.1+n.q*1.7,0,7); c.fill(); }

    if(mx>-1e3){
      const g=c.createRadialGradient(mx,my,0,mx,my,R*0.8);
      g.addColorStop(0,hexA(mint,.15)); g.addColorStop(1,hexA(mint,0));
      c.fillStyle=g; c.beginPath(); c.arc(mx,my,R*0.8,0,7); c.fill();
    }
    for(const b of bodies){
      const hov=Math.hypot(b.x-mx,b.y-my)<b.r;
      const col=b.chg>=0?up:dn;
      c.globalAlpha=.16; c.fillStyle=col;
      c.beginPath(); c.arc(b.x,b.y,b.r*1.34,0,7); c.fill(); c.globalAlpha=1;
      c.fillStyle=hov?col:tok('--g2');
      c.beginPath(); c.arc(b.x,b.y,b.r,0,7); c.fill();
      c.lineWidth=1.4; c.strokeStyle=col; c.globalAlpha=hov?1:.7; c.stroke(); c.globalAlpha=1;
      c.fillStyle=hov?tok('--on-mint'):ink;
      c.font='600 '+Math.max(10,Math.min(14,b.r*.36))+'px "IBM Plex Mono", monospace';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText(b.n,b.x,b.y-3);
      c.font='500 '+Math.max(8,Math.min(11,b.r*.28))+'px "IBM Plex Mono", monospace';
      c.fillStyle=hov?tok('--on-mint'):col;
      c.fillText((b.chg>=0?'+':'−')+Math.abs(b.chg).toFixed(1)+'%', b.x, b.y+Math.max(9,b.r*.36));
    }
  }
  /* Paint before anything is scheduled: one settled frame that stands on its
     own if no animation frame ever arrives. */
  const paintOnce=()=>{ if(!size()) return false; step(); draw(); return true; };
  let retry=null;
  if(!paintOnce()){
    /* The stage can still have no height on first mount. Retry on a timer, not
       an animation frame: timers keep running in the contexts where frames are
       suspended, which are exactly the contexts this fallback exists for. */
    let tries=0;
    retry=setInterval(()=>{ if(!cv.isConnected||paintOnce()||++tries>60) { clearInterval(retry); retry=null; } },50);
  }
  const io=new IntersectionObserver(es=>{
    const on=es[0].isIntersecting&&!RM();
    if(on&&!run){ if(size()){ run=true; raf=requestAnimationFrame(frame); } }
    else if(!on&&run){ run=false; cancelAnimationFrame(raf); }
  },{threshold:0});
  io.observe(host);
  if(!RM()&&W){ run=true; raf=requestAnimationFrame(frame); }
  /* If the pane is hidden or the tab is backgrounded, rAF never fires. Repaint
     when it comes back, so a reader who switches to the tab sees the surface
     immediately rather than waiting on the next frame. */
  const onVis=()=>{ if(!document.hidden && cv.isConnected){ paintOnce();
    if(!run&&!RM()){ run=true; raf=requestAnimationFrame(frame); } } };
  document.addEventListener('visibilitychange',onVis);
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected){size(); if(!run) draw();}},150);};
  addEventListener('resize',onR);
  ACTIVE.push(()=>{ run=false; cancelAnimationFrame(raf); io.disconnect(); if(retry) clearInterval(retry);
    removeEventListener('resize',onR); document.removeEventListener('visibilitychange',onVis); });
  /* The mesh runs from the first frame with no data at all, and the markets
     drop into it when the call lands. A hero that is an empty box until the
     network answers is a worse first impression than no hero. */
  return { setMarkets(list){ markets=list||[]; if(size()){ step(); draw(); } },
           state(){ return {run, W, H, nodes:nodes.length, bodies:bodies.length}; } };
}

ROUTES.home=async function(){

    const a=el('a','hm-c tilt edge'); a.href=href; if(soon) a.dataset.soon='1';

    a.append(i, el('b',null,t), el('p',null,p));
    const g=el('span','go');
    g.innerHTML=(soon?'Coming next':go2)+'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>';
    a.appendChild(g); grid.appendChild(a);
  });
  cards.appendChild(grid);

  /* ── 1 · the board, live ──────────────────────────────────────────

    'Ranked out of every market with real volume behind it. Same arithmetic as the radar, same numbers.'));

  sBoard.appendChild(miniHost);

  boardMore.innerHTML='See all ten, with every measure<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>';
  sBoard.appendChild(boardMore);
  PAGE.appendChild(sBoard);

  /* ── 2 · how a reading is built ───────────────────────────────────

     apart into the seven measures that vote on it. */
  const sHow=el('section','sec rv');
  sHow.appendChild(secHead('How a reading is built',
    'Seven measures vote. Nothing is weighted by opinion, and every one of them is on screen.'));
  const howHost=el('div','hm-how');
  sHow.appendChild(howHost);
  PAGE.appendChild(sHow);

  /* ── 3 · read any wallet ──────────────────────────────────────────
     The other half of the site, one field wide. */

  sWal.appendChild(secHead('Or read somebody’s account',
    'Paste an address and get the record behind it — what it holds, what it has traded, and what that says about how it trades.'));
  const wbox=el('form','hm-wal card pad');
  const wf2=el('div','hm-wf');
  const wi=el('input'); wi.type='text'; wi.spellcheck=false; wi.autocomplete='off';
  /* a hex address is not a sentence: no autocorrect, no capitalisation, and

  wi.placeholder='0x… paste any address';
  wi.setAttribute('aria-label','Wallet address');
  const wb=el('button','btn pri mag','Read wallet'); wb.type='submit';
  wf2.append(wi,wb); wbox.appendChild(wf2);
  const werr=el('p','hm-werr'); werr.hidden=true; wbox.appendChild(werr);
  wbox.addEventListener('submit',e=>{
    e.preventDefault();
    const v=(wi.value||'').trim();
    /* Checked here rather than after a route change, so a typo costs nothing */
    if(!/^0x[0-9a-fA-F]{40}$/.test(v)){
      werr.textContent='That is not an address. An EVM address is 0x followed by 40 hex characters.';
      werr.hidden=false; wi.focus(); return;
    }
    werr.hidden=true; location.hash='#/wallet/'+v.toLowerCase();
  });
  wi.addEventListener('input',()=>{ werr.hidden=true; });
  sWal.appendChild(wbox);
  PAGE.appendChild(sWal);

  /* ── 4 · referral, last ───────────────────────────────────────────*/
  const ref=el('section','sec rv');
  ref.appendChild(secHead('Where the trade actually happens',
    'Everything above is free to read. Acting on any of it needs an account on Hyperliquid.'));
  ref.appendChild(refBlock('home'));
  PAGE.appendChild(ref);

  field(PAGE); magnetise(PAGE); reveal(PAGE);
  const mesh=heroField(stage, []);          /* alive immediately, empty for now */
  window.__mesh=mesh;                       /* handle for the render tests */

  /* one call. It fills the live strip, feeds the hero, and warms the cache the
     radar reads from — so clicking through costs nothing. */
  try{
    const U=await loadUniverse();
    RADAR={t:Date.now(),U,short:RADAR.short,det:RADAR.det||{}};
    const oi=U.reduce((s,m)=>s+(m.oiNtl||0),0);
    const up=U.filter(m=>m.chg>0).length;
    const wf=isSpot()? null
      : U.filter(m=>m.oiNtl>FUND_FLOOR).sort((a,b)=>Math.abs(b.fundingApr)-Math.abs(a.fundingApr))[0];
    live.innerHTML='';
    const U2=(html)=>{ const n=el('span','u'); n.innerHTML=html; live.appendChild(n); };
    U2('<i></i><b>'+U.length+'</b> '+(isSpot()?'spot pairs':'markets')+' live');
    if(!isSpot()) U2('<b>$'+fmtC(oi)+'</b> open interest');
    else U2('<b>$'+fmtC(U.reduce((s,m)=>s+(m.vol||0),0))+'</b> traded today');
    U2('<b>'+Math.round(up/U.length*100)+'%</b> above yesterday');
    if(wf&&!isSpot()){ U2('widest funding <b>'+pct(wf.fundingApr,0)+'</b> on '+wf.name);
      live.lastChild.title='Annualised from the current hourly rate. Markets under $'
        +fmtC(FUND_FLOOR)+' open interest are excluded — one hourly print on a thin book '
        +'annualises to a number nobody can trade.'; }
    mesh.setMarkets(U.slice().sort((a,b)=>b.vol-a.vol));

    /* The board preview and the worked example both need candles, so they are
       filled from ONE set of chart calls, after the strip and the mesh are
       already on screen. Six markets, six at a time: one wave, ~250ms, and the
       results land in the same RADAR.det the radar reads — so clicking through
       to the radar arrives with a third of its work already done. */
    fillHome(U).catch(()=>{
      miniHost.innerHTML='';
      miniHost.appendChild(el('p','rd-count','The charts did not answer just now — the radar reads them again on arrival.'));
      howHost.innerHTML='';
    });
  }catch(e){
    live.innerHTML='';
    const n=el('span','u'); n.textContent='the exchange is not answering right now';
    live.appendChild(n);
    if(heroHint) heroHint.textContent='sweep the mesh';   /* nothing to drag yet */
    miniHost.innerHTML=''; howHost.innerHTML='';
  }

  async function fillHome(U){
    const det=RADAR.det||(RADAR.det={});
    const byVol=U.slice().filter(m=>m.vol>(isSpot()?SPOT_FLOOR:VOL_FLOOR)).sort((a,b)=>b.vol-a.vol);
    const pool=(byVol.length>=6?byVol:U.slice().sort((a,b)=>b.vol-a.vol)).slice(0,14);
    await inParallel(pool.filter(m=>!det[m.name]), 6, async m=>{
      try{
        const now=Date.now();
        const bars=await apiR({type:'candleSnapshot',req:{coin:m.key||m.name,interval:'1h',
          startTime:now-230*3600*1000,endTime:now}},{ttl:60000});
        if(Array.isArray(bars)&&bars.length>30) det[m.name]=analyse(m,bars);
      }catch(e){}
    });
    const ranked=pool.map(m=>({m,a:det[m.name],r:det[m.name]?momentum(m,det[m.name]):null}))
      .filter(x=>x.r&&x.r.dir!=='none').sort((a,b)=>b.r.score-a.r.score);
    if(!ranked.length){ miniHost.innerHTML=''; howHost.innerHTML=''; return; }

    /* the three rows */
    miniHost.innerHTML='';
    ranked.slice(0,3).forEach((x,i)=>miniHost.appendChild(miniRow(x,i)));
    field(miniHost); flick(miniHost);

    /* the worked example — the market at the top, taken apart */
    howHost.innerHTML='';
    howHost.appendChild(measureTable(ranked[0]));
    field(howHost);
  }

  /* Every class here is hm- prefixed. Bare names like .sc, .id and .n are
     already taken by unscoped global rules elsewhere in this stylesheet — .sc
     is the share-card grid, and using it here silently made each row 147px
     tall with a 36px gap inside the score cell. Fourth collision of this kind
     in the project; see the bare-class list printed by the build check. */
  function miniRow(x,i){
    const {m,r}=x;
    const a=el('a','hm-row tilt edge'); a.href='#/coin/'+encodeURIComponent(m.name);
    a.dataset.dir=r.dir;
    a.appendChild(el('div','hm-stripe'));
    a.appendChild(el('div','hm-rk',String(i+1).padStart(2,'0')));
    const id=el('div','hm-idc');
    const nm=el('div','hm-nm');
    nm.append(coinMark(m.name,24), el('b',null,m.name),
      el('span','chip '+(m.chg>=0?'up':'down'),pct(m.chg)));
    id.append(nm, el('div','hm-px', px(m.mark)+'  ·  $'+fmtC(m.vol)+' 24h'));
    a.appendChild(id);
    const lean=el('div','hm-ln');
    lean.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+
      (r.dir==='long'?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>')+
      '</svg><span>'+r.leanText+'</span>';
    a.appendChild(lean);
    const sc=el('div','hm-sc'); const b=el('b'); countUp(b,r.score,v=>String(Math.round(v)),620);
    sc.append(b, el('s',null,'momentum')); a.appendChild(sc);
    return a;
  }

  /* Seven rows, one per measure, each with its number and the vote it casts.
     This is the same votes array the radar renders — not a mock-up of it. */

     changes as the board does — it is read from the same live ranking, never
     pinned to a name. Its header links through to its own page. */

    const {m,a,r}=x;
    const wrap=el('div','hm-hw card');

    hd.innerHTML='<b>'+m.name+'</b><span class="chip '+(m.chg>=0?'up':'down')+'">'+pct(m.chg)+'</span>'+
      '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '+
      'stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>'+
      '<s>currently top of the board — open its page</s>';
    wrap.appendChild(hd);
    wrap.appendChild(measureList(m,a,r));
    wrap.appendChild(voteFoot(r));
    wrap.appendChild(el('p','hm-fp','A direction needs a two-measure majority before it counts at all. '+
      'The score sorts inside that — it is a sort order, not a probability, and it does not know what price does next.'));
    return wrap;
  }

  /* Seven rows that open. Closed, it is the number; open, it is what the
     number is and what it currently reads. */

    const list=el('div','hm-ms');
    r.votes.forEach(v=>{
      const row=el('div','hm-msr'); row.dataset.v=v.vote;
      const hd=el('button','hm-msh'); hd.type='button';

      ic.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+
        (v.vote==='for'?'<path d="M12 19V5M6 11l6-6 6 6"/>':
         v.vote==='against'?'<path d="M12 5v14M6 13l6 6 6-6"/>':'<path d="M5 12h14"/>')+'</svg>';

      cv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
      hd.appendChild(cv);
      row.appendChild(hd);
      const mn=meaningFor(v,m,a);
      if(mn){
        const body=el('div','hm-msb');
        body.append(el('p','hm-what',mn.what), el('p','hm-now',mn.now));
        row.appendChild(body);
        hd.addEventListener('click',()=>{
          const open=row.dataset.open==='1';
          $$('.hm-msr[data-open="1"]',list).forEach(o=>{ if(o!==row) o.dataset.open='0'; });
          row.dataset.open=open?'0':'1';
        });
      } else { hd.disabled=true; cv.hidden=true; }
      list.appendChild(row);
    });
    return list;
  }

  /* "6 for · 0 against" as a sentence was the least legible thing on the page.
     It is a proportion, so it is drawn as one: a single bar split into the
     seven votes, coloured by which way each one points. */
  function voteFoot(r){
    const foot=el('div','hm-ft');
    const l=el('div','hm-fl');
    const bar=el('div','hm-vbar');
    r.votes.forEach(v=>{ const i=el('i'); if(v.vote!=='flat') i.dataset.v=v.vote; bar.appendChild(i); });
    l.appendChild(bar);
    const key=el('div','hm-vkey');
    const part=(n,cls,label)=>{ if(!n) return;
      const sp=el('span',cls); sp.append(el('b',null,String(n)),
        document.createTextNode(' '+label)); key.appendChild(sp); };
    const flat=r.votes.length-r.for-r.against;
    part(r.for,'up','read up');
    part(r.against,'down','read down');
    part(flat,'dim','neutral');
    l.appendChild(key);
    foot.appendChild(l);
    const tot=el('div','hm-tot');
    const b=el('b'); countUp(b,r.score,v=>String(Math.round(v)),700);
    tot.append(b, el('s',null,'agreement'));
    foot.appendChild(tot);
    return foot;
  }
};

/* ═══════════════════════════════════════════════════════════════
   15 · COIN — one market, everything a trader asks about it
   ═══════════════════════════════════════════════════════════════ */

/* ── candles ──────────────────────────────────────────────────────
   A real chart, not a sparkline: bodies and wicks, a volume strip
   underneath, three moving averages over the top, and a crosshair that
   reads out the bar under the pointer. Drawn on one canvas at device
   resolution; the crosshair repaints only the overlay so dragging across
   200 bars costs nothing. */
function candleChart(host, opts){
  const wrap=el('div','ck');
  const cv=el('canvas'), ov=el('canvas','ov');
  const tip=el('div','ck-tip');
  wrap.append(cv,ov,tip); host.appendChild(wrap);
  let bars=[], W=0,H=0,c=null,o=null, geo=null, hover=-1;
  /* which averages are drawn — the legend is a control, not a caption */
  const on={s20:true,s50:true,s100:true};
  /* `opts && opts.mas!==false` is undefined when opts is omitted, which is
     falsy — the averages silently never drew. */
  const mas = !opts || opts.mas!==false;

  const PADL=0, PADR=62, PADT=14, PADB=22, VOLH=0.20;

  function size(){
    const r=wrap.getBoundingClientRect(); if(!r.width||!r.height) return false;
    W=r.width; H=r.height; c=fit(cv,W,H,2); o=fit(ov,W,H,2); return true;
  }
  function compute(){
    if(!bars.length){ geo=null; return; }
    const plotW=W-PADL-PADR, plotH=(H-PADT-PADB)*(1-VOLH), volTop=PADT+plotH+10;
    const volH=(H-PADT-PADB)-plotH-10;
    let lo=Infinity, hi=-Infinity, vmax=0;
    for(const b of bars){ if(b.l<lo)lo=b.l; if(b.h>hi)hi=b.h; if(b.v>vmax)vmax=b.v; }
    for(const k of ['s20','s50','s100']) if(mas&&on[k]) for(const b of bars){
      const v=b[k]; if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } }
    const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
    const step=plotW/bars.length;
    geo={lo,hi,vmax,plotW,plotH,volTop,volH,step,
      x:i=>PADL+step*(i+0.5),
      y:v=>PADT+plotH-((v-lo)/(hi-lo))*plotH,
      vy:v=>volTop+volH-(vmax?(v/vmax)*volH:0)};
  }
  function draw(){
    if(!c||!geo){ if(c) c.clearRect(0,0,W,H); return; }
    const up=tok('--up'), dn=tok('--down'), line=tok('--line'), ink4=tok('--ink-4');
    c.clearRect(0,0,W,H);
    /* price gridlines, five of them, labelled on the right */
    c.font='500 10px "IBM Plex Mono", monospace'; c.textBaseline='middle'; c.textAlign='left';
    for(let i=0;i<=4;i++){
      const v=geo.lo+(geo.hi-geo.lo)*(i/4), y=geo.y(v);
      c.strokeStyle=hexA(line,.9); c.lineWidth=1;
      c.beginPath(); c.moveTo(0,Math.round(y)+.5); c.lineTo(W-PADR+4,Math.round(y)+.5); c.stroke();
      c.fillStyle=ink4; c.fillText(px(v), W-PADR+9, y);
    }
    /* volume first, so price sits over it */
    const bw=Math.max(1,Math.min(geo.step*0.62,14));
    for(let i=0;i<bars.length;i++){ const b=bars[i];
      c.fillStyle=hexA(b.c>=b.o?up:dn,.30);
      const y=geo.vy(b.v); c.fillRect(geo.x(i)-bw/2, y, bw, geo.volTop+geo.volH-y); }
    /* candles */
    for(let i=0;i<bars.length;i++){ const b=bars[i], x=geo.x(i), col=b.c>=b.o?up:dn;
      c.strokeStyle=col; c.lineWidth=1;
      c.beginPath(); c.moveTo(Math.round(x)+.5,geo.y(b.h)); c.lineTo(Math.round(x)+.5,geo.y(b.l)); c.stroke();
      const yo=geo.y(b.o), yc=geo.y(b.c);
      const top=Math.min(yo,yc), h=Math.max(1,Math.abs(yc-yo));
      c.fillStyle=col; c.fillRect(x-bw/2, top, bw, h);
    }
    /* moving averages */
    if(mas){
      [['s100',hexA(tok('--info'),.75),1.3],['s50',hexA(tok('--warn'),.8),1.3],
       ['s20',hexA(tok('--mint'),.95),1.6]].filter(([k])=>on[k]).forEach(([k,col,lw])=>{
        c.strokeStyle=col; c.lineWidth=lw; c.beginPath(); let started=false;
        for(let i=0;i<bars.length;i++){ const v=bars[i][k]; if(v==null) continue;
          const x=geo.x(i), y=geo.y(v); started?c.lineTo(x,y):(c.moveTo(x,y),started=true); }
        c.stroke();
      });
    }
    /* time axis, in the band PADB already reserves */
    c.fillStyle=ink4; c.font='500 9.5px "IBM Plex Mono", monospace'; c.textBaseline='top';
    const span=bars[bars.length-1].t-bars[0].t, days=span/864e5;
    const fmt=d=>days>3
      ? d.toLocaleDateString(undefined,{month:'short',day:'numeric'})
      : d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    const ticks=Math.max(2,Math.min(6,Math.floor(W/140)));
    for(let i=0;i<ticks;i++){
      const bi=Math.round((bars.length-1)*(i/(ticks-1)));
      const x=geo.x(bi);
      c.textAlign = i===0?'left' : i===ticks-1?'right' : 'center';
      c.fillText(fmt(new Date(bars[bi].t)), clamp(x,0,W-PADR), H-PADB+6);
    }
    c.textAlign='left'; c.textBaseline='middle';

    /* the window's own high and low: the first two levels anyone looks for */
    let hiB=bars[0], loB=bars[0];
    for(const b of bars){ if(b.h>hiB.h) hiB=b; if(b.l<loB.l) loB=b; }
    c.font='500 9.5px "IBM Plex Mono", monospace'; c.textBaseline='middle';
    [[hiB,hiB.h,-9,'high'],[loB,loB.l,9,'low']].forEach(([b,v,dy,lbl])=>{
      const x=geo.x(bars.indexOf(b)), y=geo.y(v);
      c.fillStyle=hexA(ink4,.9);
      c.textAlign = x>W*0.72 ? 'right' : 'left';
      c.fillText(lbl+' '+px(v), x + (x>W*0.72?-7:7), y+dy);
      c.strokeStyle=hexA(ink4,.5); c.lineWidth=1;
      c.beginPath(); c.arc(x,y,2.2,0,7); c.stroke();
    });
    c.textAlign='left';

    /* last price marker */
    const last=bars[bars.length-1];
    if(last){ const y=geo.y(last.c), col=last.c>=last.o?up:dn;
      c.setLineDash([3,3]); c.strokeStyle=hexA(col,.55); c.lineWidth=1;
      c.beginPath(); c.moveTo(0,Math.round(y)+.5); c.lineTo(W-PADR,Math.round(y)+.5); c.stroke();
      c.setLineDash([]);
      c.fillStyle=col; rr(c,W-PADR+5,y-9,PADR-8,18,5); c.fill();
      c.fillStyle=tok('--on-mint'); c.font='600 10px "IBM Plex Mono", monospace';
      c.textAlign='center'; c.fillText(px(last.c), W-PADR+5+(PADR-8)/2, y);
      c.textAlign='left';
    }
  }
  function overlay(){
    if(!o) return;
    o.clearRect(0,0,W,H);
    if(hover<0||!geo||!bars[hover]){ tip.dataset.on='0'; return; }
    const b=bars[hover], x=geo.x(hover), y=geo.y(b.c);
    const ink=tok('--ink');
    o.strokeStyle=hexA(ink,.28); o.lineWidth=1; o.setLineDash([3,3]);
    o.beginPath(); o.moveTo(Math.round(x)+.5,PADT-6); o.lineTo(Math.round(x)+.5,H-PADB+4); o.stroke();
    /* the horizontal is the half people actually use: it puts the hovered
       close on the price scale so you can read a level off the chart */
    o.beginPath(); o.moveTo(0,Math.round(y)+.5); o.lineTo(W-PADR,Math.round(y)+.5); o.stroke();
    o.setLineDash([]);
    o.fillStyle=hexA(ink,.86); rr(o,W-PADR+5,y-9,PADR-8,18,5); o.fill();
    o.fillStyle=tok('--g0'); o.font='600 10px "IBM Plex Mono", monospace';
    o.textAlign='center'; o.textBaseline='middle';
    o.fillText(px(b.c), W-PADR+5+(PADR-8)/2, y);
    o.textAlign='left';
    o.fillStyle=hexA(tok('--mint'),.95);
    o.beginPath(); o.arc(x,y,3.4,0,7); o.fill();
    const chg=b.o? (b.c/b.o-1)*100 : 0;
    const rng=b.l? (b.h/b.l-1)*100 : 0;
    tip.innerHTML='<div class="hd"><b>'+px(b.c)+'</b>'+
      '<span class="'+(chg>=0?'up':'down')+'">'+pct(chg)+'</span></div>'+
      '<s>'+new Date(b.t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</s>'+
      '<u>O '+px(b.o)+'  H '+px(b.h)+'  L '+px(b.l)+'</u>'+
      '<u>range '+rng.toFixed(2)+'%  ·  vol '+fmtC(b.v)+'</u>';
    tip.dataset.on='1';
    const tw=tip.offsetWidth||150;
    tip.style.left=clamp(x-tw/2, 4, Math.max(4,W-tw-4))+'px';
  }
  const at=e=>{ const r=cv.getBoundingClientRect();
    if(!geo) return -1;
    const i=Math.round(((e.clientX-r.left)-PADL)/geo.step-0.5);
    return clamp(i,0,bars.length-1); };
  wrap.addEventListener('pointermove',e=>{ const i=at(e); if(i!==hover){ hover=i; overlay(); } },{passive:true});
  wrap.addEventListener('pointerleave',()=>{ hover=-1; overlay(); });
  wrap.addEventListener('pointerdown',e=>{ const i=at(e); hover=i; overlay(); },{passive:true});
  let rt; const onR=()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(cv.isConnected&&size()){compute();draw();overlay();} },140);};
  addEventListener('resize',onR);
  ACTIVE.push(()=>removeEventListener('resize',onR));
  return {
    set(list){ bars=list||[]; if(size()){ compute(); draw(); hover=-1; overlay(); } },
    redraw(){ if(size()){ compute(); draw(); overlay(); } },
    toggle(k){ on[k]=!on[k]; if(size()){ compute(); draw(); overlay(); } return on[k]; },
    shown(k){ return !!on[k]; }
  };
}

/* Moving averages computed once, in place, so the chart never recomputes them
   while drawing. Null until there are enough bars — a 100-bar average over 40
   bars is not a 100-bar average. */
function withMAs(bars){
  const out=bars.map(b=>({t:+b.t, o:+b.o, h:+b.h, l:+b.l, c:+b.c, v:+b.v}));
  const closes=out.map(b=>b.c);
  const roll=(n,key)=>{ let sum=0;
    for(let i=0;i<out.length;i++){ sum+=closes[i]; if(i>=n) sum-=closes[i-n];
      out[i][key]= i>=n-1 ? sum/n : null; } };
  roll(20,'s20'); roll(50,'s50'); roll(100,'s100');
  return out;
}



/* The spot universe, in exactly the shape the perp one has, so the radar, the
   board, the table and the coin page do not need to know which they are
   holding. Spot has no funding, no open interest, no oracle and no impact
   spread — those come back null rather than zero, because zero is a
   measurement and null is an absence, and the UI hides what is absent.
   In exchange it has supply, so market cap is real here and nowhere else. */
function spotUniverse(meta,ctxs){
  const tokens={}; (meta.tokens||[]).forEach(t=>tokens[t.index]=t);
  const byCoin={}; (ctxs||[]).forEach(c=>{ if(c&&c.coin) byCoin[c.coin]=c; });
  const out=[];
  (meta.universe||[]).forEach(u=>{
    const bt=tokens[u.tokens[0]], qt=tokens[u.tokens[1]];
    if(!bt||!qt||qt.name!=='USDC') return;
    const c=byCoin[u.name]; if(!c) return;
    const mark=+(c.midPx||c.markPx||0); if(!(mark>0)) return;
    /* learnTwins needs the token's own description to rule out staking
       receipts, and the price to prove everything else */
    const alt=TWINS.s2p[String(bt.name).toUpperCase()]||null;
    const prev=+c.prevDayPx;
    const supply=+c.circulatingSupply;
    out.push({name:bt.name, key:u.name, kind:'spot', pair:bt.name+'/USDC',
      canonical:!!bt.isCanonical, delisted:false,
      mark, oracle:null,
      chg: prev? (mark-prev)/prev*100 : 0,
      fundingHr:null, fundingApr:null,
      oiNtl:null, vol:+c.dayNtlVlm||0, volOverOi:null,
      oracleGap:null, spreadPct:null,
      mcap: isFinite(supply)&&supply>0? supply*mark : null,
      /* U-prefixed tickers are bridged wrappers, not the native asset. Saying
         so is the difference between a listing and a trap. */
      /* "bridged" used to be a guess from a leading U, which called UBTC a
         wrapper and FXRP a native token. Two different claims live here and
         they need different evidence: having a TWIN is a claim about identity
         and is settled by price, while being a WRAPPER is a claim about what
         the token is, which the issuer states in its own name — "Unit Ansem"
         is a wrapper whether or not Hyperliquid lists an ANSEM perp for it to
         be a twin of. So: a twin, or a description that says so. */
      bridged: !!alt || /^(unit|wrapped)\s|bridge|layerzero/i.test(bt.fullName||''),
      full: bt.fullName||'',
      /* the ticker a reader would have typed to get here */
      alt: alt
    });
  });
  /* one row per token: prefer the canonical pair, then the busiest */
  const best={};
  for(const m of out){ const p=best[m.name];
    if(!p || (m.canonical&&!p.canonical) || (m.canonical===p.canonical && m.vol>p.vol)) best[m.name]=m; }
  return Object.values(best);
}

/* The names that exist on the other side, so the table can say where a market
   a reader is looking for actually trades. One extra call, cached five
   minutes, and only made when they ask to see the list. */
let OTHER={perp:null,spot:null};
/* set by the coin route just before it redirects to the same asset's other
   name, read once on the way in so the reader is told why the ticker changed */
let ALIASED=null;
async function otherSide(){
  const want=isSpot()?'perp':'spot';
  if(OTHER[want]) return OTHER[want];
  if(want==='perp'){
    const [meta,ctxs]=await apiR({type:'metaAndAssetCtxs'},{ttl:300000});
    OTHER.perp=universe(meta,ctxs).filter(m=>!m.delisted);
  }else{
    await ensureTwins();
    const [meta,ctxs]=await apiR({type:'spotMetaAndAssetCtxs'},{ttl:300000});
    OTHER.spot=spotUniverse(meta,ctxs);
  }
  return OTHER[want];
}

async function loadUniverse(){
  if(isSpot()){
    /* Spot rows are the ones that carry a twin, so the map is built before the
       first paint rather than upgrading marks and links underneath the reader.
       Both calls are cached and one of them is this one. */
    await ensureTwins();
    const [meta,ctxs]=await apiR({type:'spotMetaAndAssetCtxs'},{ttl:20000});
    return spotUniverse(meta,ctxs);
  }
  const [meta,ctxs]=await apiR({type:'metaAndAssetCtxs'},{ttl:20000});
  return universe(meta,ctxs);
}
function setMode(m){
  if(m===MODE) return;
  MODE=m; try{ localStorage.setItem('hf.mode',m); }catch(e){}
  RADAR={t:0,U:null,short:null,det:null};      /* different venue, different cache */
  $$('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  const pill=$('#modePill'); const on=$('[data-mode].on');
  if(pill&&on){ pill.style.left=on.offsetLeft+'px'; pill.style.width=on.offsetWidth+'px'; }
  document.documentElement.dataset.mode=m;
  dispatchEvent(new CustomEvent('hf:mode'));
}

/* Spot pairs, keyed by the perp name they correspond to.
   Two traps here, both found by checking rather than assuming:
   1. spotMetaAndAssetCtxs returns 718 contexts against a 326-pair universe and
      they are NOT positionally aligned — universe[109] is pair @109 while
      ctxs[109].coin is "@107". They have to be joined on the coin field. Read
      positionally, every spot price on the page is a different market's price.
   2. A matching ticker is not a matching asset. Of eight perp names that also
      exist as spot tokens, five are squatters: a "HYPE" token at $0.08 beside
      the $82 perp, "TRUMP" at $0.0015 beside $2.26, "AZTEC" off by 53,000x.
      Sending someone to buy one of those instead of the market they asked for
      is the worst thing this page could do, so a pair is only offered when its
      mid is within 15% of the perp mark. */
let SPOT=null;
async function spotIndex(){
  if(SPOT) return SPOT;
  /* the twin map has to exist before the index is keyed by it */
  await ensureTwins();
  const [meta,ctxs]=await apiR({type:'spotMetaAndAssetCtxs'},{ttl:300000});
  const tokens={}; (meta.tokens||[]).forEach(t=>tokens[t.index]=t);
  const byCoin={}; (ctxs||[]).forEach(c=>{ if(c&&c.coin) byCoin[c.coin]=c; });
  const byBase={}, byAlt={};
  (meta.universe||[]).forEach(u=>{
    const bt=tokens[u.tokens[0]], qt=tokens[u.tokens[1]];
    if(!bt||!qt||qt.name!=='USDC') return;
    const c=byCoin[u.name]; if(!c) return;
    const mid=+(c.midPx||c.markPx||0); if(!(mid>0)) return;
    const row={base:bt.name, pair:bt.name+'/USDC', canonical:!!bt.isCanonical,
      mid, vol:+c.dayNtlVlm||0, chg: +c.prevDayPx? (mid-+c.prevDayPx)/+c.prevDayPx*100 : null};
    (byBase[bt.name]=byBase[bt.name]||[]).push(row);
    /* The ENA perp had no "Buy spot" button because the spot market is called
       UENA and this index was keyed by the spot ticker alone. A wrapper is
       also filed under the asset it carries. */
    const alt=TWINS.s2p[String(bt.name).toUpperCase()];
    if(alt) (byAlt[alt]=byAlt[alt]||[]).push(row);
  });
  SPOT={};
  const pick=list=>list.slice().sort((x,y)=>(y.canonical-x.canonical)||(y.vol-x.vol))[0];
  for(const [b,list] of Object.entries(byBase)) SPOT[b]=pick(list);
  /* a token that genuinely carries the name always wins the key */
  for(const [b,list] of Object.entries(byAlt)) if(!SPOT[b]) SPOT[b]=pick(list);
  return SPOT;
}
function spotFor(name, perpMark){
  const s=SPOT&&SPOT[name];
  if(!s||!isFinite(perpMark)||perpMark<=0) return null;
  return Math.abs(s.mid/perpMark-1)<0.15 ? s : null;
}

/* Bar counts chosen so a candle is wide enough to read on a phone: 140 hourly
   bars is about six days, which is the window an hourly chart is actually for. */
const RANGES=[{k:'1h',label:'1H',bars:140,ms:3600e3},
              {k:'4h',label:'4H',bars:150,ms:4*3600e3},
              {k:'1d',label:'1D',bars:180,ms:24*3600e3}];

ROUTES.coin=async function(args){
  const name=decodeURIComponent(args[0]||'').toUpperCase();
  if(!name){ location.hash='#/radar'; return; }
  $('#crumbT').textContent=name;

  /* ── shell, painted before anything is fetched ── */
  const head=el('section','cn-head');
  const idw=el('div','cn-id');
  const back=el('a','cn-back'); back.href='#/radar';
  back.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Radar';
  idw.appendChild(back);
  const title=el('div','cn-t');
  title.append(coinMark(name,40), el('h1',null,name));
  const pxw=el('div','cn-px'); pxw.append(el('b','v','—'), el('span','chip dim','—'));
  title.appendChild(pxw);
  idw.appendChild(title);
  const acts=el('div','cn-acts');
  idw.appendChild(acts);
  head.appendChild(idw);
  /* A 1px marker where the header rests. The observer watching it fires twice
     in the life of the page instead of on every scroll frame, and it needs no
     magic number: the marker leaving the viewport IS the header reaching the
     top bar, whatever the header currently measures. */
  const sent=el('div','cn-sent');
  PAGE.append(sent, head);
  /* A scroll listener, NOT an IntersectionObserver — and this is the fifth
     time in this project that the distinction has mattered. IO callbacks are
     delivered in the rendering steps, exactly like requestAnimationFrame, so a
     view the browser is not painting receives none of them: I watched this
     very header sit at its full height with document.hidden true and both rAF
     and a freshly-constructed observer never fire once. A stuck flag that only
     resolves after the first paint is survivable; a habit of hanging state off
     frame callbacks is what produced four silent-emptiness bugs before it.

     Scroll events are not gated on painting, the read is one rect on one
     element, and the attribute is only written when the answer changes. The
     sentinel is still the reference: it sits where the header rests and scrolls
     normally, so "sentinel above the bar" IS "header pinned", whatever the
     header currently measures and however tall the bar is at this width. */
  let stuck=null;
  const measure=()=>{
    const topH=($('#top')&&$('#top').getBoundingClientRect().height)||60;
    const now = sent.getBoundingClientRect().top <= topH ? '1':'0';
    if(now!==stuck){ stuck=now; head.dataset.stuck=now; }
  };
  measure();
  addEventListener('scroll',measure,{passive:true});
  addEventListener('resize',measure);
  addEventListener('hf:topH',measure);
